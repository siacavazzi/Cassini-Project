<!doctype html>
<!-- Cassini OS usage: the frame server's daily counts (usage.py), served at /stats/ to its own network only.
     Reads /stats/usage.json?days=N. Top pictures link to their moment in Cassini OS (the frame's time from
     data/catalog/<year>.json, as the page's own catalog has it). Nothing here is counted. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cassini OS usage</title>
<style>
:root {
  --bg: #0b0c0f; --panel: rgba(255,255,255,.035); --line: rgba(255,255,255,.10);
  --text: rgba(232,236,242,.88); --dim: rgba(232,236,242,.50); --accent: #8ab6ff; --bar: #3987e5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 28px 16px 60px; }
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: .01em; }
h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 10px; }
.sub { color: var(--dim); }
.range { margin-left: auto; display: flex; gap: 4px; }
button { font: inherit; color: var(--text); background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
button[aria-pressed="true"] { background: rgba(138,182,255,.18); border-color: rgba(138,182,255,.45); }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
.tile b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile span { color: var(--dim); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 2fr; gap: 14px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
#chart { position: relative; }
#chart svg { display: block; width: 100%; height: 180px; overflow: visible; }
#chart .tip { position: absolute; pointer-events: none; background: rgba(20,22,27,.96); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -110%); }
#chart .tip[hidden] { display: none; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
td { padding: 4px 0; border-top: 1px solid var(--line); vertical-align: middle; }
td.n { text-align: right; width: 64px; }
td.meter { width: 40%; padding-left: 10px; }
.meter i { display: block; height: 6px; border-radius: 3px; background: var(--bar); min-width: 2px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
.pics { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.pic { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; color: inherit; text-decoration: none; display: block; }
.pic .img { aspect-ratio: 1; background: #000 center / contain no-repeat; }
.pic .cap { padding: 5px 7px; font-size: 11px; display: flex; justify-content: space-between; gap: 6px; }
.pic .cap span { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { color: var(--dim); padding: 8px 0; }
footer { color: var(--dim); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Cassini OS usage</h1>
    <span class="sub" id="span"></span>
    <div class="range" id="range">
      <button data-days="7">7 days</button><button data-days="30">30 days</button><button data-days="90">90 days</button><button data-days="365">Year</button>
    </div>
  </header>

  <section><div class="tiles" id="tiles"></div></section>

  <section>
    <h2>Visitors per day</h2>
    <div id="chart"><svg id="bars" role="img" aria-label="Visitors per day"></svg><div class="tip" hidden></div></div>
  </section>

  <div class="grid2">
    <section>
      <h2>Where from</h2>
      <table id="countries"></table>
    </section>
    <section>
      <h2>Most popular pictures</h2>
      <div class="tabs" id="tabs"></div>
      <div class="pics" id="pics"></div>
    </section>
  </div>

  <footer id="foot"></footer>
</main>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search), key = q.get("key");
  const withKey = u => key ? `${u}${u.includes("?") ? "&" : "?"}key=${encodeURIComponent(key)}` : u;
  const fmt = n => n >= 10000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + "k" : n.toLocaleString("en-US");
  // the events, in the order the page shows them, with what each means
  const TILES = [
    ["visitor_days", "visitors", "one person counted once a day"],
    ["visits", "visits", "times Cassini OS was opened"],
    ["pictures", "pictures shown", "frames, composites, mosaics, reels"],
    ["full", "full-resolution views", "a picture looked at on its own"],
    ["download", "downloads", "pictures and films saved"],
    ["export", "movies made", "movie exports started"],
    ["copy-link", "links copied", "a moment shared"],
    ["visit-link", "shared links opened", "visits that started on a link"],
  ];
  const TABS = [
    ["frame", "Frames"], ["composite", "Color"], ["mosaic", "Mosaics"], ["full", "Full view"],
    ["download", "Downloaded"], ["raw", "Raw PNG"], ["body", "Body reels"],
  ];
  const LEAPS = [[Date.UTC(1999, 0, 1), 32], [Date.UTC(2006, 0, 1), 33], [Date.UTC(2009, 0, 1), 34], [Date.UTC(2012, 6, 1), 35], [Date.UTC(2015, 6, 1), 36], [Date.UTC(2017, 0, 1), 37]];
  const J2000_MS = Date.UTC(2000, 0, 1, 11, 58, 55, 816);
  const leapAt = ms => { let n = 31; for (const [w, k] of LEAPS) if (ms >= w) n = k; return n; };
  const utc = et => { let ms = et * 1000 + J2000_MS; ms = (et - (leapAt(ms) - 32)) * 1000 + J2000_MS; return new Date(ms).toISOString().slice(0, 19); };
  // a frame's year, near enough from its spacecraft clock (seconds since 1958), to find it in that year's catalog
  const yearOf = id => new Date(Date.UTC(1958, 0, 1) + (+id.slice(1, 11)) * 1000).getUTCFullYear();
  const catalogs = {};
  const catalog = y => catalogs[y] || (catalogs[y] = fetch(`/data/catalog/${y}.json`).then(r => r.ok ? r.json() : null)
    .then(c => c ? new Map(c.id.map((id, i) => [id, c.et[i]])) : new Map()).catch(() => new Map()));
  async function momentOf(id) {
    const y = yearOf(id);
    for (const yy of [y, y - 1, y + 1]) { const et = (await catalog(yy)).get(id); if (et != null) return utc(et); }
    return null;
  }
  const flag = cc => /^[A-Z]{2}$/.test(cc) ? String.fromCodePoint(...[...cc].map(c => 0x1f1a5 + c.charCodeAt(0))) : "";
  const regionName = (() => { try { const d = new Intl.DisplayNames(["en"], { type: "region" }); return cc => d.of(cc); } catch (e) { return cc => cc; } })();
  const place = cc => cc === "local" ? "Home network" : cc === "unknown" ? "Unknown" : `${flag(cc)} ${regionName(cc)}`;

  let data = null, tab = "frame", days = +(q.get("days") || 30);

  function tiles() {
    const t = { visitor_days: data.visitor_days, visits: data.days.reduce((s, d) => s + d.visits, 0),
                pictures: data.days.reduce((s, d) => s + d.pictures, 0), ...data.events };
    $("tiles").innerHTML = TILES.map(([k, label, note]) => `<div class="tile" title="${note}"><b>${fmt(t[k] || 0)}</b><span>${label}</span></div>`).join("");
  }

  function chart() {
    const svg = $("bars"), W = svg.clientWidth || 800, H = 180, pad = { l: 28, b: 18, t: 6 };
    const ds = data.days, max = Math.max(1, ...ds.map(d => d.visitors));
    const step = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / step) * step;
    const bw = (W - pad.l) / ds.length, gap = Math.min(2, bw * .25), y = v => H - pad.b - (H - pad.b - pad.t) * v / top;
    let s = "";
    for (const v of [0, top / 2, top]) s += `<line x1="${pad.l}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.08)"/>` +
      `<text x="${pad.l - 6}" y="${y(v) + 4}" fill="rgba(232,236,242,.5)" font-size="10" text-anchor="end">${fmt(v)}</text>`;
    ds.forEach((d, i) => {
      const x = pad.l + i * bw + gap / 2, h = Math.max(0, y(0) - y(d.visitors)), r = Math.min(4, (bw - gap) / 2, h);
      if (h > 0) s += `<path d="M${x},${y(0)} v${-(h - r)} q0,${-r} ${r},${-r} h${bw - gap - 2 * r} q${r},0 ${r},${r} v${h - r} z" fill="#3987e5"/>`;
      s += `<rect class="hit" data-i="${i}" x="${pad.l + i * bw}" y="${pad.t}" width="${bw}" height="${H - pad.t}" fill="transparent"/>`;
    });
    const every = Math.ceil(ds.length / 8);
    ds.forEach((d, i) => { if (i % every === 0 || (i === ds.length - 1 && i % every >= every / 2)) s += `<text x="${pad.l + (i + .5) * bw}" y="${H - 4}" fill="rgba(232,236,242,.5)" font-size="10" text-anchor="middle">${d.day.slice(5)}</text>`; });
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.innerHTML = s;
    const tip = $("chart").querySelector(".tip");
    svg.onmousemove = e => {
      const i = e.target.dataset && e.target.dataset.i;
      if (i == null) { tip.hidden = true; return; }
      const d = ds[i], b = svg.getBoundingClientRect();
      tip.innerHTML = `<b>${d.day}</b> · ${d.visitors} visitors · ${d.visits} visits · ${fmt(d.pictures)} pictures · ${d.downloads} downloads`;
      tip.style.left = `${(pad.l + (+i + .5) * bw) * b.width / W}px`; tip.style.top = `${y(d.visitors) * b.height / H}px`; tip.hidden = false;
    };
    svg.onmouseleave = () => { tip.hidden = true; };
  }

  function countries() {
    const rows = data.countries, max = Math.max(1, ...rows.map(r => r[1]));
    $("countries").innerHTML = rows.length ? rows.slice(0, 30).map(([cc, n]) =>
      `<tr><td>${place(cc)}</td><td class="meter"><i style="width:${100 * n / max}%"></i></td><td class="n">${fmt(n)}</td></tr>`).join("")
      : `<tr><td class="empty">No visitors yet</td></tr>`;
  }

  function picture(event, k) {
    if (event === "body") return { img: "", label: k.charAt(0) + k.slice(1).toLowerCase() };
    if (event === "composite" || /,/.test(k)) return { img: `/frames/color.webp?ids=${k}&size=256`, label: k.split(",")[0] + " color", id: k.split(",")[0] };
    if (/^[NW]\d{10}_\d+$/.test(k)) return { img: event === "mosaic" ? `/frames/mosaic/${k}.webp?size=256` : `/frames/${k}.webp?size=256`, label: k, id: k };
    return { img: "", label: k };
  }

  function pics() {
    const avail = TABS.filter(([k]) => (data.top[k] || []).length);
    if (!avail.find(([k]) => k === tab) && avail.length) tab = avail[0][0];
    $("tabs").innerHTML = avail.map(([k, label]) => `<button data-tab="${k}" aria-pressed="${k === tab}">${label}</button>`).join("");
    const top = (data.top[tab] || []).slice(0, 24);
    $("pics").innerHTML = top.length ? top.map(([k, n], i) => {
      const p = picture(tab, k);
      return `<a class="pic" data-i="${i}" target="_blank" rel="noopener"><div class="img" style="${p.img ? `background-image:url('${p.img}')` : ""}"></div>` +
        `<div class="cap"><span>${p.label}</span><b>${fmt(n)}</b></div></a>`;
    }).join("") : `<div class="empty">Nothing counted yet</div>`;
    // each picture opens Cassini OS on its moment, paused, so its camera window shows it
    top.forEach(([k], i) => {
      const a = $("pics").querySelector(`[data-i="${i}"]`), p = picture(tab, k);
      if (tab === "body") { a.href = `/?view=${k.toLowerCase()}`; return; }
      if (p.id) momentOf(p.id).then(t => { if (t) { a.href = `/?t=${t}&view=follow&speed=60&play=0`; a.title = `Open ${p.id} at ${t} UTC`; } });
    });
  }

  async function load() {
    document.querySelectorAll("#range button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.days === days));
    const r = await fetch(withKey(`/stats/usage.json?days=${days}`), { cache: "no-store" });
    if (!r.ok) { $("tiles").innerHTML = `<div class="empty">The stats did not load (${r.status})</div>`; return; }
    data = await r.json();
    $("span").textContent = `${data.days[0].day} to ${data.days[data.days.length - 1].day} (UTC)`;
    $("foot").textContent = `Daily totals only: no cookies, no addresses kept, nothing per person. ${fmt(data.bots)} requests from crawlers and test browsers were left out of every count above.`;
    tiles(); chart(); countries(); pics();
  }
  $("range").onclick = e => { const b = e.target.closest("button"); if (b) { days = +b.dataset.days; load(); } };
  $("tabs").onclick = e => { const b = e.target.closest("button"); if (b) { tab = b.dataset.tab; pics(); } };
  addEventListener("resize", () => data && chart());
  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
