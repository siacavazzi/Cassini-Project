<!-- The Grand Finale, a tribute for whoever plays the mission to its end. build.py splices the style into the head, the
     section into #app and the script after the viewer's (and the loading screen's) script.

     When playback reaches the end of the data and the data ends with the mission's final plunge (a milestone in
     encounters.json within the last hour of coverage), the interface fades away and the view settles on Cassini for
     its last minute, in real time. Where Cassini is comes from the trajectory (carried on along its last velocity once
     the data stops); how it holds its dish on Earth is an interpretation, worked out by a rule, not a keyframe list:
       - the thrusters' load follows the air's density, which grows tenfold for every fixed drop in altitude. The rule
         is pinned to NASA's two numbers (JPL, "Cassini Spacecraft Makes Its Final Approach to Saturn", 2017-09-13):
         loss of signal at about 1,500 km above the cloud tops, with the thrusters going from 10 percent of their
         capacity to 100 percent in the span of about a minute before it
       - up to full load the thrusters hold the dish within a fraction of a degree of Earth, wobbling more as the load
         grows; past it they can do no more and Cassini begins to tumble. The signal fades once the dish is a few
         tenths of a degree off Earth
       - when the real readings below are there, loss of signal is their last sample (10:31:54 UTC at Saturn, 1,363 km
         up, a little lower than NASA's prediction) and the ramp keeps its one minute
       - each thruster's plume flickers on with a chance that grows with the load; the air streams past faster and
         thicker as the load grows; after loss of signal the leading side heats and glows, then the view cuts away to
         Saturn, where Cassini burns up as a small flare (NASA: "burned up and disintegrated like a meteor")
       - the wobble is drawn 15 times larger than the angle it stands for, or a fraction of a degree would not show
     The camera drifts round Cassini toward the rings (the direction of the ring plane from Cassini, laid on its
     horizon) with Saturn's clouds underneath; dragging looks around (the view eases back a few seconds after), the
     wheel zooms. The real readings Cassini sent in its last hour (finale-data.json, from NASA's Planetary Data
     System, written in by build.py) run as a strip chart while it falls. Captions turn quiet and sad as it fights to
     keep the dish on Earth, then the view pulls back to Saturn for a warmer recap of what it did. Escape or the Skip
     button ends it; ?finale plays it at once. After "Thank you, Cassini" the screen goes dark and the credits roll, like
     the end of a film: the people who made the mission happen (mission-team.json, from NASA's and ESA's team pages,
     written in by build.py), the imaging team first since every picture here is theirs. The roll moves on its own; a
     wheel, drag or swipe scrolls it by hand and it carries on from there a few seconds later. Its last card links to
     About, and the Skip button or Escape still ends it. Sound (sound.html): Cassini's carrier as a pure tone that wavers with
     the wobble and stops at loss of signal, a low minor drone that grows with the struggle, one low bell at the
     break-up, and chords under the recap that open from minor to bright major. -->
<style>
#finale { position: fixed; inset: 0; z-index: 2002; pointer-events: none; }
#finale[hidden] { display: none; }
#finale .fx-black { position: absolute; inset: 0; background: #000; opacity: 0; }
/* the air's glow from below as it heats, and a shade under the captions so they read over Saturn's bright clouds */
#finale .fx-air { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 90% 70% at 50% 100%, rgba(255,120,40,.55), rgba(255,80,20,.18) 55%, transparent 80%); mix-blend-mode: screen; }
#finale .fx-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.78) 0, rgba(0,0,0,.55) 22%, rgba(0,0,0,0) 48%); }
#finale .fx-caps { position: absolute; left: 50%; bottom: 15vh; transform: translateX(-50%); width: min(640px, calc(100vw - 32px)); display: grid; }
#finale .fx-cap { grid-area: 1 / 1; align-self: end; text-align: center; color: var(--q-text); font: 300 19px/1.5 -apple-system, "Helvetica Neue", var(--ui);
  letter-spacing: .01em; text-shadow: 0 1px 12px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.8); opacity: 0; }
#finale .fx-cap b { display: block; margin-bottom: 8px; font-weight: normal; font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--q-dim); }

/* the real readings: a quiet strip chart, top right */
#finale .fx-data { position: absolute; right: 16px; top: 16px; width: min(300px, calc(100vw - 32px)); box-sizing: border-box; padding: 9px 11px 8px; background: var(--q-panel); border: 1px solid var(--q-line); border-radius: 9px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); opacity: 0; transition: opacity 1.5s ease; }

#finale .fx-note { position: absolute; left: 16px; bottom: 14px; max-width: min(460px, calc(100vw - 140px)); font-size: 10.5px; line-height: 1.4; color: rgba(232,236,242,.34); opacity: 0; transition: opacity 1.5s ease; }
#finale .fx-note.on { opacity: 1; }
#finale .fx-skip { all: unset; position: absolute; right: 16px; bottom: 12px; padding: 4px 11px; border-radius: 11px; border: 1px solid var(--q-line);
  background: rgba(16,17,20,.5); color: rgba(232,236,242,.55); font-size: 11px; cursor: pointer; pointer-events: auto; }
#finale .fx-skip:hover { color: var(--q-text); }
#finale .fx-hint { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); font-size: 11px; color: rgba(232,236,242,.45); opacity: 0; transition: opacity 1.5s ease; }
#finale .fx-hint.on { opacity: 1; }
body.finale #gl { cursor: grab; }
body.finale.fx-drag #gl { cursor: grabbing; }
body.finale #app > :not(#gl):not(#finale) { opacity: 0 !important; pointer-events: none !important; transition: opacity 1.2s ease !important; }

/* the credits roll: a column that scrolls up over the darkened sky, fading in and out at its top and bottom edges */
#finale .fx-roll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; opacity: 0; pointer-events: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 16%, #000 84%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 16%, #000 84%, transparent 100%); }
#finale .fx-roll::-webkit-scrollbar { display: none; }
#finale .fx-roll.on { pointer-events: auto; }
#finale .fx-roll .in { width: min(620px, calc(100vw - 32px)); margin: 0 auto; padding: 100vh 0 calc(50vh - 120px); text-align: center; color: var(--q-text);
  font: 300 15px/1.5 -apple-system, "Helvetica Neue", var(--ui); text-shadow: 0 1px 10px rgba(0,0,0,.9); }
#finale .fx-roll .head { font-size: 23px; line-height: 1.45; margin: 0 0 24px; }
#finale .fx-roll .lede { color: var(--q-dim); margin: 0 auto 120px; max-width: 30em; }
#finale .fx-roll section { margin: 0 0 96px; }
#finale .fx-roll h3 { margin: 0 0 6px; font-weight: normal; font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--q-dim); }
#finale .fx-roll h4 { margin: 34px 0 12px; font-weight: normal; font-size: 12px; letter-spacing: .06em; color: var(--q-accent); }
#finale .fx-roll .sub { margin: 0 auto 20px; font-size: 12.5px; color: var(--q-dim); max-width: 34em; }
#finale .fx-roll dl { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; row-gap: 7px; margin: 0; }
#finale .fx-roll dt { text-align: right; font-size: 12.5px; color: var(--q-dim); padding-top: 2px; }

#finale .fx-roll .names { margin: 14px auto 0; max-width: 36em; line-height: 1.9; }
/* the dot rides at the end of the name before it, so a wrapped line never starts with one */
#finale .fx-roll .names span { white-space: nowrap; }
#finale .fx-roll .names span:not(:last-child)::after { content: "·"; margin: 0 .3em 0 .55em; color: rgba(232,236,242,.3); }

#finale .fx-roll .end { margin-top: 160px; }

#finale .fx-roll .end .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
#finale .fx-roll .end button { all: unset; padding: 6px 15px; border-radius: 13px; border: 1px solid var(--q-line); background: rgba(16,17,20,.55); color: rgba(232,236,242,.75); font-size: 12px; cursor: pointer; }
#finale .fx-roll .end button:hover { color: var(--q-text); border-color: rgba(232,236,242,.35); }
#finale .fx-roll .src { margin-top: 40px; font-size: 10.5px; line-height: 1.5; color: rgba(232,236,242,.34); }
#finale .fx-roll .src a { color: inherit; }
body.phone #finale .fx-roll .in { font-size: 14px; }
body.phone #finale .fx-roll dl { grid-template-columns: 1fr; row-gap: 2px; }
body.phone #finale .fx-roll dt, body.phone #finale .fx-roll dd { text-align: center; }
body.phone #finale .fx-roll dd { margin-bottom: 10px; }
body.phone #finale .fx-cap { font-size: 16px; } body.phone #finale .fx-cap.big { font-size: 21px; }
body.phone #finale .fx-read { font-size: 9.5px; bottom: 9vh; }
body.phone #finale .fx-note { bottom: 40px; }
body.phone #finale .fx-data { width: min(220px, calc(100vw - 32px)); top: 10px; right: 10px; }
</style>

<section id="finale" hidden aria-live="polite">
  <div class="fx-air"></div>
  <div class="fx-shade"></div>
  <div class="fx-black"></div>
  <div class="fx-caps"></div>
  <div class="fx-roll" tabindex="-1" aria-label="Credits"><div class="in"></div></div>
  <div class="fx-read" aria-hidden="true"></div>
  <div class="fx-data" aria-hidden="true"><b>Its last readings · real data</b><canvas width="556" height="290"></canvas><small></small></div>
  <div class="fx-note">An interpretation. Cassini's path is its real trajectory and the readings are what it sent; the way it fights to hold its antenna on Earth follows a rule pinned to NASA's numbers, not telemetry.</div>
  <div class="fx-hint">Drag to look around</div>
  <button class="fx-skip" type="button">Skip ▸</button>
</section>

<script>
// ---------- the Grand Finale: Cassini's last minute and a mission recap, at the end of the data ----------
(function () {
  const root = document.getElementById("finale"), black = root.querySelector(".fx-black"), caps = root.querySelector(".fx-caps"), air = root.querySelector(".fx-air");
  const read = root.querySelector(".fx-read"), note = root.querySelector(".fx-note"), hint = root.querySelector(".fx-hint"), skipBtn = root.querySelector(".fx-skip");
  const roll = root.querySelector(".fx-roll"), rollIn = roll.querySelector(".in");
  const dataBox = root.querySelector(".fx-data"), dataCv = dataBox.querySelector("canvas"), dataNote = dataBox.querySelector("small");
  // the real readings from the last hour, written in by build.py from finale-data.json (null when there are none):
  // { window: s, credit, series: [{ label, unit, color, log, t: [ms UTC], v: [...] }] }
  const FINALE_DATA = /*FINALE_DATA*/null;
  // the mission team for the credits roll, written in by build.py from mission-team.json:
  // { intro: { head, text }, sections: [{ title, sub, people: [{ role, name, note }], names: [...], text, groups: [same] }], closing, sources: [{ title, url }] }
  const TEAM = /*MISSION_TEAM*/null;
  window.cassiniTeam = TEAM;
  // NASA's numbers (JPL, 2017-09-13 "Final Approach" and 2017-09-15 "Ends Its Historic Exploration of Saturn")
  const H_LOS = 1500;          // km above the cloud tops at loss of signal
  const RAMP = 60;             // s from 10 percent of the thrusters' capacity to 100 percent
  const BEAM = 0.3;            // deg off Earth at which the link is half gone ("a few fractions of a degree")
  const VIS = 15;              // the wobble is drawn this many times larger than the angle it stands for
  const LEAD = 62;             // s of the descent shown before loss of signal
  const AFTER = 5.5;           // s after loss of signal the view cuts to Saturn, where Cassini burns up as a flare
  const FLARE = 2.5;           // s into the Saturn view the flare peaks
  const NASA_IMAGES = 453048;  // NASA, "Cassini by the Numbers"
  // the descent, quieter and sadder as the struggle grows: mission seconds from loss of signal, how long, the line
  const DESCENT = [
    [-58, 10, `<b>September 15, 2017 · Saturn</b>After thirteen years in orbit, Cassini dives into the planet it came to study.`],
    [-46.5, 10, `Its fuel nearly gone, it was sent in on purpose, so it could never fall onto the moons it found might hold life.`],
    [-35, 10, `Nothing is stored anymore. Every reading goes straight home, live, through the dish pointed at Earth.`],
    [-23.5, 11, `The air thickens. Its thrusters fire harder and harder to hold that dish on Earth.`],
    [-11, 10, `It keeps sending. To the very last second, it keeps sending.`],
    [1.2, 5, `Loss of signal`, "big"],
  ];
  // the recap, warmer line by line: screen seconds from its start, how long, the line, a class, and the chord under it
  // (steps of the D major pentatonic scale: a minor color first, opening to bright D major at the end)
  const RECAP = images => [
    [FLARE, 6.5, `Moments later, Cassini burned up like a meteor, and became part of Saturn.`, "", null],
    [10, 7, `<b>Received on Earth</b>Its last signal crossed the solar system for 83 minutes. At 11:55:46 UTC, the antennas in Canberra, Australia, heard it fall silent.`, "", [4, 5, 7]],
    [17.5, 7, `<b>The last data</b>Eight instruments reported to the end. Its mass spectrometer tasted Saturn's air directly, the first and only time anything has.`, "", [3, 5, 7]],
    [25, 6, `<b>1997 &ndash; 2017</b>Twenty years in space. Thirteen at Saturn. 294 orbits.`, "big", [1, 3, 5, 6]],
    [31.5, 6, `<b>Pictures</b>${fmtInt(NASA_IMAGES)} pictures of Saturn, its rings and its moons.${images ? `<small>${fmtInt(images)} of them play in this replay.</small>` : ""}`, "big", [0, 2, 3, 5]],
    [38, 8.5, `<b>What it found</b><ul><li>An ocean under the ice of Enceladus, spraying into space</li><li>Seas and lakes of liquid methane on Titan, and Huygens on its surface</li><li>A six-sided jet stream circling Saturn's north pole</li><li>Moonlets stirring propellers in the rings, and new moons</li></ul>`, "", [2, 3, 5, 7]],
    [47, 8, `Cassini turned points of light into worlds. Much of what we know about Saturn and its moons, we know because it went and looked.`, "big", [0, 3, 5, 7, 8]],
    [55.5, 5.5, `<b>Cassini-Huygens · 1997 &ndash; 2017</b>Thank you, Cassini.`, "big", [0, 2, 3, 5, 7, 10]],
  ];
  const RECAP_END = 62;
  const ROLL_IN = 1.4;         // s of darkness between "Thank you, Cassini" and the credits
  const ROLL_SPEED = 60;       // px/s the credits move up (48 on a phone)
  const ROLL_HOLD = 3.5;       // s after a hand scroll before the roll moves on its own again
  const ROLL_REST = 9;         // s the last card stays before it all fades back to the mission

  let F = null;   // the running finale
  const tmpS = v3(), tmpC = v3(), tmpE = v3();
  const vScene = new THREE.Vector3(), eScene = new THREE.Vector3(), uScene = new THREE.Vector3(), rScene = new THREE.Vector3();
  const qInv = new THREE.Quaternion(), vT = new THREE.Vector3();

  // the end of the data is the end of the mission: a milestone within its last hour (the final plunge)
  function endsMission() {
    return Array.isArray(encounters) && encounters.some(e => e.kind === "milestone" && e.et <= coverage[1] + 1 && coverage[1] - e.et < 3600);
  }
  // Cassini relative to Saturn (J2000, km) at et, carried on along its last velocity past the end of the data
  function rel(et, out) {
    const end = coverage[1], t = Math.min(et, end);
    sub(positionAt(tracks.CASSINI, t, tmpC), positionAt(tracks.SATURN, t, tmpS), out);
    if (et > end) {
      const a = sub(positionAt(tracks.CASSINI, end - 2, tmpC), positionAt(tracks.SATURN, end - 2, tmpS), tmpE);
      for (let k = 0; k < 3; k++) out[k] += (out[k] - a[k]) / 2 * (et - end);
    }
    return out;
  }
  // height above Saturn's ellipsoid (km)
  function altitude(et) {
    const r = rel(et, v3()), R = iauMatrix(bodies.SATURN, Math.min(et, coverage[1])), [a, b, c] = bodies.SATURN.radii;
    const x = dot(R[0], r), y = dot(R[1], r), z = dot(R[2], r);
    return len(r) * (1 - 1 / Math.sqrt(x * x / (a * a) + y * y / (b * b) + z * z / (c * c)));
  }
  // when the altitude drops through NASA's loss-of-signal height, and the altitude a minute before (10 percent load)
  function calibrate() {
    let lo = coverage[1] - 6 * 3600, hi = coverage[1] + 1800;
    if (altitude(lo) < H_LOS) return null;
    for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (altitude(m) > H_LOS) lo = m; else hi = m; }
    let tLos = (lo + hi) / 2;
    // the real readings, when there are some, say when the signal really ended
    if (FINALE_DATA && FINALE_DATA.end) tLos = utcToEt(new Date(FINALE_DATA.end).toISOString());
    const hLos = altitude(tLos);
    return { tLos, hLos, span: Math.max(50, altitude(tLos - RAMP) - hLos) };
  }
  // the thrusters' load (1 = full capacity) at this height: tenfold for every `span` km lower
  const load = h => Math.pow(10, -(h - F.hLos) / F.span);
  // pseudo-random but smooth, in -1..1
  const wob = (t, k) => (Math.sin(1.7 * t + k) + Math.sin(2.9 * t + 2.1 * k) + 0.5 * Math.sin(6.3 * t + 3.7 * k)) / 2.5;
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const jitter = s => new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(s);

  // ---------- effects, all children of the Cassini group (so they share its close-up render pass), in metres ----------
  let glowTex = null;
  function glowTexture() {
    if (glowTex) return glowTex;
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d"), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.25, "rgba(255,255,255,.55)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return glowTex = new THREE.CanvasTexture(c);
  }
  function sprite(color, size) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), color, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
    s.scale.setScalar(size); s.layers.set(1);
    return s;
  }
  // a thruster plume: a 1 N hydrazine jet is small and faint, so a soft glow that fades along its length and toward its
  // edges (no hard cone), with a bright point at the nozzle. The shader keeps the viewer's logarithmic depth
  let plumeMat = null;
  function plumeMaterial() {
    if (plumeMat) return plumeMat.clone();
    plumeMat = new THREE.ShaderMaterial({
      uniforms: { glow: { value: 0 }, tint: { value: new THREE.Color(0xcfe2ff) } },
      vertexShader: `varying float vAlong; varying vec3 vN; varying vec3 vV;
        #include <common>
        #include <logdepthbuf_pars_vertex>
        void main() { vAlong = -position.y; vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz);
          gl_Position = projectionMatrix * mv;
          #include <logdepthbuf_vertex>
        }`,
      fragmentShader: `uniform float glow; uniform vec3 tint; varying float vAlong; varying vec3 vN; varying vec3 vV;
        #include <logdepthbuf_pars_fragment>
        void main() {
          #include <logdepthbuf_fragment>
          float along = pow(clamp(1.0 - vAlong, 0.0, 1.0), 2.2);
          float edge = pow(abs(dot(normalize(vN), normalize(vV))), 1.5);
          gl_FragColor = vec4(tint * glow * along * edge, 1.0);
        }`,
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
    return plumeMat.clone();
  }
  // one thruster: nozzle at pos, exhaust along dir (both in the Cassini group's frame, metres)
  function plume(pos, dir) {
    const g = new THREE.Group(), geo = new THREE.ConeGeometry(0.11, 1, 20, 6, true);
    geo.translate(0, -0.5, 0);   // the tip at the nozzle, widening along -Y over 1 m (scaled to the jet's length)
    const jet = new THREE.Mesh(geo, plumeMaterial());
    jet.layers.set(1); jet.frustumCulled = false;
    const core = sprite(0xeef4ff, 0.14);
    g.add(jet, core);
    g.position.copy(pos);
    g.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), dir);
    g.userData = { jet, core, dir: dir.clone(), torque: new THREE.Vector3().crossVectors(pos, dir.clone().negate()) };
    return g;
  }
  // sparks, wisps of air and pieces: point clouds whose points are kept in the scene's directions and turned into the
  // spacecraft's frame each frame, so they stream behind it however it tumbles
  function cloud(max, size) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(max * 3), 3));
    geo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(max * 3), 3));
    geo.setDrawRange(0, 0);
    const p = new THREE.Points(geo, new THREE.PointsMaterial({ size, sizeAttenuation: false, vertexColors: true, map: glowTexture(), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    p.layers.set(1); p.frustumCulled = false; p.userData = { max, list: [] };
    return p;
  }
  function addEffects() {
    // Cassini's sixteen 1 N hydrazine thrusters, four clusters of four, sit at the ends of the four short booms at the
    // base of the spacecraft beside the main engines (JPL, "Cassini's Hydrazine-fueled Rocket Thrusters"). Placed from
    // NASA's model itself: each boom ends in a box at (±1.236, ±1.661) m off the axis, 2.4 m below the model's origin,
    // with two nozzles on its outer face firing sideways (body ±Y, for roll) and nozzles underneath firing aft (body +Z,
    // away from the dish, for pitch and yaw). The model's axes become the group's as (-x, z, y)
    const thr = [];
    for (const sx of [1, -1]) for (const sz of [1, -1]) {
      const at = (mx, my, mz) => new THREE.Vector3(-mx, mz, my);
      thr.push(plume(at(sx * 1.236, -2.533, sz * 1.585), new THREE.Vector3(0, 0, -1)));
      thr.push(plume(at(sx * 1.236, -2.43, sz * 1.78), new THREE.Vector3(0, sz, 0)));
      thr.push(plume(at(sx * 1.236, -2.36, sz * 1.78), new THREE.Vector3(0, sz, 0)));
    }
    thr.forEach(p => cassini.add(p));

    F.wobRate = F.wob && dt > 0 ? [(w0[0] - F.wob[0]) / dt, (w0[1] - F.wob[1]) / dt] : [0, 0]; F.wob = w0;
    if (err < 1) { cassini.rotateX(w0[0]); cassini.rotateY(w0[1]); }
    else { cassini.rotateX(0.2 * wob(t, 0)); cassini.rotateOnAxis(F.tumbleAxis, a + 0.6 * Math.max(0, s) ** 1.3); }
    qInv.copy(cassini.quaternion).invert();
    const heat = F.lost ? clamp01((s - 0.3) / 5) : 0;
    const fx = F.fx;
    if (fx) {
      // thruster firing by rule: the controller wants a torque that pushes the wobble back and damps its swing (plus
      // a slow roll trim), and each thruster whose own torque helps fires, more often the harder the air pushes; past
      // full load they all fire, flat out
      const want = new THREE.Vector3(-(F.wob[0] * 3 + F.wobRate[0]), -(F.wob[1] * 3 + F.wobRate[1]), 0.3 * wob(t * 0.7, 9) * a).normalize();
      fx.thr.forEach(p => {
        const help = p.userData.torque.clone().normalize().dot(want);
        const on = L >= 1 || (L > 0.02 && help > 0.25 && Math.random() < Math.min(1, 0.25 + 2 * L) * help);
        const lit = on ? 0.6 + 0.4 * Math.random() : 0;
        p.userData.jet.material.uniforms.glow.value = lit * (0.8 + 0.6 * Math.min(1, L));
        p.userData.core.material.opacity = lit;
        p.userData.jet.scale.set(1, (0.3 + 0.5 * Math.min(1, L)) * (0.85 + 0.3 * Math.random()), 1);
      });
      // heating on the leading side (where the mass spectrometer looks), the model warming toward red, then the break-up
      const lead = vScene.clone().applyQuaternion(qInv);
      fx.glow.position.copy(lead).multiplyScalar(3.2); fx.core.position.copy(lead).multiplyScalar(2.6);
      fx.glow.material.opacity = Math.min(1, heat * 1.3) * (0.8 + 0.2 * Math.random()); fx.glow.scale.setScalar(4 + 22 * heat * heat);
      fx.core.material.opacity = heat * (0.7 + 0.3 * Math.random()); fx.core.scale.setScalar(2 + 6 * heat);
      fx.mats.forEach(m => m.emissive.setRGB(1.1 * heat * heat, 0.32 * heat * heat, 0.06 * heat));
      stepParticles(fx, dt, vScene, L, heat);
    }
    air.style.opacity = Math.min(1, 0.1 * Math.min(1, L) ** 2 + 0.75 * heat);
    if (!F.lost) { sound("carrier", signal, Math.min(1, L)); sound("drone", Math.min(1, 0.15 + L)); }
    read.innerHTML = `Altitude ${fmtInt(h)} km · Thrusters <i>${Math.round(Math.min(100, L * 100))}%</i> · Antenna <i>${err < 10 ? err.toFixed(2) : fmtInt(err)}°</i> off Earth · Signal <i>${F.lost ? "lost" : Math.round(signal * 100) + "%"}</i>`;
    drawData(F.tau);
  };
  // the camera: beside Cassini with Saturn's clouds below and the horizon level, drifting round toward the rings;
  // then far back from Saturn. A drag turns it, the wheel zooms
  window.studyCamera = () => {
    if (!F || F.phase === "out") return;
    if (F.phase === "descent") {
      const s = F.tau - F.tLos, k = clamp01((s + LEAD) / (LEAD + 10));
      relScene("SATURN", vT).sub(cassini.position);   // Cassini -> Saturn's centre
      uScene.copy(vT).negate().normalize();
      // toward the rings: a point of the ring plane 120,000 km from Saturn on Cassini's side, laid on its horizon
      const pole = toScene(iauMatrix(bodies.SATURN, state.et)[2], new THREE.Vector3()).normalize();
      const out = vT.clone().negate(), ring = out.addScaledVector(pole, -out.dot(pole)).setLength(1.2e5 / KM);
      rScene.copy(vT).add(ring);
      rScene.addScaledVector(uScene, -rScene.dot(uScene));
      if (rScene.lengthSq() < 1e-12) rScene.crossVectors(uScene, pole);
      rScene.normalize();
      // the horizontal look direction turns from 40 deg to 95 deg off that direction as the descent goes on, which
      // brings the rings rising beyond the horizon into the frame and across it
      const yaw = (-40 - 55 * k) * Math.PI / 180 + look.yaw, pitch = 0.16 + 0.06 * k + look.pitch;
      const dirv = rScene.clone().applyAxisAngle(uScene, yaw).multiplyScalar(Math.cos(pitch)).addScaledVector(uScene, -Math.sin(pitch)).normalize();
      const d = (3.6e-5 - 1.6e-5 * clamp01((s + LEAD) / LEAD)) * look.zoom;
      // shake: the struggle, then the heating
      const L = load(altitude(F.tau)), heat = F.lost ? clamp01((s - 0.3) / 5) : 0, sh = d * (0.004 * Math.min(1, L) + 0.03 * heat);
      camera.position.copy(cassini.position).addScaledVector(dirv, -d);
      camera.up.copy(uScene);
      camera.lookAt(cassini.position.clone().add(jitter(sh)));
    } else {
      // Saturn from the sunlit side, a little above the rings, turning slowly
      const R = iauMatrix(bodies.SATURN, state.et), pole = toScene(R[2], new THREE.Vector3()).normalize();
      toScene(norm(sub(pos.SUN, pos.SATURN, tmpS)), vScene).normalize();
      const side = new THREE.Vector3().crossVectors(pole, vScene).normalize();
      const k = (performance.now() - F.recapAt) / 1000;
      // facing the spot where Cassini went in at first, then drifting round to the sunlit side as it pulls back
      rel(F.tau, tmpC); const entry = toScene(tmpC, new THREE.Vector3()).normalize(), m = clamp01(k / 25);
      const dir = entry.multiplyScalar(0.9 * (1 - m)).addScaledVector(vScene, 0.25 + 0.5 * m).addScaledVector(side, 0.25 + 0.3 * m).normalize();
      dir.addScaledVector(pole, 0.3 + look.pitch).normalize().applyAxisAngle(pole, -0.003 * k + look.yaw);
      camera.position.copy(dir.multiplyScalar((260 + 180 * (1 - Math.exp(-k / 9))) * look.zoom));
      camera.up.copy(pole);
      camera.lookAt(new THREE.Vector3().addScaledVector(pole, -22));
    }
  };

  // playback reaching the end of the data starts it
  const advance = window.studyAdvance;
  window.studyAdvance = (et, dt, speed) => {
    const next = advance ? advance(et, dt, speed) : et + dt * speed;
    if (!F && et < coverage[1] - 0.5 && next >= coverage[1] - 0.5 && endsMission()) setTimeout(play, 0);
    return next;
  };
  // Escape or Skip ends it; dragging and the wheel look around
  window.addEventListener("keydown", e => { if (F && e.key === "Escape") { e.preventDefault(); e.stopImmediatePropagation(); finish(); } }, true);
  skipBtn.addEventListener("click", e => { e.stopPropagation(); finish(); });
  window.addEventListener("pointerdown", onDown, true);
  window.addEventListener("pointermove", onMove, true);
  window.addEventListener("pointerup", onUp, true);
  window.addEventListener("pointercancel", onUp, true);
  window.addEventListener("wheel", onWheel, { capture: true, passive: false });
  window.cassiniFinale = { play, skip: finish, get running() { return !!F; } };
  // ?finale plays it as soon as the end of the mission is loaded
  if (new URLSearchParams(location.search).has("finale")) {
    const wait = setInterval(() => {
      if (!coverage[1] || !tracks.CASSINI || $("loading") && !$("loading").hidden) return;
      if (!endsMission()) { clearInterval(wait); return; }
      if (Math.abs(state.et - coverage[1]) > 7200) { setTime(coverage[1]); return; }
      if (typeof yearReady === "function" && !yearReady()) return;
      clearInterval(wait); play();
    }, 250);
  }
})();
</script>
