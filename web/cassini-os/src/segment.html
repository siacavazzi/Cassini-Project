<!-- A highlighted stretch of the timeline for Cassini OS. build.py splices the parts below into the page: the style
     into the head, the aside into #app and the script after the export script (whose marks it uses); the script moves
     the bar into the Cassini Replay window, as a row right above the timeline.
     Highlight a stretch (drag across the timeline; a click still moves the clock; I and O mark its ends at the clock)
     and the bar comes up with its times, its frames and one button, Edit: the highlight is let go and the stretch
     opens in the Movie Editor (movieedit.html), first as a small window that shows it loading (the frames listed, then
     every picture the editor and the camera windows will show made ahead on the frame server) and then as the whole
     editor. Playing, saving and the look are the editor's.
     Making a stretch ahead is here (cassiniSegment.make: POST /prebuild, web/frames/prebuild.py, the pre-build tool's
     own makers, at the windows' sizes and in the page's look); the editor asks for it, and a line along the foot of
     the timeline shows how far it is. While movie mode keeps waiting on pictures being made ("cassini:movie-slow"), a
     quiet note says a stretch can be opened in the editor to make it ahead, with a button that highlights what is
     coming up. -->
<style>
/* a row of the Cassini Replay window, right above the timeline: it comes and goes with the window, never behind it */
#segbar { display: flex; gap: 8px; align-items: center; margin: 4px 0 2px; padding: 5px 6px 5px 10px; box-sizing: border-box; border-radius: 6px;
  background: rgba(138,182,255,.07); border: 1px solid rgba(138,182,255,.28); color: var(--q-text, #ddd); font: 11px/1.25 var(--ui); }
#segbar[hidden], #seghint[hidden] { display: none !important; }
#segwhen { color: var(--q-text, #ddd); font-variant-numeric: tabular-nums; white-space: nowrap; }
#segwhat { color: var(--q-dim, #888); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#segbar .grow { flex: 1; }
#segbar button { font: inherit; padding: 3px 12px; border-radius: 4px; border: 1px solid var(--q-line, #555); background: rgba(255,255,255,.08); color: var(--q-text, #ddd); cursor: pointer; white-space: nowrap; }
#segbar button:hover { background: rgba(255,255,255,.16); }
#segbar button:disabled { opacity: .45; cursor: default; }
#segbar #segedit { background: var(--q-accent, #8ab6ff); border-color: transparent; color: #0b1019; font-weight: 600; padding: 3px 16px; }
#segbar #segedit:hover { filter: brightness(1.1); }
#segbar #segedit:disabled { filter: none; }
#segbar #segx { border: 0; background: none; padding: 0 4px; color: var(--q-dim, #888); font-size: 14px; line-height: 1; }
#segbar #segx:hover { color: var(--q-text, #ddd); }
#seghint { position: fixed; left: 50%; transform: translateX(-50%); z-index: 1100; display: flex; gap: 12px; align-items: center; max-width: min(560px, calc(100vw - 16px)); box-sizing: border-box;
  padding: 7px 12px; border-radius: 8px; background: var(--q-panel, rgba(16,17,20,.72)); border: 1px solid var(--q-line, rgba(255,255,255,.1)); color: var(--q-text, #ddd);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); font: 11.5px/1.35 var(--ui); box-shadow: 0 8px 30px rgba(0,0,0,.45); opacity: 0; transition: opacity .4s ease; }
#seghint.on { opacity: 1; }
#seghint button { font: inherit; background: none; border: 0; padding: 0; color: var(--q-accent, #8ab6ff); cursor: pointer; white-space: nowrap; }
#seghint button.x { color: var(--q-dim, #888); font-size: 14px; line-height: 1; }
body.phone #segbar button { padding: 6px 11px; }
</style>

<aside id="segbox">
  <div id="segbar" role="group" aria-label="Highlighted stretch" hidden>
    <span id="segwhen"></span><span id="segwhat"></span><span class="grow"></span>
    <button id="segedit" title="Open this stretch in the Movie Editor: pick its frames, its look, play it and save it (Enter)">Edit</button>
    <button id="segx" aria-label="Clear the highlight" title="Clear the highlight (Esc)">×</button>
  </div>
  <div id="seghint" role="status" aria-live="polite" hidden><span>Movie mode is waiting for pictures to be made. Highlight a stretch of the timeline and press Edit: its pictures are made ahead while it opens.</span><button id="seghintgo">Highlight what’s next</button><button class="x" id="seghintx" aria-label="Dismiss">×</button></div>
</aside>

<script>
// ---------- a highlighted stretch of the timeline, and making a stretch ahead ----------
(function () {
  const $ = id => document.getElementById(id);
  const FRAMES = (() => {                       // the frame server, chosen as the camera window chooses it
    const q = new URLSearchParams(location.search).get("frames");
    if (q) return q.replace(/\/$/, "");
    if (/^https?:$/.test(location.protocol) && !/claude\.ai$|claudeusercontent\.com$|claude\.site$/.test(location.hostname)) return location.origin;
    return "http://localhost:8765";
  })();
  const S = window.cassiniSettings, EX = window.cassiniExport;
  if (!EX) return;
  const opt = (k, d) => (S && S.get(k) !== undefined ? S.get(k) : d);
  const MOST_NONE = 200000;                     // the top of Settings > Playback > Make ahead up to: no limit
  const most = () => { const v = +opt("segment.maxFrames", MOST_NONE) || MOST_NONE; return v >= MOST_NONE ? 0 : v; };
  if (S) {
    // the most frames one stretch makes ahead (prebuild.py SEGMENT_MAX: the server may set its own ceiling over this)
    S.define({ key: "segment.maxFrames", section: "Playback", label: "Make ahead up to", type: "range", value: MOST_NONE, min: 5000, max: MOST_NONE, step: 5000,
      format: v => v >= MOST_NONE ? "No limit" : `${v.toLocaleString()} frames`,
      hint: "The most frames of a stretch opened in the Movie Editor that are made ahead while it opens (a busy day near Saturn has about 1,500). A long stretch takes a while: the editor shows how long is left, can open before it is done, and what is made stays made. A public site may set its own limit." });
    S.define({ key: "segment.hint", section: "Playback", label: "Suggest making a stretch ahead when movie mode waits", type: "toggle", value: true,
      hint: "A quiet note when movie mode spends most of its time waiting for pictures to be made." });
  }
  const bar = $("segbar"), hint = $("seghint");
  $("tl").parentNode.insertBefore(bar, $("tl"));
  // P: the stretch highlighted now (a, b); J: the stretch being made ahead (its job on the frame server)
  const P = { a: null, b: null, hintAt: -1e9 };
  let J = null;
  const isoOf = et => new Date(etToMs(et)).toISOString().slice(0, 19);
  const short = et => { const d = new Date(etToMs(et)).toISOString(); return `${d.slice(0, 10)} ${d.slice(11, 16)}`; };

  // ---- what the camera windows will ask for: their cameras and sizes, and the page's look ----
  // A window's size changes with the picture in it (cassiniWM.sized: 1024, or 512 when it shows the picture that small,
  // which a window often does once its first picture is up), so both are made, except on a phone, which asks for 512
  // The cameras: the camera windows open; with one camera window closed its camera is off (cassiniFeeds.liveCams): the
  // timeline, movie mode and the windows have none of its pictures
  const liveCams = () => (window.cassiniFeeds && cassiniFeeds.liveCams ? cassiniFeeds.liveCams() : null);
  function windows() {
    const open = new Set();
    for (const card of document.querySelectorAll(".win:not([hidden]) [data-cam]")) if (/^[NW]$/.test(card.dataset.cam)) open.add(card.dataset.cam);
    let cams = open.size ? ["N", "W"].filter(c => open.has(c)).join("") : "NW";
    const lc = liveCams();
    if (lc) cams = lc;
    return { cams, sizes: document.body.classList.contains("phone") ? "512" : "512,1024" };
  }
  function params(a, b) {
    const w = windows();
    const q = new URLSearchParams({ from: isoOf(a), until: isoOf(b), cams: w.cams, sizes: w.sizes,
      mosaics: opt("cameras.mosaics", true) && window.cassiniMosaics !== false ? "1" : "0", steady: opt("movies.steady", true) ? "1" : "0",
      color: opt("cameras.composites", true) ? "1" : "0", processed: opt("cameras.processedFrames", true) === false ? "0" : "1",
      center: opt("cameras.autoCenter", true) === false ? "0" : "1", trail: String(opt("movies.trail", 0) || 0), laps: String(opt("movies.laps", 1) || 1),
      fade: String(opt("movies.mosaicFrames", "rolling") === "whole" ? 0 : opt("movies.fade", 0) || 0), persist: String(opt("movies.persist", 35) ?? 35),
      steady_smooth: String(window.cassiniStabilize ? window.cassiniStabilize() : 0),
      exposure: String(window.cassiniExposure ? window.cassiniExposure() : 0) });
    return q.toString() + (window.cassiniLook ? window.cassiniLook() : "");
  }
  // frames of the windows' cameras in the stretch (in the body view, of its body alone, as the timeline and the
  // windows show them): from the catalog in the months loaded now (the clock's and two either side), and from the
  // catalog files of the months the stretch covers when it reaches past them, as the timeline's bars there do
  // (window.cassiniParts, head-quiet.html: each file fetched once; null while one is on its way, and the count comes
  // up when it is in)
  const body = () => (window.cassiniBodyMode && cassiniBodyMode.name) || null;
  document.addEventListener("cassini:part", () => { if (!bar.hidden && P.a != null) summary(); });
  function frames(a, b) {
    if (!catalog || a == null) return 0;
    const cams = windows().cams, vb = body();
    if (typeof loadedSpan === "undefined" || (a >= loadedSpan[0] && b <= loadedSpan[1])) {
      const i0 = lastImageIndex(a) + 1, i1 = lastImageIndex(b) + 1;
      let n = 0; for (let i = i0; i < i1; i++) { const k = order[i]; if (cams.includes(catalog.cam[k]) && (!vb || catalog.target[k] === vb)) n++; }
      return n;
    }
    let n = 0, waiting = false;
    for (const { file } of cassiniParts.files(a, b)) {
      const c = cassiniParts.cat(file);
      if (!c) { waiting = true; continue; }
      for (let k = 0; k < c.et.length; k++) if (c.et[k] > a && c.et[k] <= b && cams.includes(c.cam[k]) && (!vb || c.target[k] === vb)) n++;
    }
    return waiting ? null : n;
  }

  // ---- the bar, over the stretch on the timeline ----
  function summary() {
    $("segwhen").textContent = `${short(P.a)} → ${short(P.b)} UTC`;
    const n = frames(P.a, P.b);
    $("segwhat").textContent = n == null ? `· ${fmtDur(P.b - P.a)} · counting frames…` : n ? `· ${fmtDur(P.b - P.a)} · ${n.toLocaleString()} frame${n === 1 ? "" : "s"}` : `· ${fmtDur(P.b - P.a)} · no pictures`;
    $("segedit").disabled = !n;
  }
  // a stretch marked (export.html's marks, also its window's From and Until): the bar comes up for it
  function marked(a, b) {
    if (a == null || b == null || b - a < 1) { hide(); return; }
    // the stretch the Movie Editor has open (marked again for its Save movie…): the editor is its bar
    if (window.cassiniMovieEdit && cassiniMovieEdit.holds && cassiniMovieEdit.holds(a, b)) { hide(); return; }
    P.a = a; P.b = b;
    bar.hidden = false; summary();
  }
  function hide() { bar.hidden = true; P.a = P.b = null; }
  document.addEventListener("cassini:marks", e => marked(e.detail.a, e.detail.b));
  // Edit: the highlight lets go, and the stretch opens in the Movie Editor (its loading window first)
  function edit() {
    if (P.a == null || !window.cassiniMovieEdit) return;
    const a = P.a, b = P.b;
    if (window.cassiniMovie && window.cassiniMovie.on && state.playing) setPlaying(false);
    EX.clear(true); hide();
    cassiniMovieEdit.open({ a, b });
  }

  // ---- making a stretch ahead: the frame server's job, followed every second (more often as it starts) ----
  // make(a, b, update): one stretch at a time (a new one stops the last, whose pictures stay made); update(job) hears
  // each answer: { state: queued | planning | making | waiting | finishing | done | failed | stopped, done, total,
  // frames, eta, took, errors, error }. The server answers once the stretch is made when that is quick (every picture
  // in the cache: a tenth of a second), or after a moment with how far it is; the page then looks again after 0.1,
  // 0.2, 0.4 and 0.8 s and every second from there. Answers { stop() }.
  const BUSY = /^(queued|planning|making|waiting|finishing)$/;
  function make(a, b, update) {
    if (J) J.stop();
    const me = J = { a, b, job: null, poll: 0, looks: 0, gone: false,
      stop() {
        if (me.gone) return; me.gone = true; clearTimeout(me.poll);
        if (me.job && BUSY.test(me.job.state)) fetch(`${FRAMES}/prebuild/${me.job.id}/stop`, { method: "POST" }).catch(() => {});
        if (J === me) J = null;
        titled(); redraw();
      } };
    const tell = j => { me.job = j; titled(); redraw(); try { update(j); } catch (err) {} };
    function follow(j) {
      if (me.gone) return;
      tell(j);
      if (!BUSY.test(j.state)) { if (J === me) { J = j.state === "done" ? me : null; } return; }
      me.poll = setTimeout(async () => {
        if (me.gone) return;
        try { const r = await fetch(`${FRAMES}/prebuild/${j.id}.json`, { cache: "no-store" }); follow(r.ok ? await r.json() : j); }
        catch (err) { follow(j); }
      }, me.looks < 4 ? 100 << me.looks++ : 1000);
    }
    (async () => {
      try {
        const r = await fetch(`${FRAMES}/prebuild?${params(a, b)}&most=${most()}`, { method: "POST" }), j = await r.json().catch(() => ({}));
        if (me.gone) return;
        if (!r.ok) { tell({ state: "failed", error: j.error || "The frame server cannot make that ahead.", done: 0, total: 0 }); if (J === me) J = null; return; }
        follow(j);
      } catch (err) { if (!me.gone) { tell({ state: "failed", error: `No frame server at ${FRAMES} that makes pictures ahead.`, unsupported: true, done: 0, total: 0 }); if (J === me) J = null; } }
    })();
    return me;
  }
  // The stretch is made on the frame server, so it carries on while the page is in the background; the tab's title
  // shows how far it is
  const TITLE = document.title;
  function titled() {
    const j = J && J.job, busy = j && BUSY.test(j.state);
    document.title = busy && j.total ? `${Math.floor(100 * j.done / j.total)}% made ahead · ${TITLE}` : TITLE;
  }

  // ---- the timeline: how far the stretch is made, a line along its foot ----
  const redraw = () => { if (typeof drawTimeline === "function" && catalog) drawTimeline(); };
  const prevTimeline = window.studyTimeline;
  window.studyTimeline = (g, w, h, xn) => {
    if (prevTimeline) prevTimeline(g, w, h, xn);
    const j = J && J.job;
    if (j && j.through && j.state !== "failed") {
      const xa = etToX(J.a, w), xt = etToX(Math.min(J.b, utcToEt(j.through)), w);
      g.fillStyle = j.state === "done" ? "rgba(138,182,255,0.95)" : "rgba(138,182,255,0.7)";
      if (xt > xa) g.fillRect(xa, h - 3, xt - xa, 3);
    }
  };

  // ---- the controls ----
  $("segedit").addEventListener("click", edit);
  $("segx").addEventListener("click", () => { EX.clear(true); hide(); });
  window.addEventListener("keydown", e => {
    if (bar.hidden || document.querySelector(".menu.open, .win.full") || (window.cassiniMovie && window.cassiniMovie.on) || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if ($("excard") && !$("excard").hidden) return;
    if (e.key === "Escape") { EX.clear(true); hide(); }
    else if (e.key === "Enter" && !$("segedit").disabled) { e.preventDefault(); edit(); }
  });

  // in the background: the pause note says the stretch is still being made
  const away = $("awaynote"), awayText = away && away.textContent;
  document.addEventListener("cassini:away", e => {
    const busy = J && J.job && BUSY.test(J.job.state);
    if (away) away.textContent = e.detail.away && busy ? `${awayText} · the stretch in the Movie Editor keeps being made ahead` : awayText;
    if (!e.detail.away) titled();
  });

  // ---- the note when movie mode keeps waiting ----
  let hintTimer = 0;
  function showHint() {
    if (!opt("segment.hint", true) || performance.now() - P.hintAt < 10 * 60e3 || (J && J.job && BUSY.test(J.job.state))) return;
    P.hintAt = performance.now();
    const r = ($("dock") || $("tl")).getBoundingClientRect();
    hint.style.bottom = `${Math.max(8, innerHeight - r.top + 8)}px`;
    hint.hidden = false; requestAnimationFrame(() => hint.classList.add("on"));
    clearTimeout(hintTimer); hintTimer = setTimeout(hideHint, 15000);
  }
  function hideHint() { hint.classList.remove("on"); setTimeout(() => { if (!hint.classList.contains("on")) hint.hidden = true; }, 400); }
  document.addEventListener("cassini:movie-slow", e => (e.detail.slow ? showHint() : hideHint()));
  $("seghintx").addEventListener("click", hideHint);
  // what's next: from the clock to the 300th frame after it (or the end of the months loaded)
  $("seghintgo").addEventListener("click", () => {
    hideHint();
    if (!catalog) return;
    const i = lastImageIndex(state.et), j = Math.min(catalog.sorted.length - 1, i + 300);
    if (j <= i) return;
    if (window.cassiniMovie && window.cassiniMovie.on) setPlaying(false);
    EX.mark(state.et, catalog.sorted[j] + 1);
  });
  window.cassiniSegment = { make, edit, hide, frames, get state() { return P; }, get making() { return J; } };
})();
</script>
