<!-- Pre-processing a stretch of the timeline for Cassini OS. build.py splices the parts below into the page: the style
     into the head, the aside into #app and the script after the export script (whose marks it uses); the script moves
     the bar into the Cassini Replay window, as a row right above the timeline.
     Highlight a stretch (drag across the timeline; a click still moves the clock; I and O mark its ends at the clock)
     and the bar comes up, with NAC / WAC / Both (the Export window's Cameras; one camera plays alone, the other's
     window stepping aside), and it stays up while the stretch is made: Pre-process asks the frame server to make every picture the camera
     windows will show in the stretch, ahead of time (POST /prebuild: web/frames/prebuild.py, the pre-build tool's own
     makers, at the windows' sizes and in the page's look). The bar and the timeline show how far it is; when it is
     done the stretch plays in movie mode (movie.html, cassiniMovie.start with the stretch) at the frame rate on the
     bar's slider (movie.fps, also under Settings > Playback), every picture waiting in the cache.
     While movie mode keeps waiting on pictures being made ("cassini:movie-slow"), a quiet note says a stretch can
     be pre-processed, with a button that highlights what is coming up. -->
<style>
/* a row of the Cassini Replay window, right above the timeline: it comes and goes with the window, never behind it */
#segbar { display: grid; gap: 5px; margin: 4px 0 2px; padding: 6px 8px 7px; box-sizing: border-box; border-radius: 6px;
  background: rgba(138,182,255,.07); border: 1px solid rgba(138,182,255,.28); color: var(--q-text, #ddd); font: 11px/1.25 var(--ui); }
#segbar[hidden], #seghint[hidden], #segbar [hidden] { display: none !important; }
/* while a stretch is being made, its window stays up when the rest of the interface fades */
body.idle #dock:has(#segbar.busy) { opacity: 1; pointer-events: auto; }
#segbar #segcams button { padding: 3px 9px; border: 0; border-radius: 0; background: none; }
#segbar #segcams button + button { border-left: 1px solid var(--q-line, #555); }
#segbar #segcams button[aria-pressed="true"] { background: rgba(138,182,255,.3); color: #fff; }
#segbar .segrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#segwhen { color: var(--q-text, #ddd); font-variant-numeric: tabular-nums; white-space: nowrap; }
#segwhat { color: var(--q-dim, #888); font-variant-numeric: tabular-nums; white-space: nowrap; }
#segbar button { font: inherit; padding: 3px 9px; border-radius: 4px; border: 1px solid var(--q-line, #555); background: rgba(255,255,255,.08); color: var(--q-text, #ddd); cursor: pointer; white-space: nowrap; }
#segbar button:hover { background: rgba(255,255,255,.16); }
#segbar button:disabled { opacity: .45; cursor: default; }
#segbar button.go { background: var(--q-accent, #8ab6ff); border-color: transparent; color: #0b1019; font-weight: 600; }
#segbar #segx { border: 0; background: none; padding: 0 2px; color: var(--q-dim, #888); font-size: 14px; line-height: 1; margin-left: auto; }
#segbar #segx:hover { color: var(--q-text, #ddd); }
#segfps { width: 96px; accent-color: var(--q-accent, #8ab6ff); }
#segfpsv { min-width: 40px; font-variant-numeric: tabular-nums; color: var(--q-dim, #888); }
#segstate { color: var(--q-dim, #888); font-variant-numeric: tabular-nums; }
#segstate.warn { color: #e6bb68; }
#segprog { height: 3px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
#segprog i { display: block; height: 100%; width: 0; background: var(--q-accent, #8ab6ff); transition: width .4s ease; }
#segbar .segrow > .grow { flex: 1; }
#seghint { position: fixed; left: 50%; transform: translateX(-50%); z-index: 1100; display: flex; gap: 12px; align-items: center; max-width: min(560px, calc(100vw - 16px)); box-sizing: border-box;
  padding: 7px 12px; border-radius: 8px; background: var(--q-panel, rgba(16,17,20,.72)); border: 1px solid var(--q-line, rgba(255,255,255,.1)); color: var(--q-text, #ddd);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); font: 11.5px/1.35 var(--ui); box-shadow: 0 8px 30px rgba(0,0,0,.45); opacity: 0; transition: opacity .4s ease; }
#seghint.on { opacity: 1; }
#seghint button { font: inherit; background: none; border: 0; padding: 0; color: var(--q-accent, #8ab6ff); cursor: pointer; white-space: nowrap; }
#seghint button.x { color: var(--q-dim, #888); font-size: 14px; line-height: 1; }
body.phone #segbar button { padding: 6px 11px; }
body.phone #segfps { flex: 1; }
</style>

<aside id="segbox">
  <div id="segbar" role="group" aria-label="Highlighted stretch" hidden>
    <div class="segrow"><span id="segwhen"></span><span id="segwhat"></span><button id="segx" aria-label="Clear the highlight" title="Clear the highlight (Esc)">×</button></div>
    <div class="segrow">
      <div class="exseg" id="segcams" role="group" aria-label="Cameras"><button data-v="NW">Both</button><button data-v="N">NAC</button><button data-v="W">WAC</button></div>
      <button id="segprep" title="Make every picture of this stretch ahead of time, so it plays smoothly at any frame rate">Pre-process</button>
      <button id="segstop" hidden>Stop</button>
      <button id="segplay" title="Play this stretch as a movie">▶ Play</button>
      <label for="segfps">Frame rate</label><input type="range" id="segfps" min="2" max="30" step="1" aria-label="Movie frame rate"><span id="segfpsv"></span>
      <span class="grow"></span>
      <button id="segedit" title="Pick which frames go into this movie, and its look (Movie Editor)">Edit…</button>
      <button id="segexport" title="Make a video file of this stretch to download (E)">Save movie…</button>
      <button id="segfull" hidden title="Save this stretch as a video with its mosaics at their own full resolution (extra work on the frame server)">Full resolution…</button>
    </div>
    <div id="segprog" hidden><i></i></div>
    <div class="segrow" id="segstaterow" hidden><span id="segstate" role="status" aria-live="polite"></span></div>
  </div>
  <div id="seghint" role="status" aria-live="polite" hidden><span>Movie mode is waiting for pictures to be made. Highlight a stretch of the timeline and pre-process it to watch it smoothly.</span><button id="seghintgo">Highlight what’s next</button><button class="x" id="seghintx" aria-label="Dismiss">×</button></div>
</aside>

<script>
// ---------- pre-processing a stretch of the timeline ----------
(function () {
  const $ = id => document.getElementById(id);
  const FRAMES = (() => {                       // the frame server, chosen as the camera window chooses it
    const q = new URLSearchParams(location.search).get("frames");
    if (q) return q.replace(/\/$/, "");
    if (/^https?:$/.test(location.protocol) && !/claude\.ai$|claudeusercontent\.com$|claude\.site$/.test(location.hostname)) return location.origin;
    return "http://localhost:8765";
  })();
  const S = window.cassiniSettings, EX = window.cassiniExport;
  if (!EX) return;
  const opt = (k, d) => (S && S.get(k) !== undefined ? S.get(k) : d);
  const MOST_NONE = 200000;                     // the top of Settings > Playback > Pre-process up to: no limit
  const most = () => { const v = +opt("segment.maxFrames", MOST_NONE) || MOST_NONE; return v >= MOST_NONE ? 0 : v; };
  if (S) {
    S.define({ key: "segment.autoplay", section: "Playback", label: "Play a pre-processed stretch when it is ready", type: "toggle", value: true,
      hint: "After Pre-process on a highlighted stretch of the timeline, it plays as a movie from its start at the bar's frame rate." });
    // the most frames one Pre-process takes (prebuild.py SEGMENT_MAX: the server may set its own ceiling over this)
    S.define({ key: "segment.maxFrames", section: "Playback", label: "Pre-process up to", type: "range", value: MOST_NONE, min: 5000, max: MOST_NONE, step: 5000,
      format: v => v >= MOST_NONE ? "No limit" : `${v.toLocaleString()} frames`,
      hint: "The most frames one highlighted stretch can pre-process at once (the frames the bar counts; a busy day near Saturn has about 1,500). A long stretch takes a while: the bar shows how long is left, and what is made stays made if you stop it. A public site may set its own limit." });
    S.define({ key: "segment.hint", section: "Playback", label: "Suggest pre-processing when movie mode waits", type: "toggle", value: true,
      hint: "A quiet note when movie mode spends most of its time waiting for pictures to be made." });
  }
  const bar = $("segbar"), hint = $("seghint");
  $("tl").parentNode.insertBefore(bar, $("tl"));
  // P: the stretch's job on the frame server (null until Pre-process), the key of the choices it was made with,
  // and whether the stretch is playing as a movie now
  const P = { job: null, key: "", poll: 0, playing: false, a: null, b: null, hintAt: -1e9, tucked: null };
  const isoOf = et => new Date(etToMs(et)).toISOString().slice(0, 19);
  const short = et => { const d = new Date(etToMs(et)).toISOString(); return `${d.slice(0, 10)} ${d.slice(11, 16)}`; };

  // ---- what the camera windows will ask for: their cameras and sizes, and the page's look ----
  // A window's size changes with the picture in it (cassiniWM.sized: 1024, or 512 when it shows the picture that small,
  // which a window often does once its first picture is up), so both are made, except on a phone, which asks for 512
  // The cameras: the row's NAC / WAC / Both (shared with the Export window's Cameras), else the camera windows open
  function windows() {
    let cams = EX.state.cams;
    if (!/^(N|W|NW)$/.test(cams || "")) {
      const open = new Set();
      for (const card of document.querySelectorAll(".win:not([hidden]) [data-cam]")) if (/^[NW]$/.test(card.dataset.cam)) open.add(card.dataset.cam);
      cams = open.size ? ["N", "W"].filter(c => open.has(c)).join("") : "NW";
    }
    return { cams, sizes: document.body.classList.contains("phone") ? "512" : "512,1024" };
  }
  function camsUi() { const c = windows().cams; document.querySelectorAll("#segcams button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === c))); }
  function params() {
    const w = windows();
    const q = new URLSearchParams({ from: isoOf(P.a), until: isoOf(P.b), cams: w.cams, sizes: w.sizes,
      mosaics: opt("cameras.mosaics", true) && window.cassiniMosaics !== false ? "1" : "0", steady: opt("movies.steady", true) ? "1" : "0",
      color: opt("cameras.composites", true) ? "1" : "0", processed: opt("cameras.processedFrames", true) === false ? "0" : "1",
      center: opt("cameras.autoCenter", true) === false ? "0" : "1", trail: String(opt("movies.trail", 0) || 0), laps: String(opt("movies.laps", 1) || 1),
      fade: String(opt("movies.mosaicFrames", "rolling") === "whole" ? 0 : opt("movies.fade", 0) || 0), persist: String(opt("movies.persist", 35) ?? 35),
      steady_smooth: String(window.cassiniStabilize ? window.cassiniStabilize() : 0),
      exposure: String(window.cassiniExposure ? window.cassiniExposure() : 0) });
    return q.toString() + (window.cassiniLook ? window.cassiniLook() : "");
  }
  // frames of the windows' cameras in the stretch (in the months loaded now)
  function frames() {
    if (!catalog || P.a == null) return 0;
    const cams = windows().cams, i0 = lastImageIndex(P.a) + 1, i1 = lastImageIndex(P.b) + 1;
    let n = 0; for (let i = i0; i < i1; i++) if (cams.includes(catalog.cam[order[i]])) n++;
    return n;
  }

  // ---- the bar, over the stretch on the timeline ----
  const place = () => {};   // the bar is a row of the Cassini Replay window, laid out with it
  function say(text, warn) { $("segstate").textContent = text || ""; $("segstate").classList.toggle("warn", !!warn); $("segstaterow").hidden = !text; }
  function progress(frac) { $("segprog").hidden = frac == null; if (frac != null) $("segprog").firstElementChild.style.width = `${(frac * 100).toFixed(1)}%`; }
  function fpsUi() { const f = Math.round(window.cassiniMovie && window.cassiniMovie.fps ? window.cassiniMovie.fps() : opt("movie.fps", 8)); $("segfps").value = f; $("segfpsv").textContent = `${f} fps`; }
  // the choices a stretch is made with, apart from its times (P.key; P.span: the times it was made for)
  function optKey() { const q = new URLSearchParams(params()); q.delete("from"); q.delete("until"); return q.toString(); }
  const inside = () => P.span && P.a >= P.span[0] && P.b <= P.span[1];
  function buttons() {
    const j = P.job, busy = j && /^(queued|planning|making|waiting|finishing)$/.test(j.state), done = j && j.state === "done" && P.key === optKey() && inside();
    $("segprep").hidden = busy || done; $("segstop").hidden = !busy;
    $("segplay").classList.toggle("go", !!done);
    fullCheck(done);
    $("segplay").textContent = P.playing && state.playing ? "❚❚ Pause" : "▶ Play";
    bar.classList.toggle("busy", !!busy);
    camsUi();
  }
  // a stretch made ahead whose mosaics hold more than 1024 px: "Full resolution…" saves it with them at their own size
  // (the export's Picture size Full), its label saying how big; asked of the frame server once per stretch and choices
  let fullKey = "";
  function fullCheck(done) {
    const b = $("segfull");
    if (!done) { b.hidden = true; return; }
    const q = new URLSearchParams(EX.params()); q.set("size", "full"); q.set("cams", windows().cams);
    const key = q.toString();
    if (key === fullKey) return;
    fullKey = key; b.hidden = true;
    fetch(`${FRAMES}/export/plan.json?${key}`).then(r => r.ok ? r.json() : null).then(p => {
      if (fullKey !== key || !p || !p.full) return;
      const f = p.full;
      b.hidden = !(f.native > 1024 && f.mosaic_pictures);
      b.textContent = `Full resolution · ${f.pane.toLocaleString()} px…`;
    }).catch(() => {});
  }
  function summary() {
    $("segwhen").textContent = `${short(P.a)} → ${short(P.b)} UTC`;
    const n = frames();
    $("segwhat").textContent = n ? `· ${fmtDur(P.b - P.a)} · ${n.toLocaleString()} frame${n === 1 ? "" : "s"}` : `· ${fmtDur(P.b - P.a)} · no pictures`;
    $("segprep").disabled = $("segplay").disabled = !n;
  }
  // a stretch marked (export.html's marks, also its window's From and Until): the bar comes up for it
  // A stretch being made, or made, is kept (EX guard, below): its ends drag outward and the new ends are made too (a
  // new job over the whole stretch, which finds what is made already in the cache), never inward while it is being
  // made; a new highlight elsewhere waits for × (the made pictures stay in the frame server's cache either way)
  let grow = 0;
  function marked(a, b) {
    if (a == null || b == null || b - a < 1) { hide(); return; }
    const moved = a !== P.a || b !== P.b;
    P.a = a; P.b = b;
    if (moved && P.job && P.key !== optKey()) { stopPoll(); P.job = null; P.span = null; progress(null); say(""); }
    if (moved && kept() && !inside()) { clearTimeout(grow); grow = setTimeout(() => { if (kept() && !inside()) prep(); }, 600); }
    bar.hidden = false; summary(); fpsUi(); camsUi(); buttons(); place();
  }
  const kept = () => !!(P.job && P.span && P.key === optKey() && !/^(failed|stopped)$/.test(P.job.state));
  let noteAt = 0;
  function locked(text) {
    if (performance.now() - noteAt < 1500) return;
    const at = noteAt = performance.now(); say(text, true);
    setTimeout(() => { if (noteAt === at && P.job && P.job.state === "done") follow(P.job); }, 6000);
  }
  EX.state.guard = (a, b, how) => {
    if (!kept()) return [a, b];
    const [A, B] = P.span, busy = P.job.state !== "done";
    if (how === "clear" || (how === "new" && !(a <= A && b >= B))) {
      locked(busy ? "This stretch is being pre-processed: drag its ends outward to add to it, or × to let it go." : "This stretch is made ahead: drag its ends to change it, or × to highlight another.");
      return null;
    }
    if (busy && (a > A || b < B)) { locked("Its ends move outward while it is being pre-processed: the part made stays made."); return [Math.min(a, A), Math.max(b, B)]; }
    return [a, b];
  };
  function hide() { bar.hidden = true; untuck(); stopPoll(); clearTimeout(grow); P.playBack = false; titled(null); P.job = null; P.span = null; P.a = P.b = null; P.playing = false; progress(null); say(""); }
  document.addEventListener("cassini:marks", e => marked(e.detail.a, e.detail.b));

  // ---- making it ahead: the frame server's job, followed every second (more often as it starts) ----
  // The server answers once the stretch is made when that is quick (every picture in the cache: a tenth of a second),
  // or after a moment with how far it is; the page then looks again after 0.1, 0.2, 0.4 and 0.8 s and every second
  // from there, so a stretch made in a moment says Ready in that moment, not after a second of "Starting…"
  async function prep() {
    const key = params(), old = P.job && /^(queued|planning|making|waiting|finishing)$/.test(P.job.state) ? P.job.id : null;
    // a stretch grown while it is being made: the old job gives way to the whole stretch's (its pictures are made)
    if (old) fetch(`${FRAMES}/prebuild/${old}/stop`, { method: "POST" }).catch(() => {});
    // (the old job is no longer followed while the server answers, so its last word never shows over the new one's)
    stopPoll();
    P.key = optKey(); P.span = [P.a, P.b]; P.looks = 0; P.pressed = true; say("Asking the frame server…"); progress(P.job && P.job.total ? P.job.done / P.job.total : 0);
    try {
      const r = await fetch(`${FRAMES}/prebuild?${key}&most=${most()}`, { method: "POST" }), j = await r.json();
      if (!r.ok) { P.job = null; P.pressed = false; progress(null); say(j.error || "The frame server cannot pre-process that.", true); buttons(); return; }
      follow(j);
    } catch (err) { P.job = null; P.pressed = false; progress(null); say(`No frame server at ${FRAMES} that pre-processes.`, true); buttons(); }
  }
  function stopPoll() { clearTimeout(P.poll); P.poll = 0; }
  // The stretch is made on the frame server, so it carries on while the page is in the background (the tab hidden,
  // another window in front: away.html pauses everything else); the tab's title shows how far it is, the polling
  // here runs on timers rather than animation frames, and a stretch finished while away plays on the way back
  const TITLE = document.title;
  function titled(j) {
    const busy = j && /^(queued|planning|making|waiting|finishing)$/.test(j.state);
    document.title = busy && j.total ? `${Math.floor(100 * j.done / j.total)}% pre-processed · ${TITLE}` : j && j.state === "done" && P.job === j && document.hidden ? `Ready · ${TITLE}` : TITLE;
  }
  // A stretch's frames (the bar's count) and its pictures (what the server makes): each frame, and with them each
  // color composite and each mosaic or movie picture a pass shows at those frames, so pictures run to about twice frames
  const made = j => j.frames ? `${j.frames.toLocaleString()} frame${j.frames === 1 ? "" : "s"} (${j.total.toLocaleString()} pictures)` : `${j.total.toLocaleString()} pictures`;
  $("segstate").title = "Pictures: each frame, plus each color composite and each mosaic or movie picture its pass shows at those frames.";
  function follow(j) {
    stopPoll();
    // pressed: the first answer since Pre-process, which is the stretch made when it was quick enough to wait for
    const was = P.job && P.job.state, pressed = P.pressed;
    P.job = j; P.pressed = false; buttons(); redraw(); titled(j);
    const frac = j.total ? j.done / j.total : 0;
    if (j.state === "done") {
      progress(1);
      say(`Ready: ${made(j)} made ahead${j.took ? ` in ${j.took < 1 ? "under a second" : fmtDur(j.took)}` : ""}${j.errors ? ` (${j.errors} could not be made)` : ""}`);
      if ((pressed || (was && was !== "done")) && opt("segment.autoplay", true)) { if (window.cassiniAway && cassiniAway.on) P.playBack = true; else play(); }
      return;
    }
    if (j.state === "failed") { progress(null); say(j.error || "Pre-processing failed; see the frame server's log.", true); return; }
    if (j.state === "stopped") { progress(frac); say(`Stopped at ${j.done.toLocaleString()} of ${j.total.toLocaleString()}; what is made stays made.`); return; }
    progress(frac);
    if (performance.now() - noteAt > 6000) say(j.state === "queued" ? (j.ahead ? `Waiting for ${j.ahead} stretch${j.ahead > 1 ? "es" : ""} before it…` : "Starting…")
      : j.state === "planning" ? "Finding every picture in the stretch…"
      : j.state === "finishing" ? "Finishing the last mosaic tiles…"
      : j.state === "waiting" ? `On hold: the frame server's machine is reserved for another job · ${j.done.toLocaleString()} of ${j.total.toLocaleString()}`
      : `Pre-processing ${j.done.toLocaleString()} of ${j.total.toLocaleString()} pictures${j.frames ? ` for ${j.frames.toLocaleString()} frames` : ""}${j.eta != null ? ` · ${fmtDur(j.eta)} left` : ""}`);
    P.poll = setTimeout(async () => {
      if (!P.job || P.job.id !== j.id) return;   // another job took over (the stretch grew)
      try { const r = await fetch(`${FRAMES}/prebuild/${j.id}.json`, { cache: "no-store" }); const n = r.ok ? await r.json() : j; if (P.job && P.job.id === j.id) follow(n); }
      catch (err) { if (P.job && P.job.id === j.id) follow(j); }
    }, P.looks < 4 ? 100 << P.looks++ : 1000);
  }
  async function stop() {
    if (!P.job) return;
    try { const r = await fetch(`${FRAMES}/prebuild/${P.job.id}/stop`, { method: "POST" }); if (r.ok) follow(await r.json()); } catch (err) {}
  }

  // ---- playing it: movie mode over the stretch, at the bar's frame rate ----
  function play() {
    if (P.a == null || !window.cassiniMovie) return;
    const M = window.cassiniMovie;
    if (P.playing && M.on) { setPlaying(!state.playing); buttons(); return; }
    P.playing = true;
    const cams = windows().cams;
    // one camera: the other camera's window used to step aside while the stretch played; with a stretch highlighted
    // the camera windows are pinned (cassiniPin, head-quiet.html), so it stays where it is
    const other = cams === "N" ? $("wacard") : cams === "W" ? $("imgcard") : null;
    if (other && !other.hidden && window.cassiniWM && !(window.cassiniPin && cassiniPin.editing())) { P.tucked = other; cassiniWM.minimize(other); }
    M.start(true, { from: P.a, until: P.b, cams: cams.length === 1 ? cams : undefined });
    buttons();
  }
  function untuck() { if (P.tucked && window.cassiniWM) cassiniWM.restore(P.tucked); P.tucked = null; }
  // movie mode left (the stretch's last picture, Escape, the Movie button): the bar says Play again
  setInterval(() => {
    if (P.playing && !(window.cassiniMovie && window.cassiniMovie.on)) { P.playing = false; untuck(); buttons(); }
    else if (P.playing) buttons();
  }, 400);

  // ---- the timeline: how far the stretch is made, a line along its foot ----
  const redraw = () => { if (typeof drawTimeline === "function" && catalog) drawTimeline(); };
  const prevTimeline = window.studyTimeline;
  window.studyTimeline = (g, w, h, xn) => {
    if (prevTimeline) prevTimeline(g, w, h, xn);
    const j = P.job;
    if (P.a != null && j && j.through && j.state !== "failed") {
      const xa = etToX(P.a, w), xt = etToX(Math.min(P.b, utcToEt(j.through)), w);
      g.fillStyle = j.state === "done" ? "rgba(138,182,255,0.95)" : "rgba(138,182,255,0.7)";
      if (xt > xa) g.fillRect(xa, h - 3, xt - xa, 3);
    }
    place();
  };
  window.addEventListener("resize", place);

  // ---- the controls ----
  $("segprep").addEventListener("click", prep);
  $("segstop").addEventListener("click", stop);
  $("segplay").addEventListener("click", play);
  $("segexport").addEventListener("click", () => EX.open({ full: false }));
  $("segfull").addEventListener("click", () => EX.open({ full: true }));
  $("segcams").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    EX.state.cams = b.dataset.v; camsUi(); summary();
    if (P.job && P.key !== optKey()) { stopPoll(); P.job = null; progress(null); say(""); }
    buttons();
  });
  $("segx").addEventListener("click", () => { EX.clear(true); hide(); });
  $("segfps").addEventListener("input", e => { if (S) S.set("movie.fps", +e.target.value); fpsUi(); });
  if (S) S.on("movie.fps", fpsUi);
  for (const k of ["cameras.composites", "cameras.mosaics", "movies.steady", "movies.stabilize", "movies.stabilizeSmooth", "movies.exposure", "movies.exposureSmooth", "movies.trail", "movies.laps", "movies.fade", "movies.persist", "movies.mosaicFrames", "cameras.autoCenter", "cameras.processedFrames", "cameras.balancedColor", "cameras.colors", ...(window.cassiniSteps || []).map(st => st.key)])
    if (S && S.get(k) !== undefined) S.on(k, () => { if (!bar.hidden) { if (P.job && P.key !== optKey()) { stopPoll(); P.job = null; progress(null); say(""); } buttons(); } });
  window.addEventListener("keydown", e => {
    if (bar.hidden || e.key !== "Escape" || document.querySelector(".menu.open, .win.full") || (window.cassiniMovie && window.cassiniMovie.on)) return;
    if (!$("excard") || $("excard").hidden) { EX.clear(true); hide(); }
  });

  // in the background: the pause note says the stretch is still being made; back, a stretch finished meanwhile plays
  const away = $("awaynote"), awayText = away && away.textContent;
  document.addEventListener("cassini:away", e => {
    const busy = P.job && /^(queued|planning|making|waiting|finishing)$/.test(P.job.state);
    if (away) away.textContent = e.detail.away && busy ? `${awayText} · the highlighted stretch keeps pre-processing` : awayText;
    if (!e.detail.away) { titled(P.job); if (P.playBack) { P.playBack = false; if (!bar.hidden) play(); } }
  });

  // ---- the note when movie mode keeps waiting ----
  let hintTimer = 0;
  function showHint() {
    if (!opt("segment.hint", true) || performance.now() - P.hintAt < 10 * 60e3 || (P.job && /^(queued|planning|making|waiting|finishing)$/.test(P.job.state))) return;
    if (!bar.hidden && P.playing) return;   // playing a highlighted stretch already
    P.hintAt = performance.now();
    const r = ($("dock") || $("tl")).getBoundingClientRect();
    hint.style.bottom = `${Math.max(8, innerHeight - r.top + 8)}px`;
    hint.hidden = false; requestAnimationFrame(() => hint.classList.add("on"));
    clearTimeout(hintTimer); hintTimer = setTimeout(hideHint, 15000);
  }
  function hideHint() { hint.classList.remove("on"); setTimeout(() => { if (!hint.classList.contains("on")) hint.hidden = true; }, 400); }
  document.addEventListener("cassini:movie-slow", e => (e.detail.slow ? showHint() : hideHint()));
  $("seghintx").addEventListener("click", hideHint);
  // what's next: from the clock to the 300th frame after it (or the end of the months loaded)
  $("seghintgo").addEventListener("click", () => {
    hideHint();
    if (!catalog) return;
    const i = lastImageIndex(state.et), j = Math.min(catalog.sorted.length - 1, i + 300);
    if (j <= i) return;
    if (window.cassiniMovie && window.cassiniMovie.on) setPlaying(false);
    EX.mark(state.et, catalog.sorted[j] + 1);
  });
  window.cassiniSegment = { prep, play, stop, hide, get state() { return P; } };
})();
</script>
