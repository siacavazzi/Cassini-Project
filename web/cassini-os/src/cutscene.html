<!-- What every cutscene shares (the Grand Finale in finale.html, and the ones after it). build.py splices the style into
     the head and the script after the viewer's and the loading screen's, before any cutscene's.

     A cutscene is its own <section> with its own effects; this file gives it the rest, so they all behave alike:
       - the viewer's four cutscene hooks (studyFrame before the bodies are placed, studyPositions, studyAttitude after
         Cassini's pointing, studyCamera after the orbit controls), shared: each cutscene registers its own and only the
         one playing is called
       - begin and end: the interface fades away (body.cutscene), playback stops, the orbit controls let go, and Escape
         or the section's .cs-skip button ends it; at the end everything comes back as it was
       - fades and captions on the viewer's frame clock (performance.now), so a recording keeps their pace
       - looking around: a drag turns the view and the wheel zooms (cassiniCutscene.look, for the cutscene's camera to
         use); it eases back a few seconds after. orbit() and frameOn() apply it with the subject kept in the middle of
         the view and no flip over the top
       - a trigger when playback crosses a moment going forward, one when it sets off from the very start of the data,
         and ?<name> in the address to play one at once
       - sound through sound.html (cassiniSound), when it is there
       - effects for the close-up pass: a soft glow texture and sprites, and an additive shell for exhaust (fx)
       - playback picks up again at the end if it was playing when the cutscene began
     Shared classes for a cutscene's section: .cs-black (a black cover), .cs-caps with .cs-cap lines (centered, low),
     .cs-hint (a quiet line at the top), .cs-read (a mono readout line low in the middle), .cs-note (a small dim note
     bottom left), .cs-skip (the Skip button). -->
<style>
.cs-root { position: fixed; inset: 0; z-index: 2002; pointer-events: none; }
.cs-root[hidden] { display: none; }
.cs-root .cs-black { position: absolute; inset: 0; background: #000; opacity: 0; }
.cs-root .cs-caps { position: absolute; left: 50%; bottom: 15vh; transform: translateX(-50%); width: min(640px, calc(100vw - 32px)); display: grid; }
.cs-root .cs-cap { grid-area: 1 / 1; align-self: end; text-align: center; color: var(--q-text); font: 300 19px/1.5 -apple-system, "Helvetica Neue", var(--ui);
  letter-spacing: .01em; text-shadow: 0 1px 12px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.8); opacity: 0; }
.cs-root .cs-cap b { display: block; margin-bottom: 8px; font-weight: normal; font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--q-dim); }
.cs-root .cs-cap.big { font-size: 26px; }
.cs-root .cs-cap ul { list-style: none; margin: 0; padding: 0; }
.cs-root .cs-cap li { margin: 3px 0; }
.cs-root .cs-cap small { display: block; margin-top: 10px; font-size: 12px; color: var(--q-dim); }
.cs-root .cs-skip { all: unset; position: absolute; right: 16px; bottom: 12px; padding: 4px 11px; border-radius: 11px; border: 1px solid var(--q-line);
  background: rgba(16,17,20,.5); color: rgba(232,236,242,.55); font-size: 11px; cursor: pointer; pointer-events: auto; }
.cs-root .cs-skip:hover { color: var(--q-text); }
.cs-root .cs-hint { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); font-size: 11px; color: rgba(232,236,242,.45); opacity: 0; transition: opacity 1.5s ease; }
.cs-root .cs-hint.on { opacity: 1; }
/* a quiet mono readout line low in the middle, and a small dim note bottom left; .on shows them */
.cs-root .cs-read { position: absolute; left: 50%; bottom: 7vh; transform: translateX(-50%); white-space: nowrap; font: 11px/1 var(--hudf); letter-spacing: .08em;
  color: var(--q-dim); opacity: 0; transition: opacity 1.2s ease; }
.cs-root .cs-read.on { opacity: 1; }
.cs-root .cs-read i { font-style: normal; color: var(--q-accent); }
.cs-root .cs-note { position: absolute; left: 16px; bottom: 14px; max-width: min(460px, calc(100vw - 140px)); font-size: 10.5px; line-height: 1.4; color: rgba(232,236,242,.34); opacity: 0; transition: opacity 1.5s ease; }
.cs-root .cs-note.on { opacity: 1; }
body.cutscene #gl { cursor: grab; }
body.cutscene.cs-drag #gl { cursor: grabbing; }
body.cutscene #app > :not(#gl):not(.cs-root) { opacity: 0 !important; pointer-events: none !important; transition: opacity 1.2s ease !important; }
body.cutscene-out #app * { pointer-events: none !important; }
body.phone .cs-root .cs-read { font-size: 9.5px; bottom: 9vh; }
body.phone .cs-root .cs-note { bottom: 40px; }
body.phone .cs-root .cs-cap { font-size: 16px; } body.phone .cs-root .cs-cap.big { font-size: 21px; }
</style>

<script>
// ---------- what every cutscene shares: hooks, begin and end, fades, captions, looking around, triggers ----------
(function () {
  const scenes = {};   // name -> { frame, positions, attitude, camera, root, onEnd }
  let active = null, saved = null;

  // ---------- fades and captions, on the viewer's frame clock ----------
  const fades = new Map(), slow = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function fadeTo(el, to, secs, then) { fades.set(el, { from: +el.style.opacity || 0, to, t0: performance.now(), secs, then }); }
  function stepFades() {
    for (const [el, f] of fades) {
      const k = Math.min(1, (performance.now() - f.t0) / 1000 / f.secs), e = k * k * (3 - 2 * k), o = f.from + (f.to - f.from) * e;
      el.style.opacity = o;
      if (el.classList.contains("cs-cap") && !slow) el.style.transform = `translateY(${(1 - o) * 6}px)`;
      if (k >= 1) { fades.delete(el); if (f.then) f.then(); }
    }
  }
  // paused in the background (away.html): the fades and the look-around's ease carry on where they stopped
  document.addEventListener("cassini:away", e => {
    if (e.detail.away) return;
    for (const f of fades.values()) f.t0 += e.detail.ms;
    look.last += e.detail.ms;
  });
  function caption(caps, html, cls) {
    const el = document.createElement("div");
    el.className = "cs-cap" + (cls ? " " + cls : ""); el.innerHTML = html; caps.appendChild(el);
    fadeTo(el, 1, 1.2);
    return el;
  }
  function drop(el) { fadeTo(el, 0, 1.1, () => el.remove()); }
  // one line at a time in a caption box: a new line takes the place of the one before, which goes quickly first so the
  // two never sit on top of each other (null just takes it down)
  const lines = new WeakMap();
  function line(caps, html, cls) {
    const was = lines.get(caps);
    let el = null;
    if (html != null) {
      el = document.createElement("div");
      el.className = "cs-cap" + (cls ? " " + cls : ""); el.innerHTML = html; el.style.opacity = 0; caps.appendChild(el);
    }
    const show = () => { if (el) fadeTo(el, 1, 1.2); };
    if (was && was.isConnected) fadeTo(was, 0, 0.4, () => { was.remove(); show(); }); else show();
    lines.set(caps, el);
    return el;
  }
  // run each line of a list ([at, dur, html, cls, chord]) whose time has come, and take it down when its time is up
  function runCaptions(caps, list, t, shown) {
    list.forEach(([at, dur, html, cls, chord], i) => {
      if (!shown[i] && t >= at && t < at + dur) { shown[i] = caption(caps, html, cls); if (chord) sound("chord", chord); }
      if (shown[i] && shown[i] !== true && t >= at + dur) { drop(shown[i]); shown[i] = true; }
    });
  }
  // take down every line still up
  function dropAll(shown) { shown.forEach((el, i) => { if (el && el !== true) { drop(el); shown[i] = true; } }); }
  const sound = (what, ...a) => { if (window.cassiniSound && cassiniSound[what]) cassiniSound[what](...a); };

  // ---------- looking around: a drag turns the view, the wheel zooms; it eases back a few seconds after ----------
  const look = { yaw: 0, pitch: 0, zoom: 1, drag: null, last: 0, wheel: true };
  const resetLook = () => Object.assign(look, { yaw: 0, pitch: 0, zoom: 1, drag: null, last: 0 });
  function onDown(e) {
    if (!active || e.target !== document.getElementById("gl")) return;
    look.drag = [e.clientX, e.clientY]; look.last = performance.now(); document.body.classList.add("cs-drag");
    e.stopImmediatePropagation();
  }
  function onMove(e) {
    if (!active || !look.drag) return;
    look.yaw -= (e.clientX - look.drag[0]) * 0.006; look.pitch = Math.max(-1.2, Math.min(1.2, look.pitch + (e.clientY - look.drag[1]) * 0.005));
    look.drag = [e.clientX, e.clientY]; look.last = performance.now();
    e.stopImmediatePropagation();
  }
  function onUp() { look.drag = null; look.last = performance.now(); document.body.classList.remove("cs-drag"); }
  function onWheel(e) {
    if (!active || !look.wheel) return;
    look.zoom = Math.max(0.35, Math.min(4, look.zoom * Math.exp(e.deltaY * 0.0012))); look.last = performance.now();
    e.preventDefault(); e.stopImmediatePropagation();
  }
  function easeLook(dt) {
    if (look.drag || performance.now() - look.last < 4000) return;
    const k = 1 - Math.exp(-dt / 1.6);
    look.yaw -= look.yaw * k; look.pitch -= look.pitch * k; look.zoom += (1 - look.zoom) * k;
  }

  // ---------- effects every cutscene can use, in the Cassini group's close-up pass (layer 1, metres) ----------
  // a soft round glow, white so a material's colour tints it
  let glowTex = null;
  function glowTexture() {
    if (glowTex) return glowTex;
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d"), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.25, "rgba(255,255,255,.55)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return glowTex = new THREE.CanvasTexture(c);
  }
  // an additive glow sprite (opacity starts at 0)
  function sprite(color, size) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), color, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
    s.scale.setScalar(size); s.layers.set(1);
    return s;
  }
  // a soft additive shell for exhaust and glows: brightest where it is seen face-on and near its start, fading along its
  // length (fall), colour going from near to far, with a shimmer running down it. Uniforms glow and time are set each
  // frame. Keeps the viewer's logarithmic depth
  function shellMaterial(near, far, fall, shimmer) {
    return new THREE.ShaderMaterial({
      uniforms: { glow: { value: 0 }, time: { value: 0 }, near: { value: new THREE.Color(near) }, far: { value: new THREE.Color(far) }, fall: { value: fall }, shimmer: { value: shimmer } },
      vertexShader: `varying float vAlong; varying vec3 vN; varying vec3 vV;
        #include <common>
        #include <logdepthbuf_pars_vertex>
        void main() { vAlong = -position.y; vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz);
          gl_Position = projectionMatrix * mv;
          #include <logdepthbuf_vertex>
        }`,
      fragmentShader: `uniform float glow; uniform float time; uniform vec3 near; uniform vec3 far; uniform float fall; uniform float shimmer;
        varying float vAlong; varying vec3 vN; varying vec3 vV;
        #include <logdepthbuf_pars_fragment>
        void main() {
          #include <logdepthbuf_fragment>
          float a = clamp(vAlong, 0.0, 1.0);
          float along = exp(-fall * a) * smoothstep(1.0, 0.75, a);
          float edge = pow(abs(dot(normalize(vN), normalize(vV))), 1.6);
          float run = 1.0 + shimmer * (0.6 * sin(a * 31.0 - time * 23.0) + 0.4 * sin(a * 13.0 - time * 9.0 + 1.3));
          gl_FragColor = vec4(mix(near, far, sqrt(a)) * glow * along * edge * run, 1.0);
        }`,
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
  }
  // an open cylinder from a nozzle along -Y: radius r0 at the start to r1 at the end, `length` metres long
  function shell(r0, r1, length, mat) {
    const geo = new THREE.CylinderGeometry(r0, r1, 1, 32, 16, true);
    geo.translate(0, -0.5, 0);
    const m = new THREE.Mesh(geo, mat);
    m.scale.set(1, length, 1); m.layers.set(1); m.frustumCulled = false;
    return m;
  }

  // ---------- a camera that keeps its subject in frame ----------
  // the view direction a drag gives: base (the cutscene's own direction from the subject to look along, scene frame)
  // turned by look.yaw about up and tilted by look.pitch, never closer than 20 deg to straight up or down, so it cannot
  // flip over the top. Returns the direction to look along and an up perpendicular to it
  function orbit(base, up) {
    const u = up.clone().normalize(), d = base.clone().normalize().applyAxisAngle(u, look.yaw);
    const el = Math.acos(Math.max(-1, Math.min(1, d.dot(u)))), MIN = 0.35;
    const to = Math.max(MIN, Math.min(Math.PI - MIN, el - look.pitch));
    const side = new THREE.Vector3().crossVectors(d, u);
    if (side.lengthSq() > 1e-12) d.applyAxisAngle(side.normalize(), el - to);
    return { dir: d.normalize(), up: u.clone().addScaledVector(d, -u.dot(d)).normalize() };
  }
  // the camera `dist` back from the subject along dir (see orbit), the subject in the middle of the view, the wheel
  // zooming. Every camera move a cutscene makes this way keeps the subject in frame
  function frameOn(subject, dir, dist, up) {
    camera.position.copy(subject).addScaledVector(dir, -dist * look.zoom);
    camera.up.copy(up);
    camera.lookAt(subject);
  }

  // ---------- begin and end ----------
  // a cutscene's hooks and its section (root, with the .cs-root class); onEnd tidies up its own effects
  function register(name, s) { scenes[name] = s; const b = s.root && s.root.querySelector(".cs-skip"); if (b) b.addEventListener("click", e => { e.stopPropagation(); end(name); }); }
  function begin(name) {
    const s = scenes[name];
    if (active || !s) return false;
    active = name; saved = { follow: state.follow, playing: state.playing };
    resetLook(); look.wheel = true;
    if (state.follow) setFollow(false);
    setPlaying(false);
    controls.enabled = false;
    s.root.hidden = false;
    document.body.classList.add("cutscene");
    return true;
  }
  // ends the one playing (or `name`, if it is the one): its own tidying first, then the interface comes back as it was.
  // then(root) runs after the interface is back, before the cover fades
  function end(name) {
    if (!active || (name && name !== active)) return;
    const s = scenes[active], was = saved; active = null; saved = null;
    // onEnd may return { follow: false } to leave follow off (an ending that leaves the view on something else)
    const keep = (s.onEnd && s.onEnd()) || {};
    cassini.visible = true; markerPts.visible = true; cassini.up.set(0, 1, 0);
    camera.up.set(0, 1, 0);
    controls.enabled = true;
    const black = s.root.querySelector(".cs-black");
    fades.forEach((v, el) => { if (el !== black) fades.delete(el); });
    if (was.follow && keep.follow !== false) setFollow(true);
    if (was.playing && state.et < coverage[1] - 1) setPlaying(true);
    document.body.classList.add("cutscene-out");
    document.body.classList.remove("cutscene", "cs-drag");
    const done = () => { document.body.classList.remove("cutscene-out"); if (!active) s.root.hidden = true; };
    if (black) fadeTo(black, 0, 1.5, done); else done();
    if (window.cassiniPerf) cassiniPerf.invalidate();
  }

  // ---------- the viewer's hooks, for the one playing ----------
  window.studyFrame = dt => {
    stepFades();
    if (!active) return;
    if (window.cassiniPerf) cassiniPerf.invalidate();
    state.playing = false;
    easeLook(dt);
    const s = scenes[active];
    if (s.frame) s.frame(dt);
  };
  const hook = k => (...a) => { if (active && scenes[active][k]) scenes[active][k](...a); };
  window.studyPositions = hook("positions");
  window.studyAttitude = hook("attitude");
  window.studyCamera = hook("camera");

  // ---------- triggers ----------
  // playback crossing a moment going forward plays a cutscene (when(et) can say no: not this time)
  const triggers = [];
  function at(et, play, when) { triggers.push({ et, play, when }); }
  // playback setting off forward from the very start of the data (where setTime clamps, so nothing is crossed; not a
  // cache slice's start, cassiniSlice.cutsStart) plays
  // one: once per visit, armed again once playback is 30 s past the start. Returns { spend() } to count a play from
  // elsewhere (?name) as this visit's
  const starts = [];
  function atStart(play, when) { const g = { play, when, spent: false, spend() { g.spent = true; } }; starts.push(g); return g; }
  const advance = window.studyAdvance;
  window.studyAdvance = (et, dt, speed) => {
    const next = advance ? advance(et, dt, speed) : et + dt * speed;
    for (const g of starts) {
      if (et > coverage[0] + 30) g.spent = false;
      if (!active && !urlPending && !g.spent && speed > 0 && et <= coverage[0] + 1 && !(window.cassiniSlice && cassiniSlice.cutsStart) && next > et && (!g.when || g.when())) { g.spent = true; setTimeout(g.play, 0); return et; }
    }
    if (!active && !urlPending) for (const g of triggers) {
      const t = typeof g.et === "function" ? g.et() : g.et;
      if (t != null && et < t && next >= t && (!g.when || g.when(t))) { setTimeout(g.play, 0); break; }
    }
    return next;
  };
  // ?<name> in the address plays it at once: the clock goes to et() (once the data is loaded) and play() runs when
  // that part of the mission is ready. ok() can say the data has no such moment
  // While it waits, the other cutscenes' triggers hold off, and it waits for one already playing to end
  let urlPending = 0;
  function fromUrl(name, et, play, ok) {
    if (!new URLSearchParams(location.search).has(name)) return;
    urlPending++;
    const wait = setInterval(() => {
      if (!coverage[1] || !tracks.CASSINI || active || $("loading") && !$("loading").hidden) return;
      if (ok && !ok()) { clearInterval(wait); urlPending--; return; }
      const t = et();
      if (Math.abs(state.et - t) > 7200) { setTime(t); return; }
      if (typeof yearReady === "function" && !yearReady()) return;
      clearInterval(wait); urlPending--; play();
    }, 250);
  }

  window.addEventListener("keydown", e => { if (active && e.key === "Escape") { e.preventDefault(); e.stopImmediatePropagation(); end(); } }, true);
  window.addEventListener("pointerdown", onDown, true);
  window.addEventListener("pointermove", onMove, true);
  window.addEventListener("pointerup", onUp, true);
  window.addEventListener("pointercancel", onUp, true);
  window.addEventListener("wheel", onWheel, { capture: true, passive: false });
  window.cassiniCutscene = { register, begin, end, at, atStart, fromUrl, orbit, frameOn, fadeTo, caption, drop, dropAll, line, runCaptions, sound, look, resetLook,
    fx: { glowTexture, sprite, shellMaterial, shell }, glowTexture, sprite,
    get active() { return active; }, get waiting() { return urlPending > 0; } };
})();
</script>
