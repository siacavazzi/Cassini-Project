<!-- Per-body camera windows for Cassini OS (a setting, off unless turned on). build.py splices the style into the
     head and the script after the chrome script. With the setting on, the two camera windows give way to one window
     per target and camera: when the narrow-angle camera starts imaging Titan a Titan narrow-angle window pops up, when
     the wide-angle camera joins in a Titan wide-angle window opens beside it, when Cassini turns to Enceladus its
     windows join them. A window stays while the screen is calm, however long its camera then goes quiet; once there
     are more windows than there is room for, the least relevant ones make way: those whose last picture is older
     than the linger time (counted only while the clock runs) shortened by how crowded the screen is, and lengthened
     by how important the picture is (a color picture, a mosaic, a color mosaic stay longer than a single frame). The two cameras never share a window, as with the two camera
     windows. Each window is the page's own camera feed (cameraFeed in the head), limited to that camera's frames of
     that target: the same frame server pictures, colour composites and channel strips. -->
<style>
.bodywin { top: calc(env(safe-area-inset-top, 0px) + 36px); left: max(14px, env(safe-area-inset-left, 0px)); width: auto; --pw: clamp(180px, 16vw, 280px); }
.bodywin.zoomed { --pw: clamp(320px, 32vw, 520px); }
.bodywin .panes { display: flex; gap: 8px; align-items: flex-start; }
.bodywin .pane { width: var(--pw); display: grid; gap: 6px; }
.bodywin .pane[data-cam="W"] { width: calc(var(--pw) * .72); }
.bodywin .info { grid-template-columns: 38px 1fr; font-size: 10px; }
.bodywin .well { height: 70px; }
.bodywin .well.has-frame { height: auto; }
.bodywin .chans { grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); }
/* new windows pop up, old ones fade out */
.bodywin.opening { animation: bwopen .32s cubic-bezier(.2, .8, .3, 1); }
.bodywin.closing { animation: bwclose .45s ease forwards; pointer-events: none; }
@keyframes bwopen { from { opacity: 0; transform: scale(.92) translateY(-6px); } }
@keyframes bwclose { to { opacity: 0; transform: scale(.96); } }
@media (prefers-reduced-motion: reduce) { .bodywin.opening, .bodywin.closing { animation: none; } }
/* resting: like the camera windows, a body window keeps its picture and only its frame fades (#app gives the rule
   an id, so it beats the head's id-strength rule that fades every window) */
body.idle #app .bodywin:has(.well.has-frame) { opacity: 1; pointer-events: auto; background: transparent; border-color: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
</style>

<script>
// ---------- per-body camera windows ----------
(function () {
  const $ = id => document.getElementById(id);
  const F = window.cassiniFeeds, WM = window.cassiniWM;
  if (!F || !WM) return;
  const S = window.cassiniSettings;
  const LS = "cassini-os-bodywin-v1";
  // settings: in the Settings window when the page has one, otherwise remembered here and switched from the Window menu
  let own = {};
  try { own = JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) {}
  const q = new URLSearchParams(location.search).get("bodywin");
  const B = {
    on: !!own.on, linger: own.linger > 0 ? own.linger : 30, max: own.max > 0 ? own.max : 4, room: own.room > 0 ? own.room : 4,
    clock: 0, lastNow: 0, lastEt: null, cat: null, wins: new Map(), rec: new Map(), dismissed: new Set(), hiddenCams: []
  };
  const saveOwn = () => { if (S) return; try { localStorage.setItem(LS, JSON.stringify({ on: B.on, linger: B.linger, max: B.max, room: B.room })); } catch (e) {} };
  if (S) {
    B.on = !!S.define({ key: "cameras.bodyWindows", section: "Cameras", label: "A window for each body", type: "toggle", value: false,
      hint: "Each target Cassini images gets its own narrow-angle and wide-angle windows. They stay up while the screen is calm and make way for new ones when it gets busy." });
    B.room = +S.define({ key: "cameras.bodyWindowRoom", section: "Cameras", label: "Body windows before they make way", type: "range", value: 4, min: 1, max: 12, step: 1,
      hint: "Up to this many body windows stay up however long their cameras go quiet. With more, the least relevant close first." });
    B.linger = +S.define({ key: "cameras.bodyWindowLinger", section: "Cameras", label: "Body window stays for at least", type: "range", value: 30, min: 5, max: 120, step: 5, unit: "s",
      hint: "Seconds of playback a single frame stays up when the screen is busy, shortened as more windows crowd in. Color pictures and mosaics stay longer (the two settings below)." });
    B.max = +S.define({ key: "cameras.bodyWindowMax", section: "Cameras", label: "Most bodies with windows at once", type: "range", value: 4, min: 1, max: 8, step: 1 });
  }
  if (q !== null) B.on = q !== "0";

  // ---- the mode: switching it on hides the two camera windows, switching it off brings them back ----
  function setOn(v) {
    v = !!v;
    const first = !B.started; B.started = true;
    if (!first && v === B.on) return;
    B.on = v; saveOwn();
    if (v) {
      B.hiddenCams = camWins().filter(w => !w.hidden);
      B.hiddenCams.forEach(w => { w.hidden = true; });
    } else if (!first) {
      for (const name of [...B.wins.keys()]) close(name, true);
      B.hiddenCams.forEach(w => { w.hidden = false; }); B.hiddenCams = [];
    }
    const m = $("bwmenu"); if (m) m.setAttribute("aria-checked", String(v));
    document.querySelectorAll('[data-act="win"][data-win="imgcard"], [data-act="win"][data-win="wacard"]').forEach(b => { b.closest("li").hidden = v; });
    WM.syncMenu();
  }
  const camWins = () => ["imgcard", "wacard"].map($).filter(Boolean);
  if (S) {
    S.on("cameras.bodyWindows", v => { if (B.started) setOn(v); });
    S.on("cameras.bodyWindowLinger", v => { B.linger = +v; });
    S.on("cameras.bodyWindowMax", v => { B.max = +v; });
    S.on("cameras.bodyWindowRoom", v => { B.room = +v; });
  } else {
    // no Settings window on this page: a Window-menu switch
    const ul = document.querySelector('[data-act="win"][data-win="dock"]')?.closest("ul");
    if (ul) {
      const sep = document.createElement("li"); sep.className = "sep"; ul.appendChild(sep);
      const li = document.createElement("li");
      li.innerHTML = '<button id="bwmenu" role="menuitemcheckbox" aria-checked="false">Window for Each Body</button>';
      ul.appendChild(li);
      li.querySelector("button").addEventListener("click", () => setOn(!B.on));
    }
  }

  // ---- one window per target and camera ----
  const title = n => n === "UNK" ? "Unknown target" : titleCase(n);
  const CAMS = ["N", "W"], CAMNAME = { N: "Narrow-angle", W: "Wide-angle" };
  const key = (name, cam) => name + "|" + cam;
  function pane(name, cam) {
    return `<div class="pane" data-cam="${cam}" data-body="${name}">
        <div class="well"><div class="wellmsg"><b>No signal</b>Waiting for the frame server</div><img class="shot" alt="" crossorigin="anonymous"><span class="shottag"></span><span class="kindtag"></span></div>
        <div class="chans" aria-label="Filter channels"></div>
        <dl class="info"><dt>Status</dt><dd><span class="led"></span><span data-f="status">—</span></dd><dt>Filter</dt><dd data-f="filter">—</dd><dt>Color</dt><dd data-f="colour">—</dd><dt>Credit</dt><dd><button class="credit" data-about="iss" title="Credits">NASA/JPL-Caltech/SSI</button></dd></dl>
      </div>`;
  }
  // a free place for a new window: the first slot in rows from the top left that no open window covers
  function place(w) {
    const r0 = w.getBoundingClientRect(), gap = 10, x0 = 14, y0 = 36;
    // clear of the other body windows, the main window, the moments list and the dock
    const others = [...B.wins.values()].filter(o => o.el !== w && !o.closing).map(o => o.el)
      .concat([$("dock"), $("moments"), $("appdock")].filter(e => e && !e.hidden)).map(e => e.getBoundingClientRect());
    const hits = (x, y) => others.some(o => x < o.right + gap && x + r0.width + gap > o.left && y < o.bottom + gap && y + r0.height + gap > o.top);
    for (let y = y0; y + r0.height <= innerHeight - 8; y += 24)
      for (let x = x0; x + r0.width <= innerWidth - 14; x += 24)
        if (!hits(x, y)) return Object.assign(w.style, { left: x + "px", top: y + "px" });
    const n = B.wins.size;   // no room: cascade
    Object.assign(w.style, { left: x0 + 24 * n + "px", top: y0 + 24 * n + "px" });
  }
  function open(name, cam) {
    const k = key(name, cam), label = `${title(name)} · ${cam}AC`;
    const el = document.createElement("section");
    el.className = "win frame img camwin bodywin opening";
    el.dataset.body = name; el.dataset.cam = cam; el.dataset.name = label;
    el.setAttribute("aria-label", `${title(name)} ${CAMNAME[cam].toLowerCase()} camera`);
    el.innerHTML = `<div class="titlebar"><span class="lights"><button class="close" aria-label="Close">×</button><button class="min" aria-label="Minimize">–</button><button class="zoom" aria-label="Zoom">+</button></span>${label}</div>
      <div class="body"><div class="panes">${pane(name, cam)}</div></div>`;
    const dock = $("dock"); dock.parentNode.insertBefore(el, dock);
    WM.wire(el);
    // closing a body window dismisses it until its camera goes quiet on that target; minimizing tucks it into the tray as usual
    el.querySelector(".close").addEventListener("click", e => { e.stopImmediatePropagation(); B.dismissed.add(k); close(k); }, true);
    const p = el.querySelector(".pane");
    const w = { el, name, cam, update: F.cameraFeed(p), closing: false };
    B.wins.set(k, w);
    place(el); WM.front(el);
    el.addEventListener("animationend", () => el.classList.remove("opening"), { once: true });
    return w;
  }
  function close(k, now) {
    const w = B.wins.get(k); if (!w || w.closing) return;
    w.closing = true;
    const gone = () => { w.el.remove(); if (B.wins.get(k) === w) B.wins.delete(k); WM.syncMenu(); };
    if (now || w.el.hidden || matchMedia("(prefers-reduced-motion: reduce)").matches) return gone();
    w.el.classList.add("closing");
    w.el.addEventListener("animationend", gone, { once: true });
    setTimeout(gone, 700);
  }
  // the latest frame of target name by camera cam at or before et, as its time, or -Infinity
  function latestOf(name, cam) {
    const ks = F.framesOf(cam, name).ks, i = F.lastOfCam(cam, state.et, name);
    return i >= 0 ? catalog.et[ks[i]] : -Infinity;
  }
  const latest = name => Math.max(...CAMS.map(cam => latestOf(name, cam)));
  let targets = null;
  function tick() {
    if (!B.started) setOn(B.on);
    if (!B.on || !catalog || !catalog.byCam) return;
    const now = performance.now(), movie = window.cassiniMovie && window.cassiniMovie.on;
    // the linger clock runs only while the mission clock moves forward (or movie mode plays, holding the clock on
    // each picture between its steps), so pausing keeps every window up
    if (B.lastEt !== null && (state.et > B.lastEt || (movie && state.playing))) B.clock += Math.min(now - B.lastNow, 250);
    // (movie mode's cuts over the time without pictures are not jumps)
    const jumped = B.lastEt !== null && Math.abs(state.et - B.lastEt) > 6 * 3600 && !(movie && state.et > B.lastEt);
    B.lastNow = now; B.lastEt = state.et;
    // records hold mission times, so they carry over when the months around this one load; a jump starts afresh
    const reset = jumped;
    if (catalog !== B.cat) { B.cat = catalog; targets = [...new Set(catalog.target)].filter(Boolean); }
    if (reset) B.rec.clear();
    const stale = F.stale(), keepKeys = [];
    let newest = null;
    // one record per target and camera: when that camera last imaged the target, and on the linger clock when that
    // was seen. A camera that imaged its target within the stale time wants a window; an open window stays however
    // long its camera then goes quiet (after a jump, only the recent ones do; one
    // whose frames are no longer in the loaded months closes)
    const lc = F.liveCams ? F.liveCams() : null;   // a closed camera window turns its camera off: none of its body windows
    for (const name of targets) for (const cam of CAMS) {
      if (lc && !lc.includes(cam)) continue;
      const k = key(name, cam), t = latestOf(name, cam), w = B.wins.get(k), up = w && !w.closing;
      if (!(t > -Infinity) || (!(state.et - t <= stale) && (!up || reset))) { B.rec.delete(k); B.dismissed.delete(k); continue; }
      let r = B.rec.get(k);
      if (!r || r.t !== t) { r = { t, seen: B.clock }; B.rec.set(k, r); }
      if (r.gone && !up) continue;   // made way for others: back with its camera's next picture of the target
      if (!newest || t > newest.t) newest = { k, t };
      keepKeys.push(k);
    }
    for (const k of B.dismissed) if (!keepKeys.includes(k)) B.dismissed.delete(k);
    let showKeys = keepKeys.filter(k => !B.dismissed.has(k));
    // a window held on a part of its picture (drill-down) stays until it goes back to live, and is not counted
    const held = [...B.wins].filter(([, w]) => !w.closing && w.el.dataset.held).map(([k]) => k);
    showKeys = showKeys.filter(k => !held.includes(k));
    // at most max targets have windows, the most recently imaged first
    const bodies = [...new Set(showKeys.map(k => k.split("|")[0]))].sort((a, b) => latest(b) - latest(a)).slice(0, Math.max(1, B.max));
    let show = showKeys.filter(k => bodies.includes(k.split("|")[0]));
    // more windows than there is room for: the least relevant make way. A window's relevance is how long ago (on the
    // linger clock) its camera last imaged its target, over how important the picture it shows is; one goes once
    // that is past the linger time, shortened in step with how crowded the screen is (room / windows). The latest
    // picture's window always stays, and a window that has only just opened is never past its time.
    if (show.length > B.room) {
      const age = k => (B.clock - B.rec.get(k).seen) / 1000;
      const weight = k => { const w = B.wins.get(k); return w && !w.closing ? w.update.importance() : 1; };
      const limit = B.linger * B.room / show.length;
      const over = show.filter(k => k !== newest.k && age(k) / weight(k) > limit).sort((a, b) => age(b) / weight(b) - age(a) / weight(a));
      while (show.length > B.room && over.length) { const k = over.shift(); B.rec.get(k).gone = true; show = show.filter(x => x !== k); }
    }
    show = show.concat(held);
    for (const k of [...B.wins.keys()]) if (!show.includes(k)) close(k);
    // oldest target first, so the newest windows land on top; the narrow-angle window first, so the wide-angle one sits beside it
    for (const name of [...new Set(bodies.concat(held.map(k => k.split("|")[0])))].reverse()) for (const cam of CAMS) {
      const k = key(name, cam); if (!show.includes(k)) continue;
      let w = B.wins.get(k);
      if (!w || w.closing) { w = open(name, cam); w.update.hold = true; }   // the window, not the stale time, decides when its picture goes
      // a wide-angle window with no narrow-angle one beside it takes its place on a phone
      w.el.classList.toggle("alone", !show.includes(key(name, cam === "N" ? "W" : "N")));
      w.update(); w.update.retier();
    }
  }
  const base = window.studyHud;
  window.studyHud = ms => { base(ms); tick(); };
  // paused in the background (away.html): the body windows let go of their pictures too
  document.addEventListener("cassini:away", e => { if (e.detail.away) for (const w of B.wins.values()) w.update(); });
  window.cassiniBodyWindows = { setOn, get on() { return B.on; }, state: B };
})();
</script>
