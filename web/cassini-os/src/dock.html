<!-- The dock for Cassini OS, as on the Mac. build.py splices the style into the head, the dock into #app and the script
     after the chrome script. A strip of apps along the bottom of the screen (Settings > Interface: on or off, bottom,
     left or right, icon size, magnification):
       Cassini and each body on stage now   a click flies the view there (the viewer's own focus, the same list as
                                             the main window's focus row) and brings back that body's windows; a dot
                                             under a body that has windows open, a blue one under the body in view
       Moments, Highlights, Settings         a click opens the window, brings it forward, or tucks it away
       minimized windows                     a minimized window shrinks into the dock (instead of the menu-bar tray)
                                             as a tile showing its last picture; a click brings it back
     The dock fades with the rest of the interface when the pointer rests. On a phone it is a scrolling strip under the
     replay controls. -->
<style>
#appdock { position: fixed; z-index: 1350; display: flex; align-items: flex-end; gap: 4px; padding: 5px 6px; --ds: 40px;
  left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); transform: translateX(-50%); max-width: calc(100% - 20px);
  background: var(--q-panel); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2);
  border: 1px solid var(--q-line); border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.45); transition: opacity .7s ease;
  box-sizing: border-box; height: calc(var(--ds) + 12px); }
/* the shelf keeps its size: magnified icons rise out of it, as on the Mac */
#appdock:is(.side-left, .side-right) { height: auto; width: calc(var(--ds) + 12px); }
#appdock[hidden] { display: none; }
#appdock.side-left, #appdock.side-right { flex-direction: column; align-items: flex-start; bottom: auto; top: 50%; transform: translateY(-50%); max-width: none; max-height: calc(100% - 60px); }
#appdock.side-left { left: max(6px, env(safe-area-inset-left, 0px)); }
#appdock.side-right { left: auto; right: max(6px, env(safe-area-inset-right, 0px)); align-items: flex-end; }
#appdock .dsep { flex: none; align-self: stretch; width: 1px; margin: 4px 3px; background: var(--q-line); }
#appdock:is(.side-left, .side-right) .dsep { width: auto; height: 1px; margin: 3px 4px; }
#appdock .dsep:last-child, #appdock .dsep:has(+ .dsep) { display: none; }
.dk { all: unset; position: relative; flex: none; box-sizing: border-box; --k: 1; width: calc(var(--ds) * var(--k)); height: calc(var(--ds) * var(--k)); display: grid; place-items: center;
  border-radius: 22%; cursor: default; transition: width .12s ease-out, height .12s ease-out; -webkit-tap-highlight-color: transparent; }
#appdock.magnifying .dk { transition: none; }
.dk:focus-visible { outline: 1px solid var(--q-accent); outline-offset: 2px; }
/* app glyphs: grey line art on a smoked tile, the one accent only for what is on */
.dk .gl { width: 100%; height: 100%; border-radius: 22%; display: grid; place-items: center; background: rgba(255,255,255,.07); border: 1px solid var(--q-line); box-sizing: border-box; color: var(--q-text); }
.dk .gl svg { width: 58%; height: 58%; } .dk .gl svg * { fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.dk:hover .gl { background: rgba(255,255,255,.12); color: #fff; }
/* bodies: the body itself, from its surface map, lit from the upper left */
.dk .orb { width: 78%; height: 78%; border-radius: 50%; position: relative; background-color: var(--c, #888); background-size: 200% 100%; background-position: 30% 50%;
  box-shadow: inset calc(var(--ds) * -.12) calc(var(--ds) * -.1) calc(var(--ds) * .2) rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.06); }
.dk .orb.ringed::after { content: ""; position: absolute; left: -30%; right: -30%; top: 38%; bottom: 38%; border-radius: 50%; border: calc(var(--ds) * .05) solid rgba(222,204,170,.7); border-top-color: transparent; transform: rotate(-14deg); }
.dk .orb.sun { background: radial-gradient(circle at 40% 40%, #fff6d8, #ffc95a 55%, #e08a1e); box-shadow: 0 0 calc(var(--ds) * .2) rgba(255,190,90,.45); }
/* running dot: a window of that app is open; blue: the body in view */
.dk::before { content: ""; position: absolute; left: 50%; bottom: -4px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: transparent; }
.dk.open::before { background: rgba(232,236,242,.7); }
.dk.here::before { background: var(--q-accent); box-shadow: 0 0 4px var(--q-accent); }
#appdock.side-left .dk::before { left: -4px; bottom: 50%; margin: 0 0 -2px; }
#appdock.side-right .dk::before { left: auto; right: -4px; bottom: 50%; margin: 0 0 -2px; }
/* the name, above the icon (beside it on a side dock) */
.dk::after { content: attr(data-label); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
  font: 11px/1 var(--ui); color: var(--q-text); padding: 4px 8px; border-radius: 5px; background: rgba(22,23,27,.92); border: 1px solid var(--q-line); opacity: 0; transition: opacity .12s; }
.dk:hover::after { opacity: 1; }
#appdock.side-left .dk::after { bottom: auto; top: 50%; left: calc(100% + 8px); transform: translateY(-50%); }
#appdock.side-right .dk::after { bottom: auto; top: 50%; left: auto; right: calc(100% + 8px); transform: translateY(-50%); }
/* minimized windows: a tile of the window's last picture, or its glyph */
.dk.mini .gl { background: rgba(0,0,0,.55) center / cover no-repeat; }
.dk.mini .gl.pic svg { display: none; }
.dk.mini .tag { position: absolute; left: 3px; bottom: 2px; right: 3px; font: 8px/1 var(--hudf); letter-spacing: .04em; color: rgba(232,236,242,.85); text-shadow: 0 0 3px #000, 0 0 5px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.dk.arrive { animation: dkin .34s ease-out; }
@keyframes dkin { from { width: 0; opacity: 0; } }
/* the dock takes the bottom of the screen: the main window sits on top of it, and the tray in the menu bar gives way */
body.has-dock.dock-bottom:not(.phone) #dock { bottom: calc(env(safe-area-inset-bottom, 0px) + var(--appdockh, 0px) + 14px); }
body.has-dock #tray { display: none; }
/* ...and on a side, the windows that start along that edge start beside it */
body.dock-left:not(.phone) #imgcard { left: calc(max(14px, env(safe-area-inset-left, 0px)) + var(--appdockw, 0px)); }
body.dock-left:not(.phone) #wacard { left: calc(max(14px, env(safe-area-inset-left, 0px)) + var(--appdockw, 0px) + var(--nacw, clamp(300px, 32vw, 480px)) + 10px); }
body.dock-right:not(.phone) #moments { right: calc(max(14px, env(safe-area-inset-right, 0px)) + var(--appdockw, 0px)); }
/* resting: the dock fades with the rest of the interface */
body.idle #appdock { opacity: 0; pointer-events: none; }
body.hasfull #appdock { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { #appdock, .dk { transition: none; } .dk.arrive { animation: none; } }
/* phone: a strip under the replay controls that scrolls sideways; names show on a long press only */
body.phone #appdock { left: var(--side) !important; right: var(--sider) !important; top: auto !important; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--gap)) !important; transform: none !important;
  flex-direction: row !important; align-items: center !important; max-width: none; max-height: none; width: auto !important; height: auto !important; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding: 4px 6px 7px; border-radius: 11px; --ds: 34px !important; }
body.phone #appdock::-webkit-scrollbar { display: none; }
body.phone.phone-land #appdock { left: calc(var(--side) + var(--col) + var(--gap)) !important; }
body.phone #appdock .dsep { width: 1px !important; height: auto !important; margin: 4px 3px !important; }
body.phone .dk::after { display: none; }
body.phone .dk::before { left: 50% !important; right: auto !important; bottom: -5px !important; margin: 0 0 0 -2px !important; }
body.phone.has-dock { --appdockh: 50px; }
</style>

<nav id="appdock" aria-label="Dock" hidden></nav>

<script>
// ---------- the dock ----------
(function () {
  const $ = id => document.getElementById(id);
  const S = window.cassiniSettings, WM = window.cassiniWM, dock = $("appdock");
  if (!WM || !dock) return;
  const D = d => S ? S.define(d) : d.value;
  const pref = {
    on: D({ key: "interface.dock", section: "Interface", label: "Dock", type: "toggle", value: true,
      hint: "A strip of apps at the edge of the screen: Cassini and each body (click to fly there), Moments, Highlights and Settings. Minimized windows shrink into it." }),
    side: D({ key: "interface.dockPosition", section: "Interface", label: "Dock position", type: "choice", value: "bottom",
      options: [["bottom", "Bottom"], ["left", "Left"], ["right", "Right"]], hint: "On a phone the dock always sits under the replay controls." }),
    size: D({ key: "interface.dockSize", section: "Interface", label: "Dock icon size", type: "range", value: 40, min: 28, max: 72, step: 2, unit: "px" }),
    mag: D({ key: "interface.dockMagnify", section: "Interface", label: "Dock magnification", type: "range", value: 40, min: 0, max: 100, step: 5, unit: "%",
      hint: "How much the icons under the pointer grow. 0 keeps them still." })
  };
  const phone = () => document.body.classList.contains("phone");

  // ---- icons ----
  const svg = d => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  const GLYPH = {
    // the spacecraft: the high-gain dish on top, the body and the magnetometer boom
    CASSINI: svg('<ellipse cx="12" cy="6.5" rx="7.5" ry="2.4"/><path d="M9.5 8.6v8.2h5V8.6M10.3 16.8l-1.2 3.4M13.7 16.8l1.2 3.4M14.5 11.5l6.5-4.2M5 12.5h4.5"/><circle cx="12" cy="4.2" r=".7"/>'),
    HUYGENS: svg('<path d="M4.5 13.5a7.5 4 0 0 0 15 0z"/><path d="M7 13.5a5 5.5 0 0 1 10 0"/><path d="M12 8V5"/>'),
    moments: svg('<path d="M5 7h14M5 12h14M5 17h9"/><path d="M18 15.5l1 2 2.2.3-1.6 1.5.4 2.2-2-1-2 1 .4-2.2-1.6-1.5 2.2-.3z"/>'),
    highlights: svg('<rect x="3.5" y="5.5" width="17" height="13" rx="1.6"/><path d="M10 9.3v5.4l4.6-2.7z"/>'),
    settings: svg('<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.6M12 18.4V21M3 12h2.6M18.4 12H21M5.6 5.6l1.9 1.9M16.5 16.5l1.9 1.9M5.6 18.4l1.9-1.9M16.5 7.5l1.9-1.9"/>'),
    window: svg('<rect x="3.5" y="5" width="17" height="14" rx="1.6"/><path d="M3.5 8.5h17"/><circle cx="6" cy="6.8" r=".5"/><circle cx="7.8" cy="6.8" r=".5"/>'),
    replay: svg('<path d="M3.5 16.5h17"/><path d="M6 16.5v-3M9 16.5v-6M12 16.5v-4M15 16.5v-8M18 16.5v-2"/><path d="M8 5.5l3 2-3 2z"/>')
  };
  const MAP = { SATURN: "saturn", TITAN: "titan", ENCELADUS: "enceladus", MIMAS: "mimas", TETHYS: "tethys", DIONE: "dione", RHEA: "rhea", HYPERION: "hyperion",
    IAPETUS: "iapetus", PHOEBE: "phoebe", VENUS: "venus", EARTH: "earth", MOON: "moon", JUPITER: "jupiter", IO: "io", EUROPA: "europa", GANYMEDE: "ganymede", CALLISTO: "callisto" };
  const name = n => n.charAt(0) + n.slice(1).toLowerCase();
  function bodyIcon(n) {
    if (GLYPH[n]) return `<span class="gl">${GLYPH[n]}</span>`;
    if (n === "SUN") return '<span class="orb sun"></span>';
    const look = typeof MOON_LOOK !== "undefined" && MOON_LOOK[n], c = look ? `rgb(${look.map(v => Math.round(v * 255)).join(",")})` : "#888";
    const map = MAP[n] ? `background-image: url(data/textures/1k/${MAP[n]}.webp);` : "";
    return `<span class="orb${n === "SATURN" ? " ringed" : ""}" style="--c:${c};${map}"></span>`;
  }
  // each icon is made once and kept, so the dock can be laid out again under the pointer without losing it
  const made = new Map();
  function item(key, label, html, onclick) {
    if (made.has(key)) return made.get(key);
    const b = document.createElement("button"); made.set(key, b);
    b.className = "dk"; b.dataset.key = key; b.dataset.label = label; b.setAttribute("aria-label", label); b.innerHTML = html;
    b.addEventListener("click", e => { e.stopPropagation(); onclick(b); });
    return b;
  }
  const seps = [0, 1].map(() => { const s = document.createElement("span"); s.className = "dsep"; s.setAttribute("aria-hidden", "true"); return s; });

  // ---- apps ----
  // a window app: hidden or minimized, it comes back; in front, it tucks away; behind others, it comes forward
  const shown = w => w && !w.hidden && !w.dataset.min && !w.classList.contains("closed");
  const inFront = w => w.classList.contains("front");
  function toggleWin(w) {
    if (!w) return;
    if (!shown(w)) { w.classList.remove("closed", "shaded"); WM.restore(w); }
    else if (inFront(w)) WM.minimize(w);
    else WM.front(w);
  }
  const APPS = [
    { key: "moments", label: "Moments", open: () => shown($("moments")),
      run() { if (phone() && $("phmom")) $("phmom").click(); else toggleWin($("moments")); } },
    { key: "highlights", label: "Highlights", open: () => !!$("hlcard") && !$("hlcard").hidden,
      run() { const H = window.cassiniHighlights, c = $("hlcard"); if (!H || !c) return; if (c.hidden) H.open(); else if (inFront(c)) H.close(); else WM.front(c); } },
    { key: "settings", label: "Settings", open: () => !!$("settings") && !$("settings").hidden,
      run() { const c = $("settings"); if (c && !c.hidden && !inFront(c)) WM.front(c); else $("sgear").click(); } }
  ];

  // ---- bodies: the viewer's focus list (Cassini, the Sun, Huygens near its descent, the bodies on stage) ----
  const bodyWins = n => [...document.querySelectorAll(".bodywin")].filter(w => w.dataset.body === n);
  function goBody(n) {
    if (typeof setFocus === "function") setFocus(n);
    // its windows come back from the dock and forward
    for (const w of bodyWins(n)) { if (w.dataset.min) WM.restore(w); else WM.front(w); }
  }
  let bodies = [], bodyKey = "";
  function bodyList() { try { return typeof focusChoices === "function" ? focusChoices() : []; } catch (e) { return []; } }

  // ---- minimized windows ----
  const winLabel = w => w.dataset.name || ({ dock: "Cassini Replay", imgcard: "Narrow-angle Camera", wacard: "Wide-angle Camera" })[w.id] || w.getAttribute("aria-label") || "Window";
  const winGlyph = w => w.id === "dock" ? GLYPH.replay : w.id === "moments" ? GLYPH.moments : GLYPH.window;
  function snapshot(w) {
    const img = w.querySelector(".well.has-frame .shot, .rlwell img, .mvwell img");
    if (img && img.src && img.naturalWidth) return img.src;
    const cv = w.querySelector(".rlwell canvas, .mvwell canvas");
    if (cv && cv.width) { try { return cv.toDataURL("image/jpeg", 0.7); } catch (e) {} }
    return "";
  }
  const tiles = new Map();   // window -> its tile while it is in the dock
  let tileN = 0;
  function tileFor(w) {
    let t = tiles.get(w);
    if (!t) {
      t = item("win:" + (w.id || w.dataset.name) + ":" + (++tileN), winLabel(w), `<span class="gl">${winGlyph(w)}</span>`, () => WM.restore(w));
      t.classList.add("mini", "arrive");
      t.addEventListener("animationend", () => t.classList.remove("arrive"), { once: true });
      const tag = (w.dataset.cam ? (w.dataset.body ? name(w.dataset.body) + " " : "") + w.dataset.cam + "AC" : "");
      if (tag) t.insertAdjacentHTML("beforeend", `<span class="tag">${tag}</span>`);
      tiles.set(w, t);
    }
    const src = snapshot(w), gl = t.querySelector(".gl");
    if (src) { gl.style.backgroundImage = `url("${src}")`; gl.classList.add("pic"); }
    return t;
  }

  // ---- layout ----
  let built = false;
  function render() {
    const on = !!(S ? S.get("interface.dock") : pref.on);
    document.body.classList.toggle("has-dock", on);
    dock.hidden = !on;
    if (!on) { ["bottom", "left", "right"].forEach(k => document.body.classList.remove("dock-" + k)); measure(); return; }
    const side = phone() ? "bottom" : (S ? S.get("interface.dockPosition") : pref.side);
    dock.classList.toggle("side-left", side === "left"); dock.classList.toggle("side-right", side === "right");
    for (const k of ["bottom", "left", "right"]) document.body.classList.toggle("dock-" + k, side === k);
    dock.style.setProperty("--ds", (S ? S.get("interface.dockSize") : pref.size) + "px");
    const mins = [...document.querySelectorAll(".win[data-min]")];
    for (const w of [...tiles.keys()]) if (!mins.includes(w) || !w.isConnected) { made.delete(tiles.get(w).dataset.key); tiles.delete(w); }
    const kids = [
      ...bodies.map(n => item("body:" + n, name(n), bodyIcon(n), () => goBody(n))),
      seps[0],
      ...APPS.map(a => item("app:" + a.key, a.label, `<span class="gl">${GLYPH[a.key]}</span>`, () => a.run())),
      seps[1],
      ...mins.map(tileFor)
    ];
    if (kids.length !== dock.children.length || kids.some((k, i) => dock.children[i] !== k)) dock.replaceChildren(...kids);
    built = true; marks(); measure();
  }
  // which apps are open and which body is in view
  function marks() {
    for (const b of dock.children) {
      const k = b.dataset && b.dataset.key; if (!k) continue;
      if (k.startsWith("body:")) {
        const n = k.slice(5);
        b.classList.toggle("here", typeof state !== "undefined" && state.focus === n);
        b.classList.toggle("open", bodyWins(n).length > 0);
      } else if (k.startsWith("app:")) {
        const a = APPS.find(a => "app:" + a.key === k); b.classList.toggle("open", !!a && a.open());
      }
    }
  }
  // the room the main window leaves under itself: the shelf's height (not the magnified icons', so it holds still)
  function measure() {
    const st = document.body.style;
    if (!phone()) st.setProperty("--appdockh", (dock.hidden ? 0 : dock.offsetHeight) + "px");
    else st.removeProperty("--appdockh");
    st.setProperty("--appdockw", (dock.hidden ? 0 : dock.offsetWidth + 6) + "px");
  }

  // magnification: the icons near the pointer grow, the farther the less (none on a phone)
  function magnify(e) {
    const m = (S ? S.get("interface.dockMagnify") : pref.mag) / 100;
    if (!m || phone() || e.pointerType === "touch") return;
    const vert = dock.classList.contains("side-left") || dock.classList.contains("side-right");
    const ds = parseFloat(dock.style.getPropertyValue("--ds")) || 40, p = vert ? e.clientY : e.clientX;
    dock.classList.add("magnifying");
    for (const b of dock.querySelectorAll(".dk")) {
      const r = b.getBoundingClientRect(), c = vert ? r.top + r.height / 2 : r.left + r.width / 2;
      const d = Math.abs(p - c) / (ds * 2.2);
      b.style.setProperty("--k", (1 + m * (d < 1 ? Math.cos(d * Math.PI / 2) ** 2 : 0)).toFixed(3));
    }
  }
  function unmagnify() { dock.classList.remove("magnifying"); dock.querySelectorAll(".dk").forEach(b => b.style.removeProperty("--k")); }
  dock.addEventListener("pointermove", magnify);
  dock.addEventListener("pointerleave", unmagnify);
  // a vertical wheel scrolls the strip on a phone
  dock.addEventListener("wheel", e => { if (phone() && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { dock.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });

  // the window manager minimizes into the dock: it asks where a window's tile is, and tells the dock when its list changes
  window.cassiniDock = {
    get on() { return !dock.hidden; },
    tile(w) { if (dock.hidden || !w.dataset.min) return null; if (!tiles.has(w)) render(); return tiles.get(w) || null; },
    sync() { if (built) render(); },
    render
  };
  if (S) ["interface.dock", "interface.dockPosition", "interface.dockSize"].forEach(k => S.on(k, () => { render(); }));
  addEventListener("resize", () => { render(); });
  new ResizeObserver(measure).observe(dock);
  // the bodies on stage change as the mission goes on; the open dots follow the windows
  const base = window.studyHud;
  let lastMarks = 0;
  window.studyHud = ms => {
    if (base) base(ms);
    const list = bodyList(), key = list.join();
    if (key !== bodyKey) { bodyKey = key; bodies = list; render(); }
    const now = performance.now();
    if (now - lastMarks > 250) { lastMarks = now; marks(); }
  };
  render();
})();
</script>
