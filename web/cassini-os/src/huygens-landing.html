<!-- Huygens lands on Titan: a cutscene for whoever plays through January 14, 2005 (or follows the release cutscene's
     "Watch the landing"), from the probe hitting Titan's air to its data reaching Earth. build.py splices the style
     into the head, the section into #app and the script after the release cutscene's (its CUTSCENES list); begin and
     end, Skip and Escape, fades, captions, looking around, the trigger and ?huygens-landing come from cutscene.html.

     Nothing here is keyframed by hand. Where the probe is, how fast it falls, its altitude and the deceleration it
     feels all come from its own track (data/huygens.json: NAIF's coast, then the DTWG entry and descent
     reconstruction); the events (parachutes, heat shield, lamp, touchdown, end of the link) are the descent team's
     reconstructed times (huygens-landing-data.json, each with its source); Cassini's place and pointing are the
     viewer's own (the real trajectory, and the real attitude where it is recorded; without one, the dish is drawn on
     the probe until the link ends, then turned to Earth). The probe is ESA's own models of it (the ESA SPICE Service's
     Huygens dataset, CC BY-NC 3.0 IGO): the entry shell in its two parts, which come off in the real order (the pilot
     chute pulls the back cover away and the back cover pulls out the main chute; half a minute later the heat shield
     drops away), and the descent module under the parachutes. The parachutes are disk-gap-band canopies at their real
     sizes (no model of them has been published). Inside Titan's haze the sky closes in around the probe, and near the
     ground the probe is held to the landing point on Titan's globe at the descent table's altitude.

     The clock runs a few times faster than real time through the entry and the parachutes, a few hundred times faster
     down the long drogue descent, then slows again for the touchdown; the readout shows the mission time throughout.
     Shots: beside the probe (entry, parachutes), Cassini listening from far off, the probe again down to the ground
     (the viewer's DISR map of the landing site and the footprints of its pictures underneath), then Cassini as the
     site sets, turning to Earth. The last card offers to stay with Huygens (paused where the cutscene ends, the view on
     the probe standing on the landing site) or go back to Cassini; left alone it stays with Huygens.

     After the landing the probe stays on Titan for good (window.studyLanded, not a cutscene hook): at any time from the
     touchdown on, the viewer's Huygens marker sits on the landing point, shown while the camera is near Titan, and up
     close it is the same model standing on the landing-site map with the drogue lying downwind, under Titan's sky. -->
<style>
#hland .hl-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.72) 0, rgba(0,0,0,.45) 22%, rgba(0,0,0,0) 46%); }
#hland .hl-tag { position: absolute; left: 0; top: 0; font: 10.5px/1 var(--hudf); letter-spacing: .1em; text-transform: uppercase; color: rgba(232,236,242,.7);
  white-space: nowrap; opacity: 0; transition: opacity 1s ease; text-shadow: 0 1px 6px rgba(0,0,0,.9); }
#hland .hl-tag::before { content: ""; display: inline-block; width: 14px; height: 1px; margin: 0 6px 3px 0; background: currentColor; vertical-align: middle; }
#hland .hl-tag.on { opacity: 1; }
#hland .hl-tag small { font-size: 9.5px; color: rgba(232,236,242,.45); letter-spacing: .06em; text-transform: none; }
#hland .cs-cap .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
#hland .cs-cap button { all: unset; pointer-events: auto; padding: 6px 15px; border-radius: 13px; border: 1px solid var(--q-line); background: rgba(16,17,20,.55);
  color: rgba(232,236,242,.8); font-size: 12px; cursor: pointer; }
#hland .cs-cap button:hover { color: var(--q-text); border-color: rgba(232,236,242,.35); }
#hland .cs-cap small { font-size: 10.5px; color: rgba(232,236,242,.4); }
#hland .cs-cap small a { color: inherit; pointer-events: auto; }
body.phone #hland .cs-read { font-size: 9.5px; bottom: 9vh; white-space: normal; width: calc(100vw - 32px); text-align: center; line-height: 1.5; }
</style>

<section id="hland" class="cs-root" hidden aria-live="polite">
  <div class="hl-shade"></div>
  <div class="cs-black"></div>
  <div class="hl-tag" data-tag="probe">Huygens</div>
  <div class="hl-tag" data-tag="cassini">Cassini</div>
  <div class="hl-tag" data-tag="earth">Earth</div>
  <div class="cs-caps"></div>
  <div class="cs-read" aria-hidden="true"></div>
  <div class="cs-note">The probe's path, speed and altitude are its reconstructed track; Cassini's are its real trajectory. The clock runs faster than real time, shown below. The parachutes' line lengths are the usual ones for their type; ESA has not published them.</div>
  <div class="cs-hint">Drag to look around</div>
  <button class="cs-skip" type="button">Skip ▸</button>
</section>

<script>
// ---------- Huygens lands on Titan: January 14, 2005, from entry to the first data on Earth ----------
(function () {
  const root = document.getElementById("hland"), black = root.querySelector(".cs-black"), caps = root.querySelector(".cs-caps");
  const read = root.querySelector(".cs-read"), note = root.querySelector(".cs-note"), hint = root.querySelector(".cs-hint");
  const tags = {}; root.querySelectorAll("[data-tag]").forEach(el => { tags[el.dataset.tag] = el; });
  const CS = cassiniCutscene, { fadeTo, sound, look } = CS, runCaptions = (list, t, shown) => CS.runCaptions(caps, list, t, shown);
  // the descent team's reconstructed times and ESA's facts, written in by build.py from huygens-landing-data.json:
  // { t0_utc, events: { name: s from t0 }, chutes_m, green_bank_earth_utc, esoc_first_data_utc, pictures, surface_k, facts }
  const DATA = /*HUYGENS_LANDING_DATA*/null;
  if (!DATA) return;
  const T0 = utcToEt(DATA.t0_utc), EV = DATA.events, CH = DATA.chutes_m;
  const GM_TITAN = 8978.14;    // km^3/s^2
  const C_KM_S = 299792.458;
  const END = 112;             // screen s when it closes by itself
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const SOURCES = [...new Set(DATA.facts.map(f => f.source))].map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(new URL(u).hostname.replace(/^www\./, ""))}</a>`).join(" · ");
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const ease = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
  const utc = et => new Date(etToMs(et)).toISOString().slice(11, 19);
  const ok = () => !!probe && !!probe.events && probe.events.entry_interface >= coverage[0] && probe.events.landing <= coverage[1];

  // ---------- what the track says: speed, deceleration, altitude ----------
  const pa = v3(), pb = v3(), pc = v3(), ta = v3(), tb = v3(), tc = v3();
  // the probe's position relative to Titan at et (km, J2000)
  function rel(et, out) { positionAt(probe.track, et, out); positionAt(tracks.TITAN, et, ta); return sub(out, ta, out); }
  // velocity relative to Titan's ground (it turns with Titan, 12 m/s at the equator), km/s, in J2000
  const bodyFixed = (et, r) => { const R = iauMatrix(bodies.TITAN, et); return [dot(R[0], r), dot(R[1], r), dot(R[2], r)]; };
  function velocity(et) {
    const a = bodyFixed(et + 1, rel(et + 1, pa)), b = bodyFixed(et - 1, rel(et - 1, pb)), R = iauMatrix(bodies.TITAN, et);
    const d = [(a[0] - b[0]) / 2, (a[1] - b[1]) / 2, (a[2] - b[2]) / 2];
    return [0, 1, 2].map(i => R[0][i] * d[0] + R[1][i] * d[1] + R[2][i] * d[2]);
  }
  // what the probe feels (everything but Titan's gravity), in g: a second difference over 6 s, gravity taken out
  function gLoad(et) {
    const h = 6; rel(et - h, pa); rel(et, pb); rel(et + h, pc);
    const a = [0, 1, 2].map(i => (pa[i] - 2 * pb[i] + pc[i]) / (h * h)), r = len(pb), g = GM_TITAN / (r * r * r);
    return Math.hypot(a[0] + g * pb[0], a[1] + g * pb[1], a[2] + g * pb[2]) * 1000 / 9.80665;
  }
  // altitude above the 2,575 km sphere the descent was reconstructed on: the descent table, else the track
  function altitude(et) {
    const de = probe.descent;
    if (de && et >= de.et[0] && et <= de.et[de.et.length - 1]) {
      const j = Math.max(0, Math.min(de.et.length - 2, lowerIndex(de.et, et))), f = clamp01((et - de.et[j]) / (de.et[j + 1] - de.et[j]));
      return de.alt_km[j] + f * (de.alt_km[j + 1] - de.alt_km[j]);
    }
    return len(rel(et, pa)) - (probe.landing_site ? probe.landing_site.radius_km : 2575);
  }
  // numbers for the captions, worked out once from the track and the trajectories
  let NUM = null;
  function numbers() {
    if (NUM) return NUM;
    const E = probe.events.entry_interface, L = T0 + EV.landing;
    // the heating goes as the air's density times the speed cubed, which is the deceleration times the speed: it peaks
    // a little before the deceleration does and lasts longer
    let peak = 0, peakEt = E, qPeak = 0;
    for (let t = E; t < T0; t += 2) { const g = gLoad(t); if (g > peak) { peak = g; peakEt = t; } qPeak = Math.max(qPeak, g * len(velocity(t))); }
    const de = probe.descent, n = de.et.length - 1;
    // the last minute of the descent table, for the touchdown speed
    let j = n; while (j > 0 && de.et[n] - de.et[j] < 60) j--;
    const vLand = (de.alt_km[j] - de.alt_km[n]) * 1000 / (de.et[n] - de.et[j]);
    const light = et => len(sub(positionAt(tracks.EARTH, et, v3()), positionAt(tracks.CASSINI, et, v3()), v3())) / C_KM_S;
    const esoc = utcToEt(DATA.esoc_first_data_utc), lt = light(esoc);
    const cassiniKm = len(sub(positionAt(tracks.CASSINI, T0 + 1800, v3()), positionAt(tracks.TITAN, T0 + 1800, v3()), v3()));
    return NUM = { E, L, peak, peakEt, qPeak, vEntry: len(velocity(E + 1)), vT0: len(velocity(T0)) * 1000, vLand, lt, send: esoc - lt, cassiniKm,
      earthKm: len(sub(positionAt(tracks.EARTH, esoc, v3()), positionAt(tracks.CASSINI, esoc, v3()), v3())) };
  }

  // ---------- the clock: screen seconds T -> mission seconds from t0, through these points, smooth and never back ----------
  let KEYS = null;
  function keys() {
    const N = numbers(), E = N.E - T0, L = EV.landing, K = EV.link_end, S = N.send - T0;
    return [[0, E + 1], [10, -35], [13.5, -3], [19.5, 6], [22, 29], [25.5, 40], [29, 150], [33.5, EV.drogue + 5], [34.5, EV.drogue + 250],
      [44.5, 2600], [57, L - 150], [64, L - 6], [66.5, L + 3], [71.5, L + 40], [72.5, L + 70], [80, K - 90], [84, K + 30], [93, S], [END, S + 600]];
  }
  // a monotone cubic through the points, so the clock speeds up and slows down without jolts
  function missionAt(T) {
    const k = KEYS, n = k.length;
    if (T <= k[0][0]) return k[0][1];
    if (T >= k[n - 1][0]) return k[n - 1][1];
    if (!k.m) {
      const d = []; for (let i = 0; i < n - 1; i++) d.push((k[i + 1][1] - k[i][1]) / (k[i + 1][0] - k[i][0]));
      // the harmonic mean of the slopes on either side (Fritsch and Butland): never overshoots, so time never runs back
      const m = [d[0]]; for (let i = 1; i < n - 1; i++) m.push(d[i - 1] * d[i] <= 0 ? 0 : 2 / (1 / d[i - 1] + 1 / d[i]));
      m.push(d[n - 2]); k.m = m;
    }
    let i = 0; while (k[i + 1][0] < T) i++;
    const h = k[i + 1][0] - k[i][0], s = (T - k[i][0]) / h, s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * k[i][1] + (s3 - 2 * s2 + s) * h * k.m[i] + (-2 * s3 + 3 * s2) * k[i + 1][1] + (s3 - s2) * h * k.m[i + 1];
  }
  const rateAt = T => (missionAt(T + 0.05) - missionAt(T - 0.05)) / 0.1;

  // ---------- captions, in screen seconds: when, how long, the line, a class, the chord under it ----------
  function captions() {
    const N = numbers(), lt = Math.round(N.lt / 60), surfaceMin = Math.round((EV.link_end - EV.landing) / 60);
    const P = DATA.pictures;
    return [
      [1.5, 6.5, `<b>January 14, 2005 · ${utc(N.E).slice(0, 5)} UTC</b>After twenty days asleep, Huygens hits Titan's air 1,270 km up, at ${N.vEntry.toFixed(1)} km/s.`, "", [0, 2, 4]],
      [8.5, 5, `Its heat shield takes the blow. Titan's air slows it to ${Math.round(N.vT0 / 10) * 10} m/s in under five minutes, at up to ${N.peak.toFixed(0)} g.`, "", null],
      [14, 6.5, `${utc(T0).slice(0, 5)} UTC · A ${CH.pilot.toFixed(1)} m pilot chute fires out and pulls the back cover away. The back cover pulls out the ${CH.main} m main parachute.`, "", [0, 4, 7]],
      [21.5, 4.5, `Half a minute later the heat shield drops away, and the instruments meet Titan's air.`, "", null],
      [26.5, 3.5, `${utc(T0 + EV.data).slice(0, 5)} UTC · Huygens starts talking to Cassini. Its camera takes pictures as it turns.`, "", [2, 4, 7]],
      [30, 4, `At 111 km the main chute lets go. A ${CH.drogue.toFixed(0)} m drogue carries it the rest of the way, for more than two hours.`, "", null],
      [35.5, 4.5, `Cassini, ${fmtInt(Math.round(N.cassiniKm / 1000) * 1000)} km away, has its dish on Titan, recording everything Huygens sends.`, "", [0, 3, 5]],
      [40, 4.5, `Earth heard it too. At 10:25 UTC the Green Bank telescope caught Huygens's faint carrier, ${lt} minutes after it left.`, "", null],
      [51, 5.5, `Under the haze its camera maps the ground it falls toward. Each outline is where one picture fell.`, "", [1, 3, 5]],
      [57, 5, `${utc(T0 + EV.lamp).slice(0, 5)} UTC · A lamp switches on, to light the ground for the last pictures.`, "", null],
      [65, 6.5, `<b>${utc(N.L)} UTC · Touchdown</b>At ${N.vLand.toFixed(1)} m/s, about walking pace. The first landing in the outer solar system.`, "big", [0, 2, 4, 7, 9]],
      [73, 5.5, `Huygens keeps talking from the ground: ${DATA.surface_k} K, ice pebbles all around. Cassini listens for another ${surfaceMin} minutes.`, "", null],
      [79.5, 5, `${utc(T0 + EV.link_end).slice(0, 5)} UTC · The landing site sinks below Titan's edge as Cassini sees it, and the link ends.`, "", [2, 4, 5]],
      [85, 5, `Cassini turns its dish to Earth and plays the recording back, more than once to be safe.`, "", null],
      [90.5, 5.5, `${DATA.esoc_first_data_utc.slice(11, 16)} UTC · ${lt} minutes later the first data reach ESA in Darmstadt. Only half came home: Cassini never listened on one of the two channels, so ${P.received} of ${P.planned} pictures arrived.`, "", [0, 2, 4]],
      [96.5, 99, `<b>Huygens on Titan · January 14, 2005</b>Its pictures are the landing-site map under the probe.<div class="btns"><button type="button" data-hl="stay">Stay with Huygens</button><button type="button" data-hl="back">Back to Cassini</button></div><small>Sources: ${SOURCES}</small>`, "big", [0, 2, 4, 7, 9]],
    ];
  }

  // ---------- the probe: ESA's models of it (entry shell in two parts, descent module), the parachutes ----------
  // ESA's models (the ESA SPICE Service's Huygens dataset, the ones its Cosmographia "Huygens descent" uses), made into
  // small GLBs by models/make_huygens_dm.py and make_huygens_shell.py, in metres in one frame: spin axis +Y, the heat
  // shield facing -Y, the base of the descent module's fore dome at y = 0 (where it touches the ground)
  function loadModel(file, then) {
    if (!THREE.GLTFLoader) return;
    fetch(file).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(t => {
      const b = atob(t.trim()), u = new Uint8Array(b.length);
      for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
      new THREE.GLTFLoader().parse(u.buffer, "", gltf => { gltf.scene.traverse(o => o.layers.set(1)); then(gltf.scene); });
    }).catch(err => console.warn(`${file} not loaded`, err));
  }
  // the parachutes hang from the swivel above the descent module's top platform; the pilot chute from the top of the
  // back cover
  const DM_TOP = 0.84, BC_TOP = 0.94;
  // a disk-gap-band parachute, the kind all three of Huygens' were: nominal diameter D0 (m), `gores` panels, `lines`
  // suspension lines `lineK` x D0 long meeting at a confluence `riser` m above the attachment point (the origin), +Y up
  // the lines. Proportions of the type (Viking's): disk 0.726 D0 across, gap 0.042 D0, band 0.121 D0 deep; inflated,
  // the canopy pulls in to about two thirds of D0 and bulges out between its radial tapes. Kevlar lines, nylon cloth
  function chute(D0, gores, lineK, riser, color) {
    const g = new THREE.Group(), base = new THREE.Color(color), tape = base.clone().multiplyScalar(0.78);
    const R = 0.33 * D0, vent = 0.045 * D0, crown = 0.4 * R, gap = 0.042 * D0, bandH = 0.121 * D0, Rb = 0.95 * R, L = lineK * D0;
    const yb = Math.sqrt(L * L - Rb * Rb), yd = yb + bandH + gap;   // the band's skirt, the disk's rim (above the confluence)
    const pos = [], col = [], idx = [];
    // a surface of revolution with scalloped gores: prof(v) = [radius, height] from v = 0 to 1, `rows` rings
    function surface(rows, prof, bulge) {
      const seg = gores * 6, s0 = pos.length / 3;
      for (let i = 0; i <= rows; i++) {
        const [r, y] = prof(i / rows);
        for (let j = 0; j <= seg; j++) {
          const f = (j % 6) / 6, b = Math.sin(Math.PI * f), a = j / seg * Math.PI * 2, rr = r * (1 + bulge * b);
          pos.push(Math.cos(a) * rr, y + bulge * 0.4 * r * b, Math.sin(a) * rr);
          const c = j % 6 === 0 || i === 0 || i === rows ? tape : base;
          col.push(c.r, c.g, c.b);
        }
      }
      for (let i = 0; i < rows; i++) for (let j = 0; j < seg; j++) {
        const a = s0 + i * (seg + 1) + j, b = a + seg + 1;
        idx.push(a, b, a + 1, a + 1, b, b + 1);
      }
    }
    const th = Math.acos(vent / R);
    surface(10, v => [R * Math.cos(th * v), yd + crown * Math.sin(th * v)], 0.05);   // the disk, rim to vent
    surface(3, v => [Rb * (0.95 + 0.05 * v), yb + bandH * v], 0.035);                  // the band, skirt to top
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    geo.setIndex(idx); geo.computeVertexNormals();
    const canopy = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0,
      side: THREE.DoubleSide, transparent: true, opacity: 1 }));
    canopy.position.y = riser;
    // the lines: one per gore, from the band's skirt (and on up its tapes to the disk) down to the confluence; the riser
    // down to the attachment
    const lp = [];
    for (let i = 0; i < RISER_N; i++) lp.push(0, riser * i / RISER_N, 0, 0, riser * (i + 1) / RISER_N, 0);
    for (let j = 0; j < gores; j++) {
      const a = j / gores * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
      lp.push(0, riser, 0, c * Rb * 0.95, riser + yb, s * Rb * 0.95);
      lp.push(c * Rb * 0.95, riser + yb, s * Rb * 0.95, c * Rb, riser + yb + bandH, s * Rb);
      lp.push(c * R, riser + yd, s * R, c * R, riser + yb + bandH, s * R);
    }
    const lg = new THREE.BufferGeometry(); lg.setAttribute("position", new THREE.Float32BufferAttribute(lp, 3));
    const lines = new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0xd8c9a0, transparent: true, opacity: 0.6 }));
    canopy.frustumCulled = lines.frustumCulled = false;   // they are reshaped once down (see layDown)
    g.add(canopy, lines);
    g.userData = { canopy, lines, top: riser + yd + crown, gores, riser, R, Rb, vent, gap, bandH, yb, yd,
      up: { canopy: geo.attributes.position.array.slice(), lines: lp.slice() } };
    return g;
  }
  // the riser, in pieces, so that it can lie slack on the ground
  const RISER_N = 24;
  // the drogue on the ground. Huygens' camera saw it go by: it hid part of the Sun's aureole 9 to 14 s after the
  // probe landed, drifting with a wind of about 0.4 m/s toward an azimuth of about 165 degrees (SSE); the probe and its
  // parachute together were 12 m long (Schröder et al. 2017, "Bouncing on Titan"). So it comes down south-south-east of
  // the probe, out of the surface picture's view (193 +- 14 degrees), its crown about 12 m off: a nylon canopy lying
  // collapsed, its upper layer still holding a little air near the mouth, creased along its tapes; its lines run slack
  // across the ground and the riser drapes over the top platform to it
  const CHUTE_DOWN = { az: 165 * Math.PI / 180, len: 12 };
  function chuteDown(g, toGround) {
    const u = g.userData, Mtot = u.bandH + u.gap + u.R - u.vent;
    const U0 = CHUTE_DOWN.len - Mtot, Uc = U0 - 0.92 * u.yb;   // the lines nearly straight from the mouth
    const dE = Math.sin(CHUTE_DOWN.az), dN = Math.cos(CHUTE_DOWN.az);
    // a point of the cloth, at `a` around the canopy and `m` metres up its gores from the skirt, flattened
    const cloth = (a, m) => {
      const r = m < u.bandH + u.gap ? u.Rb : Math.max(0, u.R - (m - u.bandH - u.gap)), b = a + 0.6, top = Math.sin(b);
      const k = 1 - m / Mtot, along = U0 + m * (1 - 0.06 * top);
      // flattened, a ring of cloth is half its round as wide, less where it bunches up
      const half = 0.55 * Math.PI / 2 * r * (0.8 + 0.25 * noise(along * 1.3, 1.7));
      const w = half * Math.cos(b) + 0.22 * Math.sin(along * 0.9 + 1) + 0.12 * noise(along * 0.7, 3) + 0.07 * noise(along * 4, a * 3);
      // the upper layer: a little air left near the mouth, creases along the tapes, rumples
      let h = 0.006 + 0.01 * Math.max(0, noise(along * 3.1, w * 3.1 - 4));
      if (top > 0) h += top * (0.03 + 0.1 * k * k + 0.015 * Math.abs(Math.sin(u.gores * a / 2))
        + 0.07 * Math.max(0, noise(along * 3, w * 4 + 5)) + 0.05 * Math.max(0, noise(along * 1.4 - 2, w * 1.6)));
      return toGround(along * dE + w * dN, along * dN - w * dE, h);
    };
    // the cloth's own coordinates from where it is when inflated (relative to the canopy's origin)
    const atCloth = (x, y, z) => {
      const r = Math.hypot(x, z), a = Math.atan2(z, x);
      return [a, y < u.yd - 0.5 * u.gap ? Math.max(0, y - u.yb) : u.bandH + u.gap + Math.max(0, u.R - r)];
    };
    const canopy = [], up = u.up.canopy;
    for (let i = 0; i < up.length; i += 3) {
      const [a, m] = atCloth(up[i], up[i + 1], up[i + 2]), p = cloth(a, m);
      canopy.push(p[0], p[1] - u.riser, p[2]);
    }

      sunH.normalize(); side.crossVectors(u, sunH).normalize();
      const a = 0.85 + 0.012 * T + look.yaw, around = sunH.clone().multiplyScalar(Math.cos(a)).addScaledVector(side, Math.sin(a));
      let D, elev, lookAt;
      if (s < 0) {
        // entry: behind and beside the shell, looking down its path at Titan; in its last seconds pulling back and
        // round to beside it, wide enough for the parachutes to come
        const w = ease((s + 2.5) / 2.5);
        // around the hottest minute, round to the shield's side to see the shock layer ahead of it
        const hv = ease(H.hv * 1.4 - 0.2) * (1 - w);
        D = 13 + 51 * w + 5 * hv; dirV.copy(around).multiplyScalar(0.8).addScaledVector(v, -0.55 * (1 - w) * (1 - hv) + 0.35 * hv).addScaledVector(u, 0.15 * (1 - w) + 0.08 * w);
        lookAt = tgt.copy(P0).addScaledVector(v, 5e-6 * (1 - w) * (1 - hv)).addScaledVector(u, 6e-6 * w);
        // the shaking of the deceleration
        if (P && P.entry) lookAt.add(CS.fx.shake(P.entry.level * 0.12e-6, T));
      } else if (s < EV.landing - 30) {
        // under the parachutes: wide enough for the canopy, then lower and closer as the ground comes up
        const chuteK = s < EV.drogue + 20 ? 1 : 0, alt = altitude(state.et);
        const low = ease(1 - (alt - 0.3) / 6);
        D = (chuteK ? 48 : 30) * (1 - 0.55 * low); elev = (chuteK ? 0.05 : 0.35) - 0.25 * low;
        let up = (chuteK ? 9 : 2) * (1 - low) - 4 * low;
        // while the shell comes off: wide, for the pilot pulling the back cover away and the main paying out; closer
        // as the main opens and the heat shield drops away below; then out to the whole canopy
        const wA = 1 - ease((s - 5) / 4), wB = (1 - wA) * (1 - ease((s - EV.shield - 8) / 12)), wN = 1 - wA - wB;
        D = D * wN + 64 * wA + 22 * wB; elev = elev * wN + 0.08 * wA + 0.22 * wB; up = up * wN + 6 * wA + 0.5 * wB;
        dirV.copy(around).addScaledVector(u, elev);
        lookAt = tgt.copy(P0).addScaledVector(u, up * 1e-6);
      } else {
        // the touchdown and after: low beside it, on the ground
        D = 11; dirV.copy(around).addScaledVector(u, 0.12);
        lookAt = tgt.copy(P0).addScaledVector(u, 0.6e-6);
      }
      dirV.addScaledVector(u, look.pitch).normalize();
      cam.copy(P0).addScaledVector(dirV, D * look.zoom * 1e-6);
      camera.position.copy(cam); camera.up.copy(u); camera.lookAt(lookAt);
      if (P) placeSky(s >= EV.landing ? 0 : altitude(state.et), u, true);
    } else {
      // Cassini at its true size, Titan beyond it
      if (P) P.sky.visible = false;
      const C = cassini.position, tW = relScene("TITAN", new THREE.Vector3()).sub(C).normalize(), up = new THREE.Vector3(0, 1, 0);
      side.crossVectors(tW, up).normalize();
      // from behind and a little beside it, Titan beyond and Cassini off to one side
      const a = (T > 72 ? 0.3 : -0.3) + 0.004 * (T - (T > 72 ? 72.5 : 34.5)) + look.yaw;
      dirV.copy(tW).multiplyScalar(-Math.cos(a)).addScaledVector(side, Math.sin(a)).addScaledVector(up, 0.18 + look.pitch).normalize();
      cam.copy(C).addScaledVector(dirV, 30 * look.zoom * 1e-6);
      camera.position.copy(cam); camera.up.copy(up);
      camera.lookAt(tgt.copy(C).addScaledVector(tW, 60e-6));
    }
    // the tags
    camera.updateMatrixWorld();
    const place = (el, w, html, on) => {
      const p = w.clone().project(camera), vis = on && p.z < 1 && Math.abs(p.x) < 1.05 && Math.abs(p.y) < 1.05;
      el.classList.toggle("on", vis);
      if (vis) el.style.transform = `translate(${(p.x + 1) / 2 * innerWidth + 8}px, ${(1 - p.y) / 2 * innerHeight - 5}px)`;
      if (html !== undefined && vis) el.innerHTML = html;
    };
    const C = H.shot === "cassini", N = numbers();
    place(tags.cassini, cassini.position, undefined, C && T - (T > 72 ? 72.5 : 34.5) > 1.5);
    const pW = relScene("HUYGENS", new THREE.Vector3());
    place(tags.probe, pW, `Huygens <small>on Titan · ${s < EV.landing ? "descending" : "landed"}</small>`, C);
    const eW = relScene("EARTH", new THREE.Vector3()).sub(camera.position).normalize().add(camera.position);
    place(tags.earth, eW, `Earth <small>${(N.earthKm / 1e9).toFixed(2)} billion km</small>`, C && s > EV.link_end);
  }

  CS.register("huygens-landing", { root, frame, attitude, camera: cameraAt, onEnd: cleanUp });
  // playback crossing the probe's entry into Titan's air plays it; so does ?huygens-landing, and the Huygens Moments
  CS.at(() => ok() ? probe.events.entry_interface : null, play, ok);
  CS.fromUrl("huygens-landing", () => probe.events.entry_interface - 5, play, ok);
  const jump0 = window.jump;
  if (typeof jump0 === "function") window.jump = e => {
    if (e && e.kind === "milestone" && /^Huygens (enters|lands)/.test(e.label || "") && ok() && !CS.active) return play();
    return jump0(e);
  };
  window.cassiniHuygensLanding = { play, skip: () => finish("back"), get running() { return !!H; }, get T() { return H ? H.T : null; },
    get numbers() { return ok() ? numbers() : null; }, get facts() { return DATA.facts; } };
})();
</script>
