<!-- Huygens lets go: a short cutscene for whoever plays through Christmas Day 2004, and the probe as a craft of its own
     afterwards. build.py splices the style into the head, the section into #app and the script after the finale's
     (its CUTSCENES list); begin and end, Skip and Escape, fades, captions, looking around, the trigger and ?huygens
     come from the shared cutscene.html.

     When playback crosses the release (2004-12-25 02:00 UTC) or the page is opened with ?huygens, the interface fades
     away and the view settles beside Cassini a few seconds before it. Where Cassini is and how it is turned are the
     viewer's own (the real trajectory and attitude). The probe follows ESA's numbers, not keyframes:
       - Cassini's thrusters are held off from 10 s before the release to about 60 s after, so nothing moves until the
         release, and a few soft puffs show them coming back
       - the Spin/Eject Device pushes the probe straight out from its mounting at 0.35 m/s, spinning 7.5 rpm about that
         same axis; its distance and turn follow from those two numbers and the clock
       - the first seconds run in real time; then the clock speeds up (shown on screen) and the spin drawn is capped so
         it does not strobe; both craft are drawn at their true size, so the gap between them is the real one
     The camera stands beside Cassini, dish up, and widens as the probe drifts off, then flies over to the probe and
     looks past it toward Titan, with a tag on each. Captions are ESA's facts
     (huygens-release-data.json, written in by build.py, each with its source). The last card offers to stay with
     Huygens (the view on the probe, paused, to look around it), the landing (a jump to Huygens entering Titan's air)
     or Cassini; left alone it stays with Huygens.

     After the release the probe is its own model at any time, not only after the cutscene (window.studyCoast, which
     the viewer calls): see "Huygens on its own" below. -->
<style>
#hrel .hr-read { position: absolute; left: 50%; bottom: 7vh; transform: translateX(-50%); white-space: nowrap; font: 11px/1 var(--hudf); letter-spacing: .08em;
  color: var(--q-dim); opacity: 0; transition: opacity 1.2s ease; }
#hrel .hr-read.on { opacity: 1; }
#hrel .hr-read i { font-style: normal; color: var(--q-accent); }
#hrel .hr-note { position: absolute; left: 16px; bottom: 14px; max-width: min(460px, calc(100vw - 140px)); font-size: 10.5px; line-height: 1.4; color: rgba(232,236,242,.34); opacity: 0; transition: opacity 1.5s ease; }
#hrel .hr-note.on { opacity: 1; }
#hrel .hr-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.72) 0, rgba(0,0,0,.45) 22%, rgba(0,0,0,0) 46%); }
/* tags on Cassini, the probe and Titan once the view pulls back */
#hrel .hr-tag { position: absolute; left: 0; top: 0; font: 10.5px/1 var(--hudf); letter-spacing: .1em; text-transform: uppercase; color: rgba(232,236,242,.7);
  white-space: nowrap; opacity: 0; transition: opacity 1s ease; text-shadow: 0 1px 6px rgba(0,0,0,.9); }
#hrel .hr-tag::before { content: ""; display: inline-block; width: 14px; height: 1px; margin: 0 6px 3px 0; background: currentColor; vertical-align: middle; }
#hrel .hr-tag.on { opacity: 1; }
#hrel .hr-tag small { font-size: 9.5px; color: rgba(232,236,242,.45); letter-spacing: .06em; text-transform: none; }
/* the last card's choices and sources */
#hrel .cs-cap .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
#hrel .cs-cap button { all: unset; pointer-events: auto; padding: 6px 15px; border-radius: 13px; border: 1px solid var(--q-line); background: rgba(16,17,20,.55);
  color: rgba(232,236,242,.8); font-size: 12px; cursor: pointer; }
#hrel .cs-cap button:hover { color: var(--q-text); border-color: rgba(232,236,242,.35); }
#hrel .cs-cap small { font-size: 10.5px; color: rgba(232,236,242,.4); }
#hrel .cs-cap small a { color: inherit; pointer-events: auto; }
body.phone #hrel .hr-read { font-size: 9.5px; bottom: 9vh; white-space: normal; width: calc(100vw - 32px); text-align: center; line-height: 1.6; }
body.phone #hrel .hr-note { bottom: auto; top: 40px; max-width: calc(100vw - 32px); }
</style>

<section id="hrel" class="cs-root" hidden aria-live="polite">
  <div class="hr-shade"></div>
  <div class="cs-black"></div>
  <div class="hr-tag" data-tag="probe">Huygens</div>
  <div class="hr-tag" data-tag="cassini">Cassini</div>
  <div class="hr-tag" data-tag="titan">Titan</div>
  <div class="cs-caps"></div>
  <div class="hr-read" aria-hidden="true"></div>
  <div class="hr-note">Cassini's path and pointing are its real trajectory and attitude. The release follows ESA's numbers; after the first seconds the clock runs faster.</div>
  <div class="cs-hint">Drag to look around</div>
  <button class="cs-skip" type="button">Skip ▸</button>
</section>

<script>
// ---------- Huygens lets go: the probe's release from Cassini, 2004-12-25 02:00 UTC, and the probe on its own after ----------
(function () {
  const root = document.getElementById("hrel"), black = root.querySelector(".cs-black"), caps = root.querySelector(".cs-caps");
  const read = root.querySelector(".hr-read"), note = root.querySelector(".hr-note"), hint = root.querySelector(".cs-hint");
  const tags = {}; root.querySelectorAll("[data-tag]").forEach(el => { tags[el.dataset.tag] = el; });
  // what every cutscene shares (cutscene.html)
  const CS = cassiniCutscene, { fadeTo, sound, look } = CS, runCaptions = (list, t, shown) => CS.runCaptions(caps, list, t, shown);
  // ESA's numbers and facts, written in by build.py from huygens-release-data.json:
  // { release_utc, speed_m_s, spin_rpm, mass_kg, getaway_utc, facts: [{ id, text, source }] }
  const DATA = /*HUYGENS_RELEASE_DATA*/null;
  if (!DATA) return;
  const RELEASE = utcToEt(DATA.release_utc);
  const SPEED = DATA.speed_m_s, SPIN = DATA.spin_rpm * 2 * Math.PI / 60;   // m/s, rad/s
  const LEAD = 8;              // s of mission time shown before the release
  const REAL = 16;             // screen s that run in real time
  const WARP = 30;             // how much faster the clock runs after that
  const RAMP = 6;              // screen s to reach it
  const PULL = 26;             // screen s when the camera starts to pull back
  const END = 59;              // screen s when it closes by itself
  const SPIN_MAX = 2.4;        // rad/s, the most the drawn spin turns, so the sped-up clock does not strobe it
  const FAR_M = 11;            // m from the probe the camera ends
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const SOURCES = [...new Set(DATA.facts.map(f => f.source))].map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(new URL(u).hostname.replace(/^www\./, ""))}</a>`).join(" · ");
  // the near part, in mission seconds from the release: when, how long, the line, a class, the chord under it
  const NEAR = [
    [-7.8, 4.2, `<b>December 25, 2004 · 02:00 UTC</b>Seven years after leaving Earth together, Cassini lets go of Huygens.`, "", [0, 2, 4]],
    [-3.6, 3.8, `Ten seconds before, Cassini's thrusters are switched off, so nothing nudges the probe on its way out.`, "", null],
    [0.2, 4.5, `Pyrotechnic devices fire, and springs push the probe out on rollers. The whole release takes 0.15 seconds.`, "", [0, 2, 4, 7]],
    [4.8, 7, `It leaves at ${Math.round(SPEED * 100)} centimeters a second, spinning ${DATA.spin_rpm} times a minute so it holds steady all the way to Titan.`, "", null],
    [60, 999, `A minute later Cassini's thrusters wake again.`, "", null],
  ];
  // the far part, in screen seconds: when, how long, the line, a class, the chord
  const FAR_CAPS = [
    [PULL + 1, 7, `<b>${DATA.mass_kg} kg · 20 days to Titan</b>Huygens sleeps now. A timer wakes it about five hours before it reaches Titan's air.`, "", [1, 3, 5]],
    [PULL + 8, 7, `Three days later Cassini fires its engine to swerve aside, so it can pass Titan 60,000 km away and listen.`, "", [0, 3, 5]],
    [PULL + 15, 7, `No one saw it live. Cassini recorded the release, then turned to Earth: the news took 1 hour 8 minutes to arrive.`, "", [2, 4, 7]],
    [PULL + 22, 99, `<b>Next · January 14, 2005</b>Huygens falls through Titan's haze and lands.<div class="btns"><button type="button" data-hr="stay">Stay with Huygens</button><button type="button" data-hr="landing">Watch the landing</button><button type="button" data-hr="back">Back to Cassini</button></div><small>Sources: ${SOURCES}</small>`, "big", [0, 2, 4, 7, 9]],
  ];

  let H = null;   // the running cutscene
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const ease = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
  // a soft glow sprite (the shared one, when cutscene.html has it)
  let glowTex = null;
  function glowTexture() {
    if (CS.glowTexture) return CS.glowTexture();
    if (glowTex) return glowTex;
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d"), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.25, "rgba(255,255,255,.5)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return glowTex = new THREE.CanvasTexture(c);
  }
  function sprite(color, size) {
    if (CS.sprite) return CS.sprite(color, size);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), color, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
    s.scale.setScalar(size); s.layers.set(1);
    return s;
  }

  // ---------- Huygens on its own, from the release until it reaches Titan's air ----------
  // After the release the probe is a craft of its own: the Huygens part of NASA's model, cloned, with Cassini's
  // model's other parts hidden. Where it is: for its first half hour, ESA's numbers (straight out from its mounting at
  // 0.35 m/s), fading over the next half hour into the probe's own track (data/huygens.json, NAIF's reconstructed
  // SPK, whose samples are only good to 10 m); without that track, ESA's numbers until Cassini's getaway burn, after
  // which the two part ways and the probe is left to the marker. How it is turned: spin-stabilized, so its axis
  // keeps the direction it left in, turning 7.5 times a minute about it
  const GETAWAY = utcToEt(DATA.getaway_utc);
  const OWN = 1800;            // s from the release on ESA's numbers alone, then as long again fading into the track
  let co = null;               // the probe on its own (null until NASA's model has loaded)
  const isProbe = o => { for (; o; o = o.parent) if (/_h$/.test(o.name)) return true; return false; };
  // Cassini's turn at et in the scene, as the viewer works it out (the reconstructed attitude, else the dish on Earth)
  function cassiniTurn(et) {
    const qb = att && attitudeAt(att, et), q = new THREE.Quaternion();
    if (qb) {
      const R = q2rows(qb), bx = toScene(R[0], new THREE.Vector3()), by = toScene(R[1], new THREE.Vector3()), bz = toScene(R[2], new THREE.Vector3());
      q.setFromRotationMatrix(new THREE.Matrix4().makeBasis(bx, by.negate(), bz.negate()));
    } else {
      const o = new THREE.Object3D();
      o.lookAt(toScene(sub(positionAt(tracks.EARTH, et, v3()), positionAt(tracks.CASSINI, et, v3()), v3()), new THREE.Vector3()));
      q.copy(o.quaternion);
    }
    return { q, real: !!qb };
  }
  const fromScene = v => [v.x * E[0][0] + v.y * E[1][0] + v.z * E[2][0], v.x * E[0][1] + v.y * E[1][1] + v.z * E[2][1], v.x * E[0][2] + v.y * E[1][2] + v.z * E[2][2]];
  // the probe alone: a clone of NASA's model with everything but the probe hidden, framed like the model in Cassini's
  // group (a part that holds the probe stays, drawn with nothing, so the probe under it still shows)
  const none = new THREE.MeshBasicMaterial({ visible: false });
  const holds = o => { let h = false; o.traverse(c => { if (c !== o && /_h$/.test(c.name)) h = true; }); return h; };
  function probeClone(m) {
    const model = m.clone();
    model.traverse(o => { o.layers.set(1); if (isProbe(o)) o.visible = true; else if (o.isMesh) { if (holds(o)) o.material = none; else o.visible = false; } });
    return model;
  }
  function coastSetup() {
    if (co) {
      // the turn at the release, once the attitude that covers it has loaded
      if (!co.real && att && tracks.CASSINI) { const t = cassiniTurn(RELEASE); if (t.real) coastAim(t); }
      return co;
    }
    const m = window.cassiniModel;
    if (!m || !cassiniProbe.length || !tracks.CASSINI || !tracks.EARTH) return null;
    // the probe's centre and the way it leaves (straight out from the bus's axis), in the Cassini group's frame (metres)
    const saved = [cassini.position.clone(), cassini.quaternion.clone(), cassini.scale.clone()];
    cassini.position.set(0, 0, 0); cassini.quaternion.identity(); cassini.scale.setScalar(1); cassini.updateMatrixWorld(true);
    const box = objs => { const b = new THREE.Box3(); objs.forEach(o => b.expandByObject(o)); return b.getCenter(new THREE.Vector3()); };
    // the bus's axis runs through the dish's centre along the group's +Z (the viewer turns the model so the dish faces
    // +Z); the probe leaves straight out from it
    const dish = m.getObjectByName("dish"), up = new THREE.Vector3(0, 0, 1);
    const p0 = box(cassiniProbe), hub = dish ? box([dish]) : new THREE.Vector3();
    const axis = p0.clone().sub(hub); axis.addScaledVector(up, -axis.dot(up)).normalize();
    cassini.position.copy(saved[0]); cassini.quaternion.copy(saved[1]); cassini.scale.copy(saved[2]); cassini.updateMatrixWorld(true);
    const group = new THREE.Group(), model = probeClone(m);
    const beacon = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), color: 0xffd7a0, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
    beacon.layers.set(1); beacon.position.copy(p0);
    group.add(model, beacon); group.visible = false;
    scene.add(group);
    co = { group, beacon, p0, axis, up, spin: null };
    coastAim(cassiniTurn(RELEASE));
    return co;
  }
  // the turn Cassini had at the release fixes the probe's axis in space, and where its centre sat
  function coastAim(t) {
    co.q0 = t.q; co.real = t.real;
    co.axisS = co.axis.clone().applyQuaternion(t.q);
    co.axisJ = fromScene(co.axisS);
    co.p0J = fromScene(co.p0.clone().applyQuaternion(t.q)).map(x => x / 1000);
  }
  // ESA's numbers: Cassini's position, plus where the probe sat on it, plus 0.35 m/s straight out
  function ownPlace(et, out) {
    positionAt(tracks.CASSINI, et, out);
    const k = (et - RELEASE) * SPEED / 1000;
    for (let i = 0; i < 3; i++) out[i] += co.p0J[i] + co.axisJ[i] * k;
    return out;
  }
  const lastEt = () => probe ? Math.min(probe.events.entry_interface, probe.track.end) : GETAWAY;
  window.studyCoast = {
    // with no track of its own, the probe is placed only while ESA's numbers hold
    active: et => et >= RELEASE && et < GETAWAY && !!coastSetup(),
    modelShown: et => et >= RELEASE && et < lastEt() && !!coastSetup(),
    // the model, after the viewer has placed the probe's marker
    draw: () => drawCoast(),
    // a fresh copy of the probe for another scene to place itself (the landing): a group framed like Cassini's, in
    // metres, with the probe's centre p0 and the axis it left along (outward, the heat shield's side); null until
    // NASA's model has loaded
    probeModel() {
      if (!coastSetup()) return null;
      const group = new THREE.Group(); group.add(probeClone(window.cassiniModel));
      return { group, p0: co.p0.clone(), axis: co.axis.clone() };
    },
    place(et, out) {
      if (et < RELEASE || et >= lastEt() || !coastSetup() || !tracks.CASSINI) return;
      if (probe && et > RELEASE + 2 * OWN) return;
      const own = ownPlace(et, v3()), w = probe ? ease((et - RELEASE - OWN) / OWN) : 0;
      for (let i = 0; i < 3; i++) out[i] = own[i] * (1 - w) + out[i] * w;
    },
  };
  // the model follows the marker each frame, after the viewer has placed Cassini
  const qSpin = new THREE.Quaternion();
  function drawCoast() {
    if (!co || !probeObj) return;
    const et = state.et, on = studyCoast.modelShown(et) && !!pos.HUYGENS;
    co.group.visible = on;
    if (!on) return;
    // spinning about its axis, which stays fixed in space; the cutscene may draw the spin slower
    const ang = co.spin !== null ? co.spin : (et - RELEASE) * SPIN;
    co.group.quaternion.copy(qSpin.setFromAxisAngle(co.axisS, ang)).multiply(co.q0);
    // true size up close; far off it is enlarged like Cassini so it stays visible (the cutscene keeps it true)
    const d = camera.position.distanceTo(probeObj.position), s = H ? 1e-6 : Math.max(1e-6, d * 0.0012);
    co.group.scale.setScalar(s);
    co.group.position.copy(co.p0).applyQuaternion(co.group.quaternion).multiplyScalar(-s).add(probeObj.position);
    // a faint warm point on it, a few pixels wide however far the camera is
    co.beacon.scale.setScalar(0.012 * d / s);
    co.beacon.material.opacity = (H ? 0.85 : 0.7) * clamp01((d - 2e-4) / 1e-3);
  }
  window.studyCloseObjects = () => co && co.group.visible ? [co.group] : [];

  // ---------- the cutscene's small glows: Cassini's own point for the far view, the thrusters' puffs ----------
  function addEffects() {
    const fx = { beacon: sprite(0xcfe2ff, 1), puffs: [] };
    // the hydrazine thrusters: four clusters at the ends of the booms at the base (the finale's placement, from NASA's
    // model; model axes become the group's as (-x, z, y)), each puff firing aft along the group's -Z
    for (const sx of [1, -1]) for (const sz of [1, -1]) {
      const p = sprite(0xeef4ff, 0.5); p.position.set(-sx * 1.236, sz * 1.585, -2.6); fx.puffs.push(p);
    }
    [fx.beacon, ...fx.puffs].forEach(o => cassini.add(o));
    return fx;
  }
  function removeEffects(fx) { if (fx) [fx.beacon, ...fx.puffs].forEach(o => cassini.remove(o)); }

  // ---------- the clock: screen seconds T -> mission seconds from the release ----------
  // real time for REAL seconds, then a smooth ramp up to WARP times faster
  function missionAt(T) {
    if (T <= REAL) return T - LEAD;
    const u = T - REAL, r = Math.min(u, RAMP);
    // the ramp's rate is 1 + (WARP - 1) * ease(u / RAMP); its integral, in closed form for the smoothstep
    const x = r / RAMP, ramp = r + (WARP - 1) * RAMP * (x * x * x - x * x * x * x / 2);
    return REAL - LEAD + ramp + Math.max(0, u - RAMP) * WARP;
  }
  const rateAt = T => T <= REAL ? 1 : 1 + (WARP - 1) * ease((T - REAL) / RAMP);
  const fmtClock = s => { const a = Math.abs(Math.round(s)), m = Math.floor(a / 60), ss = String(a % 60).padStart(2, "0"); return `${s < 0 ? "T−" : "T+"}${m}:${ss}`; };


  function play() {
    if (H || CS.active || !tracks.CASSINI) return;
    if (!CS.begin("huygens")) return;
    H = { t0: performance.now(), phase: "out", T: 0, s: -LEAD, shownN: [], shownF: [], playing: state.playing, speed: state.speed,
      spin: 0, lastFrame: performance.now(), fx: null, how: "back" };
    fadeTo(black, 1, 1.4);
  }
  // how it ends: "stay" leaves the view on Huygens, paused, to look around it; "back" returns to Cassini and plays on
  // as before; "landing" jumps to Huygens entering Titan's air. Skip and Escape (cutscene.html) are "back"
  function finish(how) { if (H) H.how = how; CS.end("huygens"); }
  function cleanUp() {
    const h = H; H = null;
    if (!h) return;
    removeEffects(h.fx);
    if (co) co.spin = null;
    caps.textContent = ""; [read, note, hint].forEach(e => e.classList.remove("on"));
    Object.values(tags).forEach(e => e.classList.remove("on"));
    // the mission carries on from where the cutscene left it
    setTime(RELEASE + Math.max(60, h.s));
    const entry = (encounters || []).find(x => x.kind === "milestone" && /^Huygens enters/.test(x.label));
    // the landing's own cutscene when it is there (huygens-landing.html), once this one has fully ended
    if (h.how === "landing" && window.cassiniHuygensLanding) setTimeout(() => cassiniHuygensLanding.play(), 0);
    else if (h.how === "landing" && entry && typeof jump === "function") jump(entry);
    else if (h.how === "stay" && studyCoast.modelShown(state.et)) {
      setPlaying(false);
      // once cutscene.html has put the interface back (it may turn follow on again)
      setTimeout(() => { if (state.follow) setFollow(false); setFocus("HUYGENS"); }, 0);
      return { follow: false };
    } else { setFocus("CASSINI"); if (h.playing) { setSpeed(h.speed); setPlaying(true); } }
  }
  caps.addEventListener("click", e => {
    const b = e.target.closest("[data-hr]"); if (!b) return;
    e.stopPropagation(); finish(b.dataset.hr);
  });

  // the cutscene's clock, before the viewer places the bodies
  function frame() {
    const now = performance.now();
    if (H.phase === "out" && now - H.t0 >= 1600) {
      // behind the black: a few seconds before the release, on Cassini
      H.phase = "run"; H.runAt = now;
      setFocus("CASSINI", 4e-5); markerPts.visible = false;
      fadeTo(black, 0, 2.5);
      note.classList.add("on"); read.classList.add("on"); hint.classList.add("on");
    }
    if (H.phase !== "run") return;
    const T = (now - H.runAt) / 1000;
    H.T = T; H.s = missionAt(T);
    if (!H.fx) H.fx = addEffects();
    if (T > 7) hint.classList.remove("on");
    if (T > PULL) note.classList.remove("on");
    runCaptions(NEAR, H.s, H.shownN);
    if (T > PULL) { CS.dropAll(H.shownN); runCaptions(FAR_CAPS, T, H.shownF); }
    if (H.s >= 0 && !H.chimed) { H.chimed = true; sound("chord", [0, 4, 7, 11]); }
    if (T > END - 2 && !H.closing) { H.closing = true; fadeTo(black, 1, 2); }
    if (T > END) { finish("stay"); return; }
    state.et = RELEASE + H.s;
  }
  // where the probe is during the cutscene, in the scene: ESA's numbers (as the viewer draws it for its first half hour)
  const toW = (local, out) => out.copy(local).applyQuaternion(cassini.quaternion).multiplyScalar(1e-6).add(cassini.position);
  function probeScene(et, out) {
    if (!co) return toW(new THREE.Vector3(-1.5, 0, -1.2), out);
    toScene(sub(ownPlace(et, v3()), positionAt(tracks.CASSINI, et, v3()), v3()), out).multiplyScalar(1 / KM);
    return out.add(cassini.position);
  }
  // after the viewer has turned Cassini: true sizes, the drawn spin, the thrusters' puffs and the readout
  function attitude() {
    if (H.phase !== "run") return;
    const now = performance.now(), dt = Math.min(0.1, (now - H.lastFrame) / 1000); H.lastFrame = now;
    // true size throughout: Cassini is never enlarged here, so the gap between the two is the real one
    cassini.scale.setScalar(1e-6);
    // the drawn spin: the real rate, capped once the clock speeds up
    if (H.s > 0) H.spin += dt * Math.min(SPIN * rateAt(H.T), Math.max(SPIN, SPIN_MAX));
    if (co) co.spin = H.spin;
    const s = H.s, out = Math.max(0, s) * SPEED;   // metres from where it sat
    const fx = H.fx;
    if (fx) {
      // Cassini's own faint point for the far view
      const camD = camera.position.distanceTo(cassini.position);
      fx.beacon.scale.setScalar(0.012 * camD / cassini.scale.x);
      fx.beacon.material.opacity = 0.7 * clamp01((H.T - PULL) / 4);
      // a minute after the release the thrusters come back on: a few short puffs as they settle Cassini
      const w = s - 60;
      fx.puffs.forEach((p, i) => {
        const on = w > 0 && w < 40 && Math.sin(w * 1.3 + i * 2.1) > 0.82;
        p.material.opacity = on ? 0.55 + 0.3 * Math.random() : 0;
      });
    }
    const rate = rateAt(H.T);
    read.innerHTML = s < 0 ? `Release in <i>${Math.ceil(-s)} s</i> · Thrusters <i>${s > -10 ? "off" : "on"}</i>`
      : `${fmtClock(s)} · Huygens <i>${out < 10 ? out.toFixed(1) : Math.round(out)} m</i> away · ${SPEED} m/s · Spin <i>${DATA.spin_rpm} rpm</i>${rate > 1.05 ? ` · Time <i>×${Math.round(rate)}</i>` : ""}`;
  }
  // the camera: beside Cassini with its dish up, widening as the probe drifts off; then beside the probe, looking
  // toward Titan. A drag turns it, the wheel zooms
  const vB2 = new THREE.Vector3(), pW = new THREE.Vector3();
  function cameraAt() {
    if (H.phase !== "run") return;
    const T = H.T;
    probeScene(state.et, pW);
    const up = co ? co.up : new THREE.Vector3(0, 0, 1), upW = up.clone().applyQuaternion(cassini.quaternion).normalize();
    const axisW = co ? co.axisS.clone() : new THREE.Vector3(-1, 0, 0).applyQuaternion(cassini.quaternion);
    const gap = pW.distanceTo(cassini.position) / 1e-6;   // metres between the two
    // near: aim at the middle of the two; stand off to the side of the probe's path, a little ahead of it and above
    const side = new THREE.Vector3().crossVectors(upW, axisW).normalize();
    const yaw = -0.35 + 0.01 * T + look.yaw;
    const dirN = side.clone().multiplyScalar(Math.cos(yaw)).addScaledVector(axisW, Math.sin(yaw) + 0.25).addScaledVector(upW, 0.28 + look.pitch).normalize();
    const tgtNear = cassini.position.clone().lerp(pW, 0.5);
    // an upright phone sees less across, so the camera stands further back and looks less far off to the side
    const fit = Math.max(1, 0.9 / camera.aspect), aside = 0.5 * Math.min(1, camera.aspect);
    const dN = (15 + 1.1 * gap) * look.zoom * fit;
    const camNear = tgtNear.clone().addScaledVector(dirN, dN * 1e-6);
    let cam = camNear, lookDir = tgtNear.clone().sub(camNear).normalize();
    // then over to the probe: close beside it, a little behind and above, looking past it toward Titan, as it heads off.
    // One move that keeps the probe in frame: the view first settles on the probe (a short turn), then the camera swings
    // round it and closes in, and only at the end does the view lean toward Titan
    const k = ease((T - PULL) / 10);
    const tW = relScene("TITAN", vB2).sub(cassini.position).normalize();
    if (k > 0) {
      const sideW = new THREE.Vector3().crossVectors(upW, tW).normalize();
      const dirF = sideW.clone().multiplyScalar(0.85).addScaledVector(tW, -0.45).addScaledVector(upW, 0.25 + look.pitch).normalize().applyAxisAngle(upW, look.yaw);
      const tgt = tgtNear.clone().lerp(pW, ease((T - PULL) / 3));
      const q = new THREE.Quaternion().setFromUnitVectors(dirN, dirF), dir = dirN.clone().applyQuaternion(new THREE.Quaternion().slerp(q, k));
      const dFar = FAR_M * look.zoom * fit;
      cam = tgt.clone().addScaledVector(dir, Math.exp(Math.log(dN) * (1 - k) + Math.log(dFar) * k) * 1e-6);
      lookDir = dir.clone().negate().addScaledVector(tW, aside * ease((T - PULL - 4) / 8)).normalize();
    }
    camera.position.copy(cam);
    camera.up.copy(upW);
    camera.lookAt(cam.clone().add(lookDir));
    // the tags, once the view has pulled back
    const showTags = T > PULL;
    const place = (el, w, extra) => {
      const v = w.clone().project(camera), on = showTags && v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05;
      el.classList.toggle("on", on);
      if (on) el.style.transform = `translate(${(v.x + 1) / 2 * innerWidth + 8}px, ${(1 - v.y) / 2 * innerHeight - 5}px)`;
      if (extra !== undefined) el.innerHTML = extra;
    };
    camera.updateMatrixWorld();
    place(tags.cassini, cassini.position);
    place(tags.probe, pW);
    const titanKm = len(sub(pos.TITAN, pos.CASSINI, v3()));
    place(tags.titan, cassini.position.clone().addScaledVector(tW, 50), `Titan <small>${(titanKm / 1e6).toFixed(1)} million km</small>`);
  }

  CS.register("huygens", { root, frame, attitude, camera: cameraAt, onEnd: cleanUp });
  // playback crossing the release plays it; so does ?huygens
  const inData = () => RELEASE >= coverage[0] && RELEASE <= coverage[1];
  CS.at(RELEASE, play, inData);
  CS.fromUrl("huygens", () => RELEASE - 600, play, inData);
  window.cassiniHuygensRelease = { play, skip: () => finish("back"), get running() { return !!H; }, get facts() { return DATA.facts; } };
})();
</script>
