<!-- Huygens lets go: a short cutscene for whoever plays through Christmas Day 2004, and the probe as a craft of its own
     afterwards. build.py splices the style into the head, the section into #app and the script after the finale's
     (its CUTSCENES list); begin and end, Skip and Escape, fades, captions, looking around, the trigger and ?huygens
     come from the shared cutscene.html.

     When playback crosses the release (2004-12-25 02:00 UTC) or the page is opened with ?huygens, the interface fades
     away and the view settles beside Cassini a few seconds before it. Where Cassini is and how it is turned are the
     viewer's own (the real trajectory and attitude). The probe follows ESA's numbers, not keyframes:
       - Cassini's thrusters are held off from 10 s before the release to about 60 s after, so nothing moves until the
         release, and a few soft puffs show them coming back
       - the Spin/Eject Device pushes the probe straight out from its mounting at 0.35 m/s, spinning 7.5 rpm about that
         same axis; its distance and turn follow from those two numbers and the clock
       - the first seconds run in real time; then the clock speeds up (shown on screen) and the spin drawn is capped so
         it does not strobe; both craft are drawn at their true size, so the gap between them is the real one
     The camera stands beside Cassini, dish up, and widens as the probe drifts off, then flies over to the probe and
     looks past it toward Titan, with a tag on each. It holds still against the stars (the frame Cassini had a few
     seconds before the release), so the turn the push leaves Cassini with, which is in its attitude record, is seen as
     Cassini turning and not as the sky sweeping past. Captions are ESA's facts
     (huygens-release-data.json, written in by build.py, each with its source), and one line for that turn. The last
     card offers to stay with Huygens (the same view of the probe, paused, to look around it), the landing (a jump to
     Huygens entering Titan's air) or Cassini; left alone it stays with Huygens.
     Looking around (a drag, the wheel) is for the shots that hold: it is let go through the fades and the fly-over.
     Skip, Escape and the last card's buttons leave through black. A quiet low tone lies under it all, with a chord for
     the release and one for most cards.

     After the release the probe is its own model at any time, not only after the cutscene (window.studyCoast, which
     the viewer calls): see "Huygens on its own" below. -->
<style>
#hrel .hr-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.72) 0, rgba(0,0,0,.45) 22%, rgba(0,0,0,0) 46%); }
/* tags on Cassini, the probe and Titan once the view pulls back */
#hrel .hr-tag { position: absolute; left: 0; top: 0; font: 10.5px/1 var(--hudf); letter-spacing: .1em; text-transform: uppercase; color: rgba(232,236,242,.7);
  white-space: nowrap; opacity: 0; transition: opacity 1s ease; text-shadow: 0 1px 6px rgba(0,0,0,.9); }
#hrel .hr-tag::before { content: ""; display: inline-block; width: 14px; height: 1px; margin: 0 6px 3px 0; background: currentColor; vertical-align: middle; }
#hrel .hr-tag.on { opacity: 1; }
#hrel .hr-tag small { font-size: 9.5px; color: rgba(232,236,242,.45); letter-spacing: .06em; text-transform: none; }
/* the last card's choices and sources */
#hrel .cs-cap .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
#hrel .cs-cap button { all: unset; pointer-events: auto; padding: 6px 15px; border-radius: 13px; border: 1px solid var(--q-line); background: rgba(16,17,20,.55);
  color: rgba(232,236,242,.8); font-size: 12px; cursor: pointer; }
#hrel .cs-cap button:hover { color: var(--q-text); border-color: rgba(232,236,242,.35); }
#hrel .cs-cap small { font-size: 10.5px; color: rgba(232,236,242,.4); }
#hrel .cs-cap small a { color: inherit; pointer-events: auto; }
/* leaving (the closing fade, Skip, a choice on the last card): everything on top goes with the picture */
#hrel.hr-out > :not(.cs-black):not(.hr-shade) { opacity: 0 !important; transition: opacity var(--hr-out, .45s) ease !important; }
body.phone #hrel .cs-read { font-size: 9.5px; bottom: 9vh; white-space: normal; width: calc(100vw - 32px); text-align: center; line-height: 1.6; }
body.phone #hrel .cs-note { bottom: auto; top: 40px; max-width: calc(100vw - 32px); }
</style>

<section id="hrel" class="cs-root" hidden aria-live="polite">
  <div class="hr-shade"></div>
  <div class="cs-black"></div>
  <div class="hr-tag" data-tag="probe">Huygens</div>
  <div class="hr-tag" data-tag="cassini">Cassini</div>
  <div class="hr-tag" data-tag="titan">Titan</div>
  <div class="cs-caps"></div>
  <div class="cs-read" aria-hidden="true"></div>
  <div class="cs-note">Cassini's path and pointing are its real trajectory and attitude. The release follows ESA's numbers; after the first seconds the clock runs faster.</div>
  <div class="cs-hint">Drag to look around</div>
  <button class="cs-skip" type="button">Skip ▸</button>
</section>

<script>
// ---------- Huygens lets go: the probe's release from Cassini, 2004-12-25 02:00 UTC, and the probe on its own after ----------
(function () {
  const root = document.getElementById("hrel"), black = root.querySelector(".cs-black"), caps = root.querySelector(".cs-caps");
  const read = root.querySelector(".cs-read"), note = root.querySelector(".cs-note"), hint = root.querySelector(".cs-hint");
  const tags = {}; root.querySelectorAll("[data-tag]").forEach(el => { tags[el.dataset.tag] = el; });
  // what every cutscene shares (cutscene.html)
  const CS = cassiniCutscene, { fadeTo, sound, look } = CS, runCaptions = (list, t, shown) => CS.runCaptions(caps, list, t, shown);
  // ESA's numbers and facts, written in by build.py from huygens-release-data.json:
  // { release_utc, speed_m_s, spin_rpm, mass_kg, getaway_utc, facts: [{ id, text, source }] }
  const DATA = /*HUYGENS_RELEASE_DATA*/null;
  if (!DATA) return;
  const RELEASE = utcToEt(DATA.release_utc);
  const SPEED = DATA.speed_m_s, SPIN = DATA.spin_rpm * 2 * Math.PI / 60;   // m/s, rad/s
  const LEAD = 8;              // s of mission time shown before the release
  const REAL = 15;             // screen s that run in real time
  const WARP = 30;             // how much faster the clock runs after that
  const RAMP = 5;              // screen s to reach it
  const PULL = 23;             // screen s when the camera sets off for the probe
  const MOVE = 9;              // screen s that fly-over takes
  const END = 46;              // screen s when it closes by itself
  const CLOSE = 1.6;           // screen s of its closing fade
  const LEAVE = 0.45;          // screen s of the fade when it is left early (Skip, a choice on the last card)
  const BED = 0.2;             // the quiet tone under it (cassiniSound.drone's level)
  const SPIN_MAX = 2.4;        // rad/s, the most the drawn spin turns, so the sped-up clock does not strobe it
  const FAR_M = 11;            // m from the probe the camera ends
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const SOURCES = [...new Set(DATA.facts.map(f => f.source))].map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(new URL(u).hostname.replace(/^www\./, ""))}</a>`).join(" · ");
  // the lines, in screen seconds: when, how long, the line, a class, the chord under it. The release is at LEAD and
  // has its own chord; the line before it is gone by then, and each line stays long enough to read (about three words
  // a second). The near part first
  const NEAR = [
    [0.2, 3.8, `<b>December 25, 2004 · 02:00 UTC</b>Seven years after leaving Earth together, Cassini lets go of Huygens.`, "", [0, 2, 4]],
    [4.3, 2.9, `Cassini's thrusters are off, so nothing nudges the probe on its way out.`, "", null],
    [LEAD + 0.2, 4.3, `Pyrotechnic devices fire, and springs push the probe out on rollers. The whole release takes 0.15 seconds.`, "", null],
    [LEAD + 4.7, 5.6, `It leaves at ${Math.round(SPEED * 100)} centimeters a second, spinning ${DATA.spin_rpm} times a minute so it holds steady all the way to Titan.`, "", [1, 3, 5]],
    // what the attitude record shows next (only said when it does: recoil below)
    [LEAD + 10.6, 999, `The push leaves Cassini turning slowly the other way, until its thrusters wake and steady it.`, "", [0, 3, 5], "recoil"],
  ];
  // the far part
  const FAR_CAPS = [
    [PULL + 1, 6.3, `<b>${DATA.mass_kg} kg · 20 days to Titan</b>Huygens sleeps now. A timer wakes it about five hours before it reaches Titan's air.`, "", [1, 3, 5]],
    [PULL + 7.6, 6.1, `No one saw it live. Cassini recorded the release, then turned to Earth: the news took 1 hour 8 minutes to arrive.`, "", [2, 4, 7]],
    [PULL + 14, 99, `<b>Next · January 14, 2005</b>Huygens falls through Titan's haze and lands.<div class="btns"><button type="button" data-hr="stay">Stay with Huygens</button><button type="button" data-hr="landing">Watch the landing</button><button type="button" data-hr="back">Back to Cassini</button></div><small>Sources: ${SOURCES}</small>`, "big", [0, 2, 4, 7, 9]],
  ];

  let H = null;   // the running cutscene
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const ease = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
  const sprite = CS.sprite;   // a soft additive glow (cutscene.html)

  // ---------- Huygens on its own, from the release until it reaches Titan's air ----------
  // The probe is ESA's model of it (huygens-models.html, shared with the landing), mounted on Cassini where NASA's
  // model has it until the release, and after the release a craft of its own. Where it is then: for its first half hour, ESA's numbers (straight out from its mounting at
  // 0.35 m/s), fading over the next half hour into the probe's own track (data/huygens.json, NAIF's reconstructed
  // SPK, whose samples are only good to 10 m); without that track, ESA's numbers until Cassini's getaway burn, after
  // which the two part ways and the probe is left to the marker. How it is turned: spin-stabilized, so its axis
  // keeps the direction it left in, turning 7.5 times a minute about it
  const GETAWAY = utcToEt(DATA.getaway_utc);
  const OWN = 1800;            // s from the release on ESA's numbers alone, then as long again fading into the track
  let co = null;               // the probe on its own (null until NASA's model has loaded)
  // Cassini's turn at et in the scene, as the viewer works it out (the reconstructed attitude, else the dish on Earth)
  function cassiniTurn(et) {
    const qb = att && attitudeAt(att, et), q = new THREE.Quaternion();
    if (qb) {
      const R = q2rows(qb), bx = toScene(R[0], new THREE.Vector3()), by = toScene(R[1], new THREE.Vector3()), bz = toScene(R[2], new THREE.Vector3());
      q.setFromRotationMatrix(new THREE.Matrix4().makeBasis(bx, by.negate(), bz.negate()));
    } else {
      const o = new THREE.Object3D();
      o.lookAt(toScene(sub(positionAt(tracks.EARTH, et, v3()), positionAt(tracks.CASSINI, et, v3()), v3()), new THREE.Vector3()));
      q.copy(o.quaternion);
    }
    return { q, real: !!qb };
  }
  const fromScene = v => [v.x * E[0][0] + v.y * E[1][0] + v.z * E[2][0], v.x * E[0][1] + v.y * E[1][1] + v.z * E[2][1], v.x * E[0][2] + v.y * E[1][2] + v.z * E[2][2]];
  // ESA's probe (shell and descent module, which share a frame), framed like Cassini's group: its centre on p, the heat
  // shield facing out along axis. Empty until the models have loaded; then(shell) once the shell is in
  function esaProbe(p, axis, then) {
    const outer = new THREE.Group(), inner = new THREE.Group();
    inner.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), axis);
    outer.add(inner);
    huygensModels.get("shell", sh => {
      sh.updateMatrixWorld(true);
      const c = new THREE.Box3().setFromObject(sh).getCenter(new THREE.Vector3());
      inner.position.copy(p).sub(c.applyQuaternion(inner.quaternion));
      inner.add(sh);
      if (then) then(sh);
    });
    huygensModels.get("dm", dm => inner.add(dm));
    return outer;
  }
  // NASA's own probe on Cassini goes, drawn with nothing, once ESA's is there to take its place
  const none = new THREE.MeshBasicMaterial({ visible: false });
  function coastSetup() {
    if (co) {
      // the turn at the release, once the attitude that covers it has loaded
      if (!co.real && att && tracks.CASSINI) { const t = cassiniTurn(RELEASE); if (t.real) coastAim(t); }
      return co;
    }
    const m = window.cassiniModel;
    if (!m || !cassiniProbe.length || !tracks.CASSINI || !tracks.EARTH) return null;
    // the probe's centre and the way it leaves (straight out from the bus's axis), in the Cassini group's frame (metres)
    const saved = [cassini.position.clone(), cassini.quaternion.clone(), cassini.scale.clone()];
    cassini.position.set(0, 0, 0); cassini.quaternion.identity(); cassini.scale.setScalar(1); cassini.updateMatrixWorld(true);
    const box = objs => { const b = new THREE.Box3(); objs.forEach(o => b.expandByObject(o)); return b.getCenter(new THREE.Vector3()); };
    // the bus's axis runs through the dish's centre along the group's +Z (the viewer turns the model so the dish faces
    // +Z); the probe leaves straight out from it
    const dish = m.getObjectByName("dish"), up = new THREE.Vector3(0, 0, 1);
    const p0 = box(cassiniProbe), hub = dish ? box([dish]) : new THREE.Vector3();
    const axis = p0.clone().sub(hub); axis.addScaledVector(up, -axis.dot(up)).normalize();
    cassini.position.copy(saved[0]); cassini.quaternion.copy(saved[1]); cassini.scale.copy(saved[2]); cassini.updateMatrixWorld(true);
    // on Cassini until the release
    const mounted = esaProbe(p0, axis, () => cassiniProbe.forEach(o => o.traverse(c => { if (c.isMesh) c.material = none; })));
    mounted.visible = state.et < RELEASE;
    cassini.add(mounted);
    // on its own after
    const group = new THREE.Group(), beacon = sprite(0xffd7a0, 1);
    beacon.position.copy(p0);
    group.add(esaProbe(p0, axis), beacon); group.visible = false;
    scene.add(group);
    co = { group, beacon, mounted, p0, axis, up, spin: null };
    coastAim(cassiniTurn(RELEASE));
    return co;
  }
  // the turn Cassini had at the release fixes the probe's axis in space, and where its centre sat
  function coastAim(t) {
    co.q0 = t.q; co.real = t.real;
    co.axisS = co.axis.clone().applyQuaternion(t.q);
    co.axisJ = fromScene(co.axisS);
    co.p0J = fromScene(co.p0.clone().applyQuaternion(t.q)).map(x => x / 1000);
    // the push that spins the probe up turns Cassini the other way (its attitude record has the turn: about the
    // probe's axis, from the instant of the release). Where the record shows it, the probe is drawn spinning against
    // it, so the two never turn the same way; recoil says the record shows it
    co.sense = 1; co.recoil = false;
    const later = t.real ? cassiniTurn(RELEASE + 60) : null;
    if (later && later.real) {
      const dq = later.q.clone().multiply(t.q.clone().invert());
      const w = new THREE.Vector3(dq.x, dq.y, dq.z).multiplyScalar(dq.w < 0 ? -1 : 1);   // sin(half the turn) along its axis
      if (w.length() > 0.05 && Math.abs(w.clone().normalize().dot(co.axisS)) > 0.5) { co.recoil = true; co.sense = w.dot(co.axisS) > 0 ? -1 : 1; }
    }
  }
  // ESA's numbers: Cassini's position, plus where the probe sat on it, plus 0.35 m/s straight out
  function ownPlace(et, out) {
    positionAt(tracks.CASSINI, et, out);
    const k = (et - RELEASE) * SPEED / 1000;
    for (let i = 0; i < 3; i++) out[i] += co.p0J[i] + co.axisJ[i] * k;
    return out;
  }
  const lastEt = () => probe ? Math.min(probe.events.entry_interface, probe.track.end) : GETAWAY;
  window.studyCoast = {
    // with no track of its own, the probe is placed only while ESA's numbers hold
    active: et => et >= RELEASE && et < GETAWAY && !!coastSetup(),
    modelShown: et => et >= RELEASE && et < lastEt() && !!coastSetup(),
    // the model, after the viewer has placed the probe's marker
    draw: () => drawCoast(),
    // a fresh copy of the probe as it left: a group framed like Cassini's, in metres, with the probe's centre p0 and
    // the axis it left along (outward, the heat shield's side); null until NASA's model (which says where) has loaded
    probeModel() {
      if (!coastSetup()) return null;
      const group = new THREE.Group(); group.add(esaProbe(co.p0, co.axis));
      return { group, p0: co.p0.clone(), axis: co.axis.clone() };
    },
    place(et, out) {
      if (et < RELEASE || et >= lastEt() || !coastSetup() || !tracks.CASSINI) return;
      if (probe && et > RELEASE + 2 * OWN) return;
      const own = ownPlace(et, v3()), w = probe ? ease((et - RELEASE - OWN) / OWN) : 0;
      for (let i = 0; i < 3; i++) out[i] = own[i] * (1 - w) + out[i] * w;
    },
  };
  // the model follows the marker each frame, after the viewer has placed Cassini
  const qSpin = new THREE.Quaternion();
  function drawCoast() {
    if (!coastSetup() || !probeObj) return;
    co.mounted.visible = state.et < RELEASE;
    const et = state.et, on = studyCoast.modelShown(et) && !!pos.HUYGENS;
    co.group.visible = on;
    if (!on) return;
    // spinning about its axis, which stays fixed in space; the cutscene may draw the spin slower
    const ang = co.sense * (co.spin !== null ? co.spin : (et - RELEASE) * SPIN);
    co.group.quaternion.copy(qSpin.setFromAxisAngle(co.axisS, ang)).multiply(co.q0);
    // true size up close; far off it is enlarged like Cassini so it stays visible (the cutscene keeps it true)
    const d = camera.position.distanceTo(probeObj.position), s = H ? 1e-6 : Math.max(1e-6, d * 0.0012);
    co.group.scale.setScalar(s);
    co.group.position.copy(co.p0).applyQuaternion(co.group.quaternion).multiplyScalar(-s).add(probeObj.position);
    // a faint warm point on it, a few pixels wide however far the camera is
    co.beacon.scale.setScalar(0.012 * d / s);
    co.beacon.material.opacity = (H ? 0.85 : 0.7) * clamp01((d - 2e-4) / 1e-3);
  }
  window.studyCloseObjects = () => co && co.group.visible ? [co.group] : [];

  // ---------- the cutscene's small glows: Cassini's own point for the far view, the thrusters' puffs ----------
  function addEffects() {
    const fx = { beacon: sprite(0xcfe2ff, 1), puffs: [] };
    // the hydrazine thrusters: four clusters at the ends of the booms at the base (the finale's placement, from NASA's
    // model; model axes become the group's as (-x, z, y)), each puff firing aft along the group's -Z
    for (const sx of [1, -1]) for (const sz of [1, -1]) {
      const p = sprite(0xeef4ff, 0.5); p.position.set(-sx * 1.236, sz * 1.585, -2.6); fx.puffs.push(p);
    }
    [fx.beacon, ...fx.puffs].forEach(o => cassini.add(o));
    return fx;
  }
  function removeEffects(fx) { if (fx) [fx.beacon, ...fx.puffs].forEach(o => cassini.remove(o)); }

  // ---------- the clock: screen seconds T -> mission seconds from the release ----------
  // real time for REAL seconds, then a smooth ramp up to WARP times faster
  function missionAt(T) {
    if (T <= REAL) return T - LEAD;
    const u = T - REAL, r = Math.min(u, RAMP);
    // the ramp's rate is 1 + (WARP - 1) * ease(u / RAMP); its integral, in closed form for the smoothstep
    const x = r / RAMP, ramp = r + (WARP - 1) * RAMP * (x * x * x - x * x * x * x / 2);
    return REAL - LEAD + ramp + Math.max(0, u - RAMP) * WARP;
  }
  const rateAt = T => T <= REAL ? 1 : 1 + (WARP - 1) * ease((T - REAL) / RAMP);
  const fmtClock = s => { const a = Math.abs(Math.round(s)), m = Math.floor(a / 60), ss = String(a % 60).padStart(2, "0"); return `${s < 0 ? "T−" : "T+"}${m}:${ss}`; };


  const gl = document.getElementById("gl"), skip = root.querySelector(".cs-skip");
  function play() {
    if (H || CS.active || !tracks.CASSINI) return;
    // the view as it is, to hold through the fade to black (beginning lets the follow camera go, which would turn it)
    const hold = camera.quaternion.clone();
    if (!CS.begin("huygens")) return;
    coastSetup();
    H = { t0: performance.now(), phase: "out", T: 0, s: -LEAD, shownN: [], shownF: [], playing: state.playing, speed: state.speed,
      spin: 0, lastFrame: performance.now(), fx: null, how: "back", hold,
      near: NEAR.filter(l => l[5] !== "recoil" || (co && co.recoil)) };
    root.classList.remove("hr-out"); root.style.removeProperty("--hr-out");
    fadeTo(black, 1, 1.4);
  }
  // how it ends: "stay" leaves the view on Huygens, paused, to look around it; "back" returns to Cassini and plays on
  // as before; "landing" jumps to Huygens entering Titan's air. Skip and Escape (cutscene.html) are "back"
  function finish(how) { if (H) H.how = how; CS.end("huygens"); }
  // leaving early (Skip, a choice on the last card): a short fade to black first, everything on top going with it
  function leave(how) {
    if (!H || H.leaving) return;
    if (H.phase !== "run" || H.closing) { finish(how); return; }
    H.leaving = how; H.leaveAt = performance.now(); H.how = how;
    root.style.setProperty("--hr-out", `${LEAVE}s`); root.classList.add("hr-out");
    fadeTo(black, 1, LEAVE); sound("drone", 0);
  }
  function cleanUp() {
    const h = H; H = null;
    if (!h) return;
    removeEffects(h.fx);
    if (co) co.spin = null;
    sound("drone", 0);
    CS.look.wheel = true; gl.style.cursor = "";
    // ended with the picture still up (Escape, which cutscene.html ends at once): to black in one go, so the viewer's
    // own view fades in under the cover instead of jumping in, and nothing of the cutscene's lingers on top of it
    if (!(+black.style.opacity > 0.95)) { root.style.setProperty("--hr-out", "0s"); root.classList.add("hr-out"); black.style.opacity = 1; }
    caps.textContent = ""; [read, note, hint].forEach(e => e.classList.remove("on"));
    Object.values(tags).forEach(e => e.classList.remove("on"));
    // the mission carries on from where the cutscene left it
    setTime(RELEASE + Math.max(60, h.s));
    const entry = (encounters || []).find(x => x.kind === "milestone" && /^Huygens enters/.test(x.label));
    // the landing's own cutscene when it is there (huygens-landing.html), once this one has fully ended
    if (h.how === "landing" && window.cassiniHuygensLanding) setTimeout(() => cassiniHuygensLanding.play(), 0);
    else if (h.how === "landing" && entry && typeof jump === "function") jump(entry);
    else if (h.how === "stay" && studyCoast.modelShown(state.et)) {
      // paused on the probe, once cutscene.html has put the interface back (it picks playback up again if it was on),
      // from where the cutscene's camera stood, so the view carries on from the last shot
      const rel = h.rel && h.T > PULL + MOVE ? h.rel.clone() : null;
      setTimeout(() => { setPlaying(false); setFocus("HUYGENS"); if (rel && state.focus === "HUYGENS") camera.position.copy(rel); }, 0);
      return { follow: false };
    } else { setFocus("CASSINI"); if (h.playing) { setSpeed(h.speed); setPlaying(true); } }
  }
  caps.addEventListener("click", e => {
    const b = e.target.closest("[data-hr]"); if (!b) return;
    e.stopPropagation(); leave(b.dataset.hr);
  });
  // Skip leaves the same way (ahead of cutscene.html's own listener on the button, which ends it at once)
  skip.addEventListener("click", e => { if (!H) return; e.stopImmediatePropagation(); leave("back"); }, true);

  // the cutscene's clock, before the viewer places the bodies
  function frame(dt) {
    const now = performance.now();
    if (H.leaving && now - H.leaveAt >= LEAVE * 1000 + 30) { finish(H.leaving); return; }
    // looking around is for the shots that hold. Through the fades and the fly-over it is let go: a drag there would
    // turn a view that is not drawn yet, or fight the camera's own move
    const Tn = H.phase === "run" ? (now - H.runAt) / 1000 : -1;
    const held = Tn < 1.5 || (Tn > PULL - 0.5 && Tn < PULL + MOVE) || H.closing || H.leaving;
    if (held) {
      // what the viewer had turned eases back (gone at once while nothing is drawn); anything new is not taken
      const L = CS.look, k = Tn < 1.5 ? 0 : Math.exp(-(dt || 0.016) / 0.3), w = H.look || [L.yaw, L.pitch, L.zoom];
      L.yaw = w[0] * k; L.pitch = w[1] * k; L.zoom = 1 + (w[2] - 1) * k; L.drag = null;
      H.look = [L.yaw, L.pitch, L.zoom];
    } else H.look = null;
    CS.look.wheel = !held; gl.style.cursor = held ? "default" : "";
    if (H.phase === "out" && now - H.t0 >= 1600) {
      // behind the black: a few seconds before the release, on Cassini
      H.phase = "run"; H.runAt = now;
      setFocus("CASSINI", 4e-5); markerPts.visible = false;
      fadeTo(black, 0, 2.5);
      note.classList.add("on"); read.classList.add("on");
    }
    if (H.phase !== "run") return;
    const T = (now - H.runAt) / 1000;
    H.T = T; H.s = missionAt(T);
    if (!H.fx) H.fx = addEffects();
    hint.classList.toggle("on", T > 1.5 && T < 7);
    if (T > PULL) note.classList.remove("on");
    if (T <= PULL) runCaptions(H.near, T, H.shownN);
    else { CS.dropAll(H.shownN); runCaptions(FAR_CAPS, T, H.shownF); }
    if (H.s >= 0 && !H.chimed) { H.chimed = true; sound("chord", [0, 4, 7, 11]); }
    // the quiet tone under it: in with the picture, a little fuller around the release, out with the closing fade
    if (!H.leaving && !(now - H.bedAt < 200)) {
      H.bedAt = now;
      sound("drone", (BED * ease(T / 3) + 0.12 * Math.exp(-(((T - LEAD) / 3) ** 2))) * (1 - ease((T - (END - CLOSE)) / CLOSE)));
    }
    if (T > END - CLOSE && !H.closing && !H.leaving) {
      H.closing = true; fadeTo(black, 1, CLOSE);
      root.style.setProperty("--hr-out", `${CLOSE * 0.8}s`); root.classList.add("hr-out");
    }
    if (T > END) { finish("stay"); return; }
    state.et = RELEASE + H.s;
  }
  // where the probe is during the cutscene, in the scene: ESA's numbers (as the viewer draws it for its first half hour)
  const toW = (local, out) => out.copy(local).applyQuaternion(cassini.quaternion).multiplyScalar(1e-6).add(cassini.position);
  function probeScene(et, out) {
    if (!co) return toW(new THREE.Vector3(-1.5, 0, -1.2), out);
    toScene(sub(ownPlace(et, v3()), positionAt(tracks.CASSINI, et, v3()), v3()), out).multiplyScalar(1 / KM);
    return out.add(cassini.position);
  }
  // after the viewer has turned Cassini: true sizes, the drawn spin, the thrusters' puffs and the readout
  function attitude() {
    if (H.phase !== "run") return;
    const now = performance.now(), dt = Math.min(0.1, (now - H.lastFrame) / 1000); H.lastFrame = now;
    // true size throughout: Cassini is never enlarged here, so the gap between the two is the real one
    cassini.scale.setScalar(1e-6);
    // the drawn spin: the real rate, capped once the clock speeds up
    if (H.s > 0) H.spin += dt * Math.min(SPIN * rateAt(H.T), Math.max(SPIN, SPIN_MAX));
    if (co) co.spin = H.spin;
    const s = H.s, out = Math.max(0, s) * SPEED;   // metres from where it sat
    const fx = H.fx;
    if (fx) {
      // Cassini's own faint point for the far view
      const camD = camera.position.distanceTo(cassini.position);
      fx.beacon.scale.setScalar(0.012 * camD / cassini.scale.x);
      fx.beacon.material.opacity = 0.7 * clamp01((H.T - PULL) / 4);
      // a minute after the release the thrusters come back on: a few short puffs as they settle Cassini
      const w = s - 60;
      fx.puffs.forEach((p, i) => {
        const on = w > 0 && w < 40 && Math.sin(w * 1.3 + i * 2.1) > 0.82;
        p.material.opacity = on ? 0.55 + 0.3 * Math.random() : 0;
      });
    }
    const rate = rateAt(H.T);
    read.innerHTML = s < 0 ? `Release in <i>${Math.ceil(-s)} s</i> · Thrusters <i>${s > -10 ? "off" : "on"}</i>`
      : `${fmtClock(s)} · Huygens <i>${out < 10 ? out.toFixed(1) : Math.round(out)} m</i> away · ${SPEED} m/s · Spin <i>${DATA.spin_rpm} rpm</i>${rate > 1.05 ? ` · Time <i>×${Math.round(rate)}</i>` : ""}`;
  }
  // the camera, through cutscene.html's orbit() and frameOn(), so its subject stays in the middle of the view and a drag
  // turns round it. Its frame is fixed against the stars: Cassini's dish axis and the probe's way out as they were when
  // the picture came up, a few seconds before the release (Cassini holds still until then). Cassini's own turn after
  // the push is then Cassini turning in the view, not the sky going round.
  // First the middle of the two craft, from beside Cassini with its dish up, widening as the probe drifts off; then one
  // move (MOVE seconds, eased at both ends): the subject slides over to the probe while the camera comes round behind
  // it and closes in, to look past it toward Titan, which sits off the middle of the view where the screen has room
  const vB2 = new THREE.Vector3(), pW = new THREE.Vector3();
  const ease5 = x => { x = clamp01(x); return x * x * x * (x * (6 * x - 15) + 10); };
  function cameraAt() {
    // through the fade to black the view stays as it was
    if (H.phase === "out") { camera.quaternion.copy(H.hold); return; }
    if (H.phase !== "run") return;
    const T = H.T;
    probeScene(state.et, pW);
    const tW = relScene("TITAN", vB2).sub(cassini.position).normalize();
    if (!H.ref) {
      const up = (co ? co.up.clone() : new THREE.Vector3(0, 0, 1)).applyQuaternion(cassini.quaternion).normalize();
      const axis = (co ? co.axis.clone() : new THREE.Vector3(-1, 0, 0)).applyQuaternion(cassini.quaternion).normalize();
      // beside the probe's path, on the side away from Titan: Titan's part of the sky is then behind the two craft,
      // and the move toward it later is a short one
      const side = new THREE.Vector3().crossVectors(up, axis).normalize();
      if (side.dot(tW) > 0) side.negate();
      H.ref = { up, axis, side };
    }
    const upW = H.ref.up, axisW = H.ref.axis, side = H.ref.side;
    const gap = pW.distanceTo(cassini.position) / 1e-6;   // metres between the two
    // near: off to the side of the probe's path, a little ahead of it and above, drifting slowly round
    const yaw = -0.35 + 0.01 * Math.min(T, PULL);
    const fromN = side.clone().multiplyScalar(Math.cos(yaw)).addScaledVector(axisW, Math.sin(yaw) + 0.25).addScaledVector(upW, 0.28).normalize();
    // an upright phone sees less across, so the camera stands further back: for Cassini itself (fit), and more for the
    // gap between the two (wide), which has to stay inside the narrow width
    const fit = Math.max(1, 0.9 / camera.aspect);
    const wide = Math.max(1, 0.45 / Math.tan(0.7 * Math.atan(Math.tan(camera.fov * Math.PI / 360) * camera.aspect)));
    const dN = 15 * fit + 1.1 * gap * wide;
    // far: behind the probe, looking on toward Titan. Titan sits off the middle, to the side on a wide screen and above
    // on an upright one, on whichever side asks the camera to come round less. Settled once, as the move begins
    if (!H.fromF) {
      const halfV = camera.fov * Math.PI / 360, halfH = Math.atan(Math.tan(halfV) * camera.aspect), across = camera.aspect >= 1;
      const ax = Math.tan((across ? 0.42 : 0.1) * halfH), ay = Math.tan((across ? 0.38 : 0.42) * halfV);
      const right = new THREE.Vector3().crossVectors(tW, upW).normalize(), upT = new THREE.Vector3().crossVectors(right, tW).normalize();
      const pick = sgn => tW.clone().addScaledVector(right, -sgn * ax).addScaledVector(upT, -ay).normalize().negate();
      const a = pick(1), b = pick(-1);
      H.fromF = a.dot(fromN) >= b.dot(fromN) ? a : b;
    }
    const fromF = H.fromF;
    const k = ease5((T - PULL) / MOVE);
    // the subject is on the probe before the camera has closed in, so the probe never nears the edge of the view
    const subject = cassini.position.clone().lerp(pW, 0.5 + 0.5 * ease5((T - PULL) / (MOVE * 0.55)));
    const from = fromN.clone().applyQuaternion(new THREE.Quaternion().slerp(new THREE.Quaternion().setFromUnitVectors(fromN, fromF), k));
    const dist = Math.exp(Math.log(dN) * (1 - k) + Math.log(FAR_M * fit) * k) * 1e-6;
    const o = CS.orbit(from.negate(), upW);
    CS.frameOn(subject, o.dir, dist, o.up);
    // where the camera stands from the probe, for the view left on it at the end
    H.rel = camera.position.clone().sub(pW);
    // the tags, once the two are small in the view: each clear of what it names (r: its size in metres)
    const showTags = T > PULL - 4, perM = innerHeight / 2 / Math.tan(camera.fov * Math.PI / 360);
    const place = (el, w, r, extra) => {
      const v = w.clone().project(camera), on = showTags && v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05;
      el.classList.toggle("on", on);
      if (extra !== undefined && el.innerHTML !== extra) el.innerHTML = extra;
      if (!on) return;
      // to the right of it; under it where the right edge of the screen is too near for the words
      const off = r ? r / Math.max(1e-9, camera.position.distanceTo(w) / 1e-6) * perM : 0;
      const x = (v.x + 1) / 2 * innerWidth, y = (1 - v.y) / 2 * innerHeight, wd = el.offsetWidth;
      el.style.transform = x + 8 + off + wd < innerWidth - 8 ? `translate(${x + 8 + off}px, ${y - 5}px)`
        : `translate(${Math.max(8, Math.min(innerWidth - 8 - wd, x - wd / 2))}px, ${y + off + 10}px)`;
    };
    camera.updateMatrixWorld();
    place(tags.cassini, cassini.position, 2.6);
    place(tags.probe, pW, 1.4);
    const titanKm = len(sub(pos.TITAN, pos.CASSINI, v3()));
    place(tags.titan, cassini.position.clone().addScaledVector(tW, 50), 0, `Titan <small>${(titanKm / 1e6).toFixed(1)} million km</small>`);
  }

  CS.register("huygens", { root, frame, attitude, camera: cameraAt, onEnd: cleanUp });
  // playback crossing the release plays it; so does ?huygens
  const inData = () => RELEASE >= coverage[0] && RELEASE <= coverage[1];
  CS.at(RELEASE, play, inData);
  CS.fromUrl("huygens", () => RELEASE - 600, play, inData);
  window.cassiniHuygensRelease = { play, skip: () => finish("back"), get running() { return !!H; }, get facts() { return DATA.facts; } };
})();
</script>
