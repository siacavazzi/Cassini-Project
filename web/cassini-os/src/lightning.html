<!-- Lightning on Saturn, for Cassini OS: a window that shows a lightning pass's pictures in an enhanced view, with the
     published flashes marked. build.py splices the style into the head and the script after the viewer's.

     Everything it shows is made ahead by the pre-build (web/frames/lightning.py, prebuild.py lightning) and only sent
     by the frame server: /frames/lightning.json lists the passes (the flashes in Dyudina et al. 2013, Icarus 226,
     Table A1), their pictures and where each flash is on its picture; /frames/lightning/<ID>.webp is a picture's
     enhanced view (night side: stretched on the storm's band of latitude; day side: tinted warm where brighter
     than the pictures ten minutes before and after). The window says it is enhanced and how.

     It opens when a Moment that holds a lightning pass is played (a Lightning Moment, or the Great Northern Storm's
     map of 2011-03-06), and follows the clock: it shows the pass's picture taken last before the time on the clock.
     Its arrows step the clock picture to picture; M shows or hides the markers. Without the pre-built pictures (a
     site whose cache lacks them) it stays closed. window.cassiniLightning (open(entry), passes(), close()) is the
     way in for the Moments window and for tests. -->
<style>
#lightwin { top: calc(env(safe-area-inset-top, 0px) + 36px); right: max(14px, env(safe-area-inset-right, 0px)); width: min(440px, calc(100% - 28px)); display: flex; flex-direction: column; }
#lightwin .lthead { flex: none; padding: 8px 12px 6px; font-size: 13px; color: var(--q-text, #111); border-bottom: 1px solid var(--q-line, #ddd); }
#lightwin .lthead small { display: block; margin-top: 2px; font: 10px/1.4 var(--hudf, monospace); color: var(--q-dim, #555); }
#lightwin .ltpic { position: relative; background: #000; aspect-ratio: 1 / 1; }
#lightwin .ltpic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
#lightwin .ltpic svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#lightwin .ltpic svg circle { fill: none; stroke: #ffd35a; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
#lightwin .ltpic .ltbadge { position: absolute; left: 8px; top: 8px; padding: 2px 6px; border-radius: 3px; font: 10px var(--hudf, monospace); color: #000; background: #ffd35a; }
#lightwin .ltbar { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--q-line, #ddd); font: 11px var(--hudf, monospace); color: var(--q-text, #111); }
#lightwin .ltbar button { border: 1px solid var(--q-line, #ccc); background: none; color: inherit; font: inherit; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
#lightwin .ltbar button[aria-pressed="false"] { opacity: .55; }
#lightwin .ltnote { padding: 6px 12px 9px; font: 10px/1.45 var(--hudf, monospace); color: var(--q-dim, #555); }
#lightwin .ltnote a { color: inherit; }
body.cutscene #lightwin, body.ambient #lightwin { display: none; }
</style>

<script>
// ---------- lightning on Saturn: the published flashes, on pictures enhanced to show them ----------
(function () {
  const L = { doc: null, asked: 0, pass: null, i: -1, marks: true, win: null, raf: 0 };
  const base = () => (window.cassiniFeeds && cassiniFeeds.frames) || "";
  async function load() {
    if (L.doc) return L.doc;
    if (Date.now() - L.asked < 60000) return null;     // a failed ask is tried again after a minute
    L.asked = Date.now();
    try {
      const r = await fetch(`${base()}/frames/lightning.json`);
      if (!r.ok) return null;
      L.doc = await r.json();
    } catch (e) { return null; }
    return L.doc;
  }
  function passFor(entry) {
    const obs = new Set(entry && entry.obs || []);
    return (L.doc && L.doc.passes || []).find(p => p.obs.some(o => obs.has(o))) || null;
  }
  const NOTE = {
    night: "Enhanced: black and white set on Saturn's night side around the storm's latitude, and the ring-lit " +
           "glow across the night side taken off, so the storm cloud and its flashes fill the range. The rings and " +
           "sky are left black. Specks and short streaks are cosmic-ray hits on the camera.",
    day: "Enhanced: the picture as taken, tinted warm where it is brighter than both pictures taken about ten " +
         "minutes before and after (redrawn to match by Saturn's turning). Lightning comes and goes; clouds stay. " +
         "Some tints are clouds that changed; the rings mark the flashes the paper found.",
  };
  function win() {
    if (L.win) return L.win;
    const el = L.win = document.createElement("aside");
    el.className = "win"; el.id = "lightwin"; el.dataset.name = "Lightning"; el.setAttribute("aria-label", "Lightning on Saturn");
    el.innerHTML = `<div class="titlebar"><span class="lights"><button class="close" aria-label="Close">×</button><button class="min" aria-label="Minimize">–</button><button class="zoom" aria-label="Zoom">+</button></span>Lightning on Saturn</div>
      <div class="lthead"></div>
      <div class="ltpic"><img alt=""><svg viewBox="0 0 1024 1024" preserveAspectRatio="xMidYMid meet"></svg><span class="ltbadge">ENHANCED</span></div>
      <div class="ltbar"><button class="ltprev" aria-label="Previous picture">◀</button><span class="ltwhen"></span><button class="ltmarks" aria-pressed="true" title="Show the published flashes (M)">Flashes</button><button class="ltnext" aria-label="Next picture">▶</button></div>
      <div class="ltnote"></div>`;
    const dock = document.getElementById("dock"); dock.parentNode.insertBefore(el, dock);
    if (window.cassiniWM) cassiniWM.wire(el);
    el.querySelector(".close").addEventListener("click", e => { e.stopImmediatePropagation(); close(); }, true);
    el.querySelector(".ltprev").addEventListener("click", () => step(-1));
    el.querySelector(".ltnext").addEventListener("click", () => step(1));
    el.querySelector(".ltmarks").addEventListener("click", toggleMarks);
    document.addEventListener("keydown", e => {
      if (el.hidden || e.metaKey || e.ctrlKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return;
      if (e.key === "m" || e.key === "M") toggleMarks();
    });
    return el;
  }
  function toggleMarks() {
    L.marks = !L.marks;
    if (L.win) L.win.querySelector(".ltmarks").setAttribute("aria-pressed", String(L.marks));
    draw(true);
  }
  function step(d) {
    const p = L.pass; if (!p) return;
    const i = Math.max(0, Math.min(p.frames.length - 1, (L.i < 0 ? 0 : L.i) + d));
    if (typeof setPlaying === "function") setPlaying(false);
    if (typeof setTime === "function") setTime(p.frames[i].et);
    L.i = -1; draw();
  }
  // the pass's picture taken last before the clock (its first one before the pass starts)
  function index() {
    const p = L.pass, et = state.et; let i = 0;
    for (let k = 0; k < p.frames.length; k++) if (p.frames[k].et <= et + 1) i = k;
    return i;
  }
  function draw(force) {
    const p = L.pass, el = L.win; if (!p || !el || el.hidden) return;
    const i = index();
    if (i === L.i && !force) return;
    L.i = i;
    const f = p.frames[i];
    const img = el.querySelector("img"), src = `${base()}/frames/lightning/${f.id}.webp?v=${encodeURIComponent(L.doc.version)}`;
    if (img.getAttribute("src") !== src) img.src = src;
    el.querySelector("svg").innerHTML = L.marks ? f.markers.map(m => `<circle cx="${m.x}" cy="${m.y}" r="38"><title>Flash at ${Math.abs(m.lat).toFixed(1)}° ${m.lat < 0 ? "S" : "N"}, about ${m.energy} billion J of light</title></circle>`).join("") : "";
    const n = f.markers.length;
    el.querySelector(".ltwhen").textContent = `${f.utc.slice(11, 19)} UTC · ${i + 1}/${p.frames.length} · ${f.exposure_s >= 1 ? f.exposure_s.toFixed(0) : f.exposure_s} s${n ? ` · ${n} flash${n > 1 ? "es" : ""}` : ""}`;
  }
  function loop() {
    L.raf = 0;
    if (!L.win || L.win.hidden || !L.pass) return;
    draw();
    L.raf = requestAnimationFrame(loop);
  }
  async function open(entry) {
    const doc = await load(); if (!doc) return false;
    const p = passFor(entry);
    if (!p) { if (L.pass) close(); return false; }   // another moment: the window goes with its pass
    L.pass = p; L.i = -1;
    const el = win();
    el.hidden = false; delete el.dataset.min;
    if (window.cassiniWM) { cassiniWM.front(el); cassiniWM.syncMenu(); }
    const fl = p.frames.reduce((a, f) => a + f.markers.length, 0);
    el.querySelector(".lthead").innerHTML = `${p.label.replace(/^Lightning on Saturn, /, "")}<small>${fl} flash${fl === 1 ? "" : "es"} at ${Math.abs(p.storm_lat).toFixed(0)}° ${p.storm_lat < 0 ? "south" : "north"}, ${p.view === "night" ? "night side" : "day side, blue filter"} · ${p.frames.length} narrow-angle pictures</small>`;
    el.querySelector(".ltnote").innerHTML = `${NOTE[p.view]} Flashes: <a href="${doc.source.open_copy}" target="_blank" rel="noopener">Dyudina et al. 2013</a>, placed by SPICE.`;
    if (!L.raf) L.raf = requestAnimationFrame(loop);
    draw(true);
    return true;
  }
  function close() {
    if (L.win) L.win.hidden = true;
    L.pass = null;
    if (window.cassiniWM) cassiniWM.syncMenu();
  }
  window.cassiniLightning = { open, close, passes: async () => ((await load()) || { passes: [] }).passes };
})();
</script>
