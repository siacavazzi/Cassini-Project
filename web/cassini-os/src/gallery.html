<!-- The gallery for Cassini OS: the viewer's own library of saved pictures and movies. build.py splices the style into
     the head, the window, share menu and toast into #app, and the script after the chrome script (after movie export,
     before the dock, which opens it).

     Saving: the ＋ in a picture window's title bar (or G) adds the picture on screen; full view has "Add to Gallery"
     beside its save button; a finished movie export has "Add to Gallery" beside Download. Pages that make pictures of
     their own call window.cassiniGallery.add({ kind: "picture" | "movie", src, film, title, sub }).

     Storage: this device only, in the browser's IndexedDB (database "cassini-gallery"; no server keeps anything).
     Each item is a recipe and, unless Settings > Gallery says otherwise, a copy of the file:
       recipe   the moment it was saved at (the share-link parameters t, view, cam, play=0) and how the frame server
                makes it: src, the /frames/... address of the picture (its pipeline: frame, composite, mosaic,
                processing), or film, the movie export's options (/export, same options give the same film)
       file     the picture at full resolution as a JPEG (the server sends WebP; JPEG is what people's apps take), or the film (MP4); a 320 px thumbnail
     A browser may clear a site's storage (Safari after 7 days without a visit); an item without its file is made
     again from its recipe when opened. Export Library writes the pictures (JPEG) and films (MP4) to one .zip; with
     Include metadata (gallery.exportMeta) it adds gallery.json and the thumbnails, and Import reads that back.

     Sharing: a link carries the recipe, never the picture: ?t=…&view=…&play=0 opens the moment (the share-link
     pattern) and pic=/frames/… (or film=from=…&until=…) shows the picture over it, made by the frame server through
     the pipeline. Share also offers the file itself (the phone's share sheet), copying it, and Reddit, X, Bluesky,
     Facebook, a text message and email. Link previews on social sites need the server reachable from the internet. -->

<script>
// ---------- the gallery ----------
(function () {
  const $ = id => document.getElementById(id);
  const FRAMES = (() => {                       // the frame server, chosen as the camera window chooses it
    const q = new URLSearchParams(location.search).get("frames");
    if (q) return q.replace(/\/$/, "");
    if (/^https?:$/.test(location.protocol) && !/claude\.ai$|claudeusercontent\.com$|claude\.site$/.test(location.hostname)) return location.origin;
    return "http://localhost:8765";
  })();
  const S = window.cassiniSettings, WM = window.cassiniWM, card = $("galcard"), grid = $("galgrid");
  const PICTURES = ".camwin, .bodywin, #reelcard, #moviecard";
  if (S) S.define({ key: "gallery.keepFiles", section: "Gallery", label: "Keep a copy of each file", type: "toggle", value: true,
    hint: "Saved pictures and films are kept on this device, in the browser. Off: only how each was made is kept, and the frame server makes it again when you open it (needs the server)." });
  const keepFiles = () => !S || S.get("gallery.keepFiles") !== false;
  if (S) S.define({ key: "gallery.exportMeta", section: "Gallery", label: "Export with metadata", type: "toggle", value: false,
    hint: "Export Library also writes how each item was made and its thumbnail (gallery.json), so Import can bring the gallery back. Off: just the pictures and films." });
  const withMeta = () => !!(S && S.get("gallery.exportMeta"));
  const ICON = {
    add: '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.5v7M1.5 5h7"/></svg>',
    link: '<svg viewBox="0 0 16 16"><path d="M7 9a3 3 0 0 0 4.2 0l2.3-2.3a3 3 0 0 0-4.2-4.2L8.2 3.6M9 7a3 3 0 0 0-4.2 0L2.5 9.3a3 3 0 0 0 4.2 4.2l1.1-1.1"/></svg>',
    share: '<svg viewBox="0 0 16 16"><path d="M8 10V2M5 4.5 8 1.5l3 3M3.5 7.5v6h9v-6"/></svg>',
    copy: '<svg viewBox="0 0 16 16"><rect x="5" y="5" width="8.5" height="8.5" rx="1.3"/><path d="M10.5 5V3.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1H5"/></svg>',
    text: '<svg viewBox="0 0 16 16"><path d="M2.5 3.5h11v7.5h-6L4.5 13.5V11h-2z"/></svg>',
    mail: '<svg viewBox="0 0 16 16"><rect x="2" y="3.5" width="12" height="9" rx="1.3"/><path d="m2.5 4.5 5.5 4.5 5.5-4.5"/></svg>',
    reddit: '<svg viewBox="0 0 16 16"><ellipse cx="8" cy="9.6" rx="5.6" ry="3.9"/><circle cx="12.6" cy="3.3" r="1.1"/><path d="M8 5.7 9 2.3l3.5.9"/><circle cx="6" cy="9.2" r=".5"/><circle cx="10" cy="9.2" r=".5"/><path d="M6.2 11.2c1 .7 2.6.7 3.6 0"/></svg>',
    x: '<svg viewBox="0 0 16 16"><path d="M3 2.5 13 13.5M13 2.5 3 13.5"/></svg>',
    bsky: '<svg viewBox="0 0 16 16"><path d="M8 7.5C6.6 4.8 3.6 2.6 2.4 3.1c-1 .4-.4 4.1.4 5 .9.9 2.7.8 2.7.8s-2.6.6-1.6 2.6c1 2 3.4.1 4.1-2 .7 2.1 3.1 4 4.1 2 1-2-1.6-2.6-1.6-2.6s1.8.1 2.7-.8c.8-.9 1.4-4.6.4-5C12.4 2.6 9.4 4.8 8 7.5z"/></svg>',
    fb: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M9.2 14V8.6h1.6l.2-1.9H9.2V5.6c0-.5.2-.9.9-.9h1V3.1H9.8c-1.6 0-2.4 1-2.4 2.4v1.2H6v1.9h1.4V14"/></svg>',
    file: '<svg viewBox="0 0 16 16"><path d="M8 2v8M5 7.5 8 10.5l3-3M3 13.5h10"/></svg>'
  };

  // ---------- the store: IndexedDB, items (recipe, thumbnail) and files ----------
  let dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      let r;
      try { r = indexedDB.open("cassini-gallery", 1); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains("items")) d.createObjectStore("items", { keyPath: "id" }); if (!d.objectStoreNames.contains("files")) d.createObjectStore("files"); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    dbp.catch(() => { dbp = null; });
    return dbp;
  }
  async function tx(stores, mode, fn) {
    const d = await db();
    return new Promise((res, rej) => {
      const t = d.transaction(stores, mode), out = fn(...[stores].flat().map(s => t.objectStore(s)));
      t.oncomplete = () => res(out && "result" in out ? out.result : out);
      t.onerror = t.onabort = () => rej(t.error || new Error("storage"));
    });
  }
  const allItems = () => tx("items", "readonly", s => s.getAll()).then(a => a.sort((x, y) => y.added - x.added));
  const getFile = id => tx("files", "readonly", s => s.get(id));
  const putItem = (item, file) => tx(["items", "files"], "readwrite", (si, sf) => { si.put(item); if (file) sf.put(file, item.id); });
  const delItem = id => tx(["items", "files"], "readwrite", (si, sf) => { si.delete(id); sf.delete(id); });

  // ---------- recipes ----------
  const utc = et => new Date(etToMs(et)).toISOString().slice(0, 19);
  const num = v => (+(+v).toPrecision(4)).toString().replace("e+", "e");
  const ID = /[NW]\d{10}_\d+/g;
  // the moment on screen as share-link parameters, paused (the link page's own when it is there)
  function moment() {
    let p;
    if (window.cassiniLink && window.cassiniLink.params) p = window.cassiniLink.params().filter(([k]) => k !== "play" && k !== "speed" && k !== "movie");
    else {
      const view = state.focus !== "CASSINI" ? state.focus.toLowerCase() : state.follow ? "follow" : "cassini";
      p = [["t", utc(state.et)], ["view", view]];
      if (view !== "follow" && typeof camera !== "undefined") p.push(["cam", [camera.position.x, camera.position.y, camera.position.z].map(num).join(",")]);
    }
    p.push(["play", "0"]);
    return p;
  }
  // a picture's frame-server address without its server or size: /frames/color.webp?ids=… (the pipeline's recipe)
  function recipe(src) {
    if (!src) return null;
    try {
      const u = new URL(src, location.href);
      if (!/^\/frames\//.test(u.pathname) || u.pathname.includes("..")) return null;
      ["size", "format", "download"].forEach(k => u.searchParams.delete(k));
      const q = u.searchParams.toString().replace(/%2C/gi, ",");
      return u.pathname + (q ? "?" + q : "");
    } catch (e) { return null; }
  }
  const sized = (rec, size) => `${FRAMES}${rec}${rec.includes("?") ? "&" : "?"}size=${size}`;
  const filmUrl = film => `${FRAMES}/export?${film}`;
  const filmKey = film => { try { const f = new URLSearchParams(film); return f.get("from") && f.get("until") ? f.toString().replace(/%3A/gi, ":") : null; } catch (e) { return null; } };
  function link(item) {
    const u = new URL(location.href), keep = [...u.searchParams].filter(([k]) => !["t", "view", "cam", "speed", "play", "movie", "pic", "film"].includes(k));
    const enc = s => encodeURIComponent(s).replace(/%3A/gi, ":").replace(/%2C/gi, ",").replace(/%2F/gi, "/");
    const p = [...item.moment, ...(item.src ? [["pic", item.src]] : []), ...(item.film ? [["film", item.film]] : []), ...keep];
    return u.origin + u.pathname + "?" + p.map(([k, v]) => v === "" ? enc(k) : `${enc(k)}=${enc(v)}`).join("&");
  }
  const cap = s => s ? s.charAt(0) + s.slice(1).toLowerCase() : "";
  function describe(ids, what) {
    const k = typeof catalog !== "undefined" && catalog && ids.length ? catalog.id.indexOf(ids[ids.length - 1]) : -1;
    if (k < 0) return { title: what ? cap(what) : "Picture", sub: ids.slice(0, 3).join(" ") };
    const camName = catalog.cam[k] === "N" ? "NAC" : "WAC", target = cap(catalog.target[k] || "") || "Sky";
    return { title: `${target} · ${what || camName}`, sub: `${camName} · ${utc(catalog.et[k]).replace("T", " ")} UTC · ${ids.length > 1 ? ids.length + " frames" : ids[0]}` };
  }
  function whatOf(rec, well) {
    if (!rec) return "picture";
    if (/\/frames\/mosaic\//.test(rec)) return /\/frame\.webp/.test(rec) ? "frame from a mosaic" : "mosaic";
    if (/\/frames\/color\.webp/.test(rec)) {
      if (/channel=/.test(rec)) return "color channel";
      const tag = well && well.closest(".win") && well.closest(".win").querySelector(".kindtag");
      if (tag && tag.textContent.trim()) return tag.textContent.trim().toLowerCase();
      // no window to read: the set in the catalog says what kind of color it is
      const ids = rec.match(ID) || [], set = typeof catalog !== "undefined" && catalog && catalog.sets ? catalog.sets.find(t => t.use.length === ids.length && t.use.every((k, j) => catalog.id[k] === ids[j])) : null;
      return set ? ({ true: "true color", false: "false color", two: "two-filter color" })[set.kind] || "color picture" : "color picture";
    }
    if (/\/frames\/processed\//.test(rec)) return "processed frame";
    if (/\/frames\/reel\//.test(rec)) return "body reel picture";
    return "frame";
  }

  // ---------- adding ----------
  const busy = new Set();
  // a file's name: what and when, as people see it in the gallery (Cassini Rhea true color 2005-01-16 0038)

  function showShared() {
    const it = sharedFromUrl(); if (!it) return;
    const named = () => { if (it.ids.length && !it.film) { const d = describe(it.ids, whatOf(it.src)); it.title = d.title; it.sub = d.sub; if (G.shared === it) { $("galtitle").textContent = it.title; $("galinfo").textContent = `${it.sub} · shared link`; } } };
    card.hidden = false; delete card.dataset.min; if (WM) { WM.front(card); WM.syncMenu(); }
    view(null, it);
    goTo(it, true);   // the moment it was saved at, paused, the view as it was
    // the catalog of that month names it once it has loaded
    let n = 0; const t = setInterval(() => { if (++n > 60 || (typeof catalog !== "undefined" && catalog && it.ids.length && catalog.id.indexOf(it.ids[it.ids.length - 1]) >= 0)) { clearInterval(t); named(); } }, 1000);
  }

  // ---------- export and import: one .zip (stored, no compression: pictures and films are compressed already) ----------
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  async function zip(entries) {   // entries: [name, Blob]
    const parts = [], central = []; let off = 0;
    const enc = new TextEncoder();
    for (const [name, blob] of entries) {
      const data = new Uint8Array(await blob.arrayBuffer()), nm = enc.encode(name), crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nm.length, true);
      parts.push(h.buffer, nm, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
      c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
      central.push(c.buffer, nm);
      off += 30 + nm.length + data.length;
    }
    const size = central.reduce((s, b) => s + b.byteLength, 0), end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true); end.setUint32(12, size, true); end.setUint32(16, off, true);
    return new Blob([...parts, ...central, end.buffer], { type: "application/zip" });
  }
  async function unzip(file) {    // stored entries only, as zip() writes them: name -> Blob
    const buf = await file.arrayBuffer(), dv = new DataView(buf), dec = new TextDecoder(), out = new Map();
    let e = buf.byteLength - 22;
    while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error("not a zip");
    let p = dv.getUint32(e + 16, true);
    for (let i = 0, n = dv.getUint16(e + 10, true); i < n; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
      const name = dec.decode(new Uint8Array(buf, p + 46, nl));
      const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
      if (method === 0) out.set(name, new Blob([new Uint8Array(buf, start, size)]));
      p += 46 + nl + xl + cl;
    }
    return out;
  }
  // plain: the pictures (JPEG) and films (MP4), named by what and when; with metadata: also gallery.json and the
  // thumbnails, which Import reads back
  async function exportLibrary() {
    const items = await allItems(); if (!items.length) return;
    const meta = withMeta(), used = new Set();
    $("galexport").disabled = true; toast("Packing the gallery…");
    const nice = i => {
      let n = fileName(i), k = 2, out = n;
      while (used.has(out.toLowerCase())) out = `${n} (${k++})`;
      used.add(out.toLowerCase()); return out;
    };
    try {
      const entries = [], list = []; let missing = 0;
      for (const i of items) {
        const m = Object.assign({}, i); delete m.thumb;
        let f = i.hasFile ? await getFile(i.id).catch(() => null) : null;
        if (!f && i.kind === "picture" && i.src) { try { const r = await fetch(sized(i.src, "full")); if (r.ok) f = await r.blob(); } catch (e) {} }
        if (f && i.kind === "picture") { f = await jpeg(f); m.type = f.type; }
        if (f) { m.file = `${meta ? "files/" : ""}${nice(i)}.${ext(f.type || m.type)}`; entries.push([m.file, f]); } else missing++;
        if (meta && i.thumb) { m.thumbFile = `thumbs/${i.id}.${ext(i.thumb.type)}`; entries.push([m.thumbFile, i.thumb]); }
        list.push(m);
      }
      if (meta) entries.unshift(["gallery.json", new Blob([JSON.stringify({ app: "Cassini OS gallery", version: 1, frames: FRAMES, exported: new Date().toISOString(), items: list }, null, 1)], { type: "application/json" })]);
      if (!entries.length) { toast("Nothing to export: the frame server could not make the pictures"); $("galexport").disabled = false; return; }
      const z = await zip(entries), a = document.createElement("a");
      a.href = URL.createObjectURL(z); a.download = `Cassini-gallery-${new Date().toISOString().slice(0, 10)}.zip`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      toast(`Gallery exported · ${items.length - missing} item${items.length - missing === 1 ? "" : "s"}${missing ? ` (${missing} could not be made)` : ""} · ${fmtBytes(z.size)}`);
    } catch (e) { console.warn("gallery export", e); toast("Could not export the gallery"); }
    $("galexport").disabled = false;
  }
  async function importLibrary(file) {
    try {
      const files = await unzip(file), j = JSON.parse(await (files.get("gallery.json") || new Blob(["{}"])).text());
      if (!j.items) { toast(files.size ? "That zip has only pictures: export with Include metadata to make one Import can read" : "That file is not an exported gallery"); return; }
      const have = new Set((await allItems()).map(i => i.id)); let n = 0;
      for (const m of j.items) {
        if (!m.id || have.has(m.id) || !Array.isArray(m.moment)) continue;
        const f = m.file && files.get(m.file), th = m.thumbFile && files.get(m.thumbFile);
        const item = Object.assign({}, m, { thumb: th ? new Blob([th], { type: /\.jpg$/.test(m.thumbFile) ? "image/jpeg" : "image/webp" }) : null, hasFile: !!f, src: recipe(m.src) });
        delete item.file; delete item.thumbFile;
        await putItem(item, f ? new Blob([f], { type: m.type || "" }) : null); n++;
      }
      toast(n ? `Imported ${n} item${n === 1 ? "" : "s"}` : "Nothing new in that file");
      refresh();
    } catch (e) { console.warn("gallery import", e); toast("That file is not an exported gallery"); }
  }

  // ---------- toast ----------
  function toast(text, act, fn) {
    const t = $("galtoast"); t.firstElementChild.textContent = text;
    const old = t.querySelector("button"); if (old) old.remove();
    if (act) { const b = document.createElement("button"); b.textContent = act; b.addEventListener("click", () => { t.hidden = true; fn(); }); t.appendChild(b); }
    t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, act ? 6000 : 2600);
  }

  // ---------- wiring ----------
  $("galfilter").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; G.filter = b.dataset.v; $("galfilter").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); refresh(); });
  $("galback").addEventListener("click", back);
  $("galgo").addEventListener("click", () => { const it = G.cur || G.shared; if (it) goTo(it); });
  $("galsharebtn").addEventListener("click", e => { e.stopPropagation(); const it = G.cur || G.shared; if (!it) return; if (!shareMenu.hidden) closeShare(); else share(it, e.currentTarget); });
  $("galkeep").addEventListener("click", async () => {
    const it = G.shared; if (!it) return;
    const saved = await add({ kind: it.kind, src: it.src ? sized(it.src, "full") : null, film: it.film, title: it.title, sub: it.sub, moment: it.moment,
      blob: it.kind === "movie" && $("galstage").querySelector("video") && $("galstage").querySelector("video").src ? await fetch($("galstage").querySelector("video").src).then(r => r.ok ? r.blob() : null, () => null) : null });
    if (saved) { dropShared(); G.shared = null; await refresh(); view(saved.id); }
  });
  // removing: gone at once, with a moment to take it back
  $("galdel").addEventListener("click", async () => {
    const it = G.cur; if (!it) return;
    const file = it.hasFile ? await getFile(it.id).catch(() => null) : null;
    await delItem(it.id); back();
    toast(`Removed · ${it.title}`, "Undo", async () => { await putItem(it, file); refresh(); });
  });
  $("galexport").addEventListener("click", exportLibrary);
  $("galmeta").checked = withMeta();
  $("galmeta").addEventListener("change", e => { if (S) S.set("gallery.exportMeta", e.target.checked); });
  if (S) S.on("gallery.exportMeta", v => { $("galmeta").checked = !!v; });
  $("galimport").addEventListener("click", () => $("galfile").click());
  $("galfile").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) importLibrary(f); });
  card.addEventListener("click", e => { if (e.target.closest(".close, .min")) { e.stopPropagation(); close(); } }, true);
  // G adds the picture in the front picture window; the arrows step through the gallery while an item is open
  window.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === "Escape" && !shareMenu.hidden) { e.stopImmediatePropagation(); closeShare(); return; }
    if (e.key === "g" || e.key === "G") {
      const w = document.querySelector(".win.full") || [...document.querySelectorAll(PICTURES)].filter(x => !x.hidden && x.querySelector(".well.has-frame, canvas")).sort((a, b) => (+b.style.zIndex || 0) - (+a.style.zIndex || 0))[0];
      if (w) { e.preventDefault(); addWindow(w, w.querySelector(".galadd")); }
      return;
    }
    if (card.hidden || !card.classList.contains("front") || !G.cur) return;
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      const j = G.items.indexOf(G.cur) + (e.key === "ArrowRight" ? 1 : -1);
      if (G.items[j]) { e.preventDefault(); e.stopImmediatePropagation(); view(G.items[j].id); }
    } else if (e.key === "Escape") { e.stopImmediatePropagation(); back(); }
  }, true);
  const go = $("gomenu");
  if (go) { const li = document.createElement("li"); li.innerHTML = '<button id="gogallery">Gallery…</button>'; go.appendChild(li); li.querySelector("button").addEventListener("click", open); }

  window.cassiniGallery = { open, close, add, addWindow, view, link, get state() { return G; }, _zip: zip, _unzip: unzip };
  // a shared link opens once the viewer has loaded the moment
  const ready = () => typeof state !== "undefined" && $("loading") && $("loading").hidden;
  if (sharedFromUrl()) {
    if (ready()) showShared();
    else { const mo = new MutationObserver(() => { if (ready()) { mo.disconnect(); showShared(); } }); mo.observe($("loading"), { attributes: true, attributeFilter: ["hidden"] }); }
  }
})();
</script>
