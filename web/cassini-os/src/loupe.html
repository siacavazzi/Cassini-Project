<!-- The zoom lens for Cassini OS. build.py splices the parts below into the page: the style into the head, the lens into
     #app and the script after the chrome script (camera windows, body windows and full view are up by then).
     Move the pointer onto a picture (after a rest, if Settings > Zoom lens > "Open after" asks for one) and a lens comes up over it,
     showing the area under the pointer magnified, and follows the pointer until it leaves the picture. The lens
     draws from the picture's full resolution version (the frame server's size=full, the one full view and the save
     menu use), asked for only once the lens is up; until it comes, it magnifies the picture as shown. The scroll
     wheel over the lens changes the magnification (loupe.zoom, also the Settings slider). On a phone, press and
     hold on a picture: the lens comes up above the finger and follows it until the finger lifts.
     A mosaic's full resolution version is its canvas (2048 px) and keeps only a part of its tiles' pixels: once the
     lens magnifies past that picture's own pixels, it asks for the part under it at native resolution (the frame
     server's /frames/mosaic/<ID>/full.webp?crop=, mosaic_native) and draws it over, a little after the pointer
     settles (Settings > Zoom lens > "Native resolution in mosaics"). Any image can offer the same with
     data-loupe-native = the address of such a route (its .json says the native size, ?crop= gives a part).
     In full view, a mosaic's picture is for looking at its seams: there the lens stays away until the magnifying glass
     in the picture's top right corner turns it on (Settings > Zoom lens > "On mosaics in full view").
     Pictures it works on: every camera and body window's picture (.well .shot) and any <img data-loupe> (the value,
     when given, is the full resolution picture's URL), so a gallery or an editor gets it by marking its images. -->
<style>
#loupe { position: fixed; left: 0; top: 0; z-index: 3000; pointer-events: none; display: none; border-radius: 10px; overflow: hidden;
  background: #000; border: 1px solid rgba(255,255,255,.22); box-shadow: 0 10px 34px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.5);
  opacity: 0; transition: opacity .14s ease; }
#loupe.on { display: block; }
#loupe.shown { opacity: 1; }
#loupe.round { border-radius: 50%; }
#loupe canvas { display: block; width: 100%; height: 100%; }
#loupe .lzx { position: absolute; left: 50%; top: 50%; width: 15px; height: 15px; margin: -8px 0 0 -8px; opacity: .55; }
#loupe .lzx::before, #loupe .lzx::after { content: ""; position: absolute; background: rgba(255,255,255,.9); box-shadow: 0 0 2px #000; }
#loupe .lzx::before { left: 7px; top: 0; width: 1px; height: 15px; }
#loupe .lzx::after { top: 7px; left: 0; height: 1px; width: 15px; }
#loupe .lzt { position: absolute; left: 7px; bottom: 6px; font: 9.5px/1 var(--ui); color: rgba(232,236,242,.8); text-shadow: 0 0 3px #000, 0 0 6px #000;
  font-variant-numeric: tabular-nums; letter-spacing: .02em; }
#loupe.on-pointer .lzx { display: none; }
#loupe.round .lzt { left: 50%; transform: translateX(-50%); bottom: 12px; white-space: nowrap; }
.well .shot, img[data-loupe] { -webkit-touch-callout: none; }
/* the magnifying glass in a mosaic's corner in full view, under its kind tag: the lens on or off there */
.lensbtn { all: unset; position: absolute; right: 5px; top: 18px; z-index: 3; display: none; width: 22px; height: 22px; border-radius: 4px; box-sizing: border-box;
  align-items: center; justify-content: center; cursor: pointer; color: var(--q-text, #cfd5de); background: rgba(0,0,0,.55); border: 1px solid var(--q-line, rgba(255,255,255,.18)); }
.lensbtn svg { width: 12px; height: 12px; } .lensbtn svg * { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
.lensbtn:hover { color: #fff; border-color: var(--q-accent, #8ab4ff); }
.lensbtn:focus-visible { outline: 1px solid var(--q-accent, #8ab4ff); }
.lensbtn[aria-pressed="true"] { color: var(--q-accent, #8ab4ff); border-color: var(--q-accent, #8ab4ff); }
.win.full .well.mosaic.has-frame .lensbtn { display: flex; }
body.idle .win.full .lensbtn { opacity: .35; } body.idle .win.full .lensbtn:hover { opacity: 1; }
</style>

<div id="loupe" aria-hidden="true"><canvas></canvas><span class="lzx"></span><span class="lzt"></span></div>

<script>
// ---------- the zoom lens ----------
(function () {
  const S = window.cassiniSettings, lens = document.getElementById("loupe");
  if (!lens) return;
  const cv = lens.querySelector("canvas"), ctx = cv.getContext("2d"), tag = lens.querySelector(".lzt");
  if (S) {
    S.define({ key: "loupe.on", section: "Zoom lens", label: "Zoom lens", type: "toggle", value: true,
      hint: "Move the pointer onto a picture and a lens shows the area under it magnified, from the picture's full resolution version. It follows the pointer; the scroll wheel over it changes the magnification. On a phone, press and hold on a picture." });
    S.define({ key: "loupe.zoom", section: "Zoom lens", label: "Magnification", type: "range", value: 3, min: 1.5, max: 32, step: 0.5, format: v => `${v}×`,
      hint: "How much bigger the lens shows the picture than the window does. Past 12× is for mosaics, whose native pixels are many times smaller than the window shows them." });
    S.define({ key: "loupe.size", section: "Zoom lens", label: "Lens size", type: "range", value: 380, min: 160, max: 720, step: 20, unit: "px",
      hint: "How wide the lens is on the screen (on a phone, at most two thirds of the screen)." });
    S.define({ key: "loupe.delay", section: "Zoom lens", label: "Open after", type: "range", value: 0, min: 0, max: 3, step: 0.1, unit: "s",
      hint: "How long the pointer rests on a picture before the lens comes up (0: at once)." });
    S.define({ key: "loupe.shape", section: "Zoom lens", label: "Lens shape", type: "choice", value: "square",
      options: [["square", "Rounded square"], ["round", "Round"]], hint: "The lens's outline." });
    S.define({ key: "loupe.where", section: "Zoom lens", label: "Lens position", type: "choice", value: "on",
      options: [["on", "On the pointer"], ["beside", "Beside the pointer"]],
      hint: "On the pointer, the lens is centered where the pointer is; beside it, the lens sits up and to the right, so the picture under the pointer stays in sight. On a phone it always sits above the finger." });
    S.define({ key: "loupe.native", section: "Zoom lens", label: "Native resolution in mosaics", type: "toggle", value: true,
      hint: "A mosaic is shown smaller than its frames were taken. When the lens magnifies past the picture's pixels, it loads the part under it at the frames' own resolution, a moment after the pointer stops." });
    S.define({ key: "loupe.mosaicFull", section: "Zoom lens", label: "On mosaics in full view", type: "toggle", value: false,
      hint: "In full view a mosaic is shown big enough to look at its seams, so the lens stays away there. The magnifying glass in the picture's top right corner turns it on and off, the same as this switch." });
  }
  const opt = (k, d) => (S && S.get(k) !== undefined ? S.get(k) : d);
  const HOLD = 450, MOVE = 10;   // a press and hold on a phone: how long, and how far the finger may wander

  // the picture under a point: a window's picture once one is up, or an image marked data-loupe
  const pictureAt = el => {
    if (!el || !el.closest || el.closest("button, a, input, select, .savewrap, .tiletip")) return null;
    const img = el && el.closest && (el.closest("img[data-loupe]") || (el.closest(".well") && el.closest(".well").querySelector(".shot")));
    if (!img || !img.naturalWidth) return null;
    const well = img.closest(".well");
    if (well && !well.classList.contains("has-frame")) return null;
    if (well && well.classList.contains("mosaic") && well.closest(".win.full") && !opt("loupe.mosaicFull", false)) return null;
    return img;
  };
  // the magnifying glass in each picture window's corner (shown on a mosaic in full view): the lens on or off there
  const GLASS = '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="5" cy="5" r="3.6"/><path d="M7.7 7.7 11 11"/></svg>';
  function glass(well) {
    if (well.querySelector(":scope > .lensbtn")) return;
    const b = document.createElement("button");
    b.type = "button"; b.className = "lensbtn"; b.innerHTML = GLASS;
    b.addEventListener("click", e => { e.stopPropagation(); if (S) S.set("loupe.mosaicFull", !opt("loupe.mosaicFull", false)); });
    b.addEventListener("dblclick", e => e.stopPropagation());
    well.appendChild(b); mark(b);
  }
  function mark(b) {
    const on = !!opt("loupe.mosaicFull", false);
    b.setAttribute("aria-pressed", on); b.title = on ? "Zoom lens on (click to look at the seams without it)" : "Zoom lens off (click to turn it on)";
    b.setAttribute("aria-label", on ? "Turn the zoom lens off" : "Turn the zoom lens on");
  }
  let glassQ = 0;
  const glasses = () => { glassQ = 0; document.querySelectorAll(".well").forEach(glass); };
  glasses();
  new MutationObserver(() => { if (!glassQ) glassQ = requestAnimationFrame(glasses); }).observe(document.getElementById("app") || document.body, { childList: true, subtree: true });
  // where the picture is drawn inside its element (object-fit: contain, as the windows show it; else filling it)
  function box(img) {
    const r = img.getBoundingClientRect(), nw = img.naturalWidth, nh = img.naturalHeight;
    if (!nw || !r.width) return null;
    const fit = getComputedStyle(img).objectFit;
    if (fit !== "contain") return { x: r.left, y: r.top, w: r.width, h: r.height };
    const s = Math.min(r.width / nw, r.height / nh), w = nw * s, h = nh * s;
    return { x: r.left + (r.width - w) / 2, y: r.top + (r.height - h) / 2, w, h };
  }
  // the full resolution version of what an image shows: the frame server's size=full of the same picture
  function fullUrl(img) {
    if (img.dataset.loupe) return img.dataset.loupe;
    const src = img.dataset.src || img.currentSrc || img.src;
    if (!src || /^(data|blob):/.test(src)) return null;
    if (!/\/frames\//.test(src)) return null;
    return /size=/.test(src) ? src.replace(/size=[^&]*/, "size=full") : src + (src.includes("?") ? "&" : "?") + "size=full";
  }
  const fulls = new Map();   // url -> Image (a few, newest last)
  function fullFor(url) {
    let im = fulls.get(url);
    if (im) { fulls.delete(url); fulls.set(url, im); return im; }
    // one full picture on its way at a time: a newer one (a mosaic gaining tiles while it plays) drops the one before
    for (const [u, o] of fulls) if (!o.complete) { o.src = ""; fulls.delete(u); }
    im = new Image(); im.crossOrigin = "anonymous"; im.decoding = "async";
    im.onload = () => { if (cur && cur.url === url) paint(); };
    im.onerror = () => { im.failed = true; if (cur && cur.url === url) paint(); };
    im.src = url; fulls.set(url, im);
    while (fulls.size > 6) fulls.delete(fulls.keys().next().value);
    return im;
  }

  // native resolution (a mosaic's tiles at their own scale): the route's address for an image (its data-loupe-native,
  // or a mosaic window picture's /frames/mosaic/<ID>/full.webp with the same look and changes), its size once asked
  // (.json), and the parts of it fetched so far (crops: fractions of the picture, newest last)
  const NATIVE_WAIT = 160, NATIVE_SIDE = 2048, NATIVE_MARGIN = 2.2;
  function nativeUrl(img, src) {
    if (img.dataset.loupeNative) return new URL(img.dataset.loupeNative, location.href);
    if (!src || !/\/frames\/mosaic\/[NW]\d{10}_\d+\.webp(\?|$)/.test(src)) return null;
    const u = new URL(src, location.href);
    u.pathname = u.pathname.replace(/\.webp$/, "/full.webp");
    for (const k of ["size", "format", "download", "warm"]) u.searchParams.delete(k);
    return u;
  }
  const natives = new Map();   // route address -> { info, crops: [{ u0, v0, u1, v1, bmp }], ask, timer }
  function nativeFor(img, src) {
    if (!opt("loupe.native", true)) return null;
    const u = nativeUrl(img, src);
    if (!u) return null;
    const key = u.href;
    let n = natives.get(key);
    if (!n) {
      n = { key, url: u, info: undefined, crops: [], ask: null, timer: 0 };
      natives.set(key, n);
      while (natives.size > 12) { const old = natives.values().next().value; if (old.ask) old.ask.ctrl.abort(); natives.delete(old.key); }
      const j = new URL(u); j.pathname = j.pathname.replace(/\.webp$/, ".json");
      fetch(j).then(r => r.ok ? r.json() : null).catch(() => null).then(v => { n.info = v && v.width ? v : null; if (cur) paint(); });
    }
    return n;
  }
  // the part of the picture around (u, v) the lens shows (span: fractions wide and high), asked for once the pointer
  // has rested; a newer ask drops the one before it
  function nativeAsk(n, u, v, su, sv) {
    clearTimeout(n.timer);
    n.timer = setTimeout(() => {
      const side = Math.max(su * n.info.width, sv * n.info.height);
      const m = Math.max(1, Math.min(NATIVE_MARGIN, NATIVE_SIDE / side));
      const r = [u - su * m / 2, v - sv * m / 2, u + su * m / 2, v + sv * m / 2].map(x => Math.max(0, Math.min(1, x)));
      if (n.ask) n.ask.ctrl.abort();
      const ctrl = new AbortController(), q = new URL(n.url);
      q.searchParams.set("crop", r.map(x => x.toFixed(4)).join(","));
      n.ask = { ctrl, r };
      fetch(q, { signal: ctrl.signal }).then(res => res.ok ? res.blob() : Promise.reject(res.status)).then(b => createImageBitmap(b)).then(bmp => {
        n.crops.push({ u0: r[0], v0: r[1], u1: r[2], v1: r[3], bmp });
        while (n.crops.length > 6) n.crops.shift().bmp.close();
        if (n.ask && n.ask.ctrl === ctrl) n.ask = null;
        if (cur) paint();
      }).catch(() => { if (n.ask && n.ask.ctrl === ctrl) { n.ask = null; if (cur) paint(); } });
    }, NATIVE_WAIT);
  }
  // draws the native parts that reach the lens's span (fu0..fu1, fv0..fv1 of the picture) over it, oldest first;
  // asks for one when none covers it at the resolution the lens shows. What the label says: "native", "loading" or ""
  function nativeDraw(n, fu0, fv0, fu1, fv1, W, dpr) {
    const want = Math.min(n.info.width, W / (fu1 - fu0)), a0 = Math.max(0, fu0), b0 = Math.max(0, fv0), a1 = Math.min(1, fu1), b1 = Math.min(1, fv1);
    let covered = false;
    for (const c of n.crops) {
      const cw = c.bmp.width / (c.u1 - c.u0), ch = c.bmp.height / (c.v1 - c.v0);
      const x0 = Math.max(a0, c.u0), y0 = Math.max(b0, c.v0), x1 = Math.min(a1, c.u1), y1 = Math.min(b1, c.v1);
      if (x1 <= x0 || y1 <= y0) continue;
      const fx = W / (fu1 - fu0) / cw;
      ctx.imageSmoothingEnabled = fx < 2 * dpr;
      ctx.drawImage(c.bmp, (x0 - c.u0) * cw, (y0 - c.v0) * ch, (x1 - x0) * cw, (y1 - y0) * ch,
        (x0 - fu0) / (fu1 - fu0) * W, (y0 - fv0) / (fv1 - fv0) * W, (x1 - x0) / (fu1 - fu0) * W, (y1 - y0) / (fv1 - fv0) * W);
      if (c.u0 <= a0 + 1e-4 && c.v0 <= b0 + 1e-4 && c.u1 >= a1 - 1e-4 && c.v1 >= b1 - 1e-4 && cw >= want * 0.9) covered = true;
    }
    if (covered) { clearTimeout(n.timer); return "native"; }
    const r = n.ask && n.ask.r;
    if (!(r && r[0] <= a0 && r[1] <= b0 && r[2] >= a1 && r[3] >= b1)) nativeAsk(n, (fu0 + fu1) / 2, (fv0 + fv1) / 2, fu1 - fu0, fv1 - fv0);
    return "loading";
  }

  // cur: the lens up now ({ img, x, y, touch, url, src }); arm: waiting out the delay
  let cur = null, arm = null, fullT = 0, stableT = 0;
  const phone = () => document.body.classList.contains("phone");
  function open(img, x, y, touch) {
    cur = { img, x, y, touch, url: null, srcSeen: null };
    lens.classList.add("on"); lens.classList.toggle("round", opt("loupe.shape", "square") === "round");
    lens.classList.toggle("on-pointer", !touch && opt("loupe.where", "on") === "on");
    requestAnimationFrame(() => lens.classList.add("shown"));
    paint();
  }
  function close() {
    clearTimeout(arm && arm.t); arm = null; clearTimeout(fullT); clearTimeout(stableT);
    for (const n of natives.values()) clearTimeout(n.timer);
    if (!cur) return;
    cur = null; lens.classList.remove("shown", "on");
  }
  // the picture changed under the lens (the clock runs on, a mosaic gains a tile): its full version is asked for
  // once it has stayed up a quarter of a second, so playing never asks for every picture going by
  function source() {
    const img = cur.img, src = img.dataset.src || img.currentSrc || img.src;
    if (src !== cur.srcSeen) {
      cur.srcSeen = src; cur.url = null; cur.stable = false; clearTimeout(fullT); clearTimeout(stableT);
      stableT = setTimeout(() => { if (cur && cur.srcSeen === src) { cur.stable = true; paint(); } }, 250);
      const u = fullUrl(img);
      if (u && u !== src) {
        if (fulls.has(u)) cur.url = u;
        else fullT = setTimeout(() => { if (cur && cur.srcSeen === src) { cur.url = u; fullFor(u); paint(); } }, 250);
      }
    }
    const f = cur.url && fullFor(cur.url);
    return f && f.complete && f.naturalWidth && !f.failed ? { im: f, full: true } : { im: img, full: /size=full/.test(src || ""), loading: !!cur.url && !(f && f.failed) };
  }
  function paint() {
    if (!cur) return;
    const img = cur.img;
    if (!img.isConnected || !img.naturalWidth) return close();
    const b = box(img);
    if (!b) return close();
    const dpr = window.devicePixelRatio || 1, vw = innerWidth, vh = innerHeight;
    let L = opt("loupe.size", 380);
    if (cur.touch || phone()) L = Math.min(L, Math.round(Math.min(vw, vh) * 0.66));
    const z = opt("loupe.zoom", 3);
    // where the lens goes: on the pointer, beside it, or (a finger) above it, kept on the screen
    let lx, ly;
    if (cur.touch) { lx = cur.x - L / 2; ly = cur.y - L - 36; if (ly < 4) ly = cur.y + 48; }
    else if (opt("loupe.where", "on") === "beside") { lx = cur.x + 26; ly = cur.y - L - 26; if (lx + L > vw - 4) lx = cur.x - L - 26; if (ly < 4) ly = cur.y + 26; }
    else { lx = cur.x - L / 2; ly = cur.y - L / 2; }
    lx = Math.max(4, Math.min(vw - L - 4, lx)); ly = Math.max(4, Math.min(vh - L - 4, ly));
    Object.assign(lens.style, { width: L + "px", height: L + "px", transform: `translate(${Math.round(lx)}px, ${Math.round(ly)}px)` });
    const W = Math.round(L * dpr);
    if (cv.width !== W) cv.width = cv.height = W;
    const { im, full, loading } = source();
    const sw = im.naturalWidth, sh = im.naturalHeight;
    // the point under the pointer as a fraction of the picture, and the lens's span of the source in its pixels
    const u = (cur.x - b.x) / b.w, v = (cur.y - b.y) / b.h;
    const spanX = (L / z) * (sw / b.w), spanY = (L / z) * (sh / b.h), sx = u * sw - spanX / 2, sy = v * sh - spanY / 2;
    const fx = W / spanX, fy = W / spanY;
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, W);
    // past two screen pixels to a source pixel, the pixels are drawn as pixels, not smoothed into a blur
    ctx.imageSmoothingEnabled = fx < 2 * dpr; ctx.imageSmoothingQuality = "high";
    // only the part of the source inside the picture (a source rectangle off its edge draws nothing in some browsers)
    const x0 = Math.max(0, sx), y0 = Math.max(0, sy), x1 = Math.min(sw, sx + spanX), y1 = Math.min(sh, sy + spanY);
    if (x1 > x0 && y1 > y0) ctx.drawImage(im, x0, y0, x1 - x0, y1 - y0, (x0 - sx) * fx, (y0 - sy) * fy, (x1 - x0) * fx, (y1 - y0) * fy);
    // past the full picture's own pixels, the part under the lens at native resolution (a mosaic), once the picture
    // has stayed up (its full version asked for)
    // (its size is asked for as soon as the picture has stayed up, so the server starts working the mosaic out)
    const n = cur.stable && nativeFor(img, cur.srcSeen);
    const nat = n && fx > 1.1 && n.info && n.info.width > sw * 1.15 ? nativeDraw(n, sx / sw, sy / sh, (sx + spanX) / sw, (sy + spanY) / sh, W, dpr) : "";
    tag.textContent = `${z}×` + (nat === "native" ? ` · native resolution ${n.info.width} × ${n.info.height}`
      : nat === "loading" ? (n.info.prepared || n.crops.length ? " · loading native resolution…" : " · preparing native resolution (first look at this mosaic)…")
      : full ? ` · full resolution ${sw} × ${sh}` : loading ? " · loading full resolution…" : "");
  }
  // the picture under the lens can change on its own: drawn again on each new picture
  document.addEventListener("load", e => { if (cur && e.target === cur.img) paint(); }, true);

  // the mouse (and a pen): rest on a picture, then the lens follows
  document.addEventListener("pointermove", e => {
    if (e.pointerType === "touch") return;
    if (!opt("loupe.on", true) || e.buttons) { if (cur || arm) close(); return; }
    const img = pictureAt(document.elementFromPoint(e.clientX, e.clientY));
    const b = img && box(img), over = b && e.clientX >= b.x && e.clientX <= b.x + b.w && e.clientY >= b.y && e.clientY <= b.y + b.h;
    if (!over) { if (cur || arm) close(); return; }
    if (cur) {
      if (cur.img !== img) { close(); } else { cur.x = e.clientX; cur.y = e.clientY; return paint(); }
    }
    // resting: the delay starts again when the pointer moves on by more than a few pixels
    if (arm && arm.img === img && Math.hypot(e.clientX - arm.x0, e.clientY - arm.y0) < 8) { arm.x = e.clientX; arm.y = e.clientY; return; }
    clearTimeout(arm && arm.t);
    arm = { img, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY };
    arm.t = setTimeout(() => { const a = arm; arm = null; if (a) open(a.img, a.x, a.y, false); }, opt("loupe.delay", 0) * 1000);
  }, { passive: true });
  // a press (a click, a drag, a double-click into full view) puts the lens away; resting again brings it back
  document.addEventListener("pointerdown", e => { if (e.pointerType !== "touch") close(); }, true);
  document.addEventListener("pointerleave", close);
  window.addEventListener("blur", close);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && cur) close(); }, true);
  // the scroll wheel over the lens changes its magnification
  window.addEventListener("wheel", e => {
    if (!cur || cur.touch || !S) return;
    e.preventDefault(); e.stopPropagation();
    const z = opt("loupe.zoom", 3), up = e.deltaY < 0, step = z > 12 || (z === 12 && up) ? 2 : z > 4 || (z === 4 && up) ? 1 : 0.5;
    S.set("loupe.zoom", Math.max(1.5, Math.min(32, Math.round((z + (up ? step : -step)) * 2) / 2)));
  }, { passive: false, capture: true });
  if (S) for (const k of ["loupe.zoom", "loupe.size", "loupe.shape", "loupe.where"]) S.on(k, () => { if (cur) { lens.classList.toggle("round", opt("loupe.shape", "square") === "round"); paint(); } });
  if (S) S.on("loupe.on", v => { if (!v) close(); });
  if (S) S.on("loupe.mosaicFull", v => { document.querySelectorAll(".lensbtn").forEach(mark); if (!v && cur && !pictureAt(cur.img)) close(); });

  // a finger: press and hold on a picture, the lens comes up above it and follows it until it lifts. The tap that
  // would have followed (opening full view, opening a mosaic's frame) does not happen.
  let press = null, swallow = false;
  document.addEventListener("pointerdown", e => {
    if (e.pointerType !== "touch" || !opt("loupe.on", true)) return;
    const img = pictureAt(e.target), b = img && box(img);
    if (!b || e.clientX < b.x || e.clientX > b.x + b.w || e.clientY < b.y || e.clientY > b.y + b.h) return;
    press = { id: e.pointerId, img, x0: e.clientX, y0: e.clientY };
    press.t = setTimeout(() => { if (press) { open(press.img, press.x0, press.y0, true); swallow = true; } }, HOLD);
  }, true);
  document.addEventListener("pointermove", e => {
    if (!press || e.pointerId !== press.id) return;
    if (cur && cur.touch) { cur.x = e.clientX; cur.y = e.clientY; const b = box(cur.img);
      if (b) { cur.x = Math.max(b.x, Math.min(b.x + b.w, cur.x)); cur.y = Math.max(b.y, Math.min(b.y + b.h, cur.y)); } paint(); return; }
    if (Math.hypot(e.clientX - press.x0, e.clientY - press.y0) > MOVE) { clearTimeout(press.t); press = null; }
  }, true);
  const lift = e => {
    if (!press || e.pointerId !== press.id) return;
    clearTimeout(press.t); press = null;
    if (cur && cur.touch) { close(); setTimeout(() => { swallow = false; }, 400); }
  };
  document.addEventListener("pointerup", lift, true);
  document.addEventListener("pointercancel", lift, true);
  // while the lens is up, the finger moves the lens, not the page or a window
  document.addEventListener("touchmove", e => { if (cur && cur.touch) e.preventDefault(); }, { passive: false, capture: true });
  for (const t of ["click", "dblclick", "contextmenu"]) document.addEventListener(t, e => { if (swallow || (cur && cur.touch)) { e.preventDefault(); e.stopPropagation(); } }, true);

  window.cassiniLoupe = { open: (img, x, y) => open(img, x, y, false), close, isOpen: () => !!cur };
})();
</script>
