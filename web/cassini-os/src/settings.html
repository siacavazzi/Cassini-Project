<!-- Settings for Cassini OS. build.py splices the three parts below into the page: the style into the head,
     the window into #app (so the window manager picks it up) and the script before the chrome script, so every
     other script on the page (chrome, movie mode, the replay viewer) can use window.cassiniSettings.

     A setting is declared once with define() and read with get() / on(); the Settings window lists every defined
     setting, grouped by section, and saves the values on this device (localStorage cassini-os-settings-v1).

       const v = cassiniSettings.define({ key: "cameras.composites", section: "Cameras", label: "Color composites",
                                          hint: "…", type: "toggle", value: true });
       cassiniSettings.on("cameras.composites", v => { … });   // runs now and on every change
       cassiniSettings.set("cameras.composites", false);

     Types: "toggle"; "range" (min, max, step, unit); "choice" (options: [[value, "Label"], …]); "action" (run, a
     button). reload: true marks a setting that takes effect when the page is opened again. -->
<style>
#settings { width: min(620px, calc(100% - 20px)); height: min(460px, calc(100% - 80px)); z-index: 900; }
#settings .sbody { flex: 1; min-height: 0; display: grid; grid-template-columns: 138px minmax(0, 1fr); border-top: 1px solid var(--q-line); }
#settings nav { padding: 8px 6px; border-right: 1px solid var(--q-line); display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
#settings nav button { all: unset; box-sizing: border-box; padding: 5px 9px; border-radius: 5px; font-size: 12px; color: var(--q-dim); cursor: default; white-space: nowrap; }
#settings nav button:hover { background: rgba(255,255,255,.05); color: var(--q-text); }
#settings nav button[aria-selected="true"] { background: rgba(138,182,255,.18); color: #fff; }
#settings nav button:focus-visible { outline: 1px solid var(--q-accent); }
#settings .pane { overflow-y: auto; padding: 6px 16px 14px; }
#settings h3 { margin: 8px 0 4px; font-size: 11px; font-weight: normal; letter-spacing: .1em; text-transform: uppercase; color: var(--q-dim); }
#settings .note { margin: 0 0 6px; font-size: 10.5px; line-height: 1.45; color: var(--q-dim); }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--q-line); }
.srow:last-child { border-bottom: 0; }
.srow label, .srow .lab { font-size: 12px; color: var(--q-text); }
.srow .hint { grid-column: 1; font-size: 10.5px; line-height: 1.4; color: var(--q-dim); }
.srow .ctl { grid-column: 2; grid-row: 1 / span 2; display: flex; align-items: center; gap: 8px; justify-self: end; }
.srow .tag { font-size: 9.5px; color: var(--q-accent); margin-left: 6px; letter-spacing: .02em; }
/* a switch: grey when off, the one blue accent when on */
.sw { all: unset; position: relative; width: 30px; height: 17px; border-radius: 9px; background: rgba(255,255,255,.16); transition: background .2s ease; cursor: default; flex: none; }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: rgba(232,236,242,.9); transition: transform .2s ease; }
.sw[aria-checked="true"] { background: var(--q-accent); }
.sw[aria-checked="true"]::after { transform: translateX(13px); background: #fff; }
.sw:focus-visible { outline: 1px solid var(--q-accent); outline-offset: 2px; }
.srow input[type=range] { width: 130px; accent-color: var(--q-accent); }
.srow .val { min-width: 54px; text-align: right; font-size: 11px; color: var(--q-text); font-variant-numeric: tabular-nums; }
.srow .seg { flex-wrap: wrap; }
.srow .seg .btn { padding: 4px 8px; flex: none; }
.srow .act { border: 1px solid var(--q-line); border-radius: 6px; padding: 4px 10px; }
#settings footer { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 12px; border-top: 1px solid var(--q-line); font-size: 10.5px; color: var(--q-dim); }
#settings footer .btn { border: 1px solid var(--q-line); border-radius: 6px; padding: 3px 9px; }
#sgear { all: unset; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; cursor: default; color: var(--q-text); }
#sgear:hover, #sgear[aria-pressed="true"] { background: rgba(255,255,255,.14); }
#sgear svg { width: 14px; height: 14px; }
#sgear svg * { fill: none; stroke: currentColor; stroke-width: 1.3; }
/* open settings stay put while the rest of the interface rests */
body.idle #settings:not([hidden]) { opacity: 1; pointer-events: auto; }
/* settings that only show or hide parts of the page */
body.s-nolabels #labels, body.s-nolabels #reticle { display: none; }
body.s-nohudline #hudline { display: none; }
body.s-nochans .camwin .chans { display: none !important; }
body.s-nofilmstrip .camwin .filmstrip { display: none !important; }
body.s-noinfo .camwin .info { display: none; }
body.phone #settings { left: 8px !important; top: calc(env(safe-area-inset-top, 0px) + 30px) !important; width: calc(100% - 16px) !important; height: calc(100% - 50px) !important; }
body.phone #settings .sbody { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
body.phone #settings nav { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--q-line); overflow-x: auto; }
body.phone .srow input[type=range] { width: 96px; }
</style>

<section class="win" id="settings" aria-label="Settings" hidden>
  <div class="titlebar"><span class="lights"><button class="close" aria-label="Close settings">×</button><button class="min" aria-label="Close settings">–</button><button class="zoom" aria-label="Zoom">+</button></span>Settings</div>
  <div class="sbody">
    <nav id="snav" role="tablist" aria-label="Settings sections"></nav>
    <div class="pane" id="spane" role="tabpanel"></div>
  </div>
  <footer><span id="snote">Saved on this device</span><button class="btn" id="sreset">Restore defaults</button></footer>
</section>

<script>
// ---------- settings: one registry for every option on the page, and the Settings window that shows it ----------
(function () {
  const $ = id => document.getElementById(id);
  const KEY = "cassini-os-settings-v1";
  const SECTIONS = ["Interface", "Cameras", "Playback", "View", "Movie", "Data"];   // sections other code adds go after these
  const NOTES = {
    Cameras: "Every picture still goes through the full pipeline (calibration, repeat-exposure stacking, alignment, SPICE centering); these settings only choose what the camera windows show.",
    Data: "Window positions and these settings are kept in this browser only."
  };
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  const defs = new Map(), subs = new Map(), values = {};
  const store = () => { try { localStorage.setItem(KEY, JSON.stringify(values)); } catch (e) {} };
  const valid = (d, v) => {
    if (d.type === "toggle") return typeof v === "boolean";
    if (d.type === "range") return typeof v === "number" && isFinite(v) && v >= d.min && v <= d.max;
    if (d.type === "choice") return d.options.some(o => o[0] === v);
    return false;
  };
  const S = window.cassiniSettings = {
    define(d) {
      d = Object.assign({ section: "Interface", hint: "" }, d);
      defs.set(d.key, d);
      if (d.type !== "action" && !(d.key in values)) values[d.key] = valid(d, saved[d.key]) ? saved[d.key] : d.value;
      if (!SECTIONS.includes(d.section)) SECTIONS.push(d.section);
      if (!card.hidden) render();
      return values[d.key];
    },
    get: key => values[key],
    set(key, v) {
      const d = defs.get(key);
      if (!d || !valid(d, v) || values[key] === v) return;
      values[key] = v; store();
      (subs.get(key) || []).forEach(fn => fn(v));
      if (!card.hidden) sync(key);
    },
    on(key, fn) {
      if (!subs.has(key)) subs.set(key, []);
      subs.get(key).push(fn);
      if (key in values) fn(values[key]);
    },
    reset() { for (const [k, d] of defs) if (d.type !== "action") S.set(k, d.value); },
    open: () => show(true), close: () => show(false),
    get defined() { return [...defs.values()]; }
  };

  // ---------- the window ----------
  const card = $("settings"), nav = $("snav"), pane = $("spane");
  let section = "Interface";
  try { section = sessionStorage.getItem("cassini-os-settings-tab") || section; } catch (e) {}
  const fmtVal = (d, v) => d.format ? d.format(v) : `${v}${d.unit ? " " + d.unit : ""}`;
  function render() {
    const used = SECTIONS.filter(s => S.defined.some(d => d.section === s));
    if (!used.includes(section)) section = used[0];
    nav.innerHTML = used.map(s => `<button role="tab" aria-selected="${s === section}" data-s="${s}">${s}</button>`).join("");
    pane.innerHTML = `<h3>${section}</h3>` + (NOTES[section] ? `<p class="note">${NOTES[section]}</p>` : "");
    for (const d of S.defined.filter(d => d.section === section)) {
      const row = document.createElement("div"), id = "s-" + d.key.replace(/\W/g, "-");
      row.className = "srow"; row.dataset.key = d.key;
      const tag = d.reload ? '<span class="tag">after reload</span>' : "";
      let ctl = "";
      if (d.type === "toggle") ctl = `<button class="sw" id="${id}" role="switch" aria-checked="false"></button>`;
      if (d.type === "range") ctl = `<input type="range" id="${id}" min="${d.min}" max="${d.max}" step="${d.step || 1}"><span class="val"></span>`;
      if (d.type === "choice") ctl = `<div class="seg" role="radiogroup" aria-labelledby="${id}">${d.options.map((o, i) => `<button class="btn" role="radio" data-i="${i}">${o[1]}</button>`).join("")}</div>`;
      if (d.type === "action") ctl = `<button class="btn act" id="${id}">${d.button || "Run"}</button>`;
      row.innerHTML = `<${d.type === "choice" ? "span" : "label"} class="lab" id="${d.type === "choice" ? id : ""}"${d.type === "choice" ? "" : ` for="${id}"`}>${d.label}${tag}</${d.type === "choice" ? "span" : "label"}>`
        + `<div class="ctl">${ctl}</div>` + (d.hint ? `<div class="hint">${d.hint}</div>` : "");
      if (d.type === "toggle") row.querySelector(".sw").addEventListener("click", () => S.set(d.key, !values[d.key]));
      if (d.type === "range") row.querySelector("input").addEventListener("input", e => S.set(d.key, +e.target.value));
      if (d.type === "choice") row.querySelectorAll(".seg .btn").forEach(b => b.addEventListener("click", () => S.set(d.key, d.options[+b.dataset.i][0])));
      if (d.type === "action") row.querySelector(".act").addEventListener("click", () => d.run());
      pane.appendChild(row);
      sync(d.key);
    }
  }
  function sync(key) {
    const row = pane.querySelector(`.srow[data-key="${CSS.escape(key)}"]`), d = defs.get(key), v = values[key];
    if (!row) return;
    if (d.type === "toggle") row.querySelector(".sw").setAttribute("aria-checked", String(v));
    if (d.type === "range") { row.querySelector("input").value = v; row.querySelector(".val").textContent = fmtVal(d, v); }
    if (d.type === "choice") row.querySelectorAll(".seg .btn").forEach(b => { const on = d.options[+b.dataset.i][0] === v; b.setAttribute("aria-pressed", String(on)); b.setAttribute("aria-checked", String(on)); });
  }
  nav.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    section = b.dataset.s; render();
    try { sessionStorage.setItem("cassini-os-settings-tab", section); } catch (err) {}
  });
  function show(on) {
    if (on === !card.hidden) return;
    if (on) {
      render();
      card.hidden = false;
      if (!card.style.left) {   // first time: in the middle of the screen
        const r = card.getBoundingClientRect();
        Object.assign(card.style, { left: Math.max(8, (innerWidth - r.width) / 2) + "px", top: Math.max(30, (innerHeight - r.height) / 2.4) + "px" });
      }
      card.dispatchEvent(new Event("pointerdown"));   // to the front
    } else card.hidden = true;
    const g = $("sgear"); if (g) g.setAttribute("aria-pressed", String(on));
  }
  // closing or minimizing the window just closes it (it never goes to the menu-bar tray)
  card.addEventListener("click", e => { if (e.target.closest(".close, .min")) { e.stopImmediatePropagation(); show(false); } }, true);
  card.addEventListener("dblclick", e => { if (e.target.closest(".titlebar")) { e.stopImmediatePropagation(); show(false); } }, true);
  $("sreset").addEventListener("click", () => S.reset());
  window.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key === ",") { e.preventDefault(); show(card.hidden); }
    else if (e.key === "Escape" && !card.hidden) { e.stopImmediatePropagation(); show(false); }
  }, true);
  document.addEventListener("click", e => {
    const b = e.target.closest('[data-act="settings"], #sgear'); if (!b) return;
    e.stopPropagation(); document.querySelectorAll(".menu.open").forEach(m => m.classList.remove("open"));
    show(card.hidden);
  }, true);

  // ---------- the settings Cassini OS already had, gathered here ----------
  const D = d => S.define(d), cls = (key, name, on) => S.on(key, v => document.body.classList.toggle(name, v === on));
  // Interface (the chrome script reads interface.autohide, interface.idleDelay and interface.hud)
  D({ key: "interface.autohide", section: "Interface", label: "Hide interface when idle", type: "toggle", value: true,
      hint: "Menus and windows fade out when the pointer rests, so the view has the screen to itself." });
  D({ key: "interface.idleDelay", section: "Interface", label: "Fade after", type: "range", value: 3.5, min: 1, max: 30, step: 0.5, unit: "s",
      hint: "How long the pointer has to rest before the interface fades." });
  D({ key: "interface.hud", section: "Interface", label: "Neon HUD", type: "toggle", value: true,
      hint: "Orbits, Cassini's trail and the camera cone drawn with a glow." });
  D({ key: "interface.labels", section: "Interface", label: "Body labels", type: "toggle", value: true,
      hint: "Names and ranges next to Saturn, the moons and Cassini, and the target bracket." });
  cls("interface.labels", "s-nolabels", false);
  D({ key: "interface.hudline", section: "Interface", label: "Flight data strip", type: "toggle", value: true,
      hint: "Target, altitude, speed, camera and pointing along the top of the view." });
  cls("interface.hudline", "s-nohudline", false);
  // Cameras (the camera windows read cameras.composites, cameras.steady, cameras.mosaics, cameras.passes, cameras.fullRes, cameras.fullDelay and cameras.stale)
  D({ key: "cameras.composites", section: "Cameras", label: "Color composites", type: "toggle", value: true,
      hint: "Once a filter set is complete, show its color picture. Off shows every frame on its own." });
  D({ key: "cameras.balancedColor", section: "Cameras", label: "Balanced color", type: "toggle", value: true,
      hint: "A gentler color stretch: black sits just above the sky's noise so grain and scan lines stay dark, white sits at the bright part of the body but never stretches dim pictures far, bright edges roll off instead of clipping, and mosaic tiles are evened out without changing the mosaic's overall level. Off shows the earlier stretch." });
  // what the frame server's picture routes are asked to add for it: nothing, or the earlier stretch
  window.cassiniLook = () => S.get("cameras.balancedColor") === false ? "&look=classic" : "";
  D({ key: "cameras.channels", section: "Cameras", label: "Filter channels", type: "toggle", value: true,
      hint: "The frames that make up a color picture, in a strip under it." });
  cls("cameras.channels", "s-nochans", false);
  D({ key: "cameras.details", section: "Cameras", label: "Frame details", type: "toggle", value: true,
      hint: "Status, frame, filter, color and scale under each picture." });
  cls("cameras.details", "s-noinfo", false);
  D({ key: "cameras.steady", section: "Cameras", label: "Steady picture size", type: "toggle", value: true,
      hint: "While a color set or a mosaic builds, the picture keeps its size: the filter strip stays in place for the whole observation and a mosaic's shape holds until the observation ends. Off lets the window fit each picture." });
  cls("cameras.steady", "s-steady", true);
  D({ key: "cameras.mosaics", section: "Cameras", label: "Mosaics in camera windows", type: "toggle", value: true,
      hint: "When Cassini steps a camera across a body, the window builds the mosaic tile by tile. Off shows every frame on its own." });
  D({ key: "cameras.passes", section: "Cameras", label: "Mosaic passes", type: "choice", value: "auto",
      options: [["auto", "Auto"], ["mosaic", "Always mosaic"], ["movie", "Always movie"], ["mosaic_movie", "Always mosaic movie"]],
      hint: "How a pass of pictures plays: Auto builds the passes that step across a body as mosaics, rolls the ones that go round the same places again and again as mosaic movies, and plays movies and stares as frames. The others force one way for every pass. The chip on a picture changes it for one pass." });
  D({ key: "cameras.fullRes", section: "Cameras", label: "Full resolution in full view", type: "toggle", value: true,
      hint: "A picture in full view (double-click it, F or the title bar button) loads at the camera's full resolution, with a button to save it. Live playback, bursts and movies stay at the smaller size." });
  D({ key: "cameras.fullDelay", section: "Cameras", label: "Full resolution while playing after", type: "range", value: 1.5, min: 0.5, max: 10, step: 0.5, unit: "s",
      hint: "While the timeline plays, a picture in full view loads in full once it has stayed up this long; paused, it loads at once." });
  D({ key: "cameras.stale", section: "Cameras", label: "Clear a quiet camera after", type: "range", value: 6, min: 1, max: 48, step: 1, unit: "h",
      hint: "A camera that has taken nothing for this long shows Idle instead of its last picture." });

  // the replay viewer's own options: applied once it has loaded, and kept in step with its buttons
  function whenReady(fn) {
    const go = () => { if (typeof state !== "undefined" && $("loading").hidden && typeof setSpeed === "function") { fn(); return true; } };
    if (go()) return;
    const mo = new MutationObserver(() => { if (go()) mo.disconnect(); });
    mo.observe($("loading"), { attributes: true, attributeFilter: ["hidden"] });
  }
  // a dock button that switches a viewer option, mirrored by a setting both ways
  function mirror(key, btn) {
    whenReady(() => {
      const b = $(btn), pressed = () => b.getAttribute("aria-pressed") === "true";
      S.on(key, v => { if (pressed() !== v) b.click(); });
      new MutationObserver(() => S.set(key, pressed())).observe(b, { attributes: true, attributeFilter: ["aria-pressed"] });
    });
  }
  D({ key: "playback.start", section: "Playback", label: "Start time", type: "choice", value: "2006-09-15T14:28:00", reload: true,
      options: [["2006-09-15T14:28:00", "In Saturn's Shadow"], ["2005-01-14T09:30:00", "Huygens lands"], ["2004-07-01T00:00:00", "Saturn arrival"]],
      hint: "The moment Cassini OS opens on. A ?t= link still wins." });
  D({ key: "playback.autoplay", section: "Playback", label: "Play when Cassini OS opens", type: "toggle", value: true,
      hint: "Off opens paused at the starting moment." });
  D({ key: "playback.speed", section: "Playback", label: "Starting speed", type: "choice", value: 600,
      options: [[60, "1 min/s"], [600, "10 min/s"], [3600, "1 h/s"], [21600, "6 h/s"], [86400, "1 day/s"]],
      hint: "Mission time per second of playback when the page opens. Jumping to a moment still picks its own speed." });
  D({ key: "playback.span", section: "Playback", label: "Timeline shows", type: "choice", value: 432000,
      options: [[86400, "Day"], [432000, "5 days"], [604800, "Week"], [2592000, "Month"]],
      hint: "How much of the mission the timeline covers when the page opens." });
  whenReady(() => {
    if (!S.get("playback.autoplay")) setPlaying(false);
    setSpeed(S.get("playback.speed"));
    const span = S.get("playback.span"); if (span !== 432000) setView(span, state.et + span * 0.3);
  });
  S.on("playback.speed", v => { if (typeof state !== "undefined" && typeof setSpeed === "function" && $("loading").hidden) setSpeed(v); });
  S.on("playback.span", v => { if (typeof state !== "undefined" && typeof setView === "function" && $("loading").hidden) setView(v, state.et + v * 0.3); });
  // View
  D({ key: "view.allOrbits", section: "View", label: "All moons", type: "toggle", value: false, hint: "Draw every moon's orbit, not only the nearby ones." });
  mirror("view.allOrbits", "allorbits");
  D({ key: "view.enlarge", section: "View", label: "Enlarge moons ×10", type: "toggle", value: false, hint: "Moons drawn ten times their size so they can be seen from afar." });
  mirror("view.enlarge", "enlarge");
  // a new key, so a saved "off" from when follow started off does not carry over
  D({ key: "view.followcam", section: "View", label: "Follow camera", type: "toggle", value: true, hint: "Look where Cassini's camera points (needs the pointing data)." });
  mirror("view.followcam", "followcam");
  // the viewer's follow camera reads view.spinHold, view.spinTurn and view.spinEase
  D({ key: "view.spinHold", section: "View", label: "Hold still through spins", type: "toggle", value: true,
      hint: "When Cassini rolls for hours for its fields-and-particles instruments (no pictures), the follow camera keeps looking where it was instead of spinning with it. Off follows every turn." });
  D({ key: "view.spinTurn", section: "View", label: "Counts as a spin after", type: "range", value: 300, min: 180, max: 1080, step: 30, unit: "°",
      hint: "How far Cassini has to keep turning without a pause before the view holds. Turns between targets stay under about 200°." });
  D({ key: "view.spinEase", section: "View", label: "Ease back over", type: "range", value: 4, min: 1, max: 15, step: 1, unit: "s",
      hint: "How long the view takes to swing back to the camera's pointing once a spin ends." });
  D({ key: "view.textures", section: "View", label: "Surface maps", type: "choice", value: "2k", reload: true,
      options: [["0", "Off"], ["1k", "1k"], ["2k", "2k"], ["4k", "4k"]],
      hint: "Map size for Saturn and the moons. 4k is sharper and slower to load; Off keeps the plain painted look. A ?tex= link still wins." });
  // Movie
  D({ key: "movie.fps", section: "Movie", label: "Movie speed", type: "range", value: 8, min: 2, max: 24, step: 1, unit: "fps",
      hint: "Frames per second in movie mode (M). The slider in the Movie window changes this too." });
  D({ key: "movie.processed", section: "Movie", label: "Processed pictures", type: "toggle", value: true,
      hint: "Movie frames made by the pipeline like the camera windows' pictures: calibrated, color composites and mosaics. Off plays the archive frames as they are, with no processing. The Processed button in the Movie window (or P) switches it too." });
  D({ key: "movie.mosaics", section: "Movie", label: "Mosaics in movies", type: "toggle", value: true,
      hint: "With processed pictures on, a mosaic pass builds its mosaic in the film. Off shows each tile on its own." });
  // movie passes in the camera and body windows (head-quiet.html cameraFeed reads these)
  D({ key: "movies.steady", section: "Movie", label: "Steady movie passes", type: "toggle", value: true,
      hint: "When a pass plays as a movie in a camera or body window (a stare, a ring or storm movie), every frame is centered by SPICE, north up, on one brightness scale and one size for the whole pass, so the body holds still and the picture does not pump. Off shows each frame as it is." });
  D({ key: "movies.center", section: "Movie", label: "Center the body", type: "toggle", value: true,
      hint: "In a steady movie pass, the body sits in the middle of every frame, north up, when its whole disk fits the picture (a moon, a planet from far off). A ring or spoke movie close to Saturn keeps its own view. Off keeps the view the frames cover, with the body where the camera put it." });
  D({ key: "movies.filmstrip", section: "Movie", label: "Filmstrip", type: "toggle", value: true,
      hint: "Under a window playing a movie pass: every frame of the pass along a strip, with the frames around the one shown. Click or drag along it to move through the pass." });
  cls("movies.filmstrip", "s-nofilmstrip", false);
  D({ key: "movies.trail", section: "Movie", label: "Rolling trail", type: "range", value: 0, min: 0, max: 12, step: 1, unit: "frames",
      hint: "In a steady movie pass, this many earlier frames of the same filter stay under the newest one, fading with age, so a moving moon or a ring's shadow leaves a short trail. 0 shows each frame alone." });
  D({ key: "movies.laps", section: "Movie", label: "Mosaic movies keep", type: "range", value: 1, min: 1, max: 6, step: 1, unit: "laps",
      hint: "A mosaic movie (the camera going over the same mosaic again and again, as on the approach to Jupiter) plays as a mosaic that never empties: each new tile replaces its own earlier copy. 1 is a time-lapse; more keeps that many copies of each tile, older ones under the newest." });
  window.addEventListener("DOMContentLoaded", () => {
    const r = $("mvfps"); if (!r) return;
    try { const f = +localStorage.getItem("cassini-os-movie-fps"); if (f >= 2 && f <= 24 && !("movie.fps" in saved)) S.set("movie.fps", f); } catch (e) {}
    S.on("movie.fps", v => { if (+r.value !== v) { r.value = v; r.dispatchEvent(new Event("input")); } });
    r.addEventListener("input", () => S.set("movie.fps", +r.value));
  });
  // Data
  D({ key: "data.layout", section: "Data", label: "Window layout", type: "action", button: "Reset",
      hint: "Put every window back where it starts and bring back the ones tucked into the menu bar.",
      run() { try { localStorage.removeItem("cassini-os-layout-v2"); } catch (e) {} location.reload(); } });
  D({ key: "data.reset", section: "Data", label: "All settings", type: "action", button: "Restore defaults",
      hint: "Every setting back to how Cassini OS ships.", run: () => S.reset() });
})();
</script>
