<!-- Settings for Cassini OS. build.py splices the three parts below into the page: the style into the head,
     the window into #app (so the window manager picks it up) and the script before the chrome script, so every
     other script on the page (chrome, movie mode, the replay viewer) can use window.cassiniSettings.

     A setting is declared once with define() and read with get() / on(); the Settings window lists every defined
     setting, grouped by section, and saves the values on this device (localStorage cassini-os-settings-v1), each
     with the default it had then, so a value left at its default follows a new default. was: [the defaults it had
     before] does the same for values saved before the defaults were kept with them.

       const v = cassiniSettings.define({ key: "cameras.composites", section: "Cameras", label: "Color composites",
                                          hint: "…", type: "toggle", value: true });
       cassiniSettings.on("cameras.composites", v => { … });   // runs now and on every change
       cassiniSettings.set("cameras.composites", false);

     Types: "toggle"; "range" (min, max, step, unit; log: true slides on a log scale from min to max, landing on
     the nearest of stops when given); "choice" (options: [[value, "Label"], …]; menu: true shows a drop-down menu
     instead of buttons, for a long list); "action" (run, a
     button). reload: true marks a setting that takes effect when the page is opened again. -->
<style>
#settings { width: min(620px, calc(100% - 20px)); height: min(460px, calc(100% - 80px)); z-index: 900; }
#settings .sbody { flex: 1; min-height: 0; display: grid; grid-template-columns: 138px minmax(0, 1fr); border-top: 1px solid var(--q-line); }
#settings nav { padding: 8px 6px; border-right: 1px solid var(--q-line); display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
#settings nav button { all: unset; box-sizing: border-box; padding: 5px 9px; border-radius: 5px; font-size: 12px; color: var(--q-dim); cursor: default; white-space: nowrap; }
#settings nav button:hover { background: rgba(255,255,255,.05); color: var(--q-text); }
#settings nav button[aria-selected="true"] { background: rgba(138,182,255,.18); color: #fff; }
#settings nav button:focus-visible { outline: 1px solid var(--q-accent); }
#settings .pane { overflow-y: auto; padding: 6px 16px 14px; }
#settings h3 { margin: 8px 0 4px; font-size: 11px; font-weight: normal; letter-spacing: .1em; text-transform: uppercase; color: var(--q-dim); }
#settings .note { margin: 0 0 6px; font-size: 10.5px; line-height: 1.45; color: var(--q-dim); }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--q-line); }
.srow:last-child { border-bottom: 0; }
.srow label, .srow .lab { font-size: 12px; color: var(--q-text); }
.srow .hint { grid-column: 1; font-size: 10.5px; line-height: 1.4; color: var(--q-dim); }
.srow .ctl { grid-column: 2; grid-row: 1 / span 2; display: flex; align-items: center; gap: 8px; justify-self: end; }
.srow .tag { font-size: 9.5px; color: var(--q-accent); margin-left: 6px; letter-spacing: .02em; }
/* a switch: grey when off, the one blue accent when on */
.sw { all: unset; position: relative; width: 30px; height: 17px; border-radius: 9px; background: rgba(255,255,255,.16); transition: background .2s ease; cursor: default; flex: none; }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: rgba(232,236,242,.9); transition: transform .2s ease; }
.sw[aria-checked="true"] { background: var(--q-accent); }
.sw[aria-checked="true"]::after { transform: translateX(13px); background: #fff; }
.sw:focus-visible { outline: 1px solid var(--q-accent); outline-offset: 2px; }
.srow input[type=range] { width: 130px; accent-color: var(--q-accent); }
.srow .val { min-width: 54px; text-align: right; font-size: 11px; color: var(--q-text); font-variant-numeric: tabular-nums; }
.srow .seg { flex-wrap: wrap; }
.srow select { font: inherit; font-size: 11.5px; color: var(--q-text); background: rgba(255,255,255,.07); border: 1px solid var(--q-line); border-radius: 5px; padding: 3px 6px; max-width: 220px; }
.srow select:focus-visible { outline: 1px solid var(--q-accent); }
.srow select option { background: #1b1e24; color: #e8ecf2; }
.srow .seg .btn { padding: 4px 8px; flex: none; }
.srow .act { border: 1px solid var(--q-line); border-radius: 6px; padding: 4px 10px; }
#settings footer { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 12px; border-top: 1px solid var(--q-line); font-size: 10.5px; color: var(--q-dim); }
#settings footer .btn { border: 1px solid var(--q-line); border-radius: 6px; padding: 3px 9px; }
#sgear { all: unset; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; cursor: default; color: var(--q-text); }
#sgear:hover, #sgear[aria-pressed="true"] { background: rgba(255,255,255,.14); }
#sgear svg { width: 14px; height: 14px; }
#sgear svg * { fill: none; stroke: currentColor; stroke-width: 1.3; }
/* open settings stay put while the rest of the interface rests */
body.idle #settings:not([hidden]) { opacity: 1; pointer-events: auto; }
/* settings that only show or hide parts of the page */
body.s-nolabels #labels, body.s-nolabels #reticle { display: none; }
body.s-nohudline #mread { display: none; }
body.s-nochans .camwin .chans { display: none !important; }
body.s-nofilmstrip .camwin .filmstrip { display: none !important; }
body.s-noinfo .camwin .info { display: none; }
body.phone #settings { left: 8px !important; top: calc(env(safe-area-inset-top, 0px) + 30px) !important; width: calc(100% - 16px) !important; height: calc(100% - 50px) !important; }
body.phone #settings .sbody { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
body.phone #settings nav { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--q-line); overflow-x: auto; }
body.phone .srow input[type=range] { width: 96px; }
</style>

<section class="win" id="settings" aria-label="Settings" hidden>
  <div class="titlebar"><span class="lights"><button class="close" aria-label="Close settings">×</button><button class="min" aria-label="Close settings">–</button><button class="zoom" aria-label="Zoom">+</button></span>Settings</div>
  <div class="sbody">
    <nav id="snav" role="tablist" aria-label="Settings sections"></nav>
    <div class="pane" id="spane" role="tabpanel"></div>
  </div>
  <footer><span id="snote">Saved on this device</span><button class="btn" id="sreset">Restore defaults</button></footer>
</section>

<script>
// ---------- settings: one registry for every option on the page, and the Settings window that shows it ----------
(function () {
  const $ = id => document.getElementById(id);
  const KEY = "cassini-os-settings-v1";
  const SECTIONS = ["Interface", "Cameras", "Processing", "Playback", "View", "Movie", "Data"];   // sections other code adds go after these
  const NOTES = {
    Cameras: "These settings choose what the camera windows show and how long. How each picture is made is under Processing.",
    Processing: "Each step the pictures go through, in the order they run. With everything on you see the mission's pictures processed; turn a step off to see what it does. A picture with a step off is made the first time it is asked for (a few seconds); with everything on it comes from the cache at once.",
    Data: "Window positions and these settings are kept in this browser only."
  };
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  // the defaults the values were saved with (DEFAULTS): a value saved at its default then follows the default now
  const DEFAULTS = "~defaults", savedDefaults = saved[DEFAULTS] && typeof saved[DEFAULTS] === "object" ? saved[DEFAULTS] : {};
  const defs = new Map(), subs = new Map(), values = {};
  const store = () => {
    const defaults = {};
    for (const [k, d] of defs) if (d.type !== "action") defaults[k] = d.value;
    try { localStorage.setItem(KEY, JSON.stringify({ ...values, [DEFAULTS]: defaults })); } catch (e) {}
  };
  const valid = (d, v) => {
    if (d.type === "toggle") return typeof v === "boolean";
    if (d.type === "range") return typeof v === "number" && isFinite(v) && v >= d.min && v <= d.max;
    if (d.type === "choice") return d.options.some(o => o[0] === v);
    return false;
  };
  const S = window.cassiniSettings = {
    define(d) {
      d = Object.assign({ section: "Interface", hint: "" }, d);
      defs.set(d.key, d);
      if (d.type !== "action" && !(d.key in values)) {
        const v = saved[d.key], atDefault = d.key in savedDefaults ? [savedDefaults[d.key]] : d.was || [];
        values[d.key] = valid(d, v) && !atDefault.includes(v) ? v : d.value;
      }
      if (!SECTIONS.includes(d.section)) SECTIONS.push(d.section);
      if (!card.hidden) render();
      return values[d.key];
    },
    get: key => values[key],
    set(key, v) {
      const d = defs.get(key);
      if (!d || !valid(d, v) || values[key] === v) return;
      values[key] = v; store();
      (subs.get(key) || []).forEach(fn => fn(v));
      if (!card.hidden) sync(key);
    },
    on(key, fn) {
      if (!subs.has(key)) subs.set(key, []);
      subs.get(key).push(fn);
      if (key in values) fn(values[key]);
    },
    reset() { for (const [k, d] of defs) if (d.type !== "action") S.set(k, d.value); },
    open: () => show(true), close: () => show(false),
    get defined() { return [...defs.values()]; }
  };

  // ---------- the window ----------
  const card = $("settings"), nav = $("snav"), pane = $("spane");
  let section = "Interface";
  try { section = sessionStorage.getItem("cassini-os-settings-tab") || section; } catch (e) {}
  const fmtVal = (d, v) => d.format ? d.format(v) : `${v}${d.unit ? " " + d.unit : ""}`;
  // a log range: the slider runs 0..1000 and the value between min and max, on the nearest of its stops
  const logPos = (d, v) => Math.round(1000 * Math.log(v / d.min) / Math.log(d.max / d.min));
  const logVal = (d, p) => {
    const v = d.min * Math.pow(d.max / d.min, p / 1000);
    return d.stops ? d.stops.reduce((a, b) => Math.abs(Math.log(b / v)) < Math.abs(Math.log(a / v)) ? b : a) : Math.round(v);
  };
  function render() {
    const used = SECTIONS.filter(s => S.defined.some(d => d.section === s));
    if (!used.includes(section)) section = used[0];
    nav.innerHTML = used.map(s => `<button role="tab" aria-selected="${s === section}" data-s="${s}">${s}</button>`).join("");
    pane.innerHTML = `<h3>${section}</h3>` + (NOTES[section] ? `<p class="note">${NOTES[section]}</p>` : "");
    for (const d of S.defined.filter(d => d.section === section)) {
      const row = document.createElement("div"), id = "s-" + d.key.replace(/\W/g, "-");
      row.className = "srow"; row.dataset.key = d.key;
      const tag = d.reload ? '<span class="tag">after reload</span>' : "";
      let ctl = "";
      if (d.type === "toggle") ctl = `<button class="sw" id="${id}" role="switch" aria-checked="false"></button>`;
      if (d.type === "range") ctl = d.log ? `<input type="range" id="${id}" min="0" max="1000" step="1"><span class="val"></span>`
        : `<input type="range" id="${id}" min="${d.min}" max="${d.max}" step="${d.step || 1}"><span class="val"></span>`;
      if (d.type === "choice" && d.menu) ctl = `<select id="${id}-m" aria-labelledby="${id}">${d.options.map((o, i) => `<option value="${i}">${o[1]}</option>`).join("")}</select>`;
      else if (d.type === "choice") ctl = `<div class="seg" role="radiogroup" aria-labelledby="${id}">${d.options.map((o, i) => `<button class="btn" role="radio" data-i="${i}">${o[1]}</button>`).join("")}</div>`;
      if (d.type === "action") ctl = `<button class="btn act" id="${id}">${d.button || "Run"}</button>`;
      row.innerHTML = `<${d.type === "choice" ? "span" : "label"} class="lab" id="${d.type === "choice" ? id : ""}"${d.type === "choice" ? "" : ` for="${id}"`}>${d.label}${tag}</${d.type === "choice" ? "span" : "label"}>`
        + `<div class="ctl">${ctl}</div>` + (d.hint ? `<div class="hint">${d.hint}</div>` : "");
      if (d.type === "toggle") row.querySelector(".sw").addEventListener("click", () => S.set(d.key, !values[d.key]));
      if (d.type === "range") row.querySelector("input").addEventListener("input", e => S.set(d.key, d.log ? logVal(d, +e.target.value) : +e.target.value));
      if (d.type === "choice") row.querySelectorAll(".seg .btn").forEach(b => b.addEventListener("click", () => S.set(d.key, d.options[+b.dataset.i][0])));
      if (d.type === "choice" && d.menu) row.querySelector("select").addEventListener("change", e => S.set(d.key, d.options[+e.target.value][0]));
      if (d.type === "action") row.querySelector(".act").addEventListener("click", () => d.run());
      pane.appendChild(row);
      sync(d.key);
    }
  }
  function sync(key) {
    const row = pane.querySelector(`.srow[data-key="${CSS.escape(key)}"]`), d = defs.get(key), v = values[key];
    if (!row) return;
    if (d.type === "toggle") row.querySelector(".sw").setAttribute("aria-checked", String(v));
    if (d.type === "range") { row.querySelector("input").value = d.log ? logPos(d, v) : v; row.querySelector(".val").textContent = fmtVal(d, v); }
    if (d.type === "choice" && d.menu) row.querySelector("select").value = String(d.options.findIndex(o => o[0] === v));
    if (d.type === "choice") row.querySelectorAll(".seg .btn").forEach(b => { const on = d.options[+b.dataset.i][0] === v; b.setAttribute("aria-pressed", String(on)); b.setAttribute("aria-checked", String(on)); });
  }
  nav.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    section = b.dataset.s; render();
    try { sessionStorage.setItem("cassini-os-settings-tab", section); } catch (err) {}
  });
  function show(on) {
    if (on === !card.hidden) return;
    if (on) {
      render();
      card.hidden = false;
      if (!card.style.left) {   // first time: in the middle of the screen
        const r = card.getBoundingClientRect();
        Object.assign(card.style, { left: Math.max(8, (innerWidth - r.width) / 2) + "px", top: Math.max(30, (innerHeight - r.height) / 2.4) + "px" });
      }
      card.dispatchEvent(new Event("pointerdown"));   // to the front
    } else card.hidden = true;
    const g = $("sgear"); if (g) g.setAttribute("aria-pressed", String(on));
  }
  // closing or minimizing the window just closes it (it never goes to the menu-bar tray)
  card.addEventListener("click", e => { if (e.target.closest(".close, .min")) { e.stopImmediatePropagation(); show(false); } }, true);
  card.addEventListener("dblclick", e => { if (e.target.closest(".titlebar")) { e.stopImmediatePropagation(); show(false); } }, true);
  $("sreset").addEventListener("click", () => S.reset());
  window.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key === ",") { e.preventDefault(); show(card.hidden); }
    else if (e.key === "Escape" && !card.hidden) { e.stopImmediatePropagation(); show(false); }
  }, true);
  document.addEventListener("click", e => {
    const b = e.target.closest('[data-act="settings"], #sgear'); if (!b) return;
    e.stopPropagation(); document.querySelectorAll(".menu.open").forEach(m => m.classList.remove("open"));
    show(card.hidden);
  }, true);

  // ---------- the settings Cassini OS already had, gathered here ----------
  const D = d => S.define(d), cls = (key, name, on) => S.on(key, v => document.body.classList.toggle(name, v === on));
  // Interface (the chrome script reads interface.autohide, interface.idleDelay and interface.hud)
  D({ key: "interface.autohide", section: "Interface", label: "Hide interface when idle", type: "toggle", value: true,
      hint: "Menus and windows fade out when the pointer rests, so the view has the screen to itself." });
  D({ key: "interface.idleDelay", section: "Interface", label: "Fade after", type: "range", value: 3.5, min: 1, max: 30, step: 0.5, unit: "s",
      hint: "How long the pointer has to rest before the interface fades." });
  D({ key: "interface.hud", section: "Interface", label: "Neon HUD", type: "toggle", value: true,
      hint: "Orbits, Cassini's trail and the camera cone drawn with a glow." });
  D({ key: "interface.labels", section: "Interface", label: "Body labels", type: "toggle", value: true,
      hint: "Names and ranges next to Saturn, the moons and Cassini, and the target bracket." });
  cls("interface.labels", "s-nolabels", false);
  D({ key: "interface.hudline", section: "Interface", label: "Flight readout in the menu bar", type: "toggle", value: true,
      hint: "Cassini's altitude above the nearest body and its speed relative to it, in the menu bar. Off, they show under the clock in the dock." });
  cls("interface.hudline", "s-nohudline", false);
  // Processing: every step the picture pipeline takes, in the order it takes them, each on by default and each
  // switched off on its own to see what it does (the camera windows read cameras.*; processing.* go to the frame
  // server as off=, calibration.STEPS, which keeps pictures made with a step off in caches of their own)
  D({ key: "cameras.processedFrames", section: "Processing", label: "Processed single frames", type: "toggle", value: true,
      hint: "A frame shown on its own goes through the pipeline like a color picture's channels: repeat exposures stacked, calibrated, lost lines filled, on the same display stretch. Off shows the frame as it is in the archive." });
  window.cassiniSteps = [
    { key: "processing.stack", step: "stack", label: "Stack repeat exposures",
      hint: "Frames Cassini took again of the same thing, with the same filter and exposure, are averaged into one picture, which cuts the noise (a plain stack). Off shows each frame alone." },
    { key: "processing.hdr", step: "hdr", label: "HDR merge",
      hint: "In mosaics, mosaic movies and the body reels, an exposure bracket (short exposures for the bright parts, long ones for the faint) is merged into one picture that has the range of both. Off merges only identical exposures, like the plain stack. Needs Stack repeat exposures." },
    { key: "processing.fill", step: "fill", label: "Fill lost lines",
      hint: "Lines a frame lost on its way to Earth are filled from the lines round them, so they don't show as black stripes or throw off the stretch. Off leaves them black." },
    { key: "processing.calibrate", step: "calibrate", label: "Calibrate",
      hint: "Every frame is turned into reflectance (I/F: bias, exposure, gain, filter and distance from the Sun taken out) and drawn on one display scale, so filters and mosaic tiles match and colors are true. Off shows each frame on the archive's own stretch, as it came down." },
    { key: "processing.dark", step: "dark", label: "Dark current",
      hint: "Takes out the charge the camera's detector gathers without any light, which grows with the exposure and with how long each line waits to be read out, with the camera team's own dark model. Most visible on long exposures: night sides, rings, Titan's surface. Off leaves them in. Needs Calibrate." },
    { key: "processing.flat", step: "flat", label: "Flat field",
      hint: "Takes out what the camera itself adds to every picture, with the mission's own calibration maps: the dust rings (shadows of dust on the narrow-angle camera's optics, more of them as the mission went on), the fine mottle that appeared in late 2003, the darker corners and the faint column pattern of the detector. Off leaves them in. Needs Calibrate." },
    { key: "processing.hotpix", step: "hotpix", label: "Hot pixels",
      hint: "The detector pixels that went hot or dead over the mission (the camera team's lists, and the far more the archive's own frames show, month by month) are filled in from the pixels round them, so they don't show as dots that stay put while the stars and the moon move in a movie. A star that lands exactly on one is filled in too. Off leaves them in. Needs Calibrate." },
    { key: "processing.align", step: "align", label: "Align",
      hint: "A color set's channels, taken seconds or minutes apart, are moved onto one another, and a mosaic's filters onto each other's tiles. Off lays them over one another as the camera pointed, so moving bodies show colored fringes." },
    { key: "processing.blend", step: "blend", label: "Blend mosaic seams",
      hint: "Where two mosaic tiles meet, their pictures fade into each other and the mosaic stays solid, with its soft edge only along its outside. Off draws each tile with its own soft edge, as before, which leaves a faint dark line along the seams and a notch where a seam meets the mosaic's edge." },
    { key: "processing.level", step: "level", label: "Level mosaic seams",
      hint: "Evens out the brightness where mosaic tiles overlap, smoothly across each tile, as the planetary mosaic tools do (a gentle brightness field per tile, solved together so no tile's step shows at a seam). Works with Blend mosaic seams on; off blends the tiles as they are." },
    { key: "processing.surface", step: "surface", label: "Mosaic surface at one moment",
      hint: "A mosaic's panels are taken minutes apart, and the moon turns and Cassini moves in between, so the same crater sits 8 to 18 pixels apart in neighboring panels and doubles or steps at their seam. On, each panel's surface is redrawn as it was at the middle of the pass, from SPICE's shape, spin and Cassini's position; the limb, the sky and the rings stay where they are. Off shows each panel as it was taken." },
    { key: "processing.panels", step: "panels", label: "Line up mosaic panels",
      hint: "SPICE places each mosaic panel from where Cassini was said to point, 3 to 5 pixels off and differently for each panel. On, each panel is matched to the panels taken before it where they overlap (by what the pictures show) and moved by the few pixels it is off (12 at most), all its filters together. Panels with nothing to match on stay where SPICE puts them. Needs Align." }
  ];
  for (const st of window.cassiniSteps) D({ key: st.key, section: "Processing", label: st.label, type: "toggle", value: true, hint: st.hint });
  D({ key: "cameras.composites", section: "Processing", label: "Color composites", type: "toggle", value: true,
      hint: "Once a filter set is complete, show its color picture. Off shows every frame on its own." });
  D({ key: "cameras.balancedColor", section: "Processing", label: "Balanced color", type: "toggle", value: true,
      hint: "A gentler color stretch: black sits just above the sky's noise so grain and scan lines stay dark, white sits at the bright part of the body but never stretches dim pictures far, bright edges roll off instead of clipping, and mosaic tiles are evened out without changing the mosaic's overall level. Off shows the earlier stretch." });
  D({ key: "cameras.colors", section: "Processing", label: "Filter colors", type: "choice", value: "natural",
      options: [["natural", "Natural color"], ["raw", "Raw filters"]],
      hint: "Natural color turns red, green and blue filter sets into the colors an eye would see, and balances false color sets (methane, ultraviolet, infrared) so the planet comes out gray and only its differences between filters show as color. Raw filters draws each filter straight as a channel. Needs Balanced color." });
  D({ key: "cameras.autoCenter", section: "Processing", label: "Auto center", type: "toggle", value: true,
      hint: "Every picture of a moon or a planet whose whole disk fits is turned north up with the body in the middle, by SPICE, at one size for the whole pass, so the body holds still from picture to picture. Ring, spoke and sky pictures, and a body too big for the picture, stay as the camera took them. Each camera window's settings button (the slider icon in its title bar) can turn it on or off for that window." });
  // right under Auto center (as in each camera window's settings menu): how a movie pass is steadied
  D({ key: "movies.stabilize", section: "Processing", label: "Image stabilization", type: "toggle", value: false,
      hint: "SPICE places each frame of a movie pass from where Cassini was said to point, and that is a few pixels off, differently from frame to frame, so a moon or Jupiter's clouds can wobble. On, each frame is matched to the frame before it by what the pictures show (the pipeline's own alignment, with SPICE's place as the starting guess), and held to SPICE over a longer stretch so the body stays where it is. Feature tracks (a cloud followed across Saturn) are always steadied. Off shows every frame where SPICE puts it." });
  D({ key: "movies.stabilizeSmooth", section: "Processing", label: "Stabilization smoothing", type: "range", value: 12, min: 4, max: 60, step: 4, unit: "frames",
      hint: "How long the pictures are believed over SPICE (with Image stabilization on). Low takes out only the frame-to-frame wobble and follows SPICE closely; high also holds slow drifts still, trusting the frame-to-frame matching over that many frames." });
  D({ key: "movies.stabilizeLocal", section: "Processing", label: "Steady movies on this computer", type: "toggle", value: true,
      hint: "Image stabilization and exposure normalization worked out by this computer, at any smoothing: it moves and brightens the frame the server already has, instead of the server drawing every frame again for each setting. True-color frames and a trail too; false-color sets, feature tracks and passes whose view follows the frames are still drawn by the server, and exports are always made by the server. Off asks the server to draw every frame again for each setting, which is slower and is not offered when many people are watching." });
  D({ key: "movies.exposure", section: "Processing", label: "Exposure normalization", type: "toggle", value: true, was: [false],
      hint: "A movie pass is drawn on one brightness scale, so a frame whose exposure the calibration did not fully even out, or one lit by stray light, flashes or jumps in brightness. On, each picture's brightness is measured against the picture before it, a frame or two far brighter or darker than their neighbours are brought to their level, and other jumps are spread over several frames, one gain for the whole picture so a color picture keeps its color. Slow changes stay, and every frame keeps its data, only scaled. Off shows every frame as the pass's scale draws it." });
  D({ key: "movies.exposureSmooth", section: "Processing", label: "Exposure smoothing", type: "range", value: 8, min: 2, max: 30, step: 2, unit: "frames",
      hint: "How many frames a change in brightness is spread over (with Exposure normalization on). Low keeps quick real changes; high evens the movie out more." });
  D({ key: "movies.colorSmooth", section: "Processing", label: "Color smoothing", type: "toggle", value: true,
      hint: "A run of color pictures mostly shares one set of filters, but now and then Cassini swapped one filter for another (a blue filter in place of a continuum one), and that picture comes out in other colors: peach and blue among green. On, every color picture's colors are moved toward the palette of the pictures round it in the same camera window (the most common one, so the odd one out never sets it), worked out by this computer. Only the balance between the colors moves: each pixel keeps its brightness (that is Exposure normalization's), and a run of one palette is left almost as it is." });
  D({ key: "movies.colorSmoothStrength", section: "Processing", label: "Color smoothing strength", type: "range", value: 100, min: 10, max: 100, step: 10, unit: "%",
      hint: "How far an odd picture's colors are moved toward its neighbours' palette (with Color smoothing on). 100% matches them; lower keeps more of the picture's own colors." });
  D({ key: "cameras.mosaics", section: "Processing", label: "Mosaics in camera windows", type: "toggle", value: true,
      hint: "When Cassini steps a camera across a body, the window builds the mosaic tile by tile. Off shows every frame on its own, at face value. How a pass plays (mosaic, movie, mosaic movie) is under Cameras > Mosaic passes." });
  // what the frame server's picture routes are asked to add for them: nothing, the earlier stretch, or raw filters;
  // o.center: the picture centred on its body (a camera window's Auto center, decided by the window for each pass)
  // the pipeline steps turned off (Settings > Processing): nothing while every step is on, so the usual pictures keep their addresses
  window.cassiniOff = () => { const off = window.cassiniSteps.filter(st => S.get(st.key) === false).map(st => st.step); return off.length ? `&off=${off.join(",")}` : ""; };
  window.cassiniLook = (o = {}) => (S.get("cameras.balancedColor") === false ? "&look=classic"
    : S.get("cameras.colors") === "raw" ? "&colors=raw" : "") + window.cassiniOff() + (o.center ? "&center=1" : "");
  // how a movie pass looks (Settings > Movie), for the camera windows' movie pictures and the film export alike;
  // o.center: the window's Auto center (else the Settings default)
  // image stabilization of a movie pass (obs_mosaic.steady_places): its smoothing in frames, 0 when off
  window.cassiniStabilize = () => !S.get("movies.stabilize") ? 0 : (S.get("movies.stabilizeSmooth") ?? 12);
  // exposure normalization of a movie pass (obs_mosaic.exposure_gains): its smoothing in frames, 0 when off
  window.cassiniExposure = () => !S.get("movies.exposure") ? 0 : (S.get("movies.exposureSmooth") ?? 8);
  // what a film's plan asks for each color set (export.py sets=): Complete color pictures only (Playback, with Color
  // composites on) makes a set one picture at its last channel, as movie mode steps; off, every channel is its own
  window.cassiniSetsQ = () => (S.get("movie.completeFrames") === false || S.get("cameras.composites") === false ? "&sets=0" : "");
  window.cassiniMovieStyle = (o = {}) => `${(o.center ?? S.get("cameras.autoCenter")) === false ? "&center=0" : ""}&trail=${o.trail ?? (S.get("movies.trail") || 0)}&laps=${S.get("movies.laps") || 1}` +
    ((o.fade ?? S.get("movies.fade")) && S.get("movies.mosaicFrames") !== "whole" ? `&fade=${o.fade ?? S.get("movies.fade")}&persist=${S.get("movies.persist") ?? 35}` : "") +
    ((o.steady ?? window.cassiniStabilize()) ? `&steady=${o.steady ?? window.cassiniStabilize()}` : "") +
    ((o.exposure ?? window.cassiniExposure()) ? `&exposure=${o.exposure ?? window.cassiniExposure()}` : "");
  // Cameras (the camera windows read cameras.steady, cameras.passes, cameras.fullRes, cameras.fullDelay, cameras.drill, cameras.pointingLook, cameras.stale and cameras.lingerColor / lingerMosaic)
  D({ key: "cameras.channels", section: "Cameras", label: "Filter channels", type: "toggle", value: true,
      hint: "The frames that make up a color picture, in a strip under it." });
  cls("cameras.channels", "s-nochans", false);
  D({ key: "cameras.details", section: "Cameras", label: "Frame details", type: "toggle", value: true,
      hint: "Status, frame, filter, color and scale under each picture." });
  cls("cameras.details", "s-noinfo", false);
  D({ key: "cameras.steady", section: "Cameras", label: "Steady picture size", type: "toggle", value: true,
      hint: "While a color set or a mosaic builds, the picture keeps its size: the filter strip stays in place for the whole observation and a mosaic's shape holds until the observation ends. Off lets the window fit each picture." });
  cls("cameras.steady", "s-steady", true);
  D({ key: "cameras.passes", section: "Cameras", label: "Mosaic passes", type: "choice", value: "auto",
      options: [["auto", "Auto"], ["mosaic", "Always mosaic"], ["movie", "Always movie"], ["mosaic_movie", "Always mosaic movie"]],
      hint: "How a pass of pictures plays: Auto builds the passes that step across a body as mosaics, rolls the ones that go round the same places again and again as mosaic movies, and plays movies and stares as frames. The others force one way for every pass. A camera window's settings button changes it for the pass it is showing." });
  D({ key: "cameras.fullRes", section: "Cameras", label: "Full resolution in full view", type: "toggle", value: true,
      hint: "A picture in full view (double-click it, F or the title bar button) always loads at the camera's full resolution, playing or paused, with a button to save it. Other windows show each picture at its true resolution, or smaller only when the window or screen is too small to show more." });
  D({ key: "cameras.drill", section: "Cameras", label: "Open channels in place", type: "toggle", value: true,
      hint: "Click a channel under a color picture to open it in that window on the picture's own scale. The window holds still until you press Esc or its held badge; other windows play on." });
  D({ key: "cameras.pointingLook", section: "Cameras", label: "Frames opened from a mosaic", type: "choice", value: "mosaic",
      options: [["mosaic", "As in the mosaic"], ["own", "On its own"]],
      hint: "Hover a mosaic to outline a frame (arrow keys step to the others) and click to open it. As in the mosaic shows that spot of the mosaic, larger: the same levels, seams and colors. On its own shows the frames as a picture of their own, on their own scale. The switch by a held frame's breadcrumb changes it." });
  D({ key: "cameras.stale", section: "Cameras", label: "Clear a quiet camera after", type: "range", value: 6, min: 1, max: 48, step: 1, unit: "h",
      hint: "A camera that has taken nothing for this long shows Idle instead of its last picture (an important picture stays longer, below)." });
  D({ key: "cameras.lingerColor", section: "Cameras", label: "Color pictures stay longer", type: "range", value: 1.5, min: 1, max: 4, step: 0.25, format: v => `${v}×`,
      hint: "How much longer a color picture stays up than a single black-and-white frame, before its window closes or its camera clears." });
  D({ key: "cameras.lingerMosaic", section: "Cameras", label: "Mosaics stay longer", type: "range", value: 2, min: 1, max: 4, step: 0.25, format: v => `${v}×`,
      hint: "How much longer a mosaic stays up than a single frame. A color mosaic gets both: 1.5 × 2 = 3 times as long." });

  // the replay viewer's own options: applied once it has loaded, and kept in step with its buttons
  function whenReady(fn) {
    const go = () => { if (typeof state !== "undefined" && $("loading").hidden && typeof setSpeed === "function") { fn(); return true; } };
    if (go()) return;
    const mo = new MutationObserver(() => { if (go()) mo.disconnect(); });
    mo.observe($("loading"), { attributes: true, attributeFilter: ["hidden"] });
  }
  // S.transient(fn): what fn does to a mirrored button stays out of the settings (a shared link's view is for that visit only)
  let quiet = 0;
  S.transient = fn => { quiet++; try { return fn(); } finally { setTimeout(() => quiet--, 0); } };
  // a dock button that switches a viewer option, mirrored by a setting both ways
  function mirror(key, btn) {
    whenReady(() => {
      const b = $(btn), pressed = () => b.getAttribute("aria-pressed") === "true";
      S.on(key, v => { if (pressed() !== v) b.click(); });
      new MutationObserver(() => { if (!quiet) S.set(key, pressed()); }).observe(b, { attributes: true, attributeFilter: ["aria-pressed"] });
    });
  }
  D({ key: "playback.start", section: "Playback", label: "Start time", type: "choice", value: "2006-09-15T14:28:00", reload: true,
      options: [["2006-09-15T14:28:00", "In Saturn's Shadow"], ["2005-01-14T09:30:00", "Huygens lands"], ["2004-07-01T00:00:00", "Saturn arrival"]],
      hint: "The moment Cassini OS opens on. A shared link still opens on its own moment." });
  D({ key: "playback.autoplay", section: "Playback", label: "Play when Cassini OS opens", type: "toggle", value: true,
      hint: "Off opens paused at the starting moment." });
  D({ key: "playback.builtOnly", section: "Playback", label: "Only years with pictures built", type: "toggle", value: true, reload: true,
      hint: "When the picture cache holds only some years (a test build of one year), the timeline, Moments and Highlights keep to them. Off shows the whole mission, and pictures outside them are made as they are asked for." });
  // the playback speed scale, shared by the dock's speed slider, this setting and the clock's read-out: mission
  // seconds per second, from real time to a month a second, on a log scale that lands on round values
  const SP = window.cassiniSpeed = {
    min: 1, max: 2592000,
    stops: [1, 2, 5, 10, 20, 30, 60, 120, 300, 600, 1200, 1800, 3600, 7200, 10800, 21600, 43200, 86400, 172800, 345600, 604800, 1209600, 2592000],
    label(v) {
      const r = x => +x.toFixed(x < 10 && x % 1 ? 1 : 0), u = (x, one, many) => `${r(x)} ${r(x) === 1 ? one : many}/s`;
      return v <= 1 ? "real time" : v < 60 ? `${r(v)}×` : v < 3600 ? u(v / 60, "min", "min") : v < 86400 ? u(v / 3600, "h", "h")
        : v < 604800 ? u(v / 86400, "day", "days") : v < 2592000 ? u(v / 604800, "wk", "wk") : u(v / 2592000, "month", "months");
    }
  };
  // movie mode's speed scale (movie.html), which the same dock slider switches to while movie mode is on: pictures a
  // second, from one a second to 30, on a log scale that lands on the usual frame rates
  const MF = window.cassiniMovieFps = {
    min: 1, max: 30, stops: [1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 24, 30],
    label: v => `${+(+v).toFixed(v < 10 && v % 1 ? 1 : 0)} fps`
  };
  D({ key: "playback.speed", section: "Playback", label: "Starting speed", type: "range", log: true, value: 600, min: SP.min, max: SP.max, stops: SP.stops, format: SP.label,
      hint: "Mission time per second of playback when the page opens; the speed slider in the replay window changes it while you watch. Jumping to a moment still picks its own speed." });
  D({ key: "playback.span", section: "Playback", label: "Timeline shows", type: "choice", value: 432000,
      options: [[86400, "Day"], [432000, "5 days"], [604800, "Week"], [2592000, "Month"]],
      hint: "How much of the mission the timeline covers when the page opens." });
  whenReady(() => {
    if (!S.get("playback.autoplay")) setPlaying(false);
    setSpeed(S.get("playback.speed"));
    const span = S.get("playback.span"); if (span !== 432000) setView(span, state.et + span * 0.3);
  });
  S.on("playback.speed", v => { if (typeof state !== "undefined" && typeof setSpeed === "function" && $("loading").hidden) setSpeed(v); });
  S.on("playback.span", v => { if (typeof state !== "undefined" && typeof setView === "function" && $("loading").hidden) setView(v, state.et + v * 0.3); });
  // View
  D({ key: "view.allOrbits", section: "View", label: "All moons", type: "toggle", value: false, hint: "Draw every moon's orbit, not only the nearby ones." });
  mirror("view.allOrbits", "allorbits");
  D({ key: "view.enlarge", section: "View", label: "Enlarge moons ×10", type: "toggle", value: false, hint: "Moons drawn ten times their size so they can be seen from afar." });
  mirror("view.enlarge", "enlarge");
  // the viewer's camera cones read view.conesEverywhere
  D({ key: "view.conesEverywhere", section: "View", label: "Camera cones on every view", type: "toggle", value: false,
      hint: "Draw the cameras' fields of view when looking at a body too. Off shows them only while the view is on Cassini." });
  // a new key, so a saved "off" from when follow started off does not carry over
  D({ key: "view.followcam", section: "View", label: "Follow camera", type: "toggle", value: true, hint: "Look where Cassini's camera points (needs the pointing data)." });
  mirror("view.followcam", "followcam");
  // the viewer's follow camera reads view.spinHold, view.spinTurn and view.spinEase
  D({ key: "view.spinHold", section: "View", label: "Hold still through spins", type: "toggle", value: true,
      hint: "When Cassini rolls for hours for its fields-and-particles instruments (no pictures), the follow camera keeps looking where it was instead of spinning with it. Off follows every turn." });
  D({ key: "view.spinTurn", section: "View", label: "Counts as a spin after", type: "range", value: 300, min: 180, max: 1080, step: 30, unit: "°",
      hint: "How far Cassini has to keep turning without a pause before the view holds. Turns between targets stay under about 200°." });
  D({ key: "view.spinEase", section: "View", label: "Ease back over", type: "range", value: 4, min: 1, max: 15, step: 1, unit: "s",
      hint: "How long the view takes to swing back to the camera's pointing once a spin ends." });
  D({ key: "view.textures", section: "View", label: "Surface maps", type: "choice", value: "2k", reload: true,
      options: [["0", "Off"], ["1k", "1k"], ["2k", "2k"], ["4k", "4k"]],
      hint: "Map size for Saturn and the moons. 4k is sharper and slower to load; Off keeps the plain painted look. A ?tex= link still wins." });
  // the viewer reads view.sky when it builds the scene and follows view.skyBrightness live
  D({ key: "view.sky", section: "View", label: "Star sky", type: "choice", value: "auto", reload: true,
      options: [["auto", "Auto"], ["0", "Off"], ["2k", "2k"], ["4k", "4k"], ["8k", "8k"]],
      hint: "The real night sky (<button class='credit' data-about='star-sky'>NASA's Deep Star Maps</button>: Hipparcos, Tycho-2 and Gaia stars and the Milky Way), placed where Cassini saw it. Auto picks 8k on a desktop and 4k on a phone; 8k is the sharpest and takes the most memory (11 MB to load), 2k is the lightest but soft. Off keeps the old painted dots. A ?sky= link still wins." });
  D({ key: "view.skyBrightness", section: "View", label: "Star brightness", type: "range", value: 1, min: 0, max: 2.5, step: 0.05,
      format: v => `${Math.round(v * 100)}%`, hint: "How bright the stars and the Milky Way are drawn." });
  // the viewer reads view.atmospheres (makeAtmosphere)
  D({ key: "view.atmospheres", section: "View", label: "Atmospheres", type: "choice", value: "full",
      options: [["off", "Off"], ["light", "Light"], ["full", "Full"]],
      hint: "Titan's orange haze with its high detached layer, Earth's thin blue limb, Venus's pale yellow haze, and the thin hazes at Saturn's and Jupiter's limbs, all lit by the Sun: soft twilight past the terminator and a bright ring when a body is backlit. Light is quicker on weak graphics; Off draws the bare globes." });
  // the viewer reads view.plumes and view.plumeBrightness (makePlume)
  D({ key: "view.plumes", section: "View", label: "Enceladus plumes", type: "toggle", value: true,
      hint: "The jets of ice grains rising from the tiger stripes at Enceladus's south pole, lit by the Sun. Like the real ones they show mostly when Cassini looks back toward the Sun, against the dark sky, and stay faint otherwise." });
  D({ key: "view.plumeBrightness", section: "View", label: "Plume brightness", type: "range", value: 1, min: 0.25, max: 4, step: 0.05,
      format: v => `${Math.round(v * 100)}%`, hint: "How bright the plumes are drawn. 100% is subtle, as in an unstretched picture; higher shows the faint outer plume the way stretched pictures do." });
  // movie mode (movie.html) is a rule for the clock, so its speed sits with the playback settings
  // Sam 2026-10-28: movie mode is about watching the pictures, so it starts slow (5) and the dock slider sets it
  D({ key: "movie.fps", section: "Playback", label: "Movie mode speed", type: "range", log: true, value: 5, was: [8], min: MF.min, max: MF.max, stops: MF.stops, format: MF.label,
      hint: "Movie mode (M) skips the time between pictures and steps from one picture to the next this many times a second. While movie mode is on, the speed slider in the replay window sets this instead of mission time per second. The camera windows show every picture as they always do." });
  // what counts as a picture (head-quiet.html complete, cameraFeed)
  D({ key: "movie.completeFrames", section: "Playback", label: "Complete color pictures only", type: "toggle", value: true,
      hint: "Movie mode steps from one finished picture to the next: a color set shows once, as its color picture when its last filter is taken, never the black-and-white frames on the way. Off steps through every frame." });
  D({ key: "playback.completeMosaics", section: "Playback", label: "Complete mosaics only", type: "toggle", value: false,
      hint: "A mosaic pass shows once it is finished: the camera window keeps the picture from before the pass and puts up the whole mosaic at its last frame, and movie mode steps straight to it. Off shows the mosaic building tile by tile." });
  // movie passes in the camera and body windows (head-quiet.html cameraFeed reads these)
  D({ key: "movies.steady", section: "Movie", label: "Steady movie passes", type: "toggle", value: true,
      hint: "When a pass plays as a movie in a camera or body window (a stare, a ring or storm movie), every frame is centered by SPICE, north up, on one brightness scale and one size for the whole pass, so the body holds still and the picture does not pump. Off shows each frame as it is." });
  D({ key: "movies.filmstrip", section: "Movie", label: "Filmstrip", type: "toggle", value: true,
      hint: "Under a window playing a movie pass: every frame of the pass along a strip, with the frames around the one shown. Click or drag along it to move through the pass." });
  cls("movies.filmstrip", "s-nofilmstrip", false);
  D({ key: "movies.trail", section: "Movie", label: "Movie trail", type: "range", value: 0, min: 0, max: 12, step: 1, unit: "frames",
      hint: "In a steady movie pass, this many earlier frames of the same filter stay under the newest one, fading with age, so a moving moon or a ring's shadow leaves a short trail. 0 shows each frame alone." });
  D({ key: "movies.laps", section: "Movie", label: "Mosaic movies keep", type: "range", value: 1, min: 1, max: 6, step: 1, unit: "laps",
      hint: "A mosaic movie (the camera going over the same mosaic again and again, as on the approach to Jupiter) plays as a mosaic that never empties: each new tile replaces its own earlier copy. 1 is a time-lapse; more keeps that many copies of each tile, older ones under the newest." });
  // how often a mosaic movie's picture changes (head-quiet.html complete and cameraFeed, export.py whole=)
  D({ key: "movies.mosaicFrames", section: "Movie", label: "Mosaic movie frames", type: "choice", value: "rolling",
      options: [["rolling", "Rolling"], ["whole", "Whole mosaics"]],
      hint: "Rolling puts each new tile of a mosaic movie into the mosaic as it is taken. Whole mosaics waits until the camera has gone round every place again: a four-panel mosaic shows a new picture once all four new panels are in, so every frame of the movie is a whole new mosaic (movie mode steps lap to lap, and older tiles never fade)." });
  // a mosaic movie's older tiles fade (obs_mosaic.rolling_layout fade=, persist=): Rolling rather than Time-lapse
  D({ key: "movies.fade", section: "Movie", label: "Older tiles fade over", type: "range", value: 0, min: 0, max: 120, step: 4,
      format: v => v ? `${v} frames` : "Off",
      hint: "In a mosaic movie, each tile dims as the camera moves on, so the mosaic shows where the camera is now and where it was a moment ago: the newest tile is full brightness and a tile this many frames older has faded down to the level below. Off is a time-lapse: every place's newest tile stays at full brightness until the camera comes back to it." });
  D({ key: "movies.persist", section: "Movie", label: "Faded tiles keep", type: "range", value: 35, min: 0, max: 100, step: 5,
      format: v => `${v}%`,
      hint: "How bright an old tile stays once it has faded (with Older tiles fade over on). 0% leaves only the tiles taken in the last frames; 100% is no fade at all." });
  // Data
  D({ key: "data.layout", section: "Data", label: "Window layout", type: "action", button: "Reset",
      hint: "Put every window back where it starts and bring back the ones tucked into the menu bar.",
      run() { try { localStorage.removeItem("cassini-os-layout-v2"); } catch (e) {} location.reload(); } });
  D({ key: "data.reset", section: "Data", label: "All settings", type: "action", button: "Restore defaults",
      hint: "Every setting back to how Cassini OS ships.", run: () => S.reset() });
})();
</script>
