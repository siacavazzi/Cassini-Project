<!-- Movie export for Cassini OS. build.py splices the three parts below into the page: the style into the head,
     the window into #app (so the window manager picks it up) and the script after the chrome script.
     Mark a stretch of the timeline (drag across it, or I at the start and O at the end; drag a marked edge to
     move it) and press Export: the frame server makes the film from the pipeline's pictures, the same ones the camera
     windows show (web/frames/export.py), and the page adds the sound, made by the live sound's own synth
     (cassiniSound.render, sound.html) from the film's picture list. The film downloads, plays here, and has a link.
     Made on this computer (Settings > Export, on by default; docs/compute-on-viewer.md): the page follows the same
     plan (its pictures, their order of tries, holds and captions), asks the frame server only for the pictures, puts
     each in its camera's pane as export.py's Film does, applies the movie editor's look with Cassini Studio's renderer
     (the port of studio_look.py) and encodes the film with WebCodecs (H.264, each picture one frame held for its
     time), its sound as AAC (Opus where the browser has no AAC encoder).
     On the public site (window.cassiniPublic, docs/public-site/README.md D1 and D7) every film is made here: the plan
     and Even out come from the page's own port of export.py (window.cassiniPlanLocal, plan-local.js and
     levels-local.js), the pictures only from what is published (cassiniExport.publicUrl), up to 1024 px a camera, and
     nothing is sent to an origin: no POST /export, no sound upload, no /export/<job>. A browser without WebCodecs gets
     a note instead of a film. cassiniExport.makeFilm(film key) makes the same film for the Gallery's shared films. -->
<style>

<script>
// ---------- movie export ----------
(function () {
  const $ = id => document.getElementById(id);
  const FRAMES = (() => {                       // the frame server, chosen as the camera window chooses it
    const q = new URLSearchParams(location.search).get("frames");
    if (q) return q.replace(/\/$/, "");
    if (/^https?:$/.test(location.protocol) && !/claude\.ai$|claudeusercontent\.com$|claude\.site$/.test(location.hostname)) return location.origin;
    return "http://localhost:8765";
  })();
  const S = window.cassiniSettings, card = $("excard");
  // 1536 and 2048: "up to", each mosaic at the biggest size its pass has detail for; "full": mosaics at their native
  // resolution (export.py)
  const SIZES = [512, 768, 1024, 1536, 2048, "full"];
  const CANVAS_S = 0.7;   // seconds a mosaic picture takes up to 2048 (the windows' canvas: about as 1024)
  // measured on the Mac Mini (bench_fullres_movie.py): seconds to draw a mosaic picture at Full, per million pixels
  // (hexagon mosaic movies 2012-11-27 and 2013-06-26: 5.5-7.4 s a picture of 2400-3100 px, two made at once)
  const FULL_S_PER_MP = 0.5;
  // the export's choices live in the settings registry, so they are kept on this device and listed in Settings
  // (on the public site, PUBLIC below: sizes up to 1024 only, and no Full, HDR or server films to choose)
  const PUBLIC_AT_START = !!window.cassiniPublic || document.documentElement.classList.contains("public");
  if (S) {
    const D = d => (PUBLIC_AT_START && ["export.full", "export.hdr", "export.local"].includes(d.key) ? null : S.define(Object.assign({ section: "Export" }, d)));
    D({ key: "export.adaptive", label: "Adaptive frame rate", type: "toggle", value: true,
        hint: "Pictures stay on screen for their real gap to the next one, sped up: bursts flip fast, quiet spells linger (1/30 to 1/2 s each)." });
    D({ key: "export.fps", label: "Fixed frame rate", type: "range", value: 12, min: 2, max: 30, step: 1, unit: "fps",
        hint: "Pictures per second when the frame rate is not adaptive." });
    D({ key: "export.size", label: "Picture size", type: "range", value: 1024, min: 512, max: PUBLIC_AT_START ? 1024 : 2048, step: 256, unit: "px",
        hint: "Pixels per camera in an exported film; 1024 is a full Cassini frame. Above 1024, mosaics are drawn up to that size, each only as big as its pass has detail for." });
    D({ key: "export.full", label: "Mosaics at full resolution", type: "toggle", value: false,
        hint: "Picture size Full: a mosaic or mosaic movie keeps every pixel its frames took (up to 4096 px a side) instead of fitting 1024. Extra work on the frame server, made only when asked for: pre-process the stretch first." });
    D({ key: "export.sound", label: "Sound", type: "toggle", value: false, was: [true], hint: "Exported films carry the picture sounds, set as in Settings > Sound." });
    D({ key: "export.boomerang", label: "Boomerang", type: "toggle", value: false,
        hint: "The film plays forward, then back to its first picture: twice as long, good for a movie of a few frames. Suggested when a film would last under a second." });
    D({ key: "export.hdr", label: "HDR film", type: "toggle", value: false,
        hint: "The film as HDR video (HEVC, HDR10): the bright parts the usual film rolls off at white (lit rings, bright limbs, glare) shine brighter than white on an HDR screen (an iPhone, a recent Mac or TV). Made by the frame server; plays as the usual film's brightness on other screens only where the player tone maps it, so keep it off for films meant for anywhere." });
    D({ key: "export.caption", label: "Captions", type: "toggle", value: true, hint: "A strip under each camera with the time, target, filters and kind of picture." });
    D({ key: "export.local", label: "Make films on this computer", type: "toggle", value: true,
        hint: "The film is put together and encoded by this browser from the pictures the frame server already has (and the movie steps worked out here), so making it costs the server nothing but the pictures. Off, or at sizes above 1024, Mosaics at full resolution or in a browser that cannot encode video, the frame server makes it." });
  }
  const opt = (k, d) => (S && S.get(k) !== undefined ? S.get(k) : d);
  const setOpt = (k, v) => { if (S) S.set(k, v); };

  // ---------- the public site (D1, D7): the public build marks the page with the class "public" (WP6), or window.cassiniPublic ----------
  // every film made here, from the page's own plan (window.cassiniPlanLocal) and the published pictures, up to
  // PUBLIC_MOST px a camera; the switch is read each time, so a page that sets it after this script still has it
  const PUB = () => !!window.cassiniPublic || document.documentElement.classList.contains("public");
  const PUBLIC_MOST = 1024;
  const PL = () => window.cassiniPlanLocal;
  const NO_PLAN = "This page cannot plan films yet (its film planner is missing).";
  const NO_CODEC = "This browser cannot make films: it has no video encoder (WebCodecs). A recent Chrome, Edge or Safari can.";
  // a film key's options as the planner takes them (export.py options: every value a string, as parse_qs gives it)
  const optionsOf = key => Object.fromEntries(new URLSearchParams(key));
  // the film's plan (export.py plan + public_plan): the page's own on the public site, else the frame server's.
  // Answers { ok, plan } or { ok: false, error }
  async function planOf(key) {
    if (PUB()) {
      if (!PL() || !PL().plan) return { ok: false, error: NO_PLAN };
      try { const p = await PL().plan(optionsOf(key)); return p && !p.error ? { ok: true, plan: p } : { ok: false, error: (p && p.error) || "The page cannot plan that film." }; }
      catch (err) { return { ok: false, error: `The page cannot plan that film: ${err.message || err}` }; }
    }
    const r = await fetch(`${FRAMES}/export/plan.json?${key}`), p = await r.json();
    return r.ok ? { ok: true, plan: p } : { ok: false, error: p.error || "The server cannot plan that film." };
  }
  // Even out's change for each picture of a film (export.py levels "even"): the page's own on the public site
  // (levels-local.js, over the plan's pictures), else measured by the frame server (/export/levels.json), asked again
  // while it measures. tell(done, total) hears how far it is; stop.done ends it. Answers { even } or null when stopped
  async function evenOf(key, pictures, stop, tell) {
    if (PUB()) {
      if (!PL() || !PL().levels) return { even: {} };
      try { const j = await PL().levels(optionsOf(key), pictures, tell); return { even: (j && j.even) || {} }; } catch (err) { console.warn("export levels here", err); return { even: {} }; }
    }
    for (;;) {
      if (stop.done) return null;
      let j = null;
      try { j = await (await fetch(`${FRAMES}/export/levels.json?${key}`)).json(); } catch (err) { j = { error: String(err) }; }
      if (!j || j.error || !j.even_ready) return { even: {} };
      if (j.total != null && j.done >= j.total) return { even: j.even || {} };
      tell(j.done || 0, j.total);
      await new Promise(r => setTimeout(r, 1000));
    }
  }
  // a picture's address as the public site has it (policy.json): a movie frame without the steps the page works out
  // itself (stabilization and trails from steady.json, a mosaic movie's fade from fade.json, exposure evening, which is
  // published only as obs_mosaic.EXPOSURE_SMOOTH), a mosaic without Studio's tile tuning, a picture without a format or
  // download; unchanged off the public site
  const EXPOSURE_BUILT = 8;
  function publicUrl(url) {
    if (!PUB() || !url) return url;
    let u;
    try { u = new URL(url, location.href); } catch (e) { return url; }
    const q = u.searchParams;
    if (/^\/frames\/movie\/[NW]\d{10}_\d+\.webp$/.test(u.pathname)) {
      ["steady", "trail", "persist"].forEach(k => q.delete(k));
      if (q.get("mode") === "rolling") q.delete("fade");
      else { q.delete("fade"); q.delete("laps"); }
      if (q.has("exposure")) { if (+q.get("exposure") > 0) q.set("exposure", String(EXPOSURE_BUILT)); else q.delete("exposure"); }
      if (q.has("laps") && q.get("laps") !== "1") q.set("laps", "1");
    }
    if (/^\/frames\/mosaic\/[NW]\d{10}_\d+\.webp$/.test(u.pathname)) { q.delete("tune"); q.delete("hide"); }
    q.delete("format"); q.delete("download");
    const out = u.origin + u.pathname + (u.search ? u.search.replace(/%2C/gi, ",").replace(/%3A/gi, ":") : "");
    return /^https?:/.test(url) ? out : out.slice(u.origin.length);
  }

  // ---------- the marked stretch, in mission time (et) ----------
  const X = { a: null, b: null, cams: null, plan: null, planKey: "", job: null, poll: 0, sent: new Set() };
  const iso = et => new Date(etToMs(et)).toISOString().slice(0, 19);
  const show = et => iso(et).replace("T", " ");
  const parse = s => { const t = s.trim().replace(" ", "T"); return /^\d{4}-\d\d-\d\d(T\d\d:\d\d(:\d\d)?)?$/.test(t) ? utcToEt(t.length === 10 ? t + "T00:00:00" : t) : null; };
  const redraw = () => { if (typeof drawTimeline === "function" && catalog) drawTimeline(); };
  // X.guard (segment.html, while a stretch is being made or is made ahead): guard(a, b, how) answers the stretch a
  // change may make, [a, b], or null when it may not change at all; how is "edge" (an end dragged or typed), "new" (a
  // fresh highlight) or "clear"
  const guarded = (a, b, how) => (X.guard && X.a != null && X.b != null ? X.guard(a, b, how) : [a, b]);
  function mark(a, b, how) {
    let na = a != null ? a : X.a, nb = b != null ? b : X.b;
    if (na != null && nb != null && nb < na) [na, nb] = [nb, na];
    if (na != null && nb != null && (a != null || b != null)) { const g = guarded(na, nb, how || "edge"); if (!g) return; [na, nb] = g; }
    X.a = na; X.b = nb;
    $("exfrom").value = X.a != null ? show(X.a) : "";
    $("exuntil").value = X.b != null ? show(X.b) : "";
    $("exhint").hidden = X.a != null && X.b != null;
    redraw(); estimate();
    // the highlighted stretch's bar (segment.html: pre-process it, play it) follows the marks
    document.dispatchEvent(new CustomEvent("cassini:marks", { detail: { a: X.a, b: X.b } }));
  }
  // a stretch just highlighted: the bar over it comes up (segment.html), or this window where there is no bar
  const marked = () => { if (!window.cassiniSegment) open(); };
  // force: the person's own × or Escape (a stretch kept by X.guard otherwise stays)
  function clear(force) { if (!force && X.guard && X.a != null && !X.guard(null, null, "clear")) return; X.a = X.b = null; mark(); }

  // drawn over the timeline: the stretch lit in the camera blue, a handle at each end
  const prevTimeline = window.studyTimeline;
  window.studyTimeline = (g, w, h, xn) => {
    if (X.a != null || X.b != null) {
      const xa = X.a != null ? etToX(X.a, w) : null, xb = X.b != null ? etToX(X.b, w) : null;
      if (xa != null && xb != null) { g.fillStyle = "rgba(138,182,255,0.16)"; g.fillRect(xa, 0, xb - xa, h); }
      g.fillStyle = "rgba(138,182,255,0.95)";
      for (const [x, dir] of [[xa, 1], [xb, -1]]) {
        if (x == null || x < -8 || x > w + 8) continue;
        g.fillRect(Math.round(x) - 1, 0, 2, h);
        g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 7 * dir, 0); g.lineTo(x, 9); g.fill();
      }
    }
    if (prevTimeline) prevTimeline(g, w, h, xn);
  };

  // dragging across the timeline's lanes marks a stretch (a click still moves the clock there; the row of dates along
  // the top still pans); dragging a marked edge moves it; shift-drag marks one anywhere, the date row included.
  // Dragging the playhead itself scrubs the clock (index.html), as a playhead does everywhere, and a click on a marked
  // edge that does not move it moves the clock there, as a click anywhere else in the lanes does
  const tl = $("tl"), MOVE = 5;
  let drag = null, press = null;
  const etAt = e => { const r = tl.getBoundingClientRect(); return xToEt(e.clientX - r.left, r.width); };
  window.addEventListener("pointerdown", e => {
    if (e.target !== tl || !catalog || e.button > 0) return;
    const r = tl.getBoundingClientRect(), x = e.clientX - r.left, near = v => v != null && Math.abs(etToX(v, r.width) - x) < 7;
    if (e.shiftKey) drag = { from: etAt(e), edge: null };
    else if (near(X.a)) drag = { edge: "a", x0: e.clientX };
    else if (near(X.b)) drag = { edge: "b", x0: e.clientX };
    else if (near(state.et)) return;   // the playhead: index.html scrubs as it is dragged
    else {
      // a press in the lanes scrubs as a click does (index.html); once it moves MOVE px it becomes a highlight from
      // where it was pressed, and the clock goes back to where it was
      if (e.offsetY >= (e.pointerType === "touch" ? 26 : 18)) press = { x0: e.clientX, from: etAt(e), et: state.et, id: e.pointerId };
      return;
    }
    e.stopImmediatePropagation(); e.preventDefault();
    tl.setPointerCapture(e.pointerId);
  }, true);
  window.addEventListener("pointermove", e => {
    if (press && !drag && Math.abs(e.clientX - press.x0) > MOVE) {
      state.dragging = false; setTime(press.et);
      drag = { from: press.from, edge: null }; press = null;
      tl.style.cursor = "col-resize";
    }
    if (!drag) return;
    e.stopImmediatePropagation();
    if (drag.edge && !drag.moved) { if (Math.abs(e.clientX - drag.x0) <= MOVE) return; drag.moved = true; }
    const t = etAt(e);
    if (drag.edge) mark(drag.edge === "a" ? t : null, drag.edge === "b" ? t : null);
    else if (!drag.held) { const g = guarded(Math.min(drag.from, t), Math.max(drag.from, t), "new"); if (g) { X.a = g[0]; X.b = g[1]; mark(); } else drag.held = true; }
  }, true);
  window.addEventListener("pointerup", e => {
    press = null;
    if (!drag) return;
    e.stopImmediatePropagation();
    const made = !drag.edge, click = drag.edge && !drag.moved;
    drag = null; tl.style.cursor = "";
    if (click) { state.tlFollow = true; setTime(etAt(e)); return; }
    if (made && X.a != null && X.b - X.a > 1) marked();
    else if (made) clear();
  }, true);
  window.addEventListener("pointercancel", () => { press = null; }, true);
  // the cursor says when an edge can be dragged
  tl.addEventListener("pointermove", e => {
    if (drag || !catalog) return;
    const r = tl.getBoundingClientRect(), x = e.clientX - r.left;
    const edge = [X.a, X.b].some(v => v != null && Math.abs(etToX(v, r.width) - x) < 7);
    tl.style.cursor = edge ? "col-resize" : e.shiftKey ? "crosshair" : "";
  });

  // ---------- what the film will be: the server's plan, asked for as the choices change ----------
  // the Background (Settings > Processing) where a picture's frame does not reach: only another color than black
  // goes in the film's query (export.py bg=), so a film made with black keeps its name
  const bg = () => (window.cassiniBackground ? window.cassiniBackground() : "#000000");
  const bgQ = () => (bg().toLowerCase() === "#000000" ? "" : `&bg=${bg().slice(1)}`);
  const params = () => {
    const q = new URLSearchParams({ from: iso(X.a), until: iso(X.b), cams: X.cams || "NW", fps: opt("export.adaptive", true) ? "auto" : String(opt("export.fps", 12)),
      size: !PUB() && opt("export.full", false) ? "full" : String(PUB() ? Math.min(PUBLIC_MOST, opt("export.size", 1024)) : opt("export.size", 1024)), sound: opt("export.sound", false) ? "1" : "0", caption: opt("export.caption", true) ? "1" : "0" });
    // Boomerang (export.py boom=): only when on, so a film made without it keeps its name
    if (opt("export.boomerang", false)) q.set("boom", "1");
    // HDR film (export.py hdr=): only when on, made by the server (filmHere)
    if (opt("export.hdr", false) && !PUB()) q.set("hdr", "1");
    // Whole mosaics (Settings > Movie): a mosaic movie's film shows only its whole laps (export.py whole=); Complete
    // mosaics only (Settings > Playback): a mosaic pass only its finished mosaic (complete=); Complete color pictures
    // only off (Settings > Playback): every channel of a color set as well (sets=0); the Movie Editor's cut
    // and look for this stretch (movieedit.html): frames left out, the look on every picture, and its Mosaics (mos=,
    // over both settings)
    return q.toString() + window.cassiniLook() + (window.cassiniMovieStyle ? window.cassiniMovieStyle() : "") + bgQ() + (opt("movies.mosaicFrames", "rolling") === "whole" ? "&whole=1" : "")
      + (opt("playback.completeMosaics", false) && opt("cameras.mosaics", true) !== false ? "&complete=1" : "") + (window.cassiniSetsQ ? window.cassiniSetsQ() : "")
      + (window.cassiniMovieCut ? window.cassiniMovieCut() : "")
