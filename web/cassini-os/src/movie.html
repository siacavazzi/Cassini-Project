<!-- Movie mode for Cassini OS. build.py splices the three parts below into the page: the style into the head,
     the window into #app (so the window manager picks it up) and the script after the chrome script.
     Movie mode plays the camera frames one after another, in time order, at a set frame rate: the mission clock
     jumps from each frame to the next, so the hours and days without pictures drop out and the 3D view moves
     with the film. -->
<style>
#movie svg { width: 15px; height: 15px; display: block; }
#movie svg * { fill: none; stroke: currentColor; stroke-width: 1.4; }
#moviecard { top: calc(env(safe-area-inset-top, 0px) + 36px); left: max(14px, env(safe-area-inset-left, 0px)); width: clamp(320px, 38vw, 600px); }
#moviecard.zoomed { width: clamp(420px, 60vw, 980px); }
#moviecard .body { padding: 2px 8px 8px; display: grid; gap: 7px; }
.mvwell { position: relative; aspect-ratio: 1; background: rgba(0,0,0,.55); border: 1px solid var(--q-line, #555); border-radius: 4px; overflow: hidden; }
.mvwell canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#mvtag, #mvskip { position: absolute; font: 10px/1.3 var(--hudf, monospace); color: rgba(232,236,242,.8); text-shadow: 0 0 3px #000, 0 0 6px #000; pointer-events: none; }
#mvtag { left: 7px; bottom: 6px; right: 7px; }
#mvskip { right: 7px; top: 6px; color: var(--q-accent, #8ab6ff); transition: opacity .6s ease; opacity: 0; }
#mvskip.on { opacity: 1; transition: none; }
#mvmsg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 0 20px; font-size: 12px; color: var(--q-dim, #888); }
#mvmsg:empty { display: none; }
.mvbar { display: flex; gap: 10px; align-items: center; font-size: 10.5px; color: var(--q-dim, #888); }
#mvplay { width: 28px; height: 28px; font-size: 11px; flex: none; }
.mvbar input[type=range] { width: 110px; accent-color: var(--q-accent, #8ab6ff); }
#mvfpsv { min-width: 38px; color: var(--q-text, #ddd); font-variant-numeric: tabular-nums; }
#mvproc { height: 22px; padding: 0 8px; font-size: 10.5px; flex: none; opacity: .55; }
#mvproc[aria-pressed="true"] { opacity: 1; color: var(--q-accent, #8ab6ff); }
#mvcount { margin-left: auto; font: 10.5px/1 var(--hudf, monospace); white-space: nowrap; font-variant-numeric: tabular-nums; }
/* resting: like the camera window, the picture stays and its frame and controls fade */
#moviecard, #moviecard .titlebar, .mvbar, .mvwell { transition: opacity .7s ease, background-color .7s ease, border-color .7s ease, box-shadow .7s ease; }
body.idle #moviecard { opacity: 1; pointer-events: auto; background: transparent; border-color: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
body.idle #moviecard :is(.titlebar, .mvbar) { opacity: 0; }
body.idle .mvwell { border-color: transparent; box-shadow: 0 6px 30px rgba(0,0,0,.6); }
body.phone #moviecard:not(.full) { width: calc(100% - 16px) !important; left: 8px !important; top: calc(env(safe-area-inset-top, 0px) + 30px) !important; }
</style>

<section class="win" id="moviecard" aria-label="Movie" hidden>
  <div class="titlebar"><span class="lights"><button class="close" aria-label="Leave movie mode">×</button><button class="min" aria-label="Leave movie mode">–</button><button class="zoom" aria-label="Zoom">+</button></span>Movie</div>
  <div class="body">
    <div class="mvwell"><canvas id="mvcanvas" width="1024" height="1024"></canvas><span id="mvtag"></span><span id="mvskip"></span><div id="mvmsg"></div></div>
    <div class="mvbar">
      <button class="btn round" id="mvplay" aria-label="Play or pause the movie">❚❚</button>
      <label for="mvfps">Speed</label><input type="range" id="mvfps" min="2" max="24" step="1" value="8" aria-label="Frames per second"><span id="mvfpsv">8 fps</span>
      <button class="btn" id="mvproc" aria-pressed="true" title="Processed: frames calibrated, color composites and mosaics, as in the camera windows. Off plays the archive frames as they are (P)">Processed</button>
      <span id="mvcount"></span>
    </div>
  </div>
</section>

<script>
// ---------- movie mode ----------
(function () {
  const $ = id => document.getElementById(id);
  const FRAMES = (() => {                       // the frame server, chosen as the camera window chooses it
    const q = new URLSearchParams(location.search).get("frames");
    if (q) return q.replace(/\/$/, "");
    if (/^https?:$/.test(location.protocol) && !/claude\.ai$|claudeusercontent\.com$|claude\.site$/.test(location.hostname)) return location.origin;
    return "http://localhost:8765";
  })();
  const card = $("moviecard"), cv = $("mvcanvas"), g = cv.getContext("2d");
  // cur: the frame on screen as { id, et }, or null to carry on from the clock; cat/i: where it sits in the loaded
  // catalog, which the viewer rebuilds as the clock reaches new years
  const M = { on: false, looping: false, playing: true, fps: 8, cur: null, cat: null, i: -1, due: 0, buf: new Map(), hidden: [], waitSince: 0 };
  try { const f = +localStorage.getItem("cassini-os-movie-fps"); if (f >= 2 && f <= 24) M.fps = f; } catch (e) {}
  $("mvfps").value = M.fps; $("mvfpsv").textContent = M.fps + " fps";

  // ---- the frame on screen and the ones after it, in time order ----
  function here() {
    if (!M.cur) return lastImageIndex(state.et);
    if (M.cat === catalog) return M.i;
    // the catalog was rebuilt: find the same frame again (frames taken in the same second sort together)
    let i = lastImageIndex(M.cur.et);
    for (let j = i; j >= 0 && catalog.sorted[j] >= M.cur.et - 1; j--) if (catalog.id[order[j]] === M.cur.id) { i = j; break; }
    M.cat = catalog; M.i = i;
    return i;
  }
  const at = i => { const k = i >= 0 ? order[i] : undefined; return k === undefined ? null : { id: catalog.id[k], et: catalog.et[k], k, i }; };

  // ---- frames: loaded ahead of the play head so 24 fps does not stutter ----
  // Each frame goes through the pipeline like the camera windows' pictures (movie.processed, on by default): the
  // frame that completes a filter set shows the set's colour composite, a new tile of a mosaic pass the mosaic so far,
  // and every other frame is processed on its own (/frames/processed: stacked, calibrated, on the pipeline's display
  // scale). The processed frame is always loaded; a composite or mosaic is loaded beside it and shown when it is ready in
  // time. The film never waits more than GRACE ms (from when the frame was first asked for) for a composite or mosaic:
  // the server makes a new mosaic tile in seconds the first time, so on a pass nobody has watched yet the film plays the
  // processed frames and the mosaic comes up where it is ready (a frame still on screen when it arrives swaps to it).
  // A server that has none (404) or cannot make one moves on to the next choice; the archive frame is the last resort.
  const S = window.cassiniSettings, GRACE = 1200;
  const opt = (key, dflt) => (S && S.get(key) !== undefined ? S.get(key) : dflt);
  const KIND = { true: "true color", false: "false color", two: "two-filter color" };
  const size = () => (window.cassiniWM && window.cassiniWM.big ? window.cassiniWM.big(card, card.querySelector(".mvwell")) : card.classList.contains("zoomed")) ? 1024 : 512;
  // the pictures frame f can be shown as, each { url, kind }: best (mosaic, then composite) and base (processed, then raw)
  function choices(f) {
    const id = f.id, sz = size(), raw = { url: `${FRAMES}/frames/${id}.webp?size=${sz}`, kind: "" };
    if (M.raw || !opt("movie.processed", true)) return { best: [], base: [raw] };
    if (!catalog.setOf && window.cassiniFeeds) window.cassiniFeeds.prep();
    const best = [], k = f.k, si = catalog.setOf ? catalog.setOf[k] : -1, s = si >= 0 ? catalog.sets[si] : null;
    const comp = s && s.use.includes(k) && s.ready === catalog.et[k] && opt("cameras.composites", true);
    // a possible mosaic tile: the camera's frame before this one is of the same body and observation (and a frame of
    // a colour set only once its composite is up, as in the camera windows)
    let prev = -1;
    for (let j = f.i - 1; j >= Math.max(0, f.i - 64); j--) if (catalog.cam[order[j]] === catalog.cam[k]) { prev = order[j]; break; }
    const tile = prev >= 0 && catalog.target[prev] === catalog.target[k] && catalog.obs[prev] === catalog.obs[k] && (!s || comp);
    if (tile && opt("movie.mosaics", true) && window.cassiniMosaics !== false) best.push({ url: `${FRAMES}/frames/mosaic/${comp ? catalog.id[s.use[0]] : id}.webp?size=${sz}`, kind: "mosaic" });
    if (comp) best.push({ url: `${FRAMES}/frames/color.webp?ids=${s.use.map(q => catalog.id[q]).join(",")}&size=${sz}`, kind: KIND[s.kind] || "color" });
    return { best, base: [{ url: `${FRAMES}/frames/processed/${id}.webp?size=${sz}`, kind: "processed" }, raw] };
  }
  // one chain of choices: tried in turn until one loads (ok true) or none does (ok false); a deferred one waits for
  // c.start() (fill starts composites and mosaics a few at a time)
  function chain(list, onload, deferred) {
    const c = { list, n: 0, img: null, ok: list.length ? null : false, kind: "", started: false };
    const load = () => {
      const im = new Image(), it = list[c.n];
      c.img = im; im.decoding = "async"; im.crossOrigin = "anonymous";
      im.onload = () => { c.ok = true; c.kind = it.kind; onload(); };
      im.onerror = () => { if (++c.n < list.length) load(); else c.ok = false; };
      im.src = it.url;
    };
    c.start = () => { if (!c.started && list.length) { c.started = true; load(); } };
    c.stop = () => { if (c.img && c.ok === null) { c.img.onload = c.img.onerror = null; c.img.src = ""; } };
    if (!deferred) c.start();
    return c;
  }
  // b.ok: null while the film should wait for frame b, then true (b.img, b.kind are what to show) or false (no frame)
  function settle(b) {
    const best = b.best.ok, base = b.base.ok;
    if (best) Object.assign(b, { ok: true, img: b.best.img, kind: b.best.kind });
    else if (base && (best === false || performance.now() - b.since > GRACE)) Object.assign(b, { ok: true, img: b.base.img, kind: b.base.kind });
    else if (base === false && best === false) b.ok = false;
    return b;
  }
  function want(f) {
    let b = M.buf.get(f.id);
    if (!b || b.size !== size()) {
      if (b) { b.best.stop(); b.base.stop(); }
      const c = choices(f);
      b = { ok: null, img: null, kind: "", size: size(), since: performance.now() };
      // a composite or mosaic that arrives while its frame is on screen replaces the processed frame there
      b.best = chain(c.best, () => { if (M.on && M.cur && M.cur.id === f.id && b.kind !== b.best.kind) { settle(b); draw(b.img); tag(f, b); } }, true);
      b.base = chain(c.base, () => {});
      M.buf.set(f.id, b);
    }
    return settle(b);
  }
  // A browser opens only six connections to the frame server, and a mosaic tile nobody has asked for before takes the
  // server seconds: so at most BEST_FLYING composites and mosaics are asked for at once, nearest the play head first,
  // and the processed frames, quick to make, always have connections left.
  const BEST_FLYING = 2;
  function fill(i) {
    // processed frames take the server a fraction of a second each the first time, so the film asks well ahead
    const ahead = Math.max(12, Math.min(72, Math.round(M.fps * 3))), keep = new Set();
    let flying = 0, best = 0;
    for (const b of M.buf.values()) if (b.best.started && b.best.ok === null) best++;
    for (let j = Math.max(0, i); j <= i + ahead; j++) {
      const f = at(j); if (!f) break;
      keep.add(f.id);
      let b = M.buf.get(f.id);
      if (b && b.base.ok === null) flying++;
      else if (!b && flying < 8) { b = want(f); flying++; }
      if (b && !b.best.started && b.best.ok === null && best < BEST_FLYING) { b.best.start(); best++; }
    }
    // pictures the film has passed or skipped: dropped, and their requests called off so they free their connections
    for (const [id, b] of M.buf) if (!keep.has(id)) { b.best.stop(); b.base.stop(); M.buf.delete(id); }
  }
  function drop() { for (const b of M.buf.values()) { b.best.stop(); b.base.stop(); } M.buf.clear(); }
  function blank() { g.fillStyle = "#000"; g.fillRect(0, 0, cv.width, cv.height); }
  function draw(img) {
    const s = cv.width, r = Math.min(s / img.naturalWidth, s / img.naturalHeight), w = img.naturalWidth * r, h = img.naturalHeight * r;
    blank(); g.drawImage(img, (s - w) / 2, (s - h) / 2, w, h);
  }
  const fmtDate = et => { const s = new Date(etToMs(et)).toISOString(); return `${s.slice(0, 10)} ${s.slice(11, 19)} UTC`; };
  const tag = (f, b) => { const k = f.k; $("mvtag").textContent = `${fmtDate(f.et)} · ${titleCase(catalog.target[k] || "Unknown")} · ${catalog.cam[k] === "N" ? "NAC" : "WAC"} ${catalog.f1[k]}/${catalog.f2[k]}${b.ok && b.kind && b.kind !== "processed" ? ` · ${b.kind}` : ""}`; };
  let skipTimer = 0;
  // put frame i on screen and move the mission clock to it
  function show(i) {
    const f = at(i), b = want(f), prev = M.cur;
    M.cur = { id: f.id, et: f.et }; M.cat = catalog; M.i = i;
    M.late = b.ok ? null : f;   // stepped to a picture still being made: it goes up when it arrives (tick)
    if (b.ok) { draw(b.img); $("mvmsg").textContent = ""; }
    else if (b.ok === false) { blank(); $("mvmsg").innerHTML = "<b>No frame</b>" + f.id; }
    setTime(f.et);
    const span = state.view[1] - state.view[0];
    if (state.et < state.view[0] || state.et > state.view[1] - span * 0.05) setView(span, state.et + span * 0.4);
    tag(f, b);
    $("mvcount").textContent = f.id;
    if (prev && f.et - prev.et > 3 * 3600) {   // a stretch without frames: say how much time the cut left out
      $("mvskip").textContent = `skipped ${fmtDur(f.et - prev.et)}`; $("mvskip").classList.add("on");
      clearTimeout(skipTimer); skipTimer = setTimeout(() => $("mvskip").classList.remove("on"), 900);
    }
  }
  // the movie's own clock: a frame every 1/fps seconds, holding on a frame until the next one has arrived;
  // when the page draws slower than the movie runs, frames are dropped to keep time
  function tick(now) {
    if (!M.on) { M.looping = false; return; }
    if (yearReady() && !state.dragging) {
      const i = here();
      fill(i);
      if (M.late && M.cur && M.late.id === M.cur.id && M.cat === catalog) { const b = want(M.late); if (b.ok !== null) show(M.late.i); }
      if (M.playing && now >= M.due) {
        let shown = -1, j = i;
        while (now >= M.due) {
          j++;
          while (at(j) && M.buf.get(at(j).id) && M.buf.get(at(j).id).ok === false) j++;   // frames the server lacks are cut too
          const f = at(j);
          if (!f) { if (shown < 0 && !(mission && yearOf(state.et) < mission.years[mission.years.length - 1])) setMoviePlaying(false); break; }
          const b = want(f);
          if (!b.ok) break;
          shown = j; M.due += 1000 / M.fps;
        }
        if (shown >= 0) { show(shown); M.due = Math.max(M.due, now - 250); M.waitSince = 0; }
        else if (M.playing && at(j)) {
          if (!M.waitSince) M.waitSince = now;
          else if (now - M.waitSince > 600) $("mvcount").textContent = "processing…";
        }
      }
    }
    requestAnimationFrame(tick);
  }
  // paused in the background (away.html): the pictures still loading are called off (the film asks again when it
  // carries on), and the film's clock moves on by the time away, so it picks up on the frame it was on
  document.addEventListener("cassini:away", e => {
    if (e.detail.away) { for (const [id, b] of M.buf) if (b.base.ok === null || (b.best.started && b.best.ok === null)) { b.best.stop(); b.base.stop(); M.buf.delete(id); } }
    else { M.due += e.detail.ms; if (M.waitSince) M.waitSince += e.detail.ms; for (const b of M.buf.values()) b.since += e.detail.ms; }
  });
  function setMoviePlaying(p) { M.playing = p; $("mvplay").textContent = p ? "❚❚" : "▶"; M.due = performance.now(); }

  // ---- entering and leaving ----
  // the film starts on the frame the camera last took and carries on from there
  function start() {
    if (!catalog || M.on) return;
    M.on = true; drop(); blank();
    setPlaying(false);
    // the movie takes the camera's place; the camera windows come back when it ends
    M.hidden = ["imgcard", "wacard"].map($).filter(w => w && !w.hidden);
    const cam = M.hidden[0];
    if (cam && cam.style.left && !card.style.left) Object.assign(card.style, { left: cam.style.left, top: cam.style.top, right: "auto", bottom: "auto" });
    M.hidden.forEach(w => { w.hidden = true; });
    card.hidden = false; card.dispatchEvent(new Event("pointerdown"));
    $("movie").setAttribute("aria-pressed", "true");
    const i = lastImageIndex(state.et), f = at(i - 1);
    M.cur = f ? { id: f.id, et: f.et } : null; M.cat = catalog; M.i = i - 1;
    $("mvmsg").textContent = at(Math.max(0, i)) ? "" : "No frames to play";
    setMoviePlaying(true);
    if (!M.looping) { M.looping = true; requestAnimationFrame(tick); }
  }
  function stop() {
    if (!M.on) return;
    M.on = false; drop();
    card.hidden = true;
    M.hidden.forEach(w => { w.hidden = false; }); M.hidden = [];
    $("movie").setAttribute("aria-pressed", "false");
    setPlaying(false);   // the clock stays on the last frame shown; play carries on from there
  }
  window.cassiniMovie = { start, stop, get on() { return M.on; }, state: M };

  // ---- controls ----
  $("movie").addEventListener("click", () => (M.on ? stop() : start()));
  $("mvplay").addEventListener("click", () => setMoviePlaying(!M.playing));
  // processing on or off (movie.processed; the mosaics alone: movie.mosaics): the pictures ahead are asked for again
  const proc = $("mvproc");
  proc.addEventListener("click", () => { const v = !opt("movie.processed", true); if (S) S.set("movie.processed", v); else { M.raw = !v; refresh(); } });
  function refresh() {
    proc.setAttribute("aria-pressed", String(!M.raw && opt("movie.processed", true)));
    if (!M.on) return;
    drop();
    if (M.cur && M.cat === catalog) show(M.i);
  }
  if (S) for (const key of ["movie.processed", "movie.mosaics"]) S.on(key, refresh);
  $("mvfps").addEventListener("input", e => {
    M.fps = +e.target.value; $("mvfpsv").textContent = M.fps + " fps";
    try { localStorage.setItem("cassini-os-movie-fps", M.fps); } catch (err) {}
  });
  // the window's close and minimize buttons (and a title-bar double-click) leave movie mode rather than tucking it away
  card.addEventListener("click", e => { if (e.target.closest(".close, .min")) { e.stopPropagation(); stop(); } }, true);
  card.querySelector(".titlebar").addEventListener("dblclick", e => { e.stopPropagation(); stop(); }, true);
  new MutationObserver(() => { const b = M.on && M.cur && M.buf.get(M.cur.id); if (b && b.ok) draw(b.img); }).observe(card, { attributes: true, attributeFilter: ["class"] });
  // while a movie runs: space plays and pauses it, the arrow keys step a frame, Escape leaves; the main play button leaves and plays on
  window.addEventListener("keydown", e => {
    if (!M.on || e.metaKey || e.ctrlKey || (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.code === "Space")) return;
    if (e.code === "Space") { e.preventDefault(); e.stopImmediatePropagation(); setMoviePlaying(!M.playing); }
    else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      e.preventDefault(); setMoviePlaying(false);
      const j = here() + (e.key === "ArrowRight" ? 1 : -1); if (at(j)) show(j);
    } else if (e.key === "p" || e.key === "P") proc.click();
    else if (e.key === "Escape") stop();
  }, true);
  window.addEventListener("keydown", e => { if (!M.on && (e.key === "m" || e.key === "M") && !e.metaKey && !e.ctrlKey && e.target === document.body) start(); });
  $("play").addEventListener("click", () => { if (M.on) stop(); }, true);
  // scrubbing the timeline moves the film: it carries on from the frame at the new time
  $("tl").addEventListener("pointerdown", () => { if (M.on) M.cur = null; }, true);
  const go = $("gomenu");
  if (go) { const li = document.createElement("li"); li.innerHTML = '<button id="gomovie">Movie mode<span class="kbd">M</span></button>'; go.prepend(li); li.querySelector("button").addEventListener("click", () => (M.on ? stop() : start())); }
})();
</script>
