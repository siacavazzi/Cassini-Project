<!-- Movie mode for Cassini OS. build.py splices the two parts below into the page: the style into the head and the
     script after the chrome script, and adds a Movie button to the transport.
     Movie mode is only a rule for the clock: the hours and days without pictures drop out, and the clock steps from
     one picture's time to the next at a set frame rate (movie.fps). Everything on screen is what the page shows
     anyway at that moment: the camera and body windows show each picture through the whole pipeline (processed
     frames, color composites, mosaics, the mosaic or movie switch, steady movie passes), and the 3D view moves with
     the clock. There is no movie window. -->
<style>
#movie svg { width: 15px; height: 15px; display: block; }
#movie svg * { fill: none; stroke: currentColor; stroke-width: 1.4; }
#movie[aria-pressed="true"] { color: var(--q-accent, #8ab6ff); border-color: var(--q-accent, #8ab6ff); }
</style>

<script>
// ---------- movie mode ----------
(function () {
  const $ = id => document.getElementById(id);
  const S = window.cassiniSettings;
  const opt = (key, dflt) => (S && S.get(key) !== undefined ? S.get(key) : dflt);
  // range.fps (start, below) plays a stretch at its own rate, under one picture a second if it likes (ambient mode)
  const fps = () => M.fps ? Math.min(30, Math.max(0.05, M.fps)) : Math.min(30, Math.max(1, +opt("movie.fps", 8) || 8));
  // A step waits for the camera windows (Sam: movie mode slows, it never skips a picture): while a window has not
  // yet put up the picture the clock is at (the frame server is still making it: a cold composite, a mosaic's new
  // tile), the next step waits. cassiniFeeds.behind stops counting a picture that has been stuck for seconds, so a
  // server that stops answering never stalls the film.
  // Slow: when the film has spent more than SLOW_SHARE of the last SLOW_SPAN ms waiting, the page hears
  // "cassini:movie-slow" (once, until it has caught up again), so it can offer to make a stretch ahead of time.
  const CUT = 3 * 3600, SLOW_SPAN = 20000, SLOW_SHARE = 0.5;
  const M = { on: false, fps: 0, stepAt: 0, waiting: false, cut: 0, cutAt: -1e9, until: Infinity, cams: null, waits: [], slow: false, lastAt: 0 };
  const ready = () => typeof catalog !== "undefined" && catalog && catalog.byCam && window.cassiniFeeds;

  const base = window.studyAdvance;
  // called by the viewer's frame loop while playing: where the clock goes now
  window.studyAdvance = (et, dt, speed) => {
    if (!M.on || !ready()) return base ? base(et, dt, speed) : et + dt * speed;
    const F = window.cassiniFeeds, now = performance.now(), due = M.stepAt + 1000 / fps();
    M.waiting = false;
    if (now < due) { track(now, false); return et; }
    if (F.behind(M.cams) > 0) { M.waiting = now > due + 300; track(now, true); return et; }
    track(now, false);
    const next = F.nextPicture(et, undefined, M.cams);
    // a stretch played as a movie (start's until) ends on its last picture
    if (next > M.until) { setPlaying(false); stop(); return et; }
    // no picture after this one in the months loaded now: the clock runs a day a frame until the next ones are in
    // (the viewer holds it while a month is loading) or the mission ends
    if (next === Infinity) return et + 86400;
    // keep the cadence: a step checked on the next animation frame does not move the next one later (at 60 Hz,
    // 24 fps would otherwise wait three frames a step and play 20); a step that came a whole interval late (after
    // a wait for pictures) starts the cadence again, so there is no burst to catch up
    M.stepAt = now - due < 1000 / fps() ? due : now;
    if (next - et > CUT) { M.cut = next - et; M.cutAt = now; }
    return next;
  };

  // the waiting kept for the last SLOW_SPAN ms, as [from, to] spans
  function track(now, waiting) {
    const dt = Math.min(250, now - (M.lastAt || now)); M.lastAt = now;
    if (waiting && dt > 0) M.waits.push([now - dt, now]);
    while (M.waits.length && M.waits[0][1] < now - SLOW_SPAN) M.waits.shift();
    const share = M.waits.reduce((a, w) => a + w[1] - Math.max(w[0], now - SLOW_SPAN), 0) / SLOW_SPAN;
    if (!M.slow && share > SLOW_SHARE) { M.slow = true; document.dispatchEvent(new CustomEvent("cassini:movie-slow", { detail: { slow: true, share, et: state.et } })); }
    else if (M.slow && share < SLOW_SHARE / 4) { M.slow = false; document.dispatchEvent(new CustomEvent("cassini:movie-slow", { detail: { slow: false, share, et: state.et } })); }
  }

  // paused in the background (away.html): the step carries on where it was, by the time away
  document.addEventListener("cassini:away", e => { if (!e.detail.away) { M.stepAt += e.detail.ms; M.cutAt += e.detail.ms; } });

  // the status line under the timeline says movie mode is on, how fast, and how much time a cut left out
  const hud = window.studyHud;
  window.studyHud = ms => {
    if (hud) hud(ms);
    if (!M.on) return;
    const el = $("mday"); if (!el) return;
    let t = ` · movie, ${fps()} fps`;
    if (M.waiting && state.playing) t += ", waiting for pictures";
    if (performance.now() - M.cutAt < 1500) t += ` · skipped ${fmtDur(M.cut)}`;
    el.textContent += t;
  };

  // ---- on and off ----
  // play: also start the clock (the Movie button, M); a shared link (link.html) leaves play as the link says.
  // range { from, until } (mission times): play one stretch, from its first picture, and leave movie mode after
  // its last (a stretch made ahead of time plays at movie.fps, its pictures all waiting in the server's cache);
  // range.cams ("N" or "W"): step through that camera's pictures only, waiting on its windows alone;
  // range.fps: this stretch's own rate (pictures a second), instead of movie.fps
  function start(play, range) {
    if (M.on && !range) return;
    M.on = true; M.stepAt = 0; M.cutAt = -1e9; M.waits = []; M.slow = false; M.lastAt = 0;
    M.until = range && range.until !== undefined ? range.until : Infinity;
    M.cams = range && /^[NW]$/.test(range.cams || "") ? range.cams : null;
    M.fps = range && +range.fps > 0 ? +range.fps : 0;
    if (range && range.from !== undefined) { setTime(range.from - 1e-3); keepNowInView(); }
    $("movie").setAttribute("aria-pressed", "true");
    if (play) setPlaying(true);
  }
  function stop() {
    if (!M.on) return;
    M.on = false; M.until = Infinity; M.cams = null; M.fps = 0;
    if (M.slow) { M.slow = false; document.dispatchEvent(new CustomEvent("cassini:movie-slow", { detail: { slow: false, share: 0, et: state.et } })); }
    $("movie").setAttribute("aria-pressed", "false");
  }
  const toggle = () => (M.on ? stop() : start(true));
  // fps: the frame rate (the movie.fps setting, Settings > Playback; set it with cassiniSettings.set("movie.fps", n))
  window.cassiniMovie = { start, stop, get on() { return M.on; }, get slow() { return M.slow; }, fps, state: M };

  // ---- controls ----
  $("movie").addEventListener("click", toggle);
  // step one picture forward or back (paused), keeping the timeline on the clock
  function step(dir) {
    if (!ready()) return;
    const F = window.cassiniFeeds, t = dir > 0 ? F.nextPicture(state.et, undefined, M.cams) : F.prevPicture(state.et, undefined, M.cams);
    if (!isFinite(t)) return;
    setPlaying(false); setTime(t); keepNowInView();
  }
  // M turns movie mode on and off; while it is on, the arrow keys step a picture and Escape leaves
  window.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if ((e.key === "m" || e.key === "M") && e.target === document.body) toggle();
    else if (!M.on) return;
    else if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); step(e.key === "ArrowRight" ? 1 : -1); }
    else if (e.key === "Escape" && !document.querySelector(".menu.open, .win.full")) stop();
  });
  const go = $("gomenu");
  if (go) { const li = document.createElement("li"); li.innerHTML = '<button id="gomovie">Movie mode<span class="kbd">M</span></button>'; go.prepend(li); li.querySelector("button").addEventListener("click", toggle); }
})();
</script>
