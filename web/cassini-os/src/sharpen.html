<!-- Sharpness on this computer (Settings > Processing): a light unsharp mask on the pictures a camera window shows, the
     last step before they go up. A line-for-line port of color_image.unsharp (web/test_sharpen_local.py runs both on
     the same pictures, byte for byte); build.py puts its script ahead of the chrome script, whose camera feed calls
     window.cassiniSharpen. The server's pictures are not changed, so no setting needs pictures of its own. -->
<script>
(() => {
  // ---------- color_image.unsharp, line for line ----------
  const TAPS = [1, 4, 6, 4, 1], GATE = 3.0, MAX = 1.5;
  // the binomial blur of v (w x h doubles), rows then columns; outside the picture counts as zero (a term of zero
  // added changes no sum, so it is left out: the sums are the Python's, term by term in the same order)
  function blur(v, w, h, taps) {
    const r = taps.length >> 1, T = taps.length, a = new Float64Array(w * h), b = new Float64Array(w * h);
    for (let y = 0; y < h; y++) {
      const o = y * w;
      for (let x = 0; x < w; x++) {
        let acc = 0;
        if (x >= r && x < w - r) for (let i = 0; i < T; i++) acc = acc + taps[i] * v[o + x + i - r];
        else for (let i = 0; i < T; i++) { const xx = x + i - r; if (xx >= 0 && xx < w) acc = acc + taps[i] * v[o + xx]; }
        a[o + x] = acc;
      }
    }
    for (let y = 0; y < h; y++) {
      const o = y * w, inside = y >= r && y < h - r;
      for (let x = 0; x < w; x++) {
        let acc = 0;
        if (inside) for (let i = 0; i < T; i++) acc = acc + taps[i] * a[o + (i - r) * w + x];
        else for (let i = 0; i < T; i++) { const yy = y + i - r; if (yy >= 0 && yy < h) acc = acc + taps[i] * a[yy * w + x]; }
        b[o + x] = acc;
      }
    }
    return b;
  }
  // RGBA bytes d (w x h) sharpened by amount, in place (alpha kept); colors: 1 for a grey picture (R = G = B, as the
  // Python's one channel), else 3
  function unsharp(d, w, h, amount, colors = 3, taps = TAPS, gate = GATE) {
    if (!(amount > 0)) return false;
    const n = w * h, lum = new Float64Array(n), al = new Float64Array(n), la = new Float64Array(n);
    for (let p = 0; p < n; p++) {
      const i = 4 * p;
      let l = d[i];
      if (colors > 1) { l = l + d[i + 1]; l = l + d[i + 2]; l = l / 3; }
      lum[p] = l; al[p] = d[i + 3] / 255; la[p] = l * al[p];
    }
    const wt = blur(al, w, h, taps), bl = blur(la, w, h, taps);
    for (let p = 0; p < n; p++) {
      if (!(al[p] > 0)) continue;
      const mean = wt[p] > 0 ? bl[p] / wt[p] : lum[p];
      let dd = lum[p] - mean;
      dd = (Math.abs(dd) < gate ? dd * (Math.abs(dd) / gate) : dd) * amount;
      const i = 4 * p;
      for (let k = 0; k < colors; k++) d[i + k] = Math.floor(Math.max(0, Math.min(255, d[i + k] + dd)) + 0.5);
      if (colors === 1) { d[i + 1] = d[i]; d[i + 2] = d[i]; }
    }
    return true;
  }
  const math = { TAPS, GATE, MAX, blur, unsharp };

  // ---------- in the page ----------
  // Settings > Processing > Sharpness: 0..100, 0 off; the amount the Python takes
  const level = () => { const s = window.cassiniSettings; const v = s ? s.get("processing.sharpness") : 0; return Math.max(0, Math.min(100, +v || 0)); };
  const amount = () => level() / 100 * MAX;
  const urls = [];
  const stats = { pictures: 0, ms: 0, math: 0 };
  // the arithmetic runs in a worker (the same functions, as their source), so a picture never holds up the page;
  // in the page itself where a worker cannot start
  let worker = null, seq = 0;
  const waiting = new Map();
  try {
    const src = `const TAPS = ${JSON.stringify(TAPS)}, GATE = ${GATE};\n${blur}\n${unsharp}\n` +
      "onmessage = e => { const { id, buf, w, h, a, c } = e.data, d = new Uint8ClampedArray(buf); const t = performance.now(); unsharp(d, w, h, a, c); postMessage({ id, buf, ms: performance.now() - t }, [buf]); };";
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
    worker.onmessage = e => { const f = waiting.get(e.data.id); waiting.delete(e.data.id); if (f) f(e.data); };
    worker.onerror = () => { worker = null; for (const f of waiting.values()) f(null); waiting.clear(); };
  } catch (e) { worker = null; }
  const run = (d, w, h, a, c) => {
    if (!worker) { const t = performance.now(); unsharp(d, w, h, a, c); stats.math += performance.now() - t; return Promise.resolve(d); }
    const id = ++seq, buf = d.buffer.slice(0);
    return new Promise(res => { waiting.set(id, res); worker.postMessage({ id, buf, w, h, a, c }, [buf]); })
      .then(m => { if (!m) { unsharp(d, w, h, a, c); return d; } stats.math += m.ms; return new Uint8ClampedArray(m.buf); });
  };
  // the picture im as shown here: a new Image, sharpened, or null when it stays as it is
  async function apply(im) {
    const a = amount(), t0 = performance.now();
    if (!a) return null;
    const W = im.naturalWidth || im.width, H = im.naturalHeight || im.height;
    if (!W || !H) return null;
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const g = c.getContext("2d", { willReadFrequently: true }); g.drawImage(im, 0, 0);
    const img = g.getImageData(0, 0, W, H), d = img.data;
    let grey = true;
    for (let i = 0; i < d.length && grey; i += 4) grey = d[i] === d[i + 1] && d[i] === d[i + 2];
    const done = await run(d, W, H, a, grey ? 1 : 3);
    g.putImageData(new ImageData(done, W, H), 0, 0);
    const blob = await new Promise(r => c.toBlob(r, "image/png")), url = URL.createObjectURL(blob), out = new Image();
    urls.push(url);
    if (urls.length > 16) URL.revokeObjectURL(urls.shift());
    await new Promise((res, rej) => { out.onload = res; out.onerror = rej; out.src = url; });
    stats.pictures++; stats.ms += performance.now() - t0;
    out.dataset.sharpen = String(level());
    return out;
  }
  window.cassiniSharpen = { math, level, amount, apply, run, stats };
})();
</script>
