<!-- The launch, a short opening for whoever plays the mission from its start. build.py splices the style into the head,
     the section into #app and the script after the Grand Finale's.

     Nothing of the rocket is modeled: the launch itself is told with NASA's own photographs from that night
     (launch-data.json, the files under media/launch, credited in credits.json), each one drifting slowly, with a few
     facts as captions and a countdown clock running underneath. When the Centaur lets go of the spacecraft the photos
     give way to the 3D view at the start of the data (the trajectory begins at separation, 42 min 40 s after liftoff),
     close to Cassini with Earth falling away behind it, and the captions name the road ahead: Venus twice, Earth and
     Jupiter, then Saturn. Then the interface comes back and the mission plays on from there.

     Facts: ESA, "Cassini-Huygens: Launch information" and "The launcher" (liftoff 08:43:00 UTC on 15 October 1997 from
     Launch Complex 40, Cape Canaveral; a 55.8 m Titan IVB/Centaur; boosters away at 2 min 23 s, 91 km up; separation
     at 42 min 40 s; first contact through the Deep Space Network near Canberra ten minutes later) and NASA, "Cassini
     Quick Facts" (5,712 kg at launch with fuel, Huygens and adapter; the flyby dates; 3.4 billion km to Saturn).

     It plays when playback runs forward from the very start of the data (the Launch moment does that), or at once with
     ?launch. Escape or the Skip button ends it. Sound (sound.html): a low rumble that swells at liftoff and dies away
     as the rocket climbs, then soft chords under the captions in space. -->
<style>
#launch { overflow: hidden; }
#launch .lx-photo { position: absolute; inset: 0; opacity: 0; background: #000; overflow: hidden; }
/* the photo whole, as tall as the screen, over a blurred and darkened copy of itself that fills the rest */
#launch .lx-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform-origin: 50% 50%; will-change: transform; }
#launch .lx-photo img.bg { object-fit: cover; filter: blur(28px) brightness(.38) saturate(1.2); transform: scale(1.15); will-change: auto; }
/* the flash of liftoff, and a shade under the captions so they read over a bright photo or Earth */
#launch .lx-flash { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 80% 70% at 50% 85%, rgba(255,214,150,.9), rgba(255,170,80,.35) 50%, transparent 80%); mix-blend-mode: screen; }
#launch .lx-shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.8) 0, rgba(0,0,0,.5) 24%, rgba(0,0,0,0) 50%); }
#launch .cs-cap.big { font-size: 30px; letter-spacing: .03em; }
/* the road to Saturn: five stops on a line, each lighting up in turn */
#launch .lx-road { display: flex; justify-content: space-between; position: relative; margin: 16px 4px 2px; }
#launch .lx-road::before { content: ""; position: absolute; left: 6px; right: 6px; top: 5px; height: 1px; background: rgba(232,236,242,.25); }
#launch .lx-road span { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12.5px; line-height: 1.3; opacity: .35; transition: opacity .8s ease; }
#launch .lx-road span::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--q-dim); box-shadow: 0 0 0 2px rgba(0,0,0,.6); margin-bottom: 4px; }
#launch .lx-road span.on { opacity: 1; }
#launch .lx-road span.on::before { background: var(--q-accent); }
#launch .lx-road span:last-child::before { background: #e6bb68; }
#launch .lx-road small { margin: 0; font-size: 10.5px; }
#launch .lx-clock { position: absolute; left: 50%; bottom: 7vh; transform: translateX(-50%); white-space: nowrap; font: 11px/1 var(--hudf); letter-spacing: .08em;
  color: var(--q-dim); opacity: 0; transition: opacity 1.2s ease; }
#launch .lx-clock.on { opacity: 1; }
#launch .lx-clock i { font-style: normal; color: var(--q-accent); }
#launch .lx-credit { position: absolute; left: 16px; bottom: 14px; max-width: min(460px, calc(100vw - 140px)); font-size: 10.5px; line-height: 1.4; color: rgba(232,236,242,.42); opacity: 0; transition: opacity 1.2s ease; }
#launch .lx-credit.on { opacity: 1; }
body.phone #launch .cs-cap.big { font-size: 23px; }
body.phone #launch .lx-road span { font-size: 11px; } body.phone #launch .lx-road small { font-size: 9.5px; }
body.phone #launch .lx-clock { font-size: 9.5px; bottom: 9vh; }
body.phone #launch .lx-credit { bottom: 40px; }
</style>

<section id="launch" class="cs-root" hidden aria-live="polite">
  <div class="cs-black"></div>
  <div class="lx-flash"></div>
  <div class="lx-shade"></div>
  <div class="cs-caps"></div>
  <div class="lx-clock" aria-hidden="true"></div>
  <div class="lx-credit"></div>
  <button class="cs-skip" type="button">Skip ▸</button>
</section>

<script>
// ---------- the launch: NASA's photos of the night of October 15, 1997, then Cassini on its own in space ----------
(function () {
  const CS = window.cassiniCutscene, { fadeTo, sound } = CS;
  const root = document.getElementById("launch"), black = root.querySelector(".cs-black"), flash = root.querySelector(".lx-flash");
  const caps = root.querySelector(".cs-caps"), clock = root.querySelector(".lx-clock"), credit = root.querySelector(".lx-credit");
  // the photos, written in by build.py from launch-data.json: { role: { file, credit, focus, from: [scale, x %, y %], to: [...] } }
  const PHOTOS = /*LAUNCH_DATA*/null || {};
  // NASA's and ESA's numbers (see the note at the top)
  const LIFTOFF = 12.4;       // s into the cutscene the countdown reaches zero
  const CLOCK = 6.4;          // s into the cutscene the countdown clock comes up
  const SEP = 42 * 60 + 40;   // s from liftoff to separation from the Centaur, where the data begins
  const SPACE = 30;           // s into the cutscene the photos give way to the 3D view
  const SPEED = 40;           // mission seconds per second in space, so Earth visibly falls away
  const END = 52;             // s into the cutscene the interface comes back
  // the photos in order: role, screen seconds in, how long, and how fast it comes in (they cross-fade over FADE s;
  // liftoff cuts in with the flash)
  const FADE = 1.4;
  const SHOTS = [["prep", 0.4, 5.2], ["pad", 6, 5.6], ["liftoff", LIFTOFF - 0.05, 4.6, 0.12], ["climb", 17, 4.6], ["trail", 22, 6.4]];
  // the captions: screen seconds in, how long, the line, a class, a chord under it (steps on the scale, see sound.html)
  const CAPS = [
    [1, 4.6, `<b>August 1997 · Kennedy Space Center</b>Cassini, with ESA's Huygens probe on its side. Fueled, the pair weigh 5,712 kilograms, one of the heaviest spacecraft ever sent to another planet.`],
    [6.6, 5.2, `<b>October 15, 1997 · Launch Complex 40, Cape Canaveral</b>Before dawn. A Titan IVB with a Centaur upper stage, 56 meters tall, stands ready.`],
    [12.5, 4, `<b>08:43:00 UTC · 4:43 a.m. local</b>Liftoff`, "big"],
    [17.3, 4.5, `<b>T+2 min 23 s</b>91 kilometers up, the two solid boosters fall away.`],
    [22.4, 6.2, `<b>The Centaur</b>After a coast in a low parking orbit, the upper stage fires again and sends Cassini out of Earth's orbit for good.`],
    [SPACE + 1.6, 6.6, `<b>T+42 min 40 s</b>The Centaur lets go. Cassini is on its own, and ten minutes later a dish near Canberra, Australia, hears its first signal.`, "", [0, 2, 4]],
    [SPACE + 8.8, 7.4, `<b>The road to Saturn</b>Too heavy to fly straight there, it borrows speed from the planets on the way.`
      + `<div class="lx-road"><span>Venus<small>Apr 1998</small></span><span>Venus<small>Jun 1999</small></span><span>Earth<small>Aug 1999</small></span><span>Jupiter<small>Dec 2000</small></span><span>Saturn<small>Jul 2004</small></span></div>`, "road", [1, 3, 5]],
    [SPACE + 16.8, 4.6, `<b>3.4 billion kilometers · 6 years, 8 months</b>Next stop: Venus.`, "big", [0, 2, 4, 7]],
  ];


  let L = null;   // the running launch
  let preloaded = false;
  const tmpA = v3(), tmpB = v3(), vE = new THREE.Vector3(), vS = new THREE.Vector3();
  const clamp01 = x => Math.max(0, Math.min(1, x)), ease = k => k * k * (3 - 2 * k);

  // ---------- the photos: one layer each, drifting from `from` to `to` (scale, and the point it moves toward) ----------
  const layers = {};
  for (const [role] of SHOTS) {
    const p = PHOTOS[role]; if (!p) continue;
    const el = document.createElement("div"); el.className = "lx-photo";
    const bg = document.createElement("img"); bg.className = "bg"; bg.alt = ""; bg.decoding = "async";
    const img = document.createElement("img"); img.alt = p.alt || ""; img.decoding = "async";
    if (p.focus) img.style.objectPosition = p.focus;
    el.append(bg, img); root.insertBefore(el, flash);
    layers[role] = { el, img, bg, p };
  }
  // the photos load once the start of the mission is near (or the launch plays), not with every page
  function preload() { for (const role in layers) if (!layers[role].img.src) layers[role].img.src = layers[role].bg.src = "media/launch/" + layers[role].p.file; }
  function stepPhotos(T) {
    let shown = null;
    for (const [role, at, dur, fin = FADE] of SHOTS) {
      const l = layers[role]; if (!l) continue;
      const o = T < at || T > at + dur + FADE ? 0 : Math.min(ease(clamp01((T - at) / fin)), ease(clamp01((at + dur + FADE - T) / FADE)));
      l.el.style.opacity = o;
      if (o > 0) {
        const k = clamp01((T - at) / (dur + FADE)), f = l.p.from || [1.04, 50, 50], t = l.p.to || [1.14, 50, 45];
        const s = f[0] + (t[0] - f[0]) * k, x = f[1] + (t[1] - f[1]) * k, y = f[2] + (t[2] - f[2]) * k;
        // liftoff shakes the frame a little, less as the rocket climbs away
        const sh = role === "liftoff" ? 5 * Math.max(0, 1 - (T - LIFTOFF) / 5) * (T > LIFTOFF ? 1 : 0) : 0;
        l.img.style.transformOrigin = `${x}% ${y}%`;
        l.img.style.transform = `translate(${(Math.random() - 0.5) * sh}px, ${(Math.random() - 0.5) * sh}px) scale(${s})`;
        if (o > 0.5) shown = l;
      }
    }
    const txt = shown ? `Photo: ${shown.p.credit}` : "";
    if (credit.textContent !== txt) { credit.textContent = txt; credit.classList.toggle("on", !!txt); }
  }

  // ---------- captions (cutscene.html runs them); the stops on the road light up one by one ----------
  function runCaptions(T) {
    CS.runCaptions(caps, CAPS, T, L.shown);
    CAPS.forEach(([at], i) => {
      const el = L.shown[i];
      if (el && el !== true) el.querySelectorAll(".lx-road span").forEach((s, j) => s.classList.toggle("on", T > at + 1 + j * 0.9));
    });
  }
  // the countdown, then the mission clock from liftoff, with Cassini's distance and speed from Earth once it is in space
  const pad = n => String(n).padStart(2, "0");
  const hms = s => `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(Math.floor(s) % 60)}`;
  function stepClock(T) {
    clock.classList.toggle("on", T >= CLOCK && T < END - 1.5);
    if (L.phase !== "space") {
      const s = T - LIFTOFF;
      clock.innerHTML = s < 0 ? `T&minus;${hms(Math.ceil(-s))}` : `T+<i>${hms(s)}</i>`;
      return;
    }
    const s = L.tau - LAUNCH_MS / 1000 + etToMs(0) / 1000;
    sub(positionAt(tracks.CASSINI, L.tau, tmpA), positionAt(tracks.EARTH, L.tau, tmpB), tmpA);
    const d = len(tmpA), rate = (len(sub(positionAt(tracks.CASSINI, L.tau + 1, tmpB), positionAt(tracks.EARTH, L.tau + 1, vT3), tmpB)) - d);
    clock.innerHTML = `T+<i>${hms(s)}</i> · ${fmtInt(d)} km from Earth · moving away at <i>${rate.toFixed(1)}</i> km/s`;
  }
  const vT3 = v3();

  function play() {
    if (L || !tracks.CASSINI || !tracks.EARTH) return;
    const was = { speed: state.speed };
    if (!CS.begin("launch")) return;
    L = Object.assign(was, { t0: performance.now(), phase: "photos", tau: null, shown: [] });
    preload();
    fadeTo(black, 1, 0.6);   // the photos sit on the black, so a cross-fade between two never shows the 3D view
  }
  // cutscene.html ends it (Escape, Skip, or the end of the scene below); the mission carries on from where the
  // cutscene left it, or from the start of the data when it ended early
  function onEnd() {
    const l = L; L = null;
    sound("rumble", 0);
    caps.textContent = ""; [clock, credit].forEach(e => e.classList.remove("on"));
    for (const role in layers) layers[role].el.style.opacity = 0;
    flash.style.opacity = 0;
    setTime(l.tau !== null ? l.tau : coverage[0]);
    spent = true;
    if (state.focus !== "CASSINI") setFocus("CASSINI");
    setFocus("CASSINI", 6e-5);
    setSpeed(l.speed); setPlaying(true);
    black.style.opacity = Math.max(+black.style.opacity || 0, 0.6);
  }

  // the viewer's frame loop, before it places the bodies: the launch runs its own clock
  function frame() {
    if (!L) return;
    const T = (performance.now() - L.t0) / 1000;
    if (L.phase === "photos") {
      stepPhotos(T);
      // liftoff: a flash from below and the rumble, which dies away as the rocket climbs
      const k = T - LIFTOFF;
      flash.style.opacity = k < 0 ? 0 : Math.min(1, k / 0.35) * Math.exp(-k / 1.8) * (0.85 + 0.15 * Math.random());
      sound("rumble", k < -0.5 ? 0 : clamp01(Math.min((k + 0.5) / 0.8, Math.exp(-Math.max(0, k - 2) / 6))));
      if (T >= SPACE) {
        // behind the black: the start of the data, close to Cassini with Earth beyond it
        L.phase = "space"; L.spaceAt = T; L.tau = coverage[0];
        sound("rumble", 0);
        for (const role in layers) layers[role].el.style.opacity = 0;
        credit.classList.remove("on"); credit.textContent = "";
        setFocus("CASSINI", 5e-5); markerPts.visible = false;
        fadeTo(black, 0, 2.2);
      }
    }
    if (L.phase === "space") {
      L.tau = Math.min(coverage[1], coverage[0] + (T - L.spaceAt) * SPEED);
      if (T > END - 1.5 && !L.closing) { L.closing = true; fadeTo(black, 0.6, 1.4); }
    }
    runCaptions(T);
    stepClock(T);
    if (L.tau !== null) state.et = L.tau;
    if (T >= END) CS.end("launch");
  }
  // in space: beside Cassini, looking past it at Earth falling away behind
  function camera_() {
    if (!L || L.phase !== "space") return;
    const k = (performance.now() - L.t0) / 1000 - L.spaceAt;
    relScene("EARTH", vE).sub(cassini.position);   // Cassini -> Earth
    const toEarth = vE.clone().normalize();
    toScene([0, 0, 1], vS).normalize();             // the celestial north pole, for an up
    const side = new THREE.Vector3().crossVectors(toEarth, vS).normalize();
    // behind Cassini as seen from Earth, swung off to one side so Earth sits beside it, drifting slowly round
    const yaw = (62 - 0.6 * k) * Math.PI / 180, pitch = 0.3;
    const dir = toEarth.clone().applyAxisAngle(vS, yaw).addScaledVector(vS, pitch).normalize();
    const d = (2.6e-5 + 1.2e-6 * k);
    camera.position.copy(cassini.position).addScaledVector(dir, -d);
    camera.up.copy(vS).addScaledVector(side, 0.08).normalize();
    camera.lookAt(cassini.position.clone().addScaledVector(toEarth, d * 0.35));
  }
  CS.register("launch", { root, frame, camera: camera_, onEnd });
  // playback running forward from the very start of the data starts it (the Launch moment does that); the data
  // starts at separation, so the clock never crosses the launch itself and cutscene.html's crossing trigger cannot
  // catch it. The photos load once the start of the mission is near
  let spent = false;
  const advance = window.studyAdvance;
  window.studyAdvance = (et, dt, speed) => {
    const next = advance ? advance(et, dt, speed) : et + dt * speed;
    if (!preloaded && et < coverage[0] + 2 * 86400) { preloaded = true; preload(); }
    if (et > coverage[0] + 30) spent = false;
    if (!L && !spent && !CS.active && speed > 0 && et <= coverage[0] + 1 && next > et) { spent = true; setTimeout(play, 0); return et; }
    return next;
  };
  window.cassiniLaunch = { play, skip: () => CS.end("launch"), get running() { return !!L; } };
  // ?launch plays it as soon as the start of the mission is loaded
  CS.fromUrl("launch", () => coverage[0], () => { spent = true; play(); });
})();
</script>
